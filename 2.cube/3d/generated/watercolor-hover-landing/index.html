<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e2d2" />
    <title>Siddharth Mehta — Dimensional Ideas</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="pigment" aria-hidden="true"></canvas>

    <main class="hero">
      <nav class="nav" aria-label="Primary navigation">
        <a class="wordmark" href="#" aria-label="Siddharth Mehta, home">SM<span>°</span></a>
        <div class="nav-links">
          <a href="#work">Work</a>
          <a href="#about">About</a>
        </div>
      </nav>

      <section class="copy" aria-labelledby="hero-title">

      <figure class="character" aria-label="The Cube of Creation">
        <div class="halo" aria-hidden="true"></div>
        <img src="./assets/cube-head-glow.png" alt="Hand-painted cube character with glowing ivory, cobalt and teal faces" />
        <figcaption><span>01</span> Cube of Creation</figcaption>
      </figure>

      <p class="gesture"><span class="gesture-dot"></span> Move to stir pigment · click to release light</p>
