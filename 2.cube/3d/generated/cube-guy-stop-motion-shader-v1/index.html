<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eee9df" />
    <title>Cube Guy — From One Side</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #eee9df;
        --ink: #15191b;
        --blue: #173954;
        --red: #8f3327;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; min-height: 100%; background: var(--paper); }

      body {
        color: var(--ink);
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        overflow-x: hidden;
      }

      .story { height: 650vh; }

      .stage {
        position: sticky;
        top: 0;
        height: 100svh;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 48%, rgba(255,255,255,.9) 0 16%, rgba(255,255,255,.28) 47%, transparent 72%),
          linear-gradient(115deg, #e9e4da, #f4f0e7 52%, #e6e0d5);
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: -20%;
        z-index: 3;
        pointer-events: none;
        opacity: .16;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");
        animation: grain .32s steps(2, end) infinite;
      }

      @keyframes grain {
        0% { transform: translate3d(-2%, 1%, 0); }
        33% { transform: translate3d(1%, -2%, 0); }
        66% { transform: translate3d(2%, 2%, 0); }
        100% { transform: translate3d(-1%, -1%, 0); }
      }

      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        touch-action: pan-y;
      }

      .fallback {
        position: absolute;
        inset: 12vh 10vw;
        width: 80vw;
        height: 76vh;
        object-fit: contain;
        z-index: 0;
      }

      .topline,
      .caption,
      .hint,
      .meter {
        position: absolute;
        z-index: 4;
        pointer-events: none;
      }

      .topline {
        top: clamp(22px, 4vw, 52px);
        left: clamp(22px, 5vw, 76px);
        letter-spacing: .2em;
        font-size: 11px;
        text-transform: uppercase;
      }

      .topline span { color: var(--red); }

      .caption {
        left: clamp(22px, 5vw, 76px);
        bottom: clamp(28px, 6vh, 70px);
        max-width: 390px;
      }

      .chapter {
        color: var(--red);
        font-size: 10px;
        letter-spacing: .18em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .line {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(28px, 4vw, 52px);
        line-height: .98;
        font-weight: 400;
        letter-spacing: -.035em;
        text-wrap: balance;
      }

      .hint {
        right: clamp(22px, 5vw, 76px);
        bottom: clamp(30px, 6vh, 72px);
        font-size: 9px;
        letter-spacing: .17em;
        text-transform: uppercase;
        opacity: .62;
      }

      .meter {
        right: clamp(22px, 5vw, 76px);
        top: 50%;
        width: 1px;
        height: 24vh;
        background: rgba(21,25,27,.18);
        transform: translateY(-50%);
      }

      .meter i {
        display: block;
        width: 1px;
        height: 100%;
        background: var(--red);
        transform: scaleY(0);
        transform-origin: top;
      }

      .status {
        position: absolute;
        z-index: 5;
        top: clamp(22px, 4vw, 52px);
        right: clamp(22px, 5vw, 76px);
        font-size: 9px;
        letter-spacing: .16em;
        text-transform: uppercase;
        opacity: .65;
      }

      .status::before {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-right: 8px;
        border-radius: 50%;
        background: #3b7e70;
        box-shadow: 0 0 10px rgba(59,126,112,.7);
      }

      @media (max-width: 720px) {
        .caption { max-width: 72vw; }
        .hint { display: none; }
        .meter { right: 20px; }
        .status { top: auto; bottom: 24px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .story { height: 100vh; }
        .stage::before { animation: none; }
        .hint, .meter { display: none; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <main class="story" id="story">
      <section class="stage" aria-label="Cube Guy forms from a sheet of paper">
        <img class="fallback" src="assets/frames/frame-01.png" alt="A paper square beginning to form Cube Guy" />
        <canvas id="gl" aria-hidden="true"></canvas>
        <div class="topline"><span>01</span> / from one side</div>
        <div class="status" id="status">GPU shader</div>
        <div class="caption" aria-live="polite">
          <div class="chapter" id="chapter">A mark</div>
          <p class="line" id="line">At first, only one side.</p>
        </div>
        <div class="hint">scroll to form · move light · click to pulse</div>
        <div class="meter"><i id="meter"></i></div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
