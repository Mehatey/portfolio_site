<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070914" />
    <title>Cube of Creation · Living Object</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./square-story.css?v=72" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <section class="stage" aria-label="Interactive watercolor cube">
        <canvas
          id="scene"
          tabindex="0"
          role="application"
          aria-label="Watercolor square. Click or press Enter to awaken."
          aria-describedby="instructions"
        ></canvas>
        <p id="instructions" class="sr-only">
          Click the square or press Enter to begin. Scroll to unfold, multiply, condense, invert, and rebuild the cube. Click any side to change its material. Drag to gently alter perspective.
        </p>
        <div class="portfolio-intro" aria-hidden="true">
          <p>Siddharth Mehta · New York</p>
          <h1>From New York.<br />Built from ideas.</h1>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script type="module" src="./square-story.js?v=78"></script>
  </body>
</html>
