<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cube Guy — Becoming</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <main id="film" aria-label="Cube Guy, a scroll-controlled story">
      <div class="film-stage">
        <canvas id="film-canvas" aria-hidden="true"></canvas>
        <div class="paper-noise" aria-hidden="true"></div>
        <div class="chapter" aria-live="polite">
          <span class="chapter__number">01</span>
          <p class="chapter__line">A square arrived with only one point of view.</p>
        </div>
        <div class="film-meta">
          <span>Cube of Creation</span>
          <button id="play-film" type="button">Play 30s</button>
        </div>
        <div class="film-progress" aria-hidden="true"><i></i></div>
        <p class="scroll-hint">Scroll to shape him</p>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
