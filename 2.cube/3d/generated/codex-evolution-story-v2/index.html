<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Cube of Creation / A Thought Learns to Walk</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7f0de;
        --muted: rgba(247, 240, 222, 0.68);
        --p: 0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #10122d;
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        min-height: 900vh;
        overflow-x: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #10122d;
      }
      #stage:before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: radial-gradient(circle at 50% 49%, transparent 25%, rgba(8, 10, 32, 0.18) 65%, rgba(4, 6, 20, 0.72) 120%);
      }
      #stage:after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0.24;
        mix-blend-mode: soft-light;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .chapter-word {
        position: fixed;
        z-index: 1;
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%);
        font:
          800 clamp(72px, 15vw, 250px)/0.8 Georgia,
          serif;
        letter-spacing: -0.07em;
        color: rgba(255, 241, 218, 0.09);
        mix-blend-mode: screen;
        pointer-events: none;
        transition:
          opacity 0.6s,
          filter 0.6s;
      }
      .chrome {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        text-transform: uppercase;
        font-size: 9px;
        letter-spacing: 0.18em;
        text-shadow: 0 1px 12px rgba(12, 10, 32, 0.8);
      }
      .brand {
        position: absolute;
        top: 26px;
        left: 29px;
      }
      .tech {
        position: absolute;
        top: 26px;
        right: 29px;
        color: var(--muted);
      }
      .tech:before {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-right: 8px;
        border-radius: 50%;
        background: #92f7cf;
        box-shadow: 0 0 16px #92f7cf;
      }
      .beat {
        position: absolute;
        left: 29px;
        bottom: 28px;
        max-width: 52ch;
        padding: 13px 15px;
        background: linear-gradient(90deg, rgba(9, 12, 35, 0.72), transparent);
        border-left: 1px solid rgba(255, 224, 186, 0.65);
      }
      .beat b {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #fff;
      }
      .beat span {
        color: var(--muted);
        text-transform: none;
        letter-spacing: 0.06em;
        line-height: 1.5;
      }
      .progress {
        position: absolute;
        right: 29px;
        top: 50%;
        width: 1px;
        height: 34vh;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.2);
      }
      .progress i {
        display: block;
        width: 4px;
        height: 38px;
        margin-left: -1px;
        background: #fff;
        box-shadow: 0 0 16px rgba(255, 255, 255, 0.7);
        transform: translateY(calc(var(--p) * (34vh - 38px)));
      }
      .cue {
        position: absolute;
        right: 29px;
        bottom: 28px;
        color: var(--muted);
      }
      .loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #10122d;
        color: #f7f0de;
        font-size: 9px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        transition: opacity 0.8s;
      }
      .loading.done {
        opacity: 0;
        pointer-events: none;
      }
      .flash {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: #ffe4bf;
        opacity: 0;
        mix-blend-mode: screen;
      }
      @media (max-width: 700px) {
        .brand,
        .beat {
          left: 18px;
        }
        .tech,
        .progress {
          right: 16px;
        }
        .cue {
          left: 18px;
          right: auto;
        }
        .beat span {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        body {
          min-height: 100vh;
        }
        .progress,
        .cue {
          display: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"><canvas id="scene" aria-label="A thought becomes Cube Guy and walks through a watercolor memory garden"></canvas></div>
    <div class="chapter-word" aria-hidden="true">MARK</div>
    <div class="chrome" aria-hidden="true">
      <div class="brand">Cube of Creation / A Thought Learns to Walk</div>
      <div class="tech">WebGPU · TSL</div>
      <div class="beat"><b>01 / The mark</b><span>Nothing yet. Just a square somebody drew and forgot.</span></div>
      <div class="progress"><i></i></div>
      <div class="cue">Scroll to author him · click to answer</div>
    </div>
    <div class="loading">Painting a world around him</div>
    <div class="flash"></div>
    <script type="module">
      import * as THREE from "three/webgpu";
      import { color, float, mix, positionLocal, sin, time, uniform, vec3 } from "three/tsl";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      const canvas = document.querySelector("#scene"),
        renderer = new THREE.WebGPURenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
      renderer.setSize(innerWidth, innerHeight, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      renderer.shadowMap.enabled = true;
      await renderer.init();
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x29375c, 0.028);
      const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 70);
      camera.position.set(0, 0.72, 4.4);
      const storyU = uniform(0);
      const seed = 91827;
      function random(n) {
        const x = Math.sin(n * 12.9898 + seed) * 43758.5453;
        return x - Math.floor(x);
      }
      function watercolorCanvas(face = 0, size = 512) {
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const x = c.getContext("2d"),
          pal = [
            ["#242752", "#5a4c83", "#ee9e83"],
            ["#23254e", "#365d79", "#d7858d"],
            ["#313667", "#7973a4", "#f4c7a4"],
            ["#161b3c", "#3f5674", "#bd6f83"],
            ["#36376a", "#597594", "#efb79d"],
            ["#151a3b", "#464d7b", "#c7778f"],
          ],
          p = pal[face % pal.length],
          g = x.createLinearGradient(0, 0, size, size);
        g.addColorStop(0, p[0]);
        g.addColorStop(0.55, p[1]);
        g.addColorStop(1, p[2]);
        x.fillStyle = g;
        x.fillRect(0, 0, size, size);
        x.globalCompositeOperation = "screen";
        for (let i = 0; i < 46; i++) {
          const px = random(i + face * 71) * size,
            py = random(i + face * 83 + 3) * size,
            r = (0.04 + random(i + 17) * 0.24) * size,
            rg = x.createRadialGradient(px, py, 0, px, py, r);
          rg.addColorStop(
            0,
            `rgba(${120 + Math.floor(random(i + 7) * 135)},${90 + Math.floor(random(i + 8) * 150)},${150 + Math.floor(random(i + 9) * 105)},${0.015 + random(i + 4) * 0.06})`
          );
          rg.addColorStop(1, "rgba(255,255,255,0)");
          x.fillStyle = rg;
          x.beginPath();
          x.ellipse(px, py, r, r * (0.45 + random(i + 22)), random(i + 31) * Math.PI, 0, Math.PI * 2);
          x.fill();
        }
        x.globalCompositeOperation = "multiply";
        x.lineWidth = 1;
        for (let i = 0; i < 260; i++) {
          x.strokeStyle = `rgba(28,22,56,${0.018 + random(i + 9) * 0.025})`;
          x.beginPath();
          const y = random(i + 300) * size;
          x.moveTo(0, y);
          x.bezierCurveTo(size * 0.3, y + random(i + 1) * 9, size * 0.7, y - random(i + 2) * 9, size, y + random(i + 3) * 5);
          x.stroke();
        }
        return c;
      }
      const sky = await new THREE.TextureLoader().loadAsync("./assets/watercolor-memory-garden-v2.png");
      sky.colorSpace = THREE.SRGBColorSpace;
      sky.mapping = THREE.EquirectangularReflectionMapping;
      scene.background = sky;
      scene.backgroundIntensity = 0.88;
      const paperTex = new THREE.CanvasTexture(watercolorCanvas(4, 1024));
      paperTex.colorSpace = THREE.SRGBColorSpace;
      paperTex.wrapS = paperTex.wrapT = THREE.RepeatWrapping;
      paperTex.repeat.set(4, 4);
      function seedTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 768;
        const x = c.getContext("2d");
        x.clearRect(0, 0, 768, 768);
        for (let i = 0; i < 16; i++) {
          x.strokeStyle = `rgba(${238 - i * 2},${205 - i},${171 + i},${0.08 + i * 0.018})`;
          x.lineWidth = 32 - i * 1.25;
          x.lineJoin = "round";
          x.beginPath();
          x.roundRect(128 + Math.sin(i) * 3, 128 + Math.cos(i) * 4, 512, 512, 62);
          x.stroke();
        }
        x.fillStyle = "#f4dfc8";
        x.beginPath();
        x.ellipse(300, 350, 27, 58, -0.04, 0, Math.PI * 2);
        x.ellipse(468, 350, 27, 58, 0.04, 0, Math.PI * 2);
        x.fill();
        x.strokeStyle = "#f4dfc8";
        x.lineWidth = 16;
        x.lineCap = "round";
        x.beginPath();
        x.moveTo(358, 475);
        x.lineTo(410, 475);
        x.stroke();
        return new THREE.CanvasTexture(c);
      }
      const seedMat = new THREE.MeshBasicMaterial({ map: seedTexture(), transparent: true, opacity: 1, depthWrite: false, side: THREE.DoubleSide }),
        seedPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.08, 1.08), seedMat);
      seedPlane.position.set(0, 0.72, 0.42);
      scene.add(seedPlane);
      const particleCount = 18000,
        particleGeo = new THREE.BufferGeometry(),
        particlePos = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount; i++) {
        const r = 1.1 + random(i + 4000) * 5.8,
          a = random(i + 5000) * Math.PI * 2;
        particlePos[i * 3] = Math.cos(a) * r;
        particlePos[i * 3 + 1] = -0.7 + random(i + 6000) * 4.4;
        particlePos[i * 3 + 2] = -1 - random(i + 7000) * 9;
      }
      particleGeo.setAttribute("position", new THREE.BufferAttribute(particlePos, 3));
      const particleOpacityU = uniform(0.12),
        particleMat = new THREE.PointsNodeMaterial({ transparent: true, depthWrite: false }),
        particleWave = sin(positionLocal.x.mul(1.7).add(positionLocal.y.mul(2.2)).add(time.mul(0.45)))
          .mul(0.5)
          .add(0.5);
      particleMat.colorNode = mix(color("#ff9a9e"), color("#71dfda"), particleWave);
      particleMat.opacityNode = particleOpacityU;
      particleMat.sizeNode = float(1.9).add(particleWave.mul(1.35));
      particleMat.positionNode = positionLocal.add(
        vec3(
          sin(positionLocal.y.mul(2).add(time)).mul(0.025),
          sin(positionLocal.x.mul(1.4).sub(time.mul(0.6))).mul(0.03),
          sin(positionLocal.z.mul(0.8).add(time.mul(0.35))).mul(0.02)
        )
      );
      const particleField = new THREE.Points(particleGeo, particleMat);
      scene.add(particleField);
      scene.add(new THREE.HemisphereLight(0xffead5, 0x242d58, 3.1));
      const sun = new THREE.DirectionalLight(0xffddb7, 5.6);
      sun.position.set(-4, 7, 4);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      scene.add(sun);
      const roseLight = new THREE.PointLight(0xff6f9c, 28, 9);
      roseLight.position.set(-3, 2, 1);
      scene.add(roseLight);
      const cyanLight = new THREE.PointLight(0x69e4df, 30, 10);
      cyanLight.position.set(3, 1, -1);
      scene.add(cyanLight);
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(36, 36),
        new THREE.MeshStandardMaterial({ map: paperTex, color: 0x777e9e, roughness: 1, metalness: 0 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.9;
      floor.receiveShadow = true;
      scene.add(floor);
      const loader = new GLTFLoader(),
        [character, treeFile, peonyFile, jellyFile, mushFile] = await Promise.all([
          loader.loadAsync("../claude-v1/cube_guy_v1.glb"),
          loader.loadAsync("./world-assets/tree.glb"),
          loader.loadAsync("./world-assets/peony.glb"),
          loader.loadAsync("./world-assets/jellyfish.glb"),
          loader.loadAsync("./world-assets/mushroom.glb"),
        ]);
      const world = new THREE.Group();
      scene.add(world);
      const worldPieces = [];
      function normalize(root, height) {
        let box = new THREE.Box3().setFromObject(root),
          s = height / Math.max(0.001, box.getSize(new THREE.Vector3()).y);
        root.scale.setScalar(s);
        box = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        root.position.x -= center.x;
        root.position.z -= center.z;
        root.position.y -= box.min.y;
        return root;
      }
      function makeInkPoints(mesh, tint = "#ff8e9e", size = 0.018) {
        if (!mesh.geometry?.attributes?.position) return null;
        const mat = new THREE.PointsNodeMaterial({ size, sizeAttenuation: true, transparent: true, depthWrite: false }),
          wave = sin(positionLocal.y.mul(3.7).add(positionLocal.x.mul(1.8)).add(time.mul(0.34)))
            .mul(0.5)
            .add(0.5),
          drift = storyU.mul(0.055);
        mat.colorNode = mix(color(tint), color("#76e3d5"), wave);
        mat.opacityNode = float(0.76);
        mat.positionNode = positionLocal.add(
          vec3(
            sin(positionLocal.y.mul(7).add(time)).mul(drift),
            sin(positionLocal.x.mul(6).sub(time.mul(0.7))).mul(drift),
            sin(positionLocal.z.mul(9).add(time.mul(0.4))).mul(drift)
          )
        );
        const pts = new THREE.Points(mesh.geometry, mat);
        pts.userData.ink = true;
        return pts;
      }
      function watercolorize(root, tint = "#ff8e9e") {
        root.traverse((o) => {
          if (o.isPoints && !o.userData.ink) {
            o.material = new THREE.PointsMaterial({
              size: 0.018,
              sizeAttenuation: true,
              vertexColors: !!o.geometry.attributes.color,
              color: o.geometry.attributes.color ? 0xffffff : tint,
              transparent: true,
              opacity: 0.82,
              depthWrite: false,
            });
            o.userData.water = true;
          } else if (o.isMesh && !o.userData.ink) {
            o.material = o.material.clone();
            o.material.roughness = 1;
            o.material.metalness = 0;
            o.material.transparent = true;
            o.material.opacity = 0.48;
            o.material.depthWrite = false;
            const pts = makeInkPoints(o, tint, 0.014);
            if (pts) o.add(pts);
            o.userData.water = true;
          }
        });
        return root;
      }
      function addWorld(root, { h, x, y = -0.88, z, ry = 0, tint, base = 0 }) {
        normalize(root, h);
        watercolorize(root, tint);
        root.position.set(x, y, z);
        root.rotation.y = ry;
        root.userData = { home: root.position.clone(), base, scale: root.scale.x };
        world.add(root);
        worldPieces.push(root);
        return root;
      }
      const treeClone = treeFile.scene.clone(true),
        peonyClone = peonyFile.scene.clone(true),
        offer = peonyFile.scene.clone(true),
        mushClone = mushFile.scene.clone(true);
      const treeL = addWorld(treeFile.scene, { h: 5.2, x: -3.3, z: -2.8, ry: 0.38, tint: "#f38a9d", base: 0.12 }),
        treeR = addWorld(treeClone, { h: 4.6, x: 3.25, z: -3.2, ry: -0.65, tint: "#6bd9c7", base: 0.18 }),
        peonyL = addWorld(peonyFile.scene, { h: 1.65, x: -1.95, z: -0.25, ry: 0.55, tint: "#ff648e", base: 0.33 }),
        peonyR = addWorld(peonyClone, { h: 1.35, x: 2.1, z: -0.6, ry: -0.7, tint: "#ffc05e", base: 0.42 }),
        jelly = addWorld(jellyFile.scene, { h: 1.9, x: 2.7, y: 0.25, z: -2.2, ry: 0.4, tint: "#8ce2df", base: 0.54 }),
        mushA = addWorld(mushFile.scene, { h: 0.48, x: -1.25, z: 0.15, ry: 0.5, tint: "#ffcb66", base: 0.45 }),
        mushB = addWorld(mushClone, { h: 0.7, x: 1.4, z: -0.4, ry: -0.6, tint: "#ef7ba0", base: 0.58 });
      normalize(offer, 0.32);
      watercolorize(offer, "#ffe08c");
      offer.position.set(0.35, 0.16, 0.5);
      offer.visible = false;
      scene.add(offer);
      const guy = character.scene;
      guy.scale.set(1.4, 1.17, 1.4);
      guy.position.y = -0.88;
      scene.add(guy);
      const named = {};
      guy.traverse((o) => {
        named[o.name] = o;
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
          o.material = o.material.clone();
          o.userData.base = { color: o.material.color?.clone(), roughness: o.material.roughness ?? 0.75, opacity: o.material.opacity ?? 1 };
          o.material.transparent = true;
          o.material.roughness = Math.max(0.78, o.material.roughness ?? 0.78);
          o.material.metalness = 0;
        }
      });
      const headParts = ["CG_Head", "CG_Eye_L", "CG_Eye_R", "CG_Mouth"].map((n) => named[n]).filter(Boolean),
        bodyParts = ["CG_Body", "CG_Shirt", "CG_Trousers", "CG_Shoes"].map((n) => named[n]).filter(Boolean),
        outlineParts = ["CG_Head_OL", "CG_Body_OL", "CG_Shirt_OL", "CG_Trousers_OL", "CG_Shoes_OL"].map((n) => named[n]).filter(Boolean),
        rig = named.CG_Rig,
        headBone = rig?.getObjectByName("Head"),
        eyeL = named.CG_Eye_L,
        eyeR = named.CG_Eye_R,
        mouth = named.CG_Mouth,
        eyeLHome = eyeL?.position.clone(),
        eyeRHome = eyeR?.position.clone(),
        mixer = new THREE.AnimationMixer(guy),
        actions = {};
      character.animations.forEach((c) => {
        const a = mixer.clipAction(c);
        a.play();
        a.paused = true;
        actions[c.name.toLowerCase()] = a;
      });
      const proportionBones = {
        Head: [1.16, 1.16, 1.16],
        Spine: [1, 0.88, 1],
        Chest: [1.04, 0.9, 1.04],
        UpperArm_L: [0.92, 0.88, 0.92],
        UpperArm_R: [0.92, 0.88, 0.92],
        Forearm_L: [0.9, 0.9, 0.9],
        Forearm_R: [0.9, 0.9, 0.9],
        Thigh_L: [1, 0.9, 1],
        Thigh_R: [1, 0.9, 1],
        Shin_L: [1, 0.9, 1],
        Shin_R: [1, 0.9, 1],
      };
      const ribbons = new THREE.Group();
      scene.add(ribbons);
      ["#fb768f", "#ffca67", "#6de1d2", "#a88bef", "#f5a6c1"].forEach((c, i) => {
        const k = i - 2,
          curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0.65, 0.05),
            new THREE.Vector3(k * 0.08, 1.02, 0.02),
            new THREE.Vector3(k * 0.28, 1.46, -0.1),
            new THREE.Vector3(k * 0.58, 1.85, -0.4),
          ]),
          tube = new THREE.Mesh(
            new THREE.TubeGeometry(curve, 70, 0.009, 6, false),
            new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.7, roughness: 1, transparent: true, opacity: 0.72 })
          );
        tube.scale.setScalar(0);
        ribbons.add(tube);
      });
      document.querySelector(".loading").classList.add("done");
      const beats = [
          ["01 / The mark", "Nothing yet. Just a square somebody drew and forgot."],
          ["02 / A body", "The mark borrows cloth, weight and a way to stand."],
          ["03 / First contact", "He notices the cursor. He decides it might be you."],
          ["04 / The crossing", "Each step paints a piece of the world into existence."],
          ["05 / Memory garden", "Thoughts escape the cube and become impossible living things."],
          ["06 / Unmade", "The garden takes him apart. Pigment remembers his shape."],
          ["07 / The gift", "He gathers one loose thought and brings it back to the screen."],
        ],
        words = ["MARK", "BODY", "HELLO", "WALK", "MEMORY", "DISSOLVE", "MAKE"],
        beatTitle = document.querySelector(".beat b"),
        beatSub = document.querySelector(".beat span"),
        chapterWord = document.querySelector(".chapter-word");
      let scrollTarget = 0,
        p = 0,
        tx = 0,
        ty = 0,
        mx = 0,
        my = 0,
        lastBeat = -1,
        currentAction = "",
        forcedUntil = 0;
      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)),
        sm = (a, b, v) => {
          const t = clamp((v - a) / (b - a));
          return t * t * (3 - 2 * t);
        },
        lerp = (a, b, t) => a + (b - a) * t;
      function readScroll() {
        scrollTarget = clamp(scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight));
        document.documentElement.style.setProperty("--p", scrollTarget);
      }
      addEventListener("scroll", readScroll, { passive: true });
      readScroll();
      addEventListener(
        "pointermove",
        (e) => {
          tx = (e.clientX / innerWidth) * 2 - 1;
          ty = -((e.clientY / innerHeight) * 2 - 1);
        },
        { passive: true }
      );
      addEventListener("pointerdown", () => {
        forcedUntil = performance.now() + 900;
        setAction("clickreact", 0.06);
        document.querySelector(".flash").animate([{ opacity: 0.32 }, { opacity: 0 }], { duration: 600, easing: "cubic-bezier(.15,.75,.2,1)" });
        worldPieces.forEach((o, i) => (o.rotation.y += i % 2 ? 0.12 : -0.12));
      });
      function setAction(name, t) {
        const action = actions[name] || actions[Object.keys(actions).find((k) => k.includes(name))];
        if (!action) return;
        if (currentAction !== name) {
          Object.values(actions).forEach((a) => {
            a.enabled = false;
            a.setEffectiveWeight(0);
          });
          action.enabled = true;
          action.setEffectiveWeight(1);
          action.paused = true;
          currentAction = name;
        }
        action.time = clamp(t) * Math.max(0.01, action.getClip().duration - 0.001);
        mixer.update(0);
      }
      function opacity(part, v) {
        if (!part?.material) return;
        part.visible = v > 0.003;
        part.material.opacity = clamp(v);
      }
      function resize() {
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
        renderer.setSize(innerWidth, innerHeight, false);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const dt = Math.min(clock.getDelta(), 0.05),
          now = performance.now() * 0.001;
        p += (scrollTarget - p) * (1 - Math.exp(-dt * 7));
        storyU.value = sm(0.62, 0.86, p);
        mx += (tx - mx) * (1 - Math.exp(-dt * 3.8));
        my += (ty - my) * (1 - Math.exp(-dt * 3.8));
        const depth = sm(0.055, 0.16, p),
          body = sm(0.13, 0.27, p),
          garden = sm(0.29, 0.5, p),
          thought = sm(0.5, 0.69, p),
          dissolve = sm(0.68, 0.84, p),
          make = sm(0.84, 0.98, p);
        seedMat.opacity = 1 - sm(0.07, 0.16, p);
        seedPlane.visible = seedMat.opacity > 0.002;
        seedPlane.scale.setScalar(0.88 + sm(0, 0.1, p) * 0.14);
        seedPlane.rotation.z = Math.sin(p * Math.PI) * 0.025;
        particleField.rotation.y = mx * 0.045 + garden * 0.04;
        particleField.rotation.x = -my * 0.022;
        particleField.position.x = mx * 0.13;
        particleField.position.y = my * 0.08;
        particleOpacityU.value = 0.12 + garden * 0.2 + thought * 0.15;
        if (performance.now() > forcedUntil) {
          if (p < 0.13) setAction("idle", p / 0.13);
          else if (p < 0.27) setAction("look", (p - 0.13) / 0.14);
          else if (p < 0.4) setAction("wave", (p - 0.27) / 0.13);
          else if (p < 0.55) setAction("walk", (p - 0.4) / 0.15);
          else if (p < 0.7) setAction("thoughtrelease", (p - 0.55) / 0.15);
          else if (p < 0.84) setAction("clickreact", (p - 0.7) / 0.14);
          else setAction("thoughtrelease", 0.48 + ((p - 0.84) / 0.16) * 0.44);
        }
        Object.entries(proportionBones).forEach(([n, s]) => {
          const b = rig?.getObjectByName(n);
          if (b) b.scale.set(...s);
        });
        headParts.forEach((o) => opacity(o, depth));
        bodyParts.forEach((o) => opacity(o, body * (1 - dissolve * 0.28 + make * 0.28)));
        outlineParts.forEach((o) => opacity(o, body * (1 - dissolve * 0.7 + make * 0.58)));
        const blink = Math.min(1, Math.exp(-Math.pow((p - 0.205) / 0.012, 2)) * 0.94 + Math.exp(-Math.pow((p - 0.735) / 0.014, 2)) * 0.9);
        headParts.forEach((o) => {
          o.scale.x = 1 + depth * 0.1;
          o.scale.y = 1 + depth * 0.1;
          o.scale.z = 0.018 + 0.982 * depth;
        });
        if (eyeL && eyeR) {
          eyeL.scale.y = (1 - blink) * 1.1 + 0.04;
          eyeR.scale.y = (1 - blink) * 1.1 + 0.04;
          eyeL.position.x = eyeLHome.x + mx * 0.008;
          eyeR.position.x = eyeRHome.x + mx * 0.008;
          eyeL.position.y = eyeLHome.y + my * 0.006;
          eyeR.position.y = eyeRHome.y + my * 0.006;
        }
        if (mouth) mouth.scale.x = 0.75 + sm(0.25, 0.4, p) * 0.35 + make * 0.22;
        guy.position.x = Math.sin(sm(0.4, 0.55, p) * Math.PI) * -0.72 + make * 0.16;
        guy.position.y = -0.88 + Math.sin(now * 1.4) * 0.008;
        guy.rotation.y = -0.045 + mx * 0.018;
        const pull = sm(0.08, 0.28, p);
        camera.position.z = lerp(3.05, 5.25, pull) - garden * 0.54 + make * 0.18;
        camera.position.x = mx * 0.2 + Math.sin(garden * Math.PI) * 0.14;
        camera.position.y = lerp(1.18, 0.42, pull) + my * 0.09;
        camera.lookAt(guy.position.x * 0.14, lerp(1.08, 0.16, pull), -0.18);
        scene.backgroundRotation.y = -0.34 + garden * 0.23 + mx * 0.025;
        if (headBone) {
          headBone.rotation.x = clamp(headBone.rotation.x - my * 0.025, -0.24, 0.24);
          headBone.rotation.y = clamp(headBone.rotation.y + mx * 0.035, -0.34, 0.34);
          headBone.rotation.z = clamp(headBone.rotation.z, -0.15, 0.15);
        }
        worldPieces.forEach((o, i) => {
          const appear = sm(o.userData.base, o.userData.base + 0.12, p);
          o.visible = appear > 0.003;
          o.position.y = o.userData.home.y + Math.sin(now * 0.42 + i * 1.7) * (0.018 + i * 0.001);
          o.position.z = o.userData.home.z + garden * (i % 2 ? 0.18 : -0.1);
          o.traverse((c) => {
            if (c.userData.water && c.material) c.material.opacity = (c.isPoints ? 0.86 : 0.42) * appear * (1 - dissolve * 0.18);
          });
        });
        jelly.rotation.y = 0.4 + Math.sin(now * 0.31) * 0.08;
        jelly.position.y = jelly.userData.home.y + Math.sin(now * 0.7) * 0.12;
        ribbons.children.forEach((r, i) => {
          const s = sm(0.52 + i * 0.012, 0.67 + i * 0.012, p) * (1 - make * 0.64);
          r.scale.setScalar(s);
          r.rotation.y = -mx * 0.1;
        });
        offer.visible = make > 0.01;
        offer.scale.setScalar(0.001 + make * 0.999);
        offer.position.set(guy.position.x + 0.34, 0.08 + Math.sin(now * 1.2) * 0.025, 0.5);
        offer.rotation.y = Math.sin(now * 0.45) * 0.08;
        guy.traverse((o) => {
          if (!o.isMesh || !o.material || !o.userData.base) return;
          const b = o.userData.base;
          o.material.roughness = THREE.MathUtils.lerp(Math.max(0.78, b.roughness), 1, dissolve);
          o.material.metalness = 0;
          if (b.color) {
            o.material.color.copy(b.color);
            if (dissolve > 0.01) o.material.color.lerp(new THREE.Color().setHSL((0.92 + o.id * 0.037 + p * 0.14) % 1, 0.63, 0.62), dissolve * 0.72);
            o.material.color.lerp(b.color, make * 0.68);
          }
        });
        roseLight.intensity = 18 + thought * 28;
        cyanLight.intensity = 18 + garden * 30;
        sun.intensity = 4.6 + make * 2.2;
        scene.fog.density = 0.035 - garden * 0.014 + dissolve * 0.012;
        scene.backgroundIntensity = 0.58 + garden * 0.42 - make * 0.08;
        const bi = Math.min(6, Math.floor(p * 7));
        if (bi !== lastBeat) {
          lastBeat = bi;
          beatTitle.textContent = beats[bi][0];
          beatSub.textContent = beats[bi][1];
          chapterWord.textContent = words[bi];
          chapterWord.animate(
            [
              { opacity: 0, filter: "blur(18px)" },
              { opacity: 1, filter: "blur(0)" },
            ],
            { duration: 750, easing: "cubic-bezier(.2,.7,.2,1)" }
          );
        }
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
