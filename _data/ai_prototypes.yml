- slug: guise
  title: Guise
  tagline: A camera-led AI transformation study. Guided demo available on request.
  caption: >
    Camera pose locks in, Florence-2 captions what it sees, then FLUX repaints you as viking warrior,
    marble statue, cyberpunk, or anything you type. Likeness slider, typewriter story beats, and on-demand upscale. Transforms run through a server proxy so the fal key never hits the browser.
  tools:
    - Florence-2 (fal.ai)
    - FLUX Kontext
    - Clarity upscaler
    - Vanilla JS
  year: 2026
  status: guided
  iframe_allow: "camera"
  tags:
    - camera
    - generative
    - fal.ai
  accent: "rgba(244, 241, 234, 0.14)"
- slug: watcher
  title: Watcher
