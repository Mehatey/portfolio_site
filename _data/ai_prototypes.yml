- slug: static
  title: Static
  tagline: A speech-recognition model listening to a room that isn't speaking.
  caption: >
    Whisper runs in-browser on a drifting bandpass tone: near-silence. When the signal goes thin it
    fabricates words, whole crowds, voices that were never there. The hallucinated speech rises off a dead-flat
    waveform as decaying TSL type, then dissolves back into the noise it came from.
  tools:
    - Whisper (transformers.js)
    - Three.js WebGPU + TSL
    - Web Audio API
    - Vite · TypeScript
  year: 2026
  status: live
  gpu: heavy
  iframe_allow: "microphone"
