# Runnable browser AI experiments — one folder per slug under /ai-prototypes/<slug>/
- slug: flatten
  title: FLATTEN
  tagline: A machine that sees in 3D and gets the space wrong.
  caption: >
    Live webcam depth via Depth Anything V2, rebuilt as a broken 3D point cloud. The model's edge
    hallucinations are stretched into visible geometry — smear, confidence, and ghost frames left in on purpose.
  tools:
    - Depth Anything V2
    - Three.js WebGPU + TSL
    - Hugging Face Transformers
    - Vite · TypeScript
  year: 2026
  status: live
  gpu: heavy
  iframe_allow: "camera"
  tags:
    - depth
    - webgpu
    - three.js
  accent: "rgba(140, 180, 255, 0.14)"
- slug: latent-atlas
  title: Latent Atlas
  tagline: A museum collection, arranged by what a neural network sees.
  caption: >
    1,500 Met Open Access works embedded with CLIP and laid out in a WebGPU galaxy by UMAP — fly through
    visual similarity, then type a phrase and an in-browser text encoder flies the camera to matches by meaning, not tags.
  tools:
    - CLIP (transformers.js)
    - Three.js WebGPU + TSL
    - Met Open Access API
    - Vite · TypeScript
  year: 2026
  status: live
  gpu: heavy
  tags:
    - clip
    - webgpu
    - met museum
  accent: "rgba(210, 180, 110, 0.14)"
- slug: feral
  title: FERAL
  tagline: The planet's living activity, scored in real time.
  caption: >
    iNaturalist sightings drive a generative score and a WebGPU globe. Real animal field recordings
    are woven into synth voices; a tfjs sequence model learns the order life is being logged and writes the lead line.
  tools:
    - Tone.js
    - TensorFlow.js
    - Three.js WebGPU
    - iNaturalist API
    - Vite · TypeScript
  year: 2026
  status: live
  gpu: heavy
  iframe_allow: "autoplay"
  tags:
    - tfjs
    - webgpu
    - generative audio
  accent: "rgba(180, 140, 220, 0.14)"
- slug: amnesiac
  title: Amnesiac
  tagline: An AI you talk to that loses its memory while you talk to it.
  caption: >
    A local LLM on WebGPU with a corruption buffer that rots conversation history in real time. The model
    genuinely responds to broken memory — the UI and WebGPU substrate decay as coherence falls.
  tools:
    - web-llm (MLC)
    - Three.js WebGPU + TSL
    - Web Audio
    - Vite · TypeScript
  year: 2026
  status: live
  gpu: heavy
  tags:
    - web-llm
    - webgpu
    - three.js
  accent: "rgba(120, 255, 200, 0.14)"
- slug: mimic
  title: MIMIC
  tagline: Life sorted by sight, not by name.
  caption: >
    CLIP embeds every live iNaturalist photo into visual space; organisms cluster by resemblance, not taxonomy.
    Where the feed outruns memory, the atlas forgets — and hollow "expected forms" fill the gaps until reality confirms them.
  tools:
    - CLIP (transformers.js)
    - Three.js WebGPU + TSL
    - iNaturalist API
    - Vanilla JS
  year: 2026
  status: live
  gpu: heavy
  tags:
    - clip
    - webgpu
    - iNaturalist
  accent: "rgba(196, 166, 240, 0.14)"
- slug: mirror
  title: MIRROR
  tagline: An AI that reconstructs a person from almost nothing.
  caption: >
    Five synthetic characters with procedural WebGPU particle portraits — browse street scenes, talk by
    voice, and get replies from an on-device Llama model with audio-reactive lip sync. The surveillance
    metaphor lives in how confidently thin signal becomes a whole person; every persona is invented, never a real third party.
  tools:
    - web-llm (MLC)
    - Web Speech API
    - Three.js WebGPU + TSL
    - Vite · TypeScript
  year: 2026
  status: live
  gpu: heavy
  iframe_allow: "autoplay; microphone"
  tags:
    - web-llm
    - webgpu
    - voice
  accent: "rgba(200, 160, 140, 0.14)"
- slug: forecast
  title: FORECAST
  tagline: A machine reading the mood of the species, live.
  caption: >
    GDELT crisis signal drives a WebGPU tension field on the globe — an in-browser LSTM trains on recent
    volume each session and forecasts the next spike, then narrates headlines as a typewriter voice while the map watches itself get the future slightly wrong.
  tools:
    - GDELT API
    - TensorFlow.js
    - Three.js WebGPU
    - Vite · TypeScript
  year: 2026
  status: live
  gpu: heavy
  iframe_allow: "autoplay"
  tags:
    - tfjs
    - webgpu
    - gdelt
  accent: "rgba(255, 122, 69, 0.14)"
- slug: guise
  title: GUISE
  tagline: A live machine looks at you, then becomes whatever you ask.
  caption: >
    Camera pose locks in, Florence-2 captions what it sees, then FLUX repaints you as viking warrior,
    marble statue, cyberpunk, or anything you type — likeness slider, typewriter story beats, and on-demand upscale. Transforms run through a server proxy so the fal key never hits the browser.
  tools:
    - Florence-2 (fal.ai)
    - FLUX Kontext
    - Clarity upscaler
    - Vanilla JS
  year: 2026
  status: live
  iframe_allow: "camera"
  tags:
    - camera
    - generative
    - fal.ai
  accent: "rgba(244, 241, 234, 0.14)"
- slug: watcher
  title: WATCHER
  tagline: Every person classified. Every scene assessed. Confidently wrong about all of it.
  caption: >
    Florence-2 runs in-browser on a grid of live public street cameras worldwide — tracking subjects,
    templated surveillance dossiers, dwell-escalating threat scores, and CRT-treated WebGPU HUD. Real VLM inference; the bureaucracy layered on top is fiction.
  tools:
    - Florence-2 (transformers.js)
    - Three.js WebGPU
    - Global public camera APIs
    - Vite · TypeScript
  year: 2026
  status: live
  gpu: heavy
  tags:
    - florence-2
    - webgpu
    - surveillance
  accent: "rgba(180, 60, 60, 0.14)"
