- slug: mirror
  title: Mirror
  repo: https://github.com/Mehatey/mirror
  tagline: An AI that reconstructs a person from almost nothing.
  caption: >
    Five synthetic characters with procedural WebGPU particle portraits. Browse street scenes, talk by
    voice, and get replies from an on-device Llama model with audio-reactive lip sync. The surveillance
    metaphor lives in how confidently thin signal becomes a whole person. Every persona is invented, never a real third party.
  tools:
    - web-llm (MLC)
    - Web Speech API
    - Three.js WebGPU + TSL
    - Vite · TypeScript
  year: 2026
  status: live
  gpu: heavy
  iframe_allow: "autoplay; microphone"
  tags:
    - web-llm
    - webgpu
    - voice
  # p1 (Lina Park) is shot on a near-black street plate — on the page it read
  # as an empty box with a text panel floating in it. p5 is Elias Rowan: the
  # particle portrait is lit, and the transcript panel shows an actual exchange
  # rather than an empty prompt, so the clip carries both halves of the piece.
  video: /assets/media/ai-prototypes/mirror/p5.mp4
  poster: /assets/media/ai-prototypes/mirror/p5-poster.webp
  accent: "rgba(200, 160, 140, 0.14)"

