# Runnable browser AI experiments — one folder per slug under /ai-prototypes/<slug>/
#
# ── ONE ENTRY, ONE VIDEO, ONE LINK ──────────────────────────────────────────
# The page that reads this file renders every entry with the identical
# structure: index, name, one line, one video, one link. So each entry carries
# at most one piece of media.
#
#   video / poster : the single clip that shows the prototype WORKING. Not the
#                    title card, not the ambient loop — the interface doing the
#                    thing the tagline claims. Picked off contact sheets of
#                    every candidate clip rather than off filenames.
#   link           : only when the prototype lives at a slug other than its own
#                    (Vantage's runnable build is /ai-prototypes/helpdesk/).
#
# Entries with a video come first, so the scroll opens on moving work and the
# five still-uncaptured ones sit together at the end rather than punching holes
# in the rhythm. When a clip is recorded for one of them, add the two keys and
# move it up — nothing else has to change.
# ────────────────────────────────────────────────────────────────────────────

- slug: captcha
  # Quoted: the colon in the title is a YAML key separator otherwise.
  title: "CAPTCHA: After Human"
  repo: https://github.com/Mehatey/captcha-after-human
  tagline: Ten proofs that you are human, in a world where drawing is the only evidence left.
  caption: >
    Each stage gives you fifteen seconds on a torn drawing surface with a velocity-responsive pencil, then an
    independent AI answers the same prompt on the right. Both drawings become 3D artifacts: fingerprint contours,
    a branching organism, a weathered relic. The last stage asks you to redraw your first gesture from memory.
  tools:
    - WebGL
    - Procedural geometry
    - Generative drawing
    - Vite · JavaScript
  year: 2026
  status: live
  gpu: heavy
  tags:
    - drawing
    - webgl
    - speculative
  # 02 over the opener. captcha_01 is the title sequence — the 3D mark and a
  # particle burst, no interaction in it — and this page's one slot goes to
  # the thing working, not the thing announcing itself. 02 is the whole
  # mechanic in eight seconds: the prompt "draw something you would never
  # optimize", a hand drawing a heart on the left, the machine answering on
  # the right, and the code writing itself underneath.
  #
  # The other three are encoded and sitting beside it (01 opener, 03 the wild,
  # 05 another life) for the case-study page Sid described: 01 full, 02 full,
  # then 03 and 05 as a pair. 04 was dropped at his suggestion — it is a fourth
  # variation on a transform the other two already show.
  video: /assets/media/ai-prototypes/captcha/CAPTCHA-02-never-optimize.mp4
  poster: /assets/media/ai-prototypes/captcha/CAPTCHA-02-never-optimize-poster.webp
  accent: "rgba(240, 79, 61, 0.16)"

- slug: vantage
  title: Vantage
  # Vantage is the product concept; /ai-prototypes/helpdesk/ is the build you
  # can actually run. They were two entries on this page pointing at one URL,
  # which is where half the "repeated links" came from. One entry now.
  link: /ai-prototypes/helpdesk/
  category: AI product design · speculative UX
  role: Product concept · UX/UI · prototyping
  tagline: The customer-care agent that says the right thing, even when it is thinking something else.
  caption: >
    A speculative customer-care system exploring the distance between emotional reaction and professional response.
    Vantage gives Alex a private internal voice, then turns that raw reaction into a calm, useful customer message.
  tools:
    - Conversational AI
    - Agent experience
    - Responsible automation
  year: 2026
  status: concept
  # opening.mp4 is a title slide ("WHEN EVERYONE LOGS OFF, SOMEONE STILL
  # ANSWERS") and closing.mp4 is the reflection film. transition.mp4 is the one
  # that puts the actual product on screen — Alex at the desk, then the live
  # console and its message thread.
  video: /assets/media/ai-prototypes/vantage/transition.mp4
  poster: /assets/media/ai-prototypes/vantage/transition-poster.webp
  accent: "rgba(255, 178, 118, 0.22)"

- slug: mimic
  title: Mimic
  repo: https://github.com/Mehatey/mimic
  tagline: Life sorted by sight, not by name.
  caption: >
    CLIP embeds every live iNaturalist photo into visual space, and organisms cluster by resemblance, not taxonomy.
    Where the feed outruns memory, the atlas forgets: hollow expected forms fill the gaps until reality confirms them.
  tools:
    - CLIP (transformers.js)
    - Three.js WebGPU + TSL
    - iNaturalist API
    - Vanilla JS
  year: 2026
  status: live
  gpu: heavy
  tags:
    - clip
    - webgpu
    - iNaturalist
  # The one clip that carries the whole process rather than a moment of it:
  # empty space, the feed arriving, the field thickening, a dive into a single
  # photograph, the dossiers, and at 45s "an imagined form" — the hollow ring
  # the machine draws where it expects a species nobody has logged yet, which
  # is the actual thesis and appears in none of the shorter clips.
  #
  # It replaces mimic1, a 20s fragment of the middle. The other four clips
  # (mimic1, mimic4, mimic5, the assembly transition) are now unused here.
  #
  # Rebuilt from the 1920x1080 master. Every mimic clip in this repo had been
  # downscaled to 1280x720 by an earlier pass, on footage whose species
  # dossiers are small type — this one is native resolution.
  video: /assets/media/ai-prototypes/mimic/MIMIC-walkthrough.mp4
  poster: /assets/media/ai-prototypes/mimic/MIMIC-walkthrough-poster.webp
  accent: "rgba(196, 166, 240, 0.14)"

