- slug: amnesiac
  title: Amnesiac
  repo: https://github.com/Mehatey/amnesiac
  tagline: An AI you talk to that loses its memory while you talk to it.
  caption: >
    A local LLM on WebGPU with a corruption buffer that rots conversation history in real time. The model
    genuinely responds to broken memory: the UI and WebGPU substrate decay as coherence falls.
  tools:
    - web-llm (MLC)
    - Three.js WebGPU + TSL
    - Web Audio
    - Vite · TypeScript
  year: 2026
  status: live
  gpu: heavy
  tags:
    - web-llm
    - webgpu
    - three.js
  # Two source clips joined into the one media slot this page gives an entry:
  # am1, where the ChatGPT mark glitches apart and resolves into the AMNESIAC
  # mark, running straight into am3, the conversation itself rotting until the
  # model is answering in "*pauses*... *flickers*... confuse me". The hook and
  # the functionality in one uninterrupted take. am2, the boot log, is left out
  # — it is a loading screen, and the join is stronger without it.
  #
  # Kept at native 1920x1080 rather than the 1280x720 most clips here use: this
  # is the most text-dense footage on the site (a terminal log and a chat
  # transcript), and the decaying TEXT is the piece. Downscaling would mush the
  # one thing a viewer needs to read. The audio is carried through from both
  # sources: an earlier pass stripped it on the reasoning that the page plays
  # these muted, which stopped being true the moment every clip got a sound
  # toggle. One silent entry out of nine is a button that does nothing.
  video: /assets/media/ai-prototypes/amnesiac/AMNESIAC-open-and-forget.mp4
  poster: /assets/media/ai-prototypes/amnesiac/AMNESIAC-open-and-forget-poster.webp
  accent: "rgba(120, 255, 200, 0.14)"

