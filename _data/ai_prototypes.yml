- slug: vantage
  title: Vantage
  category: AI product design · speculative UX
  role: Product concept · UX/UI · prototyping
  tagline: The customer-care agent that says the right thing, even when it is thinking something else.
  caption: >
    A speculative customer-care system exploring the distance between emotional reaction and professional response.
    Vantage gives Alex a private internal voice, then turns that raw reaction into a calm, useful customer message.
