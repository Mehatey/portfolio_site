- slug: mirror
  title: Mirror
  repo: https://github.com/Mehatey/mirror
  tagline: An AI that reconstructs a person from almost nothing.
  caption: >
    Five synthetic characters with procedural WebGPU particle portraits. Browse street scenes, talk by
    voice, and get replies from an on-device Llama model with audio-reactive lip sync. The surveillance
    metaphor lives in how confidently thin signal becomes a whole person. Every persona is invented, never a real third party.
  tools:
    - web-llm (MLC)
    - Web Speech API
    - Three.js WebGPU + TSL
    - Vite · TypeScript
