# ─────────────────────────────────────────────────────────────────────────────
# PLAY — real titles, written by Sid, one piece at a time
#
# WHY THIS FILE EXISTS
#
# /play/ renders 201 images. Every one of them was announced to a screen reader
# as "Archive piece 047", and an earlier version was worse: it invented a genre
# by bucketing the filename number, so a graphite copy of Guernica was labelled
# "Visual system 034". That was replaced with an honest constant, which stopped
# the lying and left 201 numbered non-descriptions.
#
# Nobody but Sid can fix that. Inventing a medium and a year for his artwork is
# not something this repo is allowed to do, and it is the reason the generic
# label is still the default rather than something more confident.
#
# HOW IT WORKS
#
# The key is the file number as it appears in play/assets/spatial/pNNN.webp.
# Anything present here is used; anything absent falls back to "Archive piece".
# So this can be filled in twenty pieces at a time and the page improves twenty
# pieces at a time — there is no all-or-nothing.
#
#   "34":
#     title: Guernica, by hand
#     medium: Graphite on paper
#     year: "2019"
#
# `title` is the only required field. `medium` and `year` are appended to the
# accessible name when they are there, because "Guernica, by hand. Graphite on
# paper, 2019" is what somebody would say out loud about it.
#
# THE TWENTY THAT MATTER MOST are the ones a recruiter is likeliest to open —
# whatever you would put in front of someone first. The rest can stay generic
# indefinitely; a truthful generic label is not a bug, it is just quiet.
# ─────────────────────────────────────────────────────────────────────────────
