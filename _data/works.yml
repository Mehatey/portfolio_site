# Selected work, in order of importance. Extracted verbatim from the old
# works layout so the rebuild changed the page, not the facts.
#
# Paths are site-root relative with no baseurl: data files are not run
# through Liquid, so the template prepends site.baseurl itself.
#
# `imgw` is the master's real pixel width, measured rather than assumed: the
# srcset in the layout used to declare a flat 1600w for every cover, and they
# actually run from 1500 to 2400. A `w` descriptor is a promise the browser
# plans against, so a wrong one is worse than none.
#
#
# `lane` groups the grid for a reader who arrived looking for one kind of
# proof. Three values, and every entry must carry one or it renders in no
# lane at all and silently disappears from /works/:
#
#   product   shipped product work with numbers attached
#   ai        work where the model or the sensor is the material
#   culture   identity systems, exhibitions, image-making
#
# The list stays in order of importance and the template numbers from that
# order, not from position within a lane, so 01 is still the headline piece
# wherever it sits.
#
# `img` is the grid cover. Where the old markup had no data-img the first
# frame of its preview reel is used, which is the image that plate was
# showing anyway.

