<!-- ── THE WALL ────────────────────────────────────────────────────────────────
     Sid: "can we add this when you scroll below the apple music screen rec
     this is a png of my room wall and we can do something creative in the
     spaces between. but yeah a nice scroll transition from the music and the
     water bg to the png of my room. and make sure this is a common footer
     across."

     It is the last thing on the site, after the coda, and it is the only
     image here that is a place rather than a piece of work: the wall above
     his desk, with the postcards and the drawings and the letter and the
     cube-head sketch on it.

     THE SPACES BETWEEN. The file is cut out — the wall itself is transparent
     and only the pinned objects carry pixels — so the gaps are real holes
     onto the page's ground rather than painted black. That is what the
     treatment is built on:

       · it arrives OUT of the water. The pond above fades as this rises, so
         one ground hands to the other rather than cutting;
       · it breathes. A displacement map moves the image's own pixels along a
         slow noise field, so the wall bends the way something under water
         bends. (A raking light sweep used to live here. It parked as a pale
         vertical band down the right-hand side once --p settled, which read
         as a rendering fault on the photograph — Sid spotted it and confirmed
         there is no such mark in the source PNG. Removed rather than retuned:
         a light painted over the picture was the wrong idea for a picture
         that is meant to be IN something.)
       · the pointer is a torch afterwards. A soft warm pool follows the
         cursor and the wall is dim outside it, so reading the wall means
         moving over it — which is the only honest way to show something that
         is a hundred small things and no single subject.

     RESOLUTION. The frame is min(1500px, 96vw) wide, so a 2x display asks
     for up to 3000px of image. The first version of this shipped a 1600px
     top rung, which is short by about half on any retina screen — the wall
     is a hundred small photographs and a soft one is just mush. The original
     2560 plate is the top rung now and `sizes` describes the frame rather
     than the viewport, so the browser can actually pick correctly.

     It ships in site_footer.html, so it is on every page that has a footer.
     ─────────────────────────────────────────────────────────────────────── -->
<section class="wall" id="wall" aria-label="The wall above Sid's desk">
  <div class="wall__runway">
    <div class="wall__stage">
      <div class="wall__frame" id="wall-frame">
        <img
          class="wall__img"
          src="{{ site.baseurl }}/assets/img/room-wall-1600.webp"
          srcset="
            {{ site.baseurl }}/assets/img/room-wall-900.webp   900w,
            {{ site.baseurl }}/assets/img/room-wall-1600.webp 1600w,
            {{ site.baseurl }}/assets/img/room-wall-2560.webp 2560w
          "
          sizes="(max-width: 900px) 100vw, min(1500px, 96vw)"
          alt="The wall above Sid's desk: postcards, drawings, photographs, a letter, and a cube-headed figure in the middle"
          loading="lazy"
          decoding="async"
        />
        <span class="wall__torch" aria-hidden="true"></span>
      </div>
    </div>
  </div>

  <!-- ── THE RIPPLE ────────────────────────────────────────────────────────
       Sid: "it should look like it's placed onto the water realistically. can
       you add a realistic, soft ripple to it so it feels like it's breathing."

       A displacement map, not an overlay. Everything laid ON this image so
       far — the torch, the old sweep — sat above it and tinted it, and a
       picture with light painted on top still reads as a picture with light
       painted on top. Water does not tint what is under it, it MOVES it.

       feTurbulence generates a slow fractal noise field and feDisplacementMap
       pushes the image's own pixels along it, so the postcards themselves
       bend. baseFrequency animates between two close values over eighteen
       seconds, which is the breathing: too slow to watch, too present to
       miss. Scale is 7 — enough to soften a straight pin edge, not enough to
       turn a hundred small photographs into soup.

       SMIL rather than JS because this needs no state and no rAF; the browser
       animates the filter itself and stops when the tab is hidden. -->
  <svg class="wall__defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="wall-ripple" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.019" numOctaves="2" seed="7" result="noise">
        <animate
          attributeName="baseFrequency"
          dur="18s"
          values="0.011 0.019; 0.016 0.013; 0.011 0.019"
          calcMode="spline"
          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"
          repeatCount="indefinite"
        />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
</section>

<style>
  .wall {
    position: relative;
    z-index: 2;
    background: transparent;
  }
  /* The runway is the duration of the transition. Short — this is a coda to
     the coda, not another act. */
  /* 120vh, not 175. This section sits in the shared footer, so its runway
     is charged to the bottom of every page on the site — the same toll the
     coda's runway pays, and the reason that one was cut from 280vh to 150.
     At 120 the arrival still has room to happen and the footer stops growing
     by nearly two screens on pages that were already long. */
  .wall__runway {
    height: 120vh;
  }
  .wall__stage {
    position: sticky;
    top: 0;
    height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(64px, 10vh, 120px) clamp(16px, 4vw, 64px);
    overflow: hidden;
  }
  .wall__frame {
    position: relative;
    width: min(1500px, 96vw);
    /* --p is 0 as the section enters and 1 once it is centred, written by the
       script below. Everything reads off it. */
    transform: scale(calc(1.14 - var(--p, 0) * 0.14)) translateY(calc((1 - var(--p, 0)) * 7vh));
    opacity: calc(var(--p, 0) * 1.25);
    will-change: transform, opacity;
  }
  .wall__img {
    display: block;
    width: 100%;
    height: auto;
    /* Sid: "it should be at 100% opacity and not be saturated."

       It was brightness 0.46 — the wall was being held at less than half
       strength so that a torch pool would have somewhere to travel to. That
       is a reasonable trick for an object you want a visitor to hunt through
       in the dark, and the wrong one for an object that is supposed to be
       sitting IN something. Half-lit reads as a picture behind glass, not a
       picture under water.

       Full brightness now, and the saturation comes DOWN rather than up,
       because that is what water does: it desaturates and cools what is
       beneath it. The torch still works — it just lifts an already-lit wall
       by a little instead of rescuing a dark one. */
    filter: brightness(calc(1 + var(--lit, 0) * 0.06)) saturate(0.82) url(#wall-ripple);
    transition: filter 400ms ease;
  }
  .wall__defs {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
  }
  /* A displacement map is a per-pixel filter over a 1500px image. On a
     coarse pointer that is a phone GPU redrawing the footer of every page,
     and the ripple is the least of what a phone is being asked for here. */
  @media (hover: none), (pointer: coarse), (prefers-reduced-motion: reduce) {
    .wall__img {
      filter: brightness(calc(1 + var(--lit, 0) * 0.06)) saturate(0.82);
    }
  }

  /* THE TORCH. A soft pool at the pointer, composited so it lifts only what
     is actually there — screen over transparent gaps changes nothing, which
     is exactly the behaviour a cut-out wants. */
  .wall__torch {
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: var(--torch, 0);
    transition: opacity 500ms ease;
    background: radial-gradient(
      circle at calc(var(--tx, 50%)) calc(var(--ty, 50%)),
      rgba(255, 228, 178, 0.5) 0%,
      rgba(255, 216, 150, 0.22) 22%,
      rgba(255, 210, 140, 0.06) 40%,
      transparent 62%
    );
  }

  html[data-theme="light"] .wall__img {
    filter: brightness(calc(1 + var(--lit, 0) * 0.04)) saturate(0.86) url(#wall-ripple);
  }
  @media (hover: none), (pointer: coarse), (prefers-reduced-motion: reduce) {
    html[data-theme="light"] .wall__img {
      filter: brightness(calc(1 + var(--lit, 0) * 0.04)) saturate(0.86);
    }
  }
  html[data-theme="light"] .wall__torch {
    mix-blend-mode: multiply;
    background: radial-gradient(
      circle at calc(var(--tx, 50%)) calc(var(--ty, 50%)),
      rgba(255, 245, 225, 0) 0%,
      rgba(30, 26, 20, 0.16) 46%,
      rgba(30, 26, 20, 0.28) 70%
    );
  }

  @media (max-width: 760px) {
    .wall__runway {
      height: 130vh;
    }
    .wall__frame {
      width: 100%;
    }
    /* No pointer to carry a torch on a phone, so the wall simply lights. */
    .wall__img {
      filter: brightness(0.72) saturate(0.95);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .wall__frame {
      transform: none;
      opacity: 1;
    }
  }
</style>

<script>
  (function () {
    var sec = document.getElementById("wall");
    var frame = document.getElementById("wall-frame");
    if (!sec || !frame) return;

    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var fine = !window.matchMedia || window.matchMedia("(hover: hover) and (pointer: fine)").matches;

    var p = 0;
    var raf = 0;

    function measure() {
      /* 0 as the runway's top reaches the viewport, 1 by the time it has
         travelled one viewport further. The same pinned-progress idea the
         hero uses, at a smaller scale. */
      var r = sec.getBoundingClientRect();
      var span = Math.max(1, window.innerHeight * 0.75);
      var v = (window.innerHeight * 0.5 - r.top) / span;
      var np = Math.max(0, Math.min(1, v));
      if (Math.abs(np - p) > 0.002) {
        p = np;
        frame.style.setProperty("--p", p.toFixed(3));
      }
      raf = 0;
    }

    function onScroll() {
      if (!raf) raf = requestAnimationFrame(measure);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    measure();

    if (fine && !reduce) {
      frame.addEventListener("pointerenter", function () {
        frame.style.setProperty("--torch", "1");
        frame.style.setProperty("--lit", "1");
      });
      frame.addEventListener("pointerleave", function () {
        frame.style.setProperty("--torch", "0");
        frame.style.setProperty("--lit", "0");
      });
      frame.addEventListener(
        "pointermove",
        function (e) {
          var r = frame.getBoundingClientRect();
          frame.style.setProperty("--tx", (((e.clientX - r.left) / Math.max(1, r.width)) * 100).toFixed(2) + "%");
          frame.style.setProperty("--ty", (((e.clientY - r.top) / Math.max(1, r.height)) * 100).toFixed(2) + "%");
        },
        { passive: true }
      );
    }
  })();
</script>
