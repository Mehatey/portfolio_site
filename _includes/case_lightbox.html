<!-- ══════════════════════════════════════════════════════════════════════════
     THE CASE-STUDY IMAGES OPEN

     A case study is between eleven and sixty-nine pieces of media and, until
     now, not one of them could be looked at properly. cube-guy.md alone holds
     eighteen images inside a three-column grid where each lands about 400px
     wide; the sketchbook spreads and the illustration boards in them carry
     detail that simply could not be read at that size. /play/ has had a
     lightbox for its archive the whole time. The work did not.

     WHAT IT DOES NOT TOUCH

     Videos. Fifty-one of cube-guy's sixty-nine media elements are clips: some
     autoplay as ambient loops, some carry controls and are meant to be
     scrubbed in place. Lifting one into an overlay would interrupt something
     that is already doing its job. Images only.

     Nothing inside a link either. Measured across three case studies, no
     media currently sits inside an anchor — but if one ever does, the anchor
     wins, because a link that opens a viewer instead of navigating is a trap.

     THE MORPH

     Opening is a same-document View Transition: the thumbnail and the overlay
     image are given the same `view-transition-name` for the duration, so the
     browser moves the picture from where it sat in the page to the middle of
     the screen and back again. Same device as the theme wipe, and unlike the
     cross-document work it is verifiable, so it is verified.

     The name is applied for the length of the transition and removed after.
     Leaving it on would make the next open the second element to claim it,
     which invalidates both and silently drops the morph.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
  .cslb {
    position: fixed;
    inset: 0;
    z-index: 10050;
    display: none;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 5vh, 64px) clamp(20px, 5vw, 80px);
    background: rgba(4, 6, 11, 0.92);
    -webkit-backdrop-filter: blur(18px) saturate(1.1);
    backdrop-filter: blur(18px) saturate(1.1);
  }
  html[data-theme="light"] .cslb {
    background: rgba(238, 236, 230, 0.94);
  }
  .cslb.is-open {
    display: flex;
  }
  .cslb__fig {
    margin: 0;
    max-width: 100%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .cslb__img {
    max-width: 100%;
    /* Room for the caption under it without either being cropped. */
    max-height: calc(100vh - clamp(96px, 16vh, 190px));
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 3px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
  }
  .cslb__cap {
    margin: 0;
    max-width: 62ch;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.7;
    letter-spacing: 0.04em;
    color: rgba(236, 241, 247, 0.68);
  }
  html[data-theme="light"] .cslb__cap {
    color: rgba(20, 22, 27, 0.7);
  }
  .cslb__close {
    position: absolute;
    top: clamp(14px, 2.4vh, 26px);
    right: clamp(14px, 2.4vw, 30px);
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line, rgba(255, 255, 255, 0.16));
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font-family: var(--font-mono);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition:
      border-color 0.2s ease,
      transform 0.2s ease;
  }
  .cslb__close:hover,
  .cslb__close:focus-visible {
    border-color: currentColor;
    transform: rotate(90deg);
  }

  /* The affordance. These images were inert for the life of the site, so the
     only honest way to say they now open is to say it on approach. */
  .proj-body img.cslb-able {
    cursor: zoom-in;
  }
  @media (prefers-reduced-motion: reduce) {
    .cslb__close {
      transition: none;
    }
  }
</style>

<div class="cslb" id="cslb" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="cslb__close" type="button" id="cslb-close" aria-label="Close image viewer">&times;</button>
  <figure class="cslb__fig">
    <img class="cslb__img" id="cslb-img" alt="" decoding="async" />
    <figcaption class="cslb__cap" id="cslb-cap"></figcaption>
  </figure>
</div>

<script>
  (function () {
    "use strict";
    var box = document.getElementById("cslb");
    var img = document.getElementById("cslb-img");
    var cap = document.getElementById("cslb-cap");
    var closeBtn = document.getElementById("cslb-close");
    var body = document.querySelector(".proj-body");
    if (!box || !img || !body) return;

    var NAME = "cs-zoom";
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* Which images qualify. Anything genuinely small is decorative furniture
       rather than work, and turning it into a viewer target would add tab
       stops that lead nowhere worth going. */
    function collect() {
      return [].slice.call(body.querySelectorAll("img")).filter(function (el) {
        if (el.closest("a")) return false;
        var r = el.getBoundingClientRect();
        return r.width >= 120 && r.height >= 90;
      });
    }

    var items = [];
    var index = -1;
    var lastFocus = null;

    /* A caption if the page already wrote one. Nothing is invented: if there
       is no cube-cap near the image, the viewer shows the picture alone. */
    function captionFor(el) {
      var wrap = el.closest(".cs-grid-item, .cs-bleed, figure") || el.parentElement;
      var c =
        (wrap && wrap.querySelector(".cube-cap")) ||
        (wrap && wrap.nextElementSibling && wrap.nextElementSibling.classList.contains("cube-cap") ? wrap.nextElementSibling : null) ||
        (wrap && wrap.previousElementSibling && wrap.previousElementSibling.classList.contains("cube-cap") ? wrap.previousElementSibling : null);
      return c ? c.textContent.trim() : "";
    }

    function paint(i) {
      var el = items[i];
      if (!el) return;
      index = i;
      img.src = el.currentSrc || el.src;
      img.alt = el.alt || "";
      var t = captionFor(el);
      cap.textContent = t;
      cap.style.display = t ? "" : "none";
    }

    /* The morph. `run` is whatever actually changes the DOM; if View
       Transitions are unavailable or unwelcome it simply runs. */
    /* ── ONE NAME AT A TIME ────────────────────────────────────────────────
       The obvious implementation puts the name on the thumbnail AND the
       overlay image before starting, and it is wrong: a view-transition-name
       must be unique per phase, and once `run` has made the overlay visible
       both elements hold it at the new-snapshot. Chrome answers that with
       "InvalidStateError: Transition was aborted because of invalid state"
       and drops the morph — which is exactly what it did here until this was
       measured.

       So the name is handed over inside `run`: the thumbnail carries it for
       the old snapshot, the overlay carries it for the new one, and never
       both at once. `from` is the element the picture leaves and `to` is the
       one it arrives at, which reverses on close. */
    function withMorph(from, to, run) {
      if (!document.startViewTransition || reduce || !from || !to) {
        run();
        return Promise.resolve();
      }
      from.style.viewTransitionName = NAME;
      var vt = document.startViewTransition(function () {
        from.style.viewTransitionName = "";
        to.style.viewTransitionName = NAME;
        run();
      });
      var clear = function () {
        from.style.viewTransitionName = "";
        to.style.viewTransitionName = "";
      };
      vt.finished.then(clear, clear);
      return vt.finished.catch(function () {});
    }

    function open(i) {
      lastFocus = document.activeElement;
      paint(i);
      withMorph(items[i], img, function () {
        box.hidden = false;
        box.classList.add("is-open");
        document.documentElement.style.overflow = "hidden";
      }).then(function () {
        /* After the morph, not before: focusing a button inside a still
           `hidden` dialog silently does nothing, which left the keyboard on
           whatever was behind the overlay. */
        closeBtn.focus();
      });
    }

    function close() {
      var el = items[index];
      index = -1;
      withMorph(img, el, function () {
        box.classList.remove("is-open");
        box.hidden = true;
        document.documentElement.style.overflow = "";
      }).then(function () {
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      });
    }

    function step(d) {
      if (index < 0 || !items.length) return;
      var next = (index + d + items.length) % items.length;
      /* No morph between neighbours: the picture is already centred, so
         moving it from its thumbnail position and back would be a detour
         through the page. A straight swap is what "next" should feel like. */
      paint(next);
      /* Keep the page's own scroll roughly with the viewer, so closing does
         not leave the reader somewhere they never were. */
      var el = items[next];
      if (el && el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "instant" });
    }

    body.addEventListener("click", function (e) {
      var el = e.target;
      if (!el || el.tagName !== "IMG") return;
      if (el.closest("a")) return;
      items = collect();
      var i = items.indexOf(el);
      if (i < 0) return;
      e.preventDefault();
      open(i);
    });

    /* Marked on load and after images decode, so the zoom-in cursor and the
       keyboard affordance only appear on pictures that actually qualify. */
    function markOne(el) {
      if (el.hasAttribute("data-cslb")) return;
      el.setAttribute("data-cslb", "");
      el.classList.add("cslb-able");
      el.setAttribute("tabindex", "0");
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", (el.alt ? el.alt + ". " : "") + "Open larger");
    }
    function mark() {
      var list = collect();
      for (var i = 0; i < list.length; i++) markOne(list[i]);
    }
    /* Marking cannot be a one-off. These pages lazy-load their media, and an
       image that has not decoded has no layout size — measured on cube-guy,
       a single pass at 1.2s qualified two images out of eighteen because the
       rest were still zero-height below the fold. Each image is watched and
       marked when it actually arrives on screen with real dimensions. */
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(
        function (entries) {
          for (var i = 0; i < entries.length; i++) {
            if (!entries[i].isIntersecting) continue;
            var r = entries[i].boundingClientRect;
            if (r.width < 120 || r.height < 90) continue;
            markOne(entries[i].target);
            io.unobserve(entries[i].target);
          }
        },
        { rootMargin: "200px 0px" }
      );
      var watch = body.querySelectorAll("img");
      for (var w = 0; w < watch.length; w++) {
        if (!watch[w].closest("a")) io.observe(watch[w]);
      }
    }
    window.addEventListener("load", mark);
    setTimeout(mark, 1200);

    body.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var el = document.activeElement;
      if (!el || el.tagName !== "IMG" || !el.hasAttribute("data-cslb")) return;
      e.preventDefault();
      items = collect();
      var i = items.indexOf(el);
      if (i >= 0) open(i);
    });

    /* ── TOUCH ─────────────────────────────────────────────────────────────
       Arrow keys are the only way to move between images, which on a phone
       means there is none: you can open a picture and then only close it.
       A horizontal drag steps, the same gesture the rest of the site already
       uses on the footer rail.

       The vertical guard matters. A phone gallery that steps on any drag
       fights the reader's attempt to scroll, so the gesture only counts when
       it is decisively horizontal — more than 48px across and at least
       twice as far across as it travelled down. */
    var tx0 = 0,
      ty0 = 0,
      touching = false;
    box.addEventListener(
      "touchstart",
      function (e) {
        if (e.touches.length !== 1) return;
        touching = true;
        tx0 = e.touches[0].clientX;
        ty0 = e.touches[0].clientY;
      },
      { passive: true }
    );
    box.addEventListener(
      "touchend",
      function (e) {
        if (!touching) return;
        touching = false;
        var t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        var dx = t.clientX - tx0;
        var dy = t.clientY - ty0;
        if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 2) return;
        step(dx < 0 ? 1 : -1);
      },
      { passive: true }
    );

    closeBtn.addEventListener("click", close);
    box.addEventListener("click", function (e) {
      if (e.target === box) close();
    });
    document.addEventListener("keydown", function (e) {
      if (box.hidden) return;
      if (e.key === "Escape") {
        e.preventDefault();
        close();
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        step(1);
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        step(-1);
      } else if (e.key === "Tab") {
        /* Two focusable things exist while this is open and one of them is
           the page behind it. Keeping focus on the close button is the
           smallest correct trap for a dialog with a single control. */
        e.preventDefault();
        closeBtn.focus();
      }
    });
  })();
</script>
