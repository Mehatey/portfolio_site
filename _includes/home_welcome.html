<!-- ══════════════════════════════════════════════════════════════════════════
     THE WELCOME

     Sid: "in the beginning, before anything shows up, I want the chat thing to
     be the first thing ... it spurts out, and then it shows the three
     different icons and what they do. It slowly animates and highlights each
     one: the audio, the hand gesture, and then it animates and starts the
     other homepage content. I feel like this will anchor and help guide the
     user onto what the cube icon is right from the start instead of
     overloading them with everything."

     This is the answer to a complaint he made earlier in the same session --
     "there is no structure or order of experience" -- and it is the right
     answer, because the problem was never that the page lacked animation. It
     was that everything arrived at once, so nothing was first. A page where
     eleven things appear together has no hierarchy no matter how well each
     one is drawn.

     SO THE CUBE GOES FIRST, AND IT SPEAKS. The character that lives in the
     corner introduces the site, then introduces its own controls one at a
     time, and only then hands over to the page. Three seconds, four beats,
     and by the end a recruiter knows there is a thing in the corner that
     talks, that the site has sound, and that the camera control is a toy
     rather than a tracker.

     THE SPURT is the point of the first beat. The bubble does not fade in
     near the cube -- it scales out OF the cube, from a transform origin at the
     cube's own corner, with an overshoot that settles. Fading says "a label
     has appeared"; springing from a point says "that object said this". The
     distinction is the whole reason the cube has a face.

     ── WHAT THIS REPLACES ──────────────────────────────────────────────────
     The nav tour added earlier the same day. That walked the five links at
     the top right, which is a second sequence competing with this one for the
     same opening seconds, and this one is better sited: it starts at the
     control a visitor has no way to interpret on their own. One opening, not
     two.

     ── AND IT GETS OUT OF THE WAY ──────────────────────────────────────────
     Once per browser, cancelled by the first scroll, key or click anywhere,
     and skipped entirely for reduced motion and for touch. Anyone who has
     started reading is not waiting to be introduced to the furniture.
     ══════════════════════════════════════════════════════════════════════ -->
<div class="wlc" id="wlc" aria-hidden="true">
  <p class="wlc__bubble" id="wlc-bubble"><span id="wlc-text"></span></p>
</div>

<style>
  .wlc {
    position: fixed;
    inset: 0;
    z-index: 9500;
    pointer-events: none;
    /* Nothing is composited until the sequence actually starts. */
    content-visibility: hidden;
  }
  .wlc.is-live {
    content-visibility: visible;
  }

  /* The bubble. No plate, no tail, no border: the site's voice has been a
     pocket of dark behind words everywhere else it speaks, and a chat bubble
     with a tail would be a different character arriving in the same corner. */
  .wlc__bubble {
    position: absolute;
    margin: 0;
    max-width: 22ch;
    padding: 0 2px;
    font-family: var(--font-head, system-ui, sans-serif);
    font-size: clamp(15px, 1.5vw, 19px);
    font-weight: 480;
    line-height: 1.34;
    letter-spacing: -0.012em;
    color: var(--ink, #f2f6fb);
    text-align: right;
    opacity: 0;
    /* Out of the cube, not near it: the origin is the cube's own corner and
       the scale runs from nothing. */
    /* Bottom right corner, which is the corner nearest the cube now that the
       bubble sits to its left: the spurt reads as coming from the object. */
    transform-origin: 100% 100%;
    transform: scale(0.2) translate(26px, 10px);
  }
  .wlc__bubble::before {
    content: "";
    position: absolute;
    inset: -18px -26px;
    z-index: -1;
    background: radial-gradient(70% 70% at 72% 55%, rgba(2, 5, 10, 0.96), rgba(2, 5, 10, 0.8) 54%, transparent 84%);
    filter: blur(10px);
  }
  body.on-paper .wlc__bubble,
  html[data-theme="light"] .wlc__bubble {
    color: #0a1727;
  }
  body.on-paper .wlc__bubble::before,
  html[data-theme="light"] .wlc__bubble::before {
    background: radial-gradient(70% 70% at 72% 55%, rgba(246, 246, 242, 0.96), rgba(246, 246, 242, 0.66) 56%, transparent 82%);
  }
  .wlc.is-out .wlc__bubble {
    opacity: 1;
    transform: scale(1) translate(0, 0);
    /* The overshoot is in the curve, not in a keyframe: one spring, so the
       bubble arrives slightly past its mark and settles. */
    transition:
      opacity 260ms ease,
      transform 640ms cubic-bezier(0.2, 1.42, 0.36, 1);
  }
  .wlc.is-gone .wlc__bubble {
    opacity: 0;
    transform: scale(0.94) translate(4px, 6px);
    transition:
      opacity 320ms ease,
      transform 420ms ease;
  }

  /* ── THE HIGHLIGHT ─────────────────────────────────────────────────────
     A ring that lands on whichever control is being named. It is one element
     that moves, rather than a class on each control, so the sequence reads as
     one pointer travelling down the stack instead of three separate things
     lighting up. */
  .wlc__ring {
    position: fixed;
    border-radius: 50%;
    border: 1.5px solid var(--accent, #8fc2ff);
    box-shadow:
      0 0 0 5px rgba(143, 194, 255, 0.12),
      0 0 22px rgba(143, 194, 255, 0.35);
    opacity: 0;
    pointer-events: none;
    z-index: 9501;
    transition:
      opacity 300ms ease,
      top 520ms cubic-bezier(0.16, 1, 0.3, 1),
      left 520ms cubic-bezier(0.16, 1, 0.3, 1),
      width 520ms cubic-bezier(0.16, 1, 0.3, 1),
      height 520ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .wlc.is-ringing .wlc__ring {
    opacity: 1;
  }

  @media (max-width: 760px), (hover: none), (pointer: coarse) {
    .wlc {
      display: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .wlc {
      display: none;
    }
  }
</style>

<script>
  (function () {
    var wrap = document.getElementById("wlc");
    var bubble = document.getElementById("wlc-bubble");
    var textEl = document.getElementById("wlc-text");
    if (!wrap || !bubble) return;
    if (window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse), (prefers-reduced-motion: reduce)").matches) return;
    if (window.innerWidth < 760) return;

    var KEY = "sid_welcomed";
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      wrap.classList.remove("is-ringing");
      wrap.classList.add("is-gone");
      setTimeout(function () {
        wrap.classList.remove("is-live");
      }, 500);
      /* The page's own opening waits on this. Fired exactly once, and also
         fired by every cancel path, so the hero can never be left waiting on
         a sequence that was skipped. */
      window.__welcomeDone = true;
      window.dispatchEvent(new CustomEvent("sid:welcomedone"));
      off();
    }

    var seen = false;
    try {
      seen = !!localStorage.getItem(KEY);
    } catch (_) {}
    if (seen) {
      window.__welcomeDone = true;
      /* Deferred so a listener attached later in the document still hears it. */
      setTimeout(function () {
        window.dispatchEvent(new CustomEvent("sid:welcomedone"));
      }, 0);
      return;
    }

    var timers = [];
    function cancel() {
      timers.forEach(clearTimeout);
      finish();
    }
    function off() {
      window.removeEventListener("wheel", cancel);
      window.removeEventListener("keydown", cancel);
      window.removeEventListener("pointerdown", cancel);
    }

    /* The three things the corner can do, in the order they are least
       obvious. The cube is last because it is the one being introduced by
       everything before it. */
    /* ── THREE WORDS, NOT A SENTENCE ──────────────────────────────────
       Sid: "text on icons bottom right is too much and too big and going into
       two lines, think like a ui ux designer."

       Right. These were full sentences at 19px beside a 48px control, so each
       wrapped to three lines and the label ended up physically larger than the
       thing it was labelling. A caption on a control has one job -- to name
       the control -- and the moment it takes two lines it has stopped naming
       and started explaining. One short phrase each, on one line. */
    var BEATS = [
      { sel: "#sound-toggle", say: "Sound, off by default" },
      { sel: "#hand-toggle", say: "Steer with your hand" },
      { sel: "#cube-chat-fab", say: "Ask me anything" },
    ];

    var ring = document.createElement("div");
    ring.className = "wlc__ring";
    wrap.appendChild(ring);

    function place(el, pad) {
      var r = el.getBoundingClientRect();
      if (!r.width) return false;
      ring.style.top = r.top - pad + "px";
      ring.style.left = r.left - pad + "px";
      ring.style.width = r.width + pad * 2 + "px";
      ring.style.height = r.height + pad * 2 + "px";
      return true;
    }

    /* The bubble sits above and to the left of the cube, so it reads as coming
       out of it. Measured rather than positioned in CSS, because the cube's
       own position is set in three different stylesheets depending on the
       route and the breakpoint. */
    function anchor(target) {
      var fab = document.querySelector("#cube-chat-fab");
      if (!fab) return false;
      var r = fab.getBoundingClientRect();
      if (!r.width) return false;
      /* ── BESIDE THE STACK, NOT ON TOP OF IT ──────────────────────────
         Anchoring the bubble's right edge to the cube's right edge put the
         words directly over the column of controls the sequence is in the
         middle of pointing at -- so the one moment the text and the icons
         both matter was the one moment they overlapped. It sits to the LEFT
         of the column now, ending before the icons begin, and rides up the
         stack to whichever control is being named so the speech stays level
         with the thing it is about. */
      var t = target ? target.getBoundingClientRect() : r;
      bubble.style.right = window.innerWidth - r.left + 20 + "px";
      /* Level with the control it is naming, not merely near it. Positioned
         from the TOP with the bubble's own measured height taken off, because
         a `bottom` offset has to predict that height and gets it wrong the
         moment a line wraps -- which is exactly what happens between one beat
         and the next. */
      bubble.style.bottom = "auto";
      var bh = bubble.offsetHeight || 40;
      bubble.style.top = Math.max(16, Math.min(window.innerHeight - bh - 16, t.top + t.height / 2 - bh / 2)) + "px";
      return true;
    }

    function say(t) {
      textEl.textContent = t;
    }

    function run() {
      if (done) return;
      try {
        localStorage.setItem(KEY, "1");
      } catch (_) {}
      if (!anchor()) {
        finish();
        return;
      }
      wrap.classList.add("is-live");
      window.addEventListener("wheel", cancel, { passive: true, once: true });
      window.addEventListener("keydown", cancel, { once: true });
      window.addEventListener("pointerdown", cancel, { once: true });

      /* Beat one: the cube speaks. Nothing else on the page has started. */
      say("Welcome to Sid’s portfolio.");
      anchor();
      requestAnimationFrame(function () {
        wrap.classList.add("is-out");
      });
      if (window.__sidNote) window.__sidNote(0);

      /* The corner has to be open for the ring to have anything to land on.
         controls-peek is the class the proximity script already uses. */
      timers.push(
        setTimeout(function () {
          document.body.classList.add("controls-peek");
        }, 520)
      );

      /* Tightened from 1750/1250. The whole sequence now runs in about half
         the time it did, because it is playing alongside the headline rather
         than in front of it and has no reason to be stately. */
      var t = 1000;
      BEATS.forEach(function (beat, i) {
        timers.push(
          setTimeout(
            function () {
              if (done) return;
              var el = document.querySelector(beat.sel);
              if (!el || !place(el, 9)) return;
              wrap.classList.add("is-ringing");
              /* ── LEVEL WITH THE THING IT IS NAMING ──────────────────────
                 `anchor()` was called with no argument here, so its `target
                 ? ... : r` fell back to the cube FAB's own rect and the speech
                 sat level with the BOTTOM of the stack for every beat. The
                 comment above it already says it should "ride up the stack to
                 whichever control is being named"; it just was not being told
                 which. Measured: at the hand beat the ring was at y=582 and
                 the words at y=798, so the label floated 216px below the
                 control it was pointing at and read as stray text rather than
                 as a caption. */
              anchor(el);
              say(beat.say);
              if (window.__sidNote) window.__sidNote((i + 1) * 3);
            },
            t + i * 1250
          )
        );
      });

      timers.push(
        setTimeout(
          function () {
            document.body.classList.remove("controls-peek");
            finish();
          },
          /* ── IT WAS ENDING BEFORE THE LAST BEAT HAD SPOKEN ────────────
             Sid: "i didn't see any of the onboarding or guiding me through
             this is what the icons mean."

             He was not missing it; it was being cut off. The beats are spaced
             1250ms apart, so the third lands at t+2500. This timer still said
             `BEATS.length * 900`, which is t+2700 -- the spacing was raised
             from 900 to 1250 in the loop above and not here, so the last
             control got 200ms of ring before the whole thing dismissed
             itself. Derived from the same constant now instead of repeating
             it, which is why they drifted apart in the first place. */
          t + (BEATS.length - 1) * 1250 + 1400
        )
      );
    }

    /* ── AFTER THE FIRST CLAUSE, NOT BEFORE THE PAGE ────────────────────
       This used to run before the hero typed anything, which put the page's
       own sentence thirteen seconds behind the open. It waits for the first
       clause to land instead -- data-story counts completed lines, so beat one
       is the claim having arrived -- and then talks over the reading of the
       second. If the typing never starts for any reason, a timer still opens
       it, because the corner should be explained whether or not the headline
       cooperated. */
    function arm() {
      if (document.documentElement.getAttribute("data-story")) {
        timers.push(setTimeout(run, 150));
        return;
      }
      var fired = false;
      var start = function () {
        if (fired) return;
        fired = true;
        timers.push(setTimeout(run, 150));
      };
      var mo = new MutationObserver(function () {
        if (document.documentElement.getAttribute("data-story")) {
          mo.disconnect();
          start();
        }
      });
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-story"] });
      timers.push(setTimeout(start, 3800));
    }
    if (window.__loaderInstantDone === true || !document.getElementById("site-loader")) arm();
    else window.addEventListener("loaderDone", arm, { once: true });

    /* A failsafe, because everything downstream waits on this. If any of the
       above never runs, the page must still open. */
    setTimeout(finish, 12000);
  })();
</script>
