<!-- ── THE CODA ───────────────────────────────────────────────────────────────
     Sid: "when you scroll more below, then I want you to have this video, and
     it should sort of play through just when you are scrolling through. And,
     um, like, maybe you need to cut it up into individual PNGs. I don't know
     how you do it, but, like, basically, the scroll should scroll the video in,
     like, a reactive dynamic way."

     It is his own screen recording — a phone scrolling his Apple Music library
     — and it goes at the very bottom, after the pond, which is the right place
     for it: everything above this is the case for hiring him, and this is the
     one thing on the site that is just true about him and asks for nothing. A
     portfolio that ends on a call to action ends on a pitch. This one ends on a
     record collection.

     THE MECHANISM. A tall runway (280vh) with a sticky stage inside it. How far
     the runway has travelled through the viewport is the playhead; the playhead
     picks a frame; the frame is drawn to a canvas. There is no <video> and no
     currentTime seek, because seeking a compressed stream lands on the nearest
     keyframe and scrubbing it backwards stutters on every browser that is not
     Safari. Thirty stills at 360px, decoded once, indexed by a number — the
     scrub is then exactly as smooth as the scroll is, which is the whole point
     of the effect.

     Thirty, not seventy. The recording is 10.4 seconds of continuous scrolling;
     at 2.9fps the album grid moves about a row and a half between frames, which
     at this size is a step you read as motion rather than as slides. Doubling
     the count doubles a megabyte to buy a smoothness nobody looks for on a
     coda.

     WHAT IT COSTS, AND WHEN. Nothing until you are near it. The frames are
     fetched by an IntersectionObserver with 900px of margin — far enough that
     they are decoded by the time the stage is sticky, close enough that a
     visitor who never scrolls past the pond never pays for them. Until then the
     canvas holds a single poster frame that ships with the page.
     ───────────────────────────────────────────────────────────────────────── -->
<section class="coda" id="coda" aria-labelledby="coda-title">
  <div class="coda__runway">
    <div class="coda__stage">
      <!-- Corner-set, not stacked in a column. A block of centred copy over a
           picture is a title slide, and a column of copy beside it is the other
           kind of title slide; annotations pinned to the corners of the frame
           read as a plate label, which is what this is. -->
      <!-- The "Coda · 00:00–00:10" slate is gone. Sid: "on the footer, there
           is some text which we dont need, like some cube or something, just
           above, on the top, on the left, above where the iTunes screen
           recording is."

           It was a film-slate affectation on a section that already reads as
           an end: the line on the right says "Everything above was made to
           this", and a timecode for a ten-second nothing was the label
           explaining a joke nobody asked about. -->
      <h2 class="coda__title" id="coda-title">Everything above was made to this.</h2>

      <div class="coda__device" id="coda-device" tabindex="0" role="group" aria-labelledby="coda-title">
        <canvas
          class="coda__screen"
          id="coda-screen"
          width="360"
          height="780"
          role="img"
          aria-label="A phone scrolling through Sid’s music library"
        ></canvas>
        <!-- The glass. A single low-angle sheen across the panel, and nothing
             else — no notch drawn on, no fake bezel highlight. The recording
             already contains its own status bar and home indicator, so the
             device is established by the artefact rather than by a drawing of a
             device around it. -->
        <span class="coda__glare" aria-hidden="true"></span>
        <!-- The hover pass. Same box as the screen, drawn only while the
             pointer is on the device; see the script at the foot of this
             file. -->
        <canvas class="coda__fx" id="coda-fx" aria-hidden="true"></canvas>
      </div>

      <!-- The playhead hairline lived here. Sid: "we don't need a loader bar
           for the apple music video."

           It was argued as "the only readout", which was true and still the
           wrong thing to have: a filling bar under a video is the one piece of
           furniture that makes a thing look like it is LOADING. It sat on the
           same page as the "scroll to play" caption that came out for the same
           reason — telling someone what is happening instead of letting the
           panel simply do it. The scrubbing is the readout. -->

      <!-- "Scroll to play · Apple Music, 11:02pm" is gone. Sid: "remove the
           scroll to play text under the mobile apple music thing we dont need
           any tool tip text let people go on an adventure and discover the
           site on their own."

           It was an instruction for something that happens whether you read
           it or not — the panel scrubs as you scroll, and a caption saying so
           only steals the moment of noticing. Same argument as the cube's
           "drag to spin". -->
    </div>
  </div>
</section>

<style>
  .coda {
    position: relative;
    z-index: 1;
    background: #04070c;
    color: rgba(240, 246, 252, 0.92);
  }

  /* The runway is the duration, and it is also a toll. This section sits in
     the shared footer, so its height is charged to the bottom of every page on
     the site — measured on /works/, the footer came to 3108px against 780px of
     actual page content, and 2363px of that was this runway. A recruiter who
     finishes the work index then scrolls nearly three screens of a mostly
     empty room to reach the colophon and the one link at the end.

     280vh was chosen to give thirty frames about 84px of travel each. 150vh
     still gives them 45px, which is under a single wheel notch on most mice —
     the scrub stays continuous, it just stops charging two and a half screens
     for ten seconds of Apple Music. */
  /* ── IT IS PLACED, NOT PINNED ─────────────────────────────────────────
     Sid: "this should just be placed there and smaller and curved a bit. Also
     it does a weird opacity in and zoom in — remove that."

     Measured, there is no opacity fade and no scale on this anywhere: at four
     scroll positions the device reports opacity 1 and transform none. What
     reads as one is the PIN. The stage was position: sticky inside a 150vh
     runway, so the phone locked to the top of the window and hung there for a
     screen and a half while the page kept moving underneath it — and because
     the frames scrub during that hold, the picture changed while the object
     did not. A thing that stops when you scroll and mutates in place is doing
     something; he asked for it to be placed.

     So it sits in the flow. The runway is the section's own height, the stage
     is static, and the scrub runs off the section's position as it crosses the
     viewport rather than off a pinned range — same thirty frames, no hold. */
  /* ── AND NOW IT IS PINNED AGAIN ───────────────────────────────────────
     Sid: "the apple music phone which needs to be scroll activated in terms
     of u stay on scree nand scroll liek the buddha. also can you make the
     phone bigger."

     This reverses the note above, deliberately. What he rejected the first
     time was a pin that held for a screen and a half while the ONLY thing
     moving was the picture inside a nailed-down rectangle -- the object stood
     still and mutated, which is the uncanny version. What the Buddha does,
     and what he is asking for here, is a pin where the object itself is being
     turned and lifted by the scroll: you stop travelling and start operating.

     The device now rises, turns on its vertical axis and tips with scroll
     velocity across the held range, all off the same --cp. Held is 110svh --
     a little over one screen. The footer-height toll in the note above is
     real and this is what it costs; it is charged once per route and it buys
     the last object on the site actually being handled.

     Below 760 it stays in the flow. A 210svh runway on a phone is two thirds
     of a minute of thumb, and a pinned object on a touch screen cannot be
     tipped by a pointer anyway. */
  .coda__runway {
    height: auto;
  }

  .coda__stage {
    position: static;
    display: grid;
    /* Three in-flow children since the slate came out — the device, the
       playhead and the note. The title is absolutely positioned and never
       counted. Left at four rows the device would take an `auto` track and
       stop centring. */
    grid-template-rows: 1fr auto auto;
    justify-items: center;
    min-height: 72svh;
    /* The top pad clears the fixed nav rather than approximating it. At
       default sizes the logo pill bottoms out at y=73 and the nav pill at
       y=73; an eyebrow set at 63 lands *behind* the logo. Both annotations
       start below 104 so the plate label reads as the stage's, not as
       something the chrome is sitting on. */
    padding: clamp(104px, 13vh, 132px) clamp(24px, 5vw, 80px) clamp(34px, 5vh, 60px);
    overflow: hidden;
  }

  /* After the base rule, not before it. A media query adds no specificity, so
     the earlier placement lost the position declaration to `position: static`
     below and the stage silently never stuck -- measured, the device ran 802px
     past the top of the window at the end of the runway. */
  @media (min-width: 761px) and (prefers-reduced-motion: no-preference) {
    .coda__runway {
      /* 160, not 210. The hold has to be long enough that the turn reads as
         something you are doing and short enough that it is not a room you
         walk through -- and this section is charged to the bottom of every
         route on the site, so the difference is half a screen on /works/ too. */
      /* 105, down from 160. See the home-page length pass. */
      /* ── AND 105 BROKE IT ─────────────────────────────────────────────
         Sid: "the phone scrolls too fast when i scroll and i dont actually
         see the songs in a smooth scroll it goes from start to end in like a
         second. my screen shud kind of hold in that section so that then i
         can scroll."

         The arithmetic is the bug and it is invisible in the value. The
         stage below is `position: sticky` with `min-height: 100svh`, so the
         held range is not the runway -- it is the runway MINUS the stage.
         At 105svh that is five: measured on a 900px window, a 945px runway
         against a 900px stage gives 45 pixels of scroll to scrub thirty
         frames. One wheel notch plays the entire recording, which is exactly
         what he is describing.

         The length pass that took 160 to 105 was measuring page height and
         it was right to; it just did not know this number is a difference
         rather than a duration. Every screen it cut came out of the hold,
         and at 105 there was none left to cut.

         240svh gives 140 of hold -- about 1260px on that window, or 42px a
         frame, which is a wheel notch per frame rather than per film. The
         footer toll the note above is protecting against is real and this is
         what it costs; it buys the section actually working. */
      height: 240svh;
    }
    .coda__stage {
      position: sticky;
      top: 0;
      min-height: 100svh;
    }
  }

  /* ── The coda's annotations were hushed past the point of speech ──
     This sequence is deliberately quiet — it is the last thing the page
     says and it says it under its breath — but the three labels here had
     been tuned by eye against a black field and measured 3.52, 2.83 and
     1.81 to 1. The last of those is not restraint, it is an invisible
     line: "Apple Music, 11:02pm" is the caption that tells you the phone
     on screen is Sid's own, at the hour he was actually listening, and
     nobody could read it. The values below are the lowest that clear 4.5
     at 9.5–10px while keeping the three steps of hierarchy the block was
     drawn with — eyebrow brightest, then the note, then its trailing
     detail. Light-mode twins directly below carry the same intent. */
  .coda__eyebrow {
    justify-self: start;
    margin: 0;
    color: rgba(240, 246, 252, 0.56); /* was 0.4  — 3.52:1 */
    font:
      400 10px/1.2 "DM Mono",
      monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Sits on the same top line as the eyebrow, pulled up out of the flow, so
     the two annotations bracket the frame rather than stacking above it. */
  /* ── THE LINE WAITS TO BE ASKED ───────────────────────────────────────
     Sid: "instead of 'everything above was made to this' have it show up on
     hover of the playlist and more subtle."

     It was a 22px statement pinned to the top right of an otherwise empty
     screen, which made it the loudest thing in the section and turned the
     phone into its illustration. As a line that appears when you reach for
     the phone it is the opposite: you go to the object, and the object tells
     you what it is.

     Still in the DOM and still the section's accessible name at all times --
     only its painting is conditional. A heading that exists only on hover is
     a heading a screen reader and a search engine never see. */
  .coda__title {
    position: absolute;
    top: clamp(102px, 13vh, 130px);
    right: clamp(24px, 5vw, 80px);
    max-width: 15ch;
    margin: 0;
    font-size: clamp(13px, 1.05vw, 16px);
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.01em;
    text-align: right;
    text-wrap: balance;
    opacity: 0;
    transform: translateY(-5px);
    transition:
      opacity 380ms var(--ease-out, ease),
      transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .coda.is-touched .coda__title {
    opacity: 0.62;
    transform: none;
  }
  /* Keyboard reaches it too: the device is focusable so the line is not
     mouse-only information. */
  .coda__device:focus-visible ~ .coda__title,
  .coda:focus-within .coda__title {
    opacity: 0.62;
    transform: none;
  }
  @media (hover: none), (pointer: coarse) {
    /* No hover to give, so it is simply present and quiet. */
    .coda__title {
      opacity: 0.55;
      transform: none;
    }
  }

  .coda__device {
    position: relative;
    align-self: center;
    /* Sized off the viewport height, not its width: this is a portrait object
       in a landscape frame, so height is the constraint that actually binds.
       aspect-ratio does the rest, which keeps the canvas from ever being
       letterboxed inside its own box. */
    /* ── SMALLER, AND MORE CURVED ────────────────────────────────────────
       Sid: "this should just be placed there and smaller and curved a bit."

       62svh put a phone mockup at 560px tall in the middle of an empty screen,
       which made a screen recording the largest object on the home page. It is
       an artefact, not the subject. 46svh at a 400px cap reads as a device
       someone is holding rather than a device on a plinth.

       The radius comes up with it: a real phone's corner is roughly a tenth of
       its width, and at the old size clamp(20px, 3.4svh, 34px) was resolving
       nearer a sixteenth, which is what made the panel read as a rounded
       rectangle rather than as hardware. */
    /* ── BIGGER, AND IT MOVES ──────────────────────────────────────────
       Sid: "make my playlist move on scroll behavior and make it a little
       bigger."

       46svh was tuned when this was the largest object on a mostly empty
       screen. It is the last thing the page shows and it is his own library
       at 11pm, which is the most personal artefact on the site; at 400px it
       was being apologised for. 58svh, capped at 520.

       And it moves. The recording already scrubbed with scroll -- thirty
       frames across the crossing -- but the DEVICE was nailed to the page, so
       the only thing that moved was the content inside a static rectangle,
       which reads as a video playing rather than as an object you are moving
       past. --cp is the same 0 to 1 crossing the scrubber uses, written by
       the script below, and it carries a rise and a slight turn on the
       vertical axis. --sv is the site's scroll velocity, so throwing the page
       tips it further than easing does. */
    /* 58svh/520 was sized for an object standing in the flow. Pinned, it is
       the subject of its own screen and has to hold it. */
    height: min(74svh, 660px);
    aspect-ratio: 360 / 780;
    /* The turn is wider now that the hold is real: 13deg across a crossing was
       a lean, 30 across a pin is the object being rotated in front of you,
       which is the whole difference between pinned-and-mutating and pinned-
       and-handled. */
    transform: perspective(1400px) translateY(calc((0.5 - var(--cp, 0.5)) * 12vh)) rotateY(calc((var(--cp, 0.5) - 0.5) * -30deg))
      rotateX(calc(var(--sv, 0) * -3.4deg));
    will-change: transform;
    border-radius: clamp(18px, 4.6svh, 30px);
    overflow: hidden;
    background: #0a0d12;
    box-shadow:
      0 2px 0 rgba(255, 255, 255, 0.07) inset,
      0 40px 90px -30px rgba(0, 0, 0, 0.9),
      0 0 0 1px rgba(240, 246, 252, 0.09);
  }

  .coda__screen {
    display: block;
    width: 100%;
    height: 100%;
  }
  .coda__device {
    cursor: pointer;
  }
  .coda__device:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 6px;
  }
  /* The shader sits over the recording and is transparent until it runs. It
     never receives the pointer -- the device is the target. */
  .coda__fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    opacity: 0;
    transition: opacity 260ms ease;
  }
  .coda.is-touched .coda__fx {
    opacity: 1;
  }

  .coda__glare {
    position: absolute;
    inset: 0;
    background: linear-gradient(196deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.03) 17%, transparent 38%);
    pointer-events: none;
  }

  html[data-theme="light"] .coda {
    background: #efece4;
    color: rgba(20, 27, 36, 0.9);
  }
  /* The recording is a dark-mode phone screen. On cream it needs a shadow that
     reads as an object resting on paper rather than a hole cut in it. */
  html[data-theme="light"] .coda__device {
    box-shadow:
      0 2px 0 rgba(255, 255, 255, 0.07) inset,
      0 34px 70px -34px rgba(28, 22, 12, 0.55),
      0 0 0 1px rgba(20, 27, 36, 0.12);
  }
  html[data-theme="light"] .coda__glare {
    background: linear-gradient(196deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.06) 17%, transparent 38%);
  }

  /* Reduced motion gets the object and no runway: one screen tall, one frame,
     no scrub. The section still says the thing it is there to say. */
  @media (prefers-reduced-motion: reduce) {
    .coda__runway {
      height: auto;
    }
    .coda__stage {
      position: static;
      height: auto;
      min-height: 86svh;
    }
  }

  @media (max-width: 760px) {
    /* Same trade on a phone, where a screen of scroll costs more: 230vh was
       1941px of the 2635px footer. */
    .coda__runway {
      height: 130vh;
    }
    .coda__title {
      position: static;
      justify-self: start;
      max-width: 22ch;
      margin-top: 10px;
      text-align: left;
    }
    .coda__stage {
      justify-items: start;
    }
    .coda__device {
      align-self: center;
      justify-self: center;
      height: min(54svh, 460px);
    }
  }
</style>

<script>
  (function () {
    var sec = document.getElementById("coda");
    var cv = document.getElementById("coda-screen");
    if (!sec || !cv || !cv.getContext) return;

    var COUNT = 30;
    var BASE = "{{ site.baseurl }}/assets/img/coda/";
    var ctx = cv.getContext("2d", { alpha: false });
    var frames = new Array(COUNT);
    var ready = 0;
    var drawn = -1;
    var wanted = 0;
    var raf = 0;

    /* Paint whatever is nearest to the frame we want. Early in the load the
       later frames do not exist yet, so walking backwards to the last decoded
       one keeps the panel showing the right *kind* of thing instead of going
       black — a scrub that degrades into a slower scrub rather than into a
       hole. */
    function draw(i) {
      var j = i;
      while (j >= 0 && !frames[j]) j--;
      if (j < 0 || j === drawn) return;
      ctx.drawImage(frames[j], 0, 0, cv.width, cv.height);
      drawn = j;
    }

    function frame() {
      raf = 0;
      var box = sec.getBoundingClientRect();
      var vh = window.innerHeight;
      /* ── PROGRESS IS THE CROSSING, NOT THE PIN ─────────────────────────
         This used to be -box.top / (box.height - innerHeight), which is the
         right maths for a section TALLER than the window: the pinned runway
         was 150vh, so the denominator was half a screen of travel.

         The section sits in the flow now and is shorter than the window, so
         that denominator goes negative and the guard clamped the playhead to
         frame 0 — the scrub would have silently frozen on the first frame.

         The span is the full crossing instead: 0 when the section's top is at
         the bottom of the window, 1 when its bottom clears the top. Same
         thirty frames, spread over the time the thing is actually on screen. */
      /* ── AND NOW IT IS THE PIN AGAIN ────────────────────────────────
         Two ranges, chosen by which one the section is actually in. Pinned
         (desktop, motion allowed) the section is taller than the window, and
         the honest progress is how far through the held range the scroll has
         gone -- that is the range over which the object is under the reader's
         hand. Unpinned (phone, or reduced motion) that denominator goes
         negative, so the crossing is used instead.

         Picking by measurement rather than by matchMedia: the media query is
         in the stylesheet and duplicating its breakpoint here is one edit away
         from the two disagreeing silently. */
      var held = box.height - vh;
      var t =
        held > 40
          ? Math.min(1, Math.max(0, -box.top / held))
          : vh + box.height > 0
            ? Math.min(1, Math.max(0, (vh - box.top) / (vh + box.height)))
            : 0;
      wanted = Math.min(COUNT - 1, Math.floor(t * COUNT));
      /* The same crossing the scrubber uses, published for the device's own
         rise and turn. One measurement, two consumers -- the frame the panel
         shows and the angle it shows it at cannot disagree. */
      sec.style.setProperty("--cp", t.toFixed(3));
      draw(wanted);
    }

    function onScroll() {
      if (!raf) raf = requestAnimationFrame(frame);
    }

    function load() {
      for (var i = 0; i < COUNT; i++) {
        (function (i) {
          var im = new Image();
          im.decoding = "async";
          /* Eager, but explicitly at the bottom of the queue: by the time this
             runs the visitor is already near the section, so lazy would stall
             the first frames behind the observer a second time — and nothing
             above this on the page is still waiting for bandwidth. */
          im.fetchPriority = "low";
          im.onload = function () {
            frames[i] = im;
            ready++;
            /* The first arrival paints immediately so the panel is never a
               blank rectangle; after that only repaint if this frame is the
               one the playhead is actually sitting on. */
            if (ready === 1 || i === wanted) {
              drawn = -1;
              draw(wanted);
            }
          };
          im.src = BASE + "g" + (i + 1 < 10 ? "0" : "") + (i + 1) + ".jpg";
        })(i);
      }
    }

    var io = new IntersectionObserver(
      function (entries) {
        if (entries[0].isIntersecting) {
          io.disconnect();
          load();
        }
      },
      { rootMargin: "900px 0px" }
    );
    io.observe(sec);

    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      /* No runway to scrub. Show the middle of the recording — the densest
         part of the grid — and leave it. */
      wanted = 14;
      return;
    }

    addEventListener("scroll", onScroll, { passive: true });
    addEventListener("resize", onScroll);
    frame();
  })();
</script>

<script>
  /* ═══════════════════════════════════════════════════════════════════════
     THE PHONE ANSWERS

     Sid: "on hover of the playlist play some sound and some webgl2 shader
     effect."

     TWO THINGS, BOTH ONLY WHILE THE POINTER IS ON THE DEVICE.

     THE SHADER. A WebGL2 pass over the recording, sampling the 2D canvas
     underneath as a texture. Three things happen to it and all three are the
     same idea -- a signal being read off a physical surface:

       · a per-channel offset that grows toward the edges of the panel, so
         the colour separates where a real lens would separate it and stays
         clean in the middle where you are actually reading
       · a horizontal band that travels down the screen once every few
         seconds, brightening and displacing what it crosses
       · a scanline grid at device resolution, and a slow vertical roll

     It is drawn only while hovered, and the loop is not merely paused when
     it is not -- it is cancelled, and the texture is re-uploaded from the 2D
     canvas each frame it does run, so the effect always shows whichever
     recording frame the scrubber is on rather than a stale copy.

     THE SOUND. One chord, quiet, on entering. Synthesised rather than a file:
     three sine partials at a fifth and an octave over a root, through a
     shared gain envelope with a slow attack and a two-second tail. A sample
     would be 40KB of network for something that plays at 6% gain, and a
     synthesised tone can be built at the exact moment it is wanted.

     The AudioContext is created on the first real gesture anywhere on the
     page and never before -- constructing one on load leaves it suspended and
     browsers increasingly warn about it. If the visitor has never clicked or
     tapped anything, hovering the phone gives the shader and no sound, which
     is the correct outcome: audio without a gesture is exactly the thing
     autoplay policy exists to prevent.

     Off entirely for coarse pointers and reduced motion.
     ═══════════════════════════════════════════════════════════════════════ */
  (function () {
    var sec = document.getElementById("coda");
    var dev = document.getElementById("coda-device");
    var src = document.getElementById("coda-screen");
    var fx = document.getElementById("coda-fx");
    if (!sec || !dev || !src || !fx) return;
    if (window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse), (prefers-reduced-motion: reduce)").matches) return;

    /* ── the sound ──────────────────────────────────────────────────────── */
    var actx = null;
    function ensureCtx() {
      if (actx || !window.AudioContext) return;
      try {
        actx = new AudioContext();
      } catch (e) {
        actx = null;
      }
    }
    /* One listener, once, on the first gesture of any kind. */
    ["pointerdown", "keydown"].forEach(function (ev) {
      window.addEventListener(ev, ensureCtx, { once: true, passive: true });
    });

    var lastTone = 0;
    function chord() {
      if (!actx || actx.state === "closed") return;
      if (actx.state === "suspended") actx.resume();
      var now = actx.currentTime;
      /* Rate limited. Sweeping in and out across the edge of the device would
         otherwise retrigger the chord several times a second, which is the
         difference between an instrument and an alarm. */
      if (now - lastTone < 1.4) return;
      lastTone = now;
      var g = actx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.055, now + 0.28);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 2.1);
      g.connect(actx.destination);
      [220, 330, 440].forEach(function (f, i) {
        var o = actx.createOscillator();
        o.type = "sine";
        o.frequency.value = f;
        var og = actx.createGain();
        og.gain.value = i === 0 ? 1 : 0.5 / i;
        o.connect(og).connect(g);
        o.start(now + i * 0.04);
        o.stop(now + 2.2);
      });
    }

    /* ── the shader ─────────────────────────────────────────────────────── */
    var gl = null,
      prog = null,
      tex = null,
      raf = 0,
      t0 = 0;

    var VS = [
      "#version 300 es",
      "const vec2 P[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));",
      "out vec2 v_uv;",
      "void main(){",
      "  vec2 p = P[gl_VertexID];",
      "  v_uv = p * 0.5 + 0.5;",
      "  gl_Position = vec4(p, 0.0, 1.0);",
      "}",
    ].join("\n");

    var FS = [
      "#version 300 es",
      "precision highp float;",
      "in vec2 v_uv;",
      "uniform sampler2D u_src;",
      "uniform float u_time;",
      "uniform vec2 u_res;",
      "out vec4 o;",
      "void main(){",
      "  vec2 uv = vec2(v_uv.x, 1.0 - v_uv.y);",
      /* The travelling band. One pass down the panel every 4.2s, narrow,
         with a soft profile so it is a sweep and not a bar. */
      "  float head = fract(u_time * 0.238);",
      "  float band = exp(-pow((uv.y - head) * 13.0, 2.0));",
      "  uv.x += band * 0.012 * sin(uv.y * 90.0);",
      /* Dispersion by distance from centre, so the middle of the screen --
         the part being read -- stays clean. */
      "  float r = length(uv - 0.5);",
      "  vec2 d = normalize(uv - 0.5 + 1e-5) * (r * r) * 0.010;",
      "  float cr = texture(u_src, uv + d).r;",
      "  vec3 cg = texture(u_src, uv).rgb;",
      "  float cb = texture(u_src, uv - d).b;",
      "  vec3 c = vec3(cr, cg.g, cb);",
      "  c += band * 0.16;",
      /* Scanlines at device resolution, and a slow roll so they are a signal
         rather than a texture printed on the glass. */
      "  float sl = 0.5 + 0.5 * sin((uv.y + u_time * 0.03) * u_res.y * 1.55);",
      "  c *= 1.0 - sl * 0.085;",
      "  o = vec4(c, 1.0);",
      "}",
    ].join("\n");

    function compile(type, s) {
      var sh = gl.createShader(type);
      gl.shaderSource(sh, s);
      gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        if (window.console && console.warn) console.warn("[coda-fx]", gl.getShaderInfoLog(sh));
        return null;
      }
      return sh;
    }

    function boot() {
      try {
        gl = fx.getContext("webgl2", { alpha: false, antialias: false });
      } catch (e) {}
      if (!gl) return false;
      var v = compile(gl.VERTEX_SHADER, VS),
        f = compile(gl.FRAGMENT_SHADER, FS);
      if (!v || !f) return ((gl = null), false);
      prog = gl.createProgram();
      gl.attachShader(prog, v);
      gl.attachShader(prog, f);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        if (window.console && console.warn) console.warn("[coda-fx] link", gl.getProgramInfoLog(prog));
        return ((gl = null), false);
      }
      prog.u = {
        src: gl.getUniformLocation(prog, "u_src"),
        time: gl.getUniformLocation(prog, "u_time"),
        res: gl.getUniformLocation(prog, "u_res"),
      };
      tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return true;
    }

    function frameFx(now) {
      if (!gl) return;
      var w = src.width,
        h = src.height;
      if (fx.width !== w || fx.height !== h) {
        fx.width = w;
        fx.height = h;
      }
      /* Re-uploaded every frame on purpose: the recording underneath is being
         scrubbed by scroll, so a texture uploaded once would freeze the panel
         on whichever frame the pointer happened to arrive on. */
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
      gl.viewport(0, 0, w, h);
      gl.useProgram(prog);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform1i(prog.u.src, 0);
      gl.uniform1f(prog.u.time, (now - t0) / 1000);
      gl.uniform2f(prog.u.res, w, h);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      raf = requestAnimationFrame(frameFx);
    }

    var on = false;
    function enter() {
      if (on) return;
      on = true;
      sec.classList.add("is-touched");
      chord();
      if (!gl && !boot()) return;
      t0 = performance.now();
      if (!raf) raf = requestAnimationFrame(frameFx);
    }
    function leave() {
      if (!on) return;
      on = false;
      sec.classList.remove("is-touched");
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
    }

    dev.addEventListener("pointerenter", enter);
    dev.addEventListener("pointerleave", leave);
    dev.addEventListener("focus", enter);
    dev.addEventListener("blur", leave);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) leave();
    });
  })();
</script>
