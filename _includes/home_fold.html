<!-- ══════════════════════════════════════════════════════════════════════════
     THE FOLD

     Sid: "i dont like how we are showing the different disciplines the
     particles move too fast and the text isnt legible ... i want a cube that
     folds into itself starting from a square interactive scroll in the 2nd
     section. also combine the seciton of spatial and what all type of work i
     do with the 2nd section of the particles."

     Two sections became one. The particle monolith said five words over four
     screens of scrolling, and the three pillars further down said the same
     thing again in a list -- so the page made its central claim twice, once
     illegibly and once as a table. This is the single place it gets made.

     WHY A FOLD AND NOT A SPIN

     A cube that is already a cube is a shape. A square that becomes one is an
     argument: six flat things that only mean something once they are assembled
     into one object is exactly the claim the section is making about the work.
     The net is laid out flat at the top of the runway with every face readable
     as plain type, and the scroll folds it up.

     THE TEXT IS DOM, NOT TEXTURE

     Every label here is real type in a real element. That is the actual fix
     for "the text isnt legible": the old scene drew its words out of moving
     points, which cannot be read at speed and cannot be read by a screen
     reader at all. These faces are <h3>s. They stay sharp at any size, they
     are in the accessibility tree, and the section still says what it says
     with JavaScript off -- the net simply stays flat.

     INTERACTIVE, IN THE ONE WAY THAT MATTERS

     Once it is a cube you can take hold of it: drag to spin, or click a face
     to bring that discipline to the front, and the list beside it follows. The
     scroll is the story; the pointer is the reader arguing with it.
     ══════════════════════════════════════════════════════════════════════ -->
<section class="fold" id="fold" aria-labelledby="fold-h" data-cube="Six sides, and he insists they are all one job.">
  <div class="fold__runway" id="fold-runway">
    <div class="fold__stage">
      <h2 class="sr-only" id="fold-h">What I work across</h2>

      <!-- The readout. Whichever face is forward names itself here at a size
           the cube cannot carry, with the work under it. This is the half of
           the section that has to survive being glanced at. -->
      <div class="fold__read" aria-live="polite">
        <span class="fold__read-idx" aria-hidden="true">01</span>
        <h3 class="fold__read-word" id="fold-word">Product</h3>
        <ul class="fold__read-sub" id="fold-sub">
          <li>Interfaces</li>
          <li>Design systems</li>
          <li>Prototypes</li>
          <li>Research</li>
        </ul>
      </div>

      <div class="fold__space">
        <div class="fold__box" id="fold-box" style="--f: 0">
          <!-- The base. Everything else hinges off it, directly or through
               the face it is attached to, which is how a real box folds. -->
          <button class="fold__face fold__face--base" type="button" data-face="0" style="--h: 196; --in: 0">
            <span class="fold__face-idx" aria-hidden="true">01</span>
            <span class="fold__face-word">Product</span>
          </button>

          <button class="fold__face fold__face--right" type="button" data-face="1" style="--h: 268; --in: 1">
            <span class="fold__face-idx" aria-hidden="true">02</span>
            <span class="fold__face-word">Spatial</span>
          </button>

          <!-- The far side folds twice, which is the only way a flat net
               closes a box. It is a SIBLING rather than a child of the right
               face, because a button inside a button is invalid HTML and
               browsers recover from it by moving the inner one out of the
               element it was supposed to hinge from. The double hinge is
               written into its transform instead; see the note in the CSS. -->
          <button class="fold__face fold__face--far" type="button" data-face="2" style="--h: 22; --in: 2">
            <span class="fold__face-idx" aria-hidden="true">03</span>
            <span class="fold__face-word">Generative</span>
          </button>

          <button class="fold__face fold__face--left" type="button" data-face="3" style="--h: 146; --in: 3">
            <span class="fold__face-idx" aria-hidden="true">04</span>
            <span class="fold__face-word">Research</span>
          </button>

          <button class="fold__face fold__face--top" type="button" data-face="4" style="--h: 44; --in: 4">
            <span class="fold__face-idx" aria-hidden="true">05</span>
            <span class="fold__face-word">Interface</span>
          </button>

          <button class="fold__face fold__face--bottom" type="button" data-face="5" style="--h: 336; --in: 5">
            <span class="fold__face-idx" aria-hidden="true">06</span>
            <span class="fold__face-word">Code</span>
          </button>
        </div>
      </div>

      <!-- The industries. This is the one line from the old pillars section
           that was not a restatement of the scene: what the work is for, as
           opposed to what it is. It sits at the foot rather than beside the
           cube, because it qualifies the whole object and not any one face.

           The separators are drawn between items rather than typed into the
           text -- a wrapping string breaks wherever it likes and leaves a
           middle dot hanging at the end of a line with nothing after it. -->
      <!-- ── NO "BUILT FOR" STRIP, AND NO "CLICK A FACE" ─────────────────
           Sid: "in the second section where we have Generative Spatial Cube,
           on the bottom left, you can remove the 'Built for Fintech' and the
           'Click Side'."

           The industries list was seven words in a row along the bottom of
           the section, and it is the least specific thing on the page: every
           one of those industries is already named, with the work attached,
           on the project it belongs to. As a strip under a rotating cube it
           reads as a keyword line rather than as a claim.

           "Click a face" was a ::after on the stage. It is the label the note
           below defends as "stated once and only while it is true", and it
           was true -- but the cube now carries the section's numbers and
           names on its own faces, and a caption telling you to click
           something is the weakest possible version of an affordance. The
           cursor and the face highlight say it instead. -->

      <!-- Six marks, one per face, so a reader can see how far through the
           assembly they are without a scrollbar that is measuring the runway
           rather than the object. -->
      <ul class="fold__ticks" aria-hidden="true">
        <li style="--n: 0"></li>
        <li style="--n: 1"></li>
        <li style="--n: 2"></li>
        <li style="--n: 3"></li>
        <li style="--n: 4"></li>
        <li style="--n: 5"></li>
      </ul>
    </div>
  </div>
</section>

<style>
  .fold {
    position: relative;
    background: none;
  }
  /* Two and a bit screens. The fold itself owns the first two thirds and the
     settle owns the rest, which puts the cube complete and turning well before
     the section leaves -- a scroll-linked sequence that finishes on its way out
     performs to nobody. */
  .fold__runway {
    height: 215svh;
  }
  .fold__stage {
    position: sticky;
    top: 0;
    height: 100svh;
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  /* ── THE READOUT ──────────────────────────────────────────────────────── */
  .fold__read {
    position: absolute;
    left: clamp(22px, 5vw, 96px);
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    max-width: 22ch;
    pointer-events: none;
  }
  .fold__read-idx {
    display: block;
    margin-bottom: 10px;
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    color: hsl(var(--fold-h, 196) 70% 72% / 0.8);
  }
  .fold__read-word {
    margin: 0 0 14px;
    font-size: clamp(30px, 4.4vw, 62px);
    font-weight: 500;
    line-height: 0.96;
    letter-spacing: -0.035em;
    color: var(--ink, #f2f6fb);
  }
  .fold__read-sub {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 5px;
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(226, 238, 250, 0.58);
  }
  .fold__read-sub li {
    opacity: 0;
    transform: translateY(6px);
    animation: foldSubIn 520ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: calc(var(--i, 0) * 60ms);
  }
  @keyframes foldSubIn {
    to {
      opacity: 1;
      transform: none;
    }
  }

  /* ── THE OBJECT ───────────────────────────────────────────────────────── */
  .fold__space {
    /* The perspective lives on the wrapper rather than on the box, so the
       box's own transform does not fight the camera. */
    perspective: 1500px;
    perspective-origin: 50% 46%;
    width: min(60vw, 520px);
    aspect-ratio: 1;
    /* Pushed right of centre so the readout has the left third to itself and
       the two never overlap at any width that keeps both. */
    transform: translateX(min(15vw, 150px));
  }
  .fold__box {
    --s: min(26vw, 210px);
    position: relative;
    width: var(--s);
    height: var(--s);
    margin: 0 auto;
    top: 50%;
    transform-style: preserve-3d;
    /* --f folds, --rx/--ry aim. The translateZ keeps the closed box centred
       on the camera: folding backwards off the base would otherwise walk the
       whole object half a face away from the viewer. */
    transform: translateY(-50%) translateZ(calc(var(--s) * 0.5 * var(--f))) rotateX(calc(var(--rx, 0) * 1deg)) rotateY(calc(var(--ry, 0) * 1deg));
    will-change: transform;
  }
  .fold__face {
    position: absolute;
    /* NOT `inset: 0`. Each hinge below sets one edge to move the face out into
       the net -- `left: 100%` for the right one, and so on -- and with inset
       having already pinned the opposite edge to 0, that resolved to a face
       with negative width. Every side of the net was drawing its label over
       nothing. An explicit size plus a single offset per hinge cannot get into
       that argument with itself. */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 7px;
    transform-style: preserve-3d;
    cursor: pointer;
    font: inherit;
    color: var(--ink, #f2f6fb);
    /* No backdrop-filter anywhere in here, deliberately: it forces
       transform-style to flat and the box would collapse into a pile of
       squares. The glass is faked with a gradient and a rim instead. */
    /* ── OPAQUE, AND ONE SIDED ─────────────────────────────────────────
       At 0.82 you could read the far faces through the near ones, and a face
       seen from behind shows its type mirrored -- so the closed cube had
       backwards words ghosting through every side of it, which is the exact
       complaint this section was rebuilt to answer arriving by another route.
       backface-visibility stops a face being drawn from behind at all, and the
       ground goes opaque so nothing reads through. The hue survives as a tint
       over it, which was all it was ever doing. */
    background: linear-gradient(152deg, hsl(var(--h, 196) 62% 58% / 0.26), hsl(var(--h, 196) 60% 34% / 0.1) 62%, transparent), rgb(10, 14, 21);
    backface-visibility: hidden;
    border: 1px solid hsl(var(--h, 196) 70% 66% / 0.34);
    box-shadow: inset 0 0 40px -14px hsl(var(--h, 196) 80% 60% / 0.5);
    transition:
      border-color 300ms ease,
      box-shadow 300ms ease;
  }
  .fold__face:hover,
  .fold__face:focus-visible {
    border-color: hsl(var(--h, 196) 80% 72% / 0.8);
    box-shadow: inset 0 0 52px -10px hsl(var(--h, 196) 85% 64% / 0.72);
    outline: none;
  }
  .fold__face-idx {
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    color: hsl(var(--h, 196) 74% 76% / 0.78);
  }
  .fold__face-word {
    font-size: clamp(13px, 1.5vw, 20px);
    font-weight: 520;
    letter-spacing: -0.02em;
    text-align: center;
  }

  /* The hinges. Each face starts laid out flat beside the one it is attached
     to and rotates onto it as --f runs 0 to 1. transform-origin is the shared
     edge, which is what makes this a fold rather than five separate squares
     converging on a point. */
  /* ── WHICH WAY EACH HINGE TURNS ────────────────────────────────────────
     Worth writing down, because the first version had two of these backwards
     and the symptom was not an obviously wrong fold -- it was a box that
     assembled around the wrong axis, with one face's type showing up mirrored
     because we were reading its back.

     CSS rotateY(+90deg) maps an element's local +Z onto world +X. So for a
     face hinged on its LEFT edge with its body extending to the right, +90
     swings that body from +X round to -Z: it folds away from the viewer, and
     its front lands pointing +X, which is out of the box. That is the right
     face. The left face extends the other way and needs the opposite sign for
     the same reason. rotateX follows the same logic about the horizontal
     axis: +90 takes +Y to +Z, so the face above the base folds back on +90
     and the one below it on -90. */
  .fold__face--right {
    left: 100%;
    transform-origin: 0 50%;
    transform: rotateY(calc(90deg * var(--f)));
  }
  /* The double hinge, written out. Starting at the base's right edge, the
     first rotation repeats the right face's fold about that edge; the
     translate walks along the now-rotated face to its far edge; the second
     rotation folds about that. Composing it here is what lets this be a
     sibling of the right face rather than a child of it. */
  .fold__face--far {
    left: 100%;
    transform-origin: 0 50%;
    transform: rotateY(calc(90deg * var(--f))) translateX(100%) rotateY(calc(90deg * var(--f)));
  }
  .fold__face--left {
    left: -100%;
    transform-origin: 100% 50%;
    transform: rotateY(calc(-90deg * var(--f)));
  }
  .fold__face--top {
    top: -100%;
    transform-origin: 50% 100%;
    transform: rotateX(calc(90deg * var(--f)));
  }
  .fold__face--bottom {
    top: 100%;
    transform-origin: 50% 0;
    transform: rotateX(calc(-90deg * var(--f)));
  }

  /* ══ AND ALL OF IT AGAIN ON CREAM ══════════════════════════════════════
     The faces were built against the dark page: an opaque near-black ground
     with --ink on top of it. On the light theme --ink resolves to near-black
     as well, so the cube became a dark box carrying dark type -- the one
     element on the page you could not read, in the section whose entire brief
     was "the text isnt legible."

     The fix is not to invert the labels, it is to invert the solid. A cube on
     paper is a pale object with shaded sides, so the ground goes to paper and
     the hue stays as the tint over it, which keeps each face identifiable by
     colour exactly as it is in the dark. */
  html[data-theme="light"] .fold__face {
    background: linear-gradient(152deg, hsl(var(--h, 196) 62% 62% / 0.3), hsl(var(--h, 196) 56% 52% / 0.12) 62%, transparent), rgb(250, 249, 245);
    border-color: hsl(var(--h, 196) 48% 44% / 0.4);
    box-shadow: inset 0 0 44px -16px hsl(var(--h, 196) 60% 40% / 0.42);
    color: #0b1016;
  }
  html[data-theme="light"] .fold__face:hover,
  html[data-theme="light"] .fold__face:focus-visible {
    border-color: hsl(var(--h, 196) 54% 36% / 0.85);
    box-shadow: inset 0 0 54px -12px hsl(var(--h, 196) 62% 42% / 0.55);
  }
  html[data-theme="light"] .fold__face-idx {
    color: hsl(var(--h, 196) 54% 32% / 0.85);
  }
  html[data-theme="light"] .fold__read-idx {
    color: hsl(var(--fold-h, 196) 52% 30%);
  }
  html[data-theme="light"] .fold__read-sub {
    color: rgba(22, 30, 42, 0.68);
  }
  html[data-theme="light"] .fold__ticks li {
    background: rgba(20, 30, 44, 0.24);
  }
  html[data-theme="light"] .fold__ticks li.is-on {
    background: hsl(var(--fold-h, 196) 58% 40%);
  }

  /* ── THE INDUSTRIES ───────────────────────────────────────────────────── */
  /* One box, stacked, rather than two absolutely positioned lines each
     guessing the other's height -- the list wraps to two rows at some widths
     and the label was landing on top of it. */

  /* ══ THE ARRIVAL ═══════════════════════════════════════════════════════
     Sid: "when i scroll towards the cube unfolded another nice animation."

     The net used to be simply THERE, fully drawn, waiting for the scroll to
     start folding it. Arriving at a finished object and then operating it is
     a control panel; watching it assemble and then folding it is a sequence.

     Two things move and neither of them touches `transform` on the faces,
     because that property is owned by the scroll -- the hinges read --f every
     frame, and an entrance animating the same property would fight it and
     lose at whichever frame the scroll last wrote. So the entrance is spent
     on the things the fold does not use: the stage gets the scale and the
     tilt, and each face gets opacity and blur on a stagger, in reading order
     from the base outward. The effect is a net being laid out, one piece at a
     time, by whoever is about to fold it. */
  .fold__space {
    opacity: 0;
    transform: translateX(min(15vw, 150px)) scale(0.82) rotateX(16deg);
    transition:
      opacity 900ms ease,
      transform 1200ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .fold.is-arrived .fold__space {
    opacity: 1;
    transform: translateX(min(15vw, 150px)) scale(1) rotateX(0deg);
  }
  .fold__face {
    opacity: 0;
    filter: blur(6px);
    transition:
      opacity 620ms ease,
      filter 620ms ease,
      border-color 300ms ease,
      box-shadow 300ms ease;
  }
  .fold.is-arrived .fold__face {
    opacity: 1;
    filter: none;
    transition-delay: calc(var(--in, 0) * 105ms + 240ms);
  }
  .fold__read,
  .fold__ticks {
    opacity: 0;
    transform: translateY(14px);
    transition:
      opacity 760ms ease,
      transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .fold__read {
    transform: translateY(-50%) translateY(14px);
  }
  .fold.is-arrived .fold__read {
    opacity: 1;
    transform: translateY(-50%);
    transition-delay: 460ms;
  }
  .fold.is-arrived .fold__ticks {
    opacity: 1;
    transform: translateY(-50%);
    transition-delay: 840ms;
  }
  .fold__ticks {
    transform: translateY(-50%) translateY(14px);
  }
  @media (max-width: 860px) {
    .fold__space,
    .fold.is-arrived .fold__space {
      transform: none;
    }
    .fold__read,
    .fold.is-arrived .fold__read {
      transform: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .fold__space,
    .fold__face,
    .fold__read,
    .fold__ticks {
      opacity: 1;
      filter: none;
      transition: none;
    }
  }

  /* ── THE TICKS ────────────────────────────────────────────────────────── */
  .fold__ticks {
    position: absolute;
    right: clamp(20px, 3vw, 52px);
    top: 50%;
    transform: translateY(-50%);
    display: grid;
    gap: 9px;
    margin: 0;
    padding: 0;
    list-style: none;
    z-index: 2;
  }
  .fold__ticks li {
    width: 16px;
    height: 1px;
    background: rgba(200, 224, 248, 0.24);
    transition:
      background 320ms ease,
      width 320ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .fold__ticks li.is-on {
    width: 30px;
    background: hsl(var(--fold-h, 196) 80% 70%);
  }

  @media (max-width: 860px) {
    .fold__space {
      transform: none;
    }
    .fold__box {
      --s: min(38vw, 168px);
      top: 58%;
    }
    .fold__read {
      top: auto;
      bottom: clamp(26px, 8vh, 78px);
      left: clamp(18px, 6vw, 40px);
      transform: none;
      max-width: calc(100vw - 96px);
    }
    .fold__read-word {
      font-size: clamp(26px, 8vw, 40px);
    }
    .fold__ticks {
      right: 14px;
    }
    /* The readout already owns the foot of a phone screen, so the industries
       go above the cube rather than under it. */
  }

  /* Reduced motion gets the section, not the sequence: the cube is simply
     assembled and turned to a three quarter view, and the readout still
     answers the faces. */
  @media (prefers-reduced-motion: reduce) {
    .fold__box {
      transition: none;
    }
    .fold__read-sub li {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
  /* ══ THE SELECTED FACE, AND A READABLE SUB-LIST ═════════════════════════
     Two of Sid's notes on this section, and they are the same note: the block
     was not saying which of its parts belonged together, and the part that
     explained it was the hardest thing on the page to read.

     THE FACE. Unpicked faces stand down -- their word and number lose weight
     and the plate loses its light. The picked one keeps both and gains a
     hairline on its edge, which is the only new ink in the whole section. It
     is a state, not an effect: nothing animates except the crossfade between
     one face being picked and the next.

     THE SUB-LIST. 11px mono, uppercase, at 0.58 alpha -- Sid: "for the AI
     Interfaces, Real-Time Shaders, whatever you put below Generative, it's
     hard to read." It was: four lines of tracked-out caps at the size this
     site reserves for kickers, carrying the only concrete description of what
     the section means. 13px at --ink-2 with the tracking pulled back, and
     sentence case rather than caps, because caps are for labels and these are
     four short phrases a reader is meant to actually read. */
  .fold__face .fold__face-word,
  .fold__face .fold__face-idx {
    transition:
      opacity 420ms ease,
      color 420ms ease;
  }
  .fold__face:not(.is-picked) .fold__face-word,
  .fold__face:not(.is-picked) .fold__face-idx {
    opacity: 0.42;
  }
  .fold__face.is-picked {
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.34);
  }
  html[data-theme="light"] .fold__face.is-picked {
    box-shadow: inset 0 0 0 1px rgba(20, 30, 50, 0.3);
  }
  .fold__face.is-picked .fold__face-word {
    opacity: 1;
  }

  .fold__read-sub {
    font-size: 13px !important;
    letter-spacing: 0.01em !important;
    text-transform: none !important;
    color: var(--ink-2) !important;
    gap: 7px !important;
  }
</style>

<script>
  (function () {
    var sec = document.getElementById("fold");
    var runway = document.getElementById("fold-runway");
    var box = document.getElementById("fold-box");
    if (!sec || !runway || !box) return;

    var faces = [].slice.call(box.querySelectorAll(".fold__face"));
    var ticks = [].slice.call(sec.querySelectorAll(".fold__ticks li"));
    var wordEl = document.getElementById("fold-word");
    var subEl = document.getElementById("fold-sub");
    var idxEl = sec.querySelector(".fold__read-idx");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* The copy that was in the three pillars, plus the three beats the
       monolith carried. Held here rather than in the markup because the
       readout is one slot showing six things; six hidden lists in the DOM
       would be five of them read out to a screen reader for nothing. */
    var FACES = [
      { word: "Product", hue: 196, sub: ["Interfaces", "Design systems", "Prototypes", "Research"] },
      { word: "Spatial", hue: 268, sub: ["visionOS apps", "Augmented reality", "Installations", "Exhibitions"] },
      { word: "Generative", hue: 22, sub: ["AI interfaces", "Real-time shaders", "Generative systems", "Creative tooling"] },
      { word: "Research", hue: 146, sub: ["User interviews", "Usability testing", "Synthesis", "Journey mapping"] },
      { word: "Interface", hue: 44, sub: ["Design systems", "Motion", "Accessibility", "Design QA"] },
      { word: "Code", hue: 336, sub: ["TypeScript", "three.js · WebGPU", "Jekyll · Liquid", "Shipping it"] },
    ];

    /* Where the box has to be aimed for each face to be the one facing you.
       Held as a table rather than computed, because the far face folds twice
       and its resting orientation is not the one a formula would give. */
    var AIM = [
      { rx: -14, ry: -26 },
      { rx: -14, ry: -116 },
      { rx: -14, ry: -206 },
      { rx: -14, ry: 64 },
      { rx: -104, ry: -26 },
      { rx: 76, ry: -26 },
    ];

    var cur = -1;
    function select(i, aim) {
      if (i === cur) return;
      cur = i;
      var f = FACES[i];
      sec.style.setProperty("--fold-h", String(f.hue));
      idxEl.textContent = "0" + (i + 1);
      wordEl.textContent = f.word;
      /* Rebuilt rather than toggled, so the stagger replays on each change --
         a list that only fades the changed words reads as a typo correction. */
      subEl.innerHTML = "";
      f.sub.forEach(function (s, n) {
        var li = document.createElement("li");
        li.style.setProperty("--i", String(n));
        li.textContent = s;
        subEl.appendChild(li);
      });
      ticks.forEach(function (t, n) {
        t.classList.toggle("is-on", n === i);
      });
      /* ── AND THE FACE ITSELF SAYS WHICH ONE IS SELECTED ─────────────────
         Sid: "something more of a highlight on which side is selected,
         because we have Product, and then you have the same product side on
         the right and the product text on the left, so it's kind of
         repeating."

         The repetition is real and it is not solved by deleting one of the
         two -- the column is the readable copy and the cube is the object
         they belong to. What was missing is the LINK between them: nothing
         on the cube said "this face is the one the column is describing", so
         a reader met the same word twice with no relationship stated.

         With the selected face at full strength and the others stood down,
         the pair reads as one thing: the cube shows where you are and the
         column says what it means. Marked in the DOM rather than inferred
         from the rotation, because the rotation is eased and would make the
         highlight lag the word it belongs to. */
      faces.forEach(function (fc, n) {
        fc.classList.toggle("is-picked", n === i);
        fc.setAttribute("aria-current", n === i ? "true" : "false");
      });
      if (aim) {
        tgtRX = AIM[i].rx;
        tgtRY = AIM[i].ry;
      }
    }

    /* ── AIM ──────────────────────────────────────────────────────────────
       Two angles, eased toward a target every frame. The target is set by the
       scroll while the box is folding, by a click on a face, or by a drag --
       one place for all three, so they cannot fight each other. */
    var faces = [].slice.call(document.querySelectorAll(".fold__face"));
    var rx = 0,
      ry = 0,
      tgtRX = 0,
      tgtRY = 0,
      f = 0,
      raf = 0;

    function frame() {
      raf = 0;
      var k = 0.11;
      rx += (tgtRX - rx) * k;
      ry += (tgtRY - ry) * k;
      box.style.setProperty("--rx", rx.toFixed(2));
      box.style.setProperty("--ry", ry.toFixed(2));
      if (Math.abs(tgtRX - rx) > 0.05 || Math.abs(tgtRY - ry) > 0.05) kick();
    }
    function kick() {
      if (!raf) raf = requestAnimationFrame(frame);
    }

    /* ── THE SCROLL ───────────────────────────────────────────────────────
       The first two thirds of the runway fold the net; the last third turns
       the closed box through the faces. Splitting it this way means the fold
       is never competing with the rotation for the same pixels of scroll,
       which is what made the old scene read as "too fast": two things were
       happening in every frame of it. */
    var ticking = false;
    function read() {
      ticking = false;
      var r = runway.getBoundingClientRect();
      var travel = Math.max(1, runway.offsetHeight - (window.innerHeight || 1));
      var p = Math.max(0, Math.min(1, -r.top / travel));

      var FOLD_END = 0.62;
      var nf = Math.min(1, p / FOLD_END);
      /* Eased, so the last few degrees of each hinge slow into place. A linear
         fold looks like a mechanism; this looks like it is being done. */
      nf = nf * nf * (3 - 2 * nf);
      if (Math.abs(nf - f) > 0.002) {
        f = nf;
        box.style.setProperty("--f", f.toFixed(4));
      }
      sec.classList.toggle("is-formed", p >= FOLD_END);

      {
        if (p < FOLD_END) {
          /* Flat on, while it is still a net: a net read at an angle is a
             heap of parallelograms with type on them. */
          tgtRX = -6 * f;
          tgtRY = -18 * f;
          select(0, false);
        } else {
          var q = (p - FOLD_END) / (1 - FOLD_END);
          var i = Math.min(FACES.length - 1, Math.floor(q * FACES.length));
          select(i, true);
        }
        kick();
      }
    }
    window.addEventListener(
      "scroll",
      function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(read);
      },
      { passive: true }
    );
    window.addEventListener("resize", read, { passive: true });

    /* ── NO DRAG ──────────────────────────────────────────────────────────
       Sid: "we don't need drag-to-turn as such."

       Out of both cubes. The scroll turns this one through the six faces and
       a click brings any face forward, so a drag was a third route to a
       destination two gestures already reached -- and a horizontal drag on a
       large object, on a page whose primary gesture is scrolling, is mostly a
       scroll that went sideways. */
    /* A click on a face brings it forward. Buttons, so this is keyboard
       reachable and announces itself without any extra wiring. */
    faces.forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        if (!sec.classList.contains("is-formed")) return;
        var i = +el.getAttribute("data-face");
        cur = -1;
        select(i, false);
        tgtRX = AIM[i].rx;
        tgtRY = AIM[i].ry + Math.round((ry - AIM[i].ry) / 360) * 360;
        kick();
      });
      el.addEventListener("focus", function () {
        var i = +el.getAttribute("data-face");
        cur = -1;
        select(i, false);
        tgtRX = AIM[i].rx;
        tgtRY = AIM[i].ry;
        kick();
      });
    });

    /* One shot, on arrival. Unobserved afterwards: a net that re-lays itself
       every time you scroll back past it is a tic. */
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(
        function (es) {
          if (!es[0].isIntersecting) return;
          sec.classList.add("is-arrived");
          io.disconnect();
        },
        { threshold: 0.18 }
      );
      io.observe(sec);
    } else {
      sec.classList.add("is-arrived");
    }

    if (reduce) {
      /* Assembled and aimed, with no sequence to sit through. */
      f = 1;
      box.style.setProperty("--f", "1");
      sec.classList.add("is-formed");
      sec.classList.add("is-arrived");
      tgtRX = AIM[0].rx;
      tgtRY = AIM[0].ry;
      rx = tgtRX;
      ry = tgtRY;
      box.style.setProperty("--rx", String(rx));
      box.style.setProperty("--ry", String(ry));
      select(0, false);
    } else {
      select(0, false);
      read();
    }
  })();
</script>
