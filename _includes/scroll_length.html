<!-- Scroll-length indicator: bottom-right rectangle showing how far down the page the reader is. -->
<div class="scrolllen" aria-hidden="true">
  <span class="scrolllen__pct" id="scrolllen-pct">0</span>
  <span class="scrolllen__track"><span class="scrolllen__fill" id="scrolllen-fill"></span></span>
</div>
<style>
  .scrolllen{position:fixed;right:18px;bottom:96px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:10px 8px;border-radius:12px;background:rgba(15,19,26,.42);backdrop-filter:blur(9px) saturate(120%);
    -webkit-backdrop-filter:blur(9px) saturate(120%);border:1px solid rgba(180,205,235,.16);
    box-shadow:0 6px 24px rgba(0,0,0,.28);opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
  .scrolllen.is-on{opacity:1;transform:translateY(0)}
  .scrolllen__pct{font-family:var(--mono,"DM Mono",monospace);font-size:9px;letter-spacing:.08em;color:#9CC6FF;font-variant-numeric:tabular-nums}
  .scrolllen__track{width:4px;height:92px;border-radius:4px;background:rgba(180,205,235,.14);overflow:hidden;position:relative}
  .scrolllen__fill{position:absolute;left:0;top:0;width:100%;height:0%;border-radius:4px;background:#9CC6FF;box-shadow:0 0 8px rgba(82,139,196,.55);transition:height .12s linear}
  @media (max-width:640px){.scrolllen{right:12px;bottom:88px;padding:8px 6px}.scrolllen__track{height:64px}}
  @media (prefers-reduced-motion:reduce){.scrolllen{transition:none}.scrolllen__fill{transition:none}}
</style>
<script>
  (function(){
    var el=document.querySelector('.scrolllen');if(!el)return;
    var fill=document.getElementById('scrolllen-fill'),pct=document.getElementById('scrolllen-pct'),tick=false;
    function upd(){
      var h=document.documentElement.scrollHeight-window.innerHeight;
      var p=h>0?Math.max(0,Math.min(1,window.scrollY/h)):0;
      fill.style.height=(p*100).toFixed(1)+'%';pct.textContent=Math.round(p*100);
      el.classList.toggle('is-on',h>240);tick=false;
    }
    window.addEventListener('scroll',function(){if(!tick){requestAnimationFrame(upd);tick=true;}},{passive:true});
    window.addEventListener('resize',upd,{passive:true});upd();
  })();
</script>
