<!-- Scroll-length indicator: bottom-right rectangle showing how far down the page the reader is. -->
<div class="scrolllen" aria-hidden="true">
  <span class="scrolllen__pct" id="scrolllen-pct">0</span>
  <span class="scrolllen__track"><span class="scrolllen__fill" id="scrolllen-fill"></span></span>
</div>
<style>
  .scrolllen {
    position: fixed;
    right: 18px;
    bottom: 96px;
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 8px;
    border-radius: 12px;
    background: rgba(15, 19, 26, 0.42);
    backdrop-filter: blur(9px) saturate(120%);
    -webkit-backdrop-filter: blur(9px) saturate(120%);
    border: 1px solid rgba(180, 205, 235, 0.16);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
    opacity: 0;
    transform: translateY(6px);
    transition:
      opacity 0.4s ease,
      transform 0.4s ease;
    pointer-events: none;
  }
  .scrolllen.is-on {
    opacity: 1;
    transform: translateY(0);
  }
  .scrolllen__pct {
    font-family: var(--mono, "DM Mono", monospace);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: #9cc6ff;
    font-variant-numeric: tabular-nums;
  }
  .scrolllen__track {
    width: 4px;
    height: 92px;
    border-radius: 4px;
    background: rgba(180, 205, 235, 0.14);
    overflow: hidden;
    position: relative;
  }
  .scrolllen__fill {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 0%;
    border-radius: 4px;
    background: #9cc6ff;
    box-shadow: 0 0 8px rgba(82, 139, 196, 0.55);
    transition: height 0.12s linear;
  }
  /* Light mode: the dark glass panel over cream washed the readout out to a
     1.59 contrast ratio. Invert the panel and take the accent to a deeper
     blue so the number and the fill both survive on the page background. */
  html[data-theme="light"] .scrolllen {
    background: rgba(255, 255, 255, 0.72);
    border-color: rgba(7, 9, 15, 0.12);
    box-shadow: 0 6px 20px rgba(7, 9, 15, 0.1);
  }
  html[data-theme="light"] .scrolllen__pct {
    color: #23507f;
  }
  html[data-theme="light"] .scrolllen__track {
    background: rgba(7, 9, 15, 0.12);
  }
  html[data-theme="light"] .scrolllen__fill {
    background: #23507f;
    box-shadow: 0 0 8px rgba(35, 80, 127, 0.35);
  }
  /* On a 390px screen the glass panel, the number and the track added up to a
     floating readout that looked like debug instrumentation bolted onto the
     page — and being fixed to the right edge it crossed every right-aligned
     label on the way down: the works count, the project meta, the footer rule.
     It also had to share the bottom of the viewport with two FABs.

     A phone does not need a percentage. It needs a sense of where it is in the
     document, which is the one thing a 2px hairline at the very edge of the
     glass does perfectly and at zero cost to the layout. So the panel, the
     blur, the border, the shadow and the number all go on small screens, and
     what is left reads as part of the frame rather than as a widget sitting on
     top of the page. The track carries a little more alpha here than on
     desktop because 2px of colour needs it to register at all. */
  @media (max-width: 640px) {
    .scrolllen {
      inset: 0 0 0 auto;
      justify-content: center;
      gap: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      transform: none;
    }
    .scrolllen.is-on {
      transform: none;
    }
    .scrolllen__pct {
      display: none;
    }
    .scrolllen__track {
      width: 2px;
      height: 34vh;
      border-radius: 0;
      background: rgba(180, 205, 235, 0.2);
    }
    .scrolllen__fill {
      border-radius: 0;
      box-shadow: 0 0 10px rgba(82, 139, 196, 0.7);
    }
    html[data-theme="light"] .scrolllen__track {
      background: rgba(7, 9, 15, 0.16);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .scrolllen {
      transition: none;
    }
    .scrolllen__fill {
      transition: none;
    }
  }
</style>
<script>
  (function () {
    var el = document.querySelector(".scrolllen");
    if (!el) return;
    var fill = document.getElementById("scrolllen-fill"),
      pct = document.getElementById("scrolllen-pct"),
      tick = false;
    function upd() {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      var p = h > 0 ? Math.max(0, Math.min(1, window.scrollY / h)) : 0;
      fill.style.height = (p * 100).toFixed(1) + "%";
      pct.textContent = Math.round(p * 100);
      el.classList.toggle("is-on", h > 240);
      tick = false;
    }
    window.addEventListener(
      "scroll",
      function () {
        if (!tick) {
          requestAnimationFrame(upd);
          tick = true;
        }
      },
      { passive: true }
    );
    window.addEventListener("resize", upd, { passive: true });
    upd();
  })();
</script>
