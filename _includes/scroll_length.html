<!-- Scroll-length indicator: a hairline at the right edge of the viewport
     showing how far down the page the reader is. -->
<div class="scrolllen" aria-hidden="true">
  <span class="scrolllen__track"><span class="scrolllen__fill" id="scrolllen-fill"></span></span>
</div>
<style>
  /* ── WHY THIS IS NO LONGER A PANEL ──────────────────────────────────────────
     This used to be a glass chip in the bottom-right corner: a rounded panel, a
     hairline border, a shadow, and a mono percentage readout above a 92px
     track. It was carefully made and it was the wrong object twice over.

     It was a widget. Everything else that floats on this site is a control —
     the theme switch, the cube — and a control earns its footprint because you
     can act on it. This one only reported. A portfolio that puts a numeric
     progress readout on top of the work is describing the scroll instead of
     letting you have it, and the number was never the thing anybody wanted; the
     question a reader actually has is "am I near the end", which is a length,
     not a figure.

     And it was in the way. Three pieces of chrome were competing for one
     corner — the cube at the bottom, this at 96px, and now the theme switch,
     which had to leave the bottom-left because a fixed disc parked on the left
     margin lands on the first letter of every line it passes. Two objects on
     the right rail's plumb line is a stack; three is a toolbar. Something had
     to give, and the thing that gives is the one that was only ever talking.

     The phone build had already worked this out — it stripped the panel down to
     a 2px hairline at the very edge of the glass, and it reads better there
     than the panel ever did on desktop: it is part of the frame rather than an
     instrument bolted to it, it costs the layout nothing, it crosses no
     right-aligned label on the way down, and it says the one thing it has to
     say. So the phone treatment is now the only treatment.
     ────────────────────────────────────────────────────────────────────────── */
  .scrolllen {
    position: fixed;
    inset: 0 0 0 auto;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .scrolllen.is-on {
    opacity: 1;
  }
  .scrolllen__track {
    /* 3px on desktop, 2px on a phone. A hairline this close to the bezel needs
       enough width to register as a deliberate rule rather than as a rendering
       seam, and a desktop viewport is wide enough that 2px reads as the latter. */
    width: 3px;
    height: 38vh;
    background: rgba(180, 205, 235, 0.18);
    position: relative;
    overflow: hidden;
  }
  .scrolllen__fill {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 0%;
    background: #9cc6ff;
    box-shadow: 0 0 10px rgba(82, 139, 196, 0.65);
    transition: height 0.12s linear;
  }
  html[data-theme="light"] .scrolllen__track {
    background: rgba(7, 9, 15, 0.14);
  }
  html[data-theme="light"] .scrolllen__fill {
    background: #23507f;
    box-shadow: 0 0 10px rgba(35, 80, 127, 0.3);
  }
  @media (max-width: 640px) {
    .scrolllen__track {
      width: 2px;
      height: 34vh;
      background: rgba(180, 205, 235, 0.2);
    }
    html[data-theme="light"] .scrolllen__track {
      background: rgba(7, 9, 15, 0.16);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .scrolllen,
    .scrolllen__fill {
      transition: none;
    }
  }
</style>
<script>
  (function () {
    var el = document.querySelector(".scrolllen");
    if (!el) return;
    var fill = document.getElementById("scrolllen-fill"),
      tick = false;
    function upd() {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      var p = h > 0 ? Math.max(0, Math.min(1, window.scrollY / h)) : 0;
      fill.style.height = (p * 100).toFixed(1) + "%";
      /* Two conditions, not one. The page has to be long enough to be worth
         reporting on (h > 240) *and* the reader has to have started reading.

         The second half is the interesting one. Before, this appeared the
         instant any tall page loaded, which meant every project hero — the
         single most-looked-at frame on the site, the one that ends up in a
         screenshot — carried a progress indicator sitting at zero. A readout
         that reads zero is not reporting anything; it is announcing itself.

         Gating on 8px of scroll makes it behave the way the rest of this
         site's chrome already behaves: the theme toggle and the cube FAB hide
         while you are scrolling because they are actions and you are not
         acting. This is the inverse of that rule, not an exception to it —
         it is the one piece of chrome that is *about* the scroll, so it earns
         its place by scrolling and gives it back at the top. */
      el.classList.toggle("is-on", h > 240 && window.scrollY > 8);
      tick = false;
    }
    window.addEventListener(
      "scroll",
      function () {
        if (!tick) {
          requestAnimationFrame(upd);
          tick = true;
        }
      },
      { passive: true }
    );
    window.addEventListener("resize", upd, { passive: true });
    upd();
  })();
</script>
