<style>
  /* ── DESIGN TOKENS ──────────────────────────────────────────────────────────
     Single source of truth for all design tokens. Included in <head> of every
     layout. Page-specific overrides live in each layout's own <style> block.
     ──────────────────────────────────────────────────────────────────────── */

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    /* ── Background & Foreground ── */
    --bg: #07060c;
    --fg: #fff;

    /* ── Muted palette ── */
    /* Small labels still need to be comfortably legible. This value keeps the
       hierarchy quiet without slipping below useful contrast on the dark canvas. */
    --muted: rgba(255, 255, 255, 0.48);
    --dim: rgba(255, 255, 255, 0.22);
    --border: rgba(255, 255, 255, 0.06);

    /* ── Accent (blue) ── */
    --accent: rgba(160, 200, 255, 1);
    --accent-dim: rgba(160, 200, 255, 0.55);

    /* ── Pillar colours ──
       One colour language for Sid's three bodies of work, lifted straight from
       the Orbit scene's three rings so the site reads as one system: cool blue
       for product & systems, warm amber for AI & creative technology, violet for
       culture, space & image. Stored as bare "r, g, b" triplets so any element
       can dial its own alpha via rgb(var(--pillar-x) / <a>) or rgba(). */
    --pillar-product: 156, 208, 255;
    --pillar-ai: 255, 179, 122;
    --pillar-culture: 201, 162, 255;

    /* ── Typography ── */
    --font-head: "Figtree", sans-serif;
    --font-mono: "DM Mono", monospace;
    --font-title: "Figtree", sans-serif;

    /* ── Layout ── */
    --nav-h: 64px;
    --gutter: max(24px, 4vw);
    --content-max: 1440px;

    /* ── Motion ── */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

    /* ══ THE SYSTEM ═══════════════════════════════════════════════════════
       Sid: "follows design fundamentals, doesn't stack a lot of text in
       different styles above each other, and follows 4 point spacing and
       colour and grid rules."

       He was right, and the measurement was worse than the complaint. Audited
       at 1512 across three pages -- works, home and a case study -- the site
       was running 39, 44 and 51 DISTINCT spacing values, of which 58%, 58%
       and 56% of all uses sat off any 4pt grid; 34, 42 and 45 distinct type
       combinations of family x size x weight x tracking x case; and 18, 17
       and 27 distinct text colours. The single most common spacing value was
       10px, used 51 to 69 times per page, with 2px close behind.

       None of that is a styling mistake in any one place. It is what happens
       when hundreds of individual values are chosen one at a time over many
       sessions -- a good number of them mine -- with nothing to choose them
       from. Every fix then lands as "better, but still off", because a number
       nudged inside a system that does not exist cannot resolve into rhythm.

       So: the scales below are the vocabulary. Nothing here changes a single
       pixel on its own -- these are additive definitions, and pages adopt them
       as they are converted, starting with works and play. That matters: a
       token layer that silently restyles twenty pages the moment it lands is
       not a refactor, it is an outage.

       ── SPACING. Strict 4pt, doubling with two half-steps where real layouts
       need them. Nothing between --sp-1 and --sp-2 exists on purpose; 10px and
       14px and 7px are exactly the values that made the pages feel unresolved,
       so there is deliberately nowhere to write them. */
    --sp-0: 0;
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --sp-6: 32px;
    --sp-7: 48px;
    --sp-8: 64px;
    --sp-9: 96px;
    --sp-10: 128px;

    /* ── TYPE. Eight roles, not forty-five. Each one is a complete decision --
       size, weight, line-height and tracking together -- because the audit
       showed the same nominal size appearing at four different weights and
       three different trackings, which is precisely the "text in different
       styles stacked above each other" he is describing. Sizes are on a 1.25
       ratio rounded to whole pixels, and every one of them is 4pt-divisible in
       line-height so text sits on the same grid as the boxes around it.

       display  the one big statement per page
       title    section headings
       heading  sub-sections, card titles
       body-lg  lead paragraphs
       body     running prose
       label    UI labels, item titles in lists
       meta     captions, secondary detail
       micro    the mono eyebrows -- the ONLY role that is uppercase-tracked */
    /* 350, not 600. The token said 600 and the site never agreed with it:
       the sixteen case studies set their display heading at 300, the homepage
       at 350, /about/ at 400. The only file that actually used the token was
       play/index.html, so the scale's heaviest role was describing one page
       while every other page hand-rolled something lighter. Changed to match
       the voice that exists rather than leaving a token nobody could adopt
       without making their page the odd one out. */
    --type-display: 350 clamp(40px, 5vw, 72px) / 1.05 var(--font-title);
    --type-title: 500 clamp(28px, 3vw, 40px) / 1.15 var(--font-head);
    --type-heading: 500 24px / 1.33 var(--font-head);
    --type-body-lg: 400 19px / 1.68 var(--font-head);
    --type-body: 400 16px / 1.5 var(--font-head);
    --type-label: 450 15px / 1.33 var(--font-head);
    --type-meta: 400 13px / 1.54 var(--font-head);
    --type-micro: 400 11px / 1.45 var(--font-mono);
    --track-display: -0.03em;
    --track-title: -0.022em;
    --track-tight: -0.012em;
    --track-micro: 0.16em;

    /* ── COLOUR. Six text tokens per theme, replacing the seventeen-to-
       twenty-seven in use. The ladder is deliberate and each step has a job,
       so there is never a reason to invent an alpha between two of them:

       ink      primary text, full strength
       ink-2    secondary -- long prose, list items
       ink-3    tertiary -- captions, meta
       ink-4    quiet -- eyebrows, disabled, decorative
       line     hairlines and dividers
       line-2   stronger dividers, focus rings

       Measured on --bg #07060c: ink-3 lands at 8.9:1 and ink-4 at 4.8:1, so
       even the quietest step clears AA for small text. That is the point of
       stopping the ladder at four -- every earlier attempt at "just a bit
       fainter" is how 0.62, 0.66 and 0.68 all ended up on the same page. */
    /* ── ONE PAGE INK ───────────────────────────────────────────────────
       Audited across eight routes: the site was rendering FOUR different
       opaque near-whites as its primary ink, one per page, each declared
       locally and none of them aware of the others —

         #f2f5f9  --home-ink and --wk-ink
         #f4f7fb  --play-ink
         #f5f7fa  --contact-ink
         #f5f7fb  --nav-ink

       Three units apart at the widest. Nobody can see the difference, which
       is exactly why it went unnoticed for so long and exactly why it is
       worth fixing: four tokens doing one job is four places to change when
       the answer changes, and the reason the fourth page always drifts.

       The per-page names stay, because they carry meaning at their call
       sites. They just all resolve here now. */
    --ink-page: #f4f7fb;
    --ink: rgba(255, 255, 255, 0.96);
    --ink-2: rgba(255, 255, 255, 0.82);
    --ink-3: rgba(255, 255, 255, 0.64);
    --ink-4: rgba(255, 255, 255, 0.44);
    --line: rgba(255, 255, 255, 0.1);
    --line-2: rgba(255, 255, 255, 0.2);

    /* ── GRID. One column system, so "the grid" means something specific:
       12 columns, 4pt-derived gutters, a max measure for prose. */
    /* --accent and --accent-dim are ONE blue, defined once, and they do not
       flip with the theme -- they are built for a dark canvas. That is fine
       for glows and borders and wrong for text, and it has now caused the same
       bug three times: a light-mode rule sets colour to --accent, the name
       reads as theme-aware, and a pale blue lands on cream at 1.27 to 1.42 to
       one. --accent-ink is the text-safe accent and it DOES flip. Any
       html[data-theme="light"] rule colouring type should use this. */
    --accent-ink: rgba(160, 200, 255, 0.92);

    --grid-cols: 12;
    --grid-gap: var(--sp-5);
    --measure: 68ch;
  }

  html[data-theme="light"] {
    --ink: rgba(12, 14, 20, 0.94);
    --ink-2: rgba(12, 14, 20, 0.8);
    --ink-3: rgba(12, 14, 20, 0.62);
    --ink-4: rgba(12, 14, 20, 0.46);
    --line: rgba(12, 14, 20, 0.12);
    --line-2: rgba(12, 14, 20, 0.22);
    /* 6.4:1 on --bg #f5f3ee -- an accent that is still legibly blue and still
       legibly text. */
    --accent-ink: rgba(35, 80, 127, 0.92);
  }

  @media (max-width: 600px) {
    :root {
      --nav-h: 56px;
    }
  }

  /* Light mode token overrides */
  html[data-theme="light"] {
    --bg: #f5f3ee;
    --fg: #1a1a22;
    /* Light mode needs a firmer muted ink than dark mode: the earlier value
       looked elegant in isolation but was too faint for small navigation and
       metadata text against the pale surface. */
    --muted: rgba(26, 26, 34, 0.64);
    --dim: rgba(26, 26, 34, 0.22);
    --border: rgba(26, 26, 34, 0.08);
  }

  html {
    font-size: 16px;
    background: var(--bg);
    color: var(--fg);
    scroll-behavior: smooth;
  }
  body {
    font-family: var(--font-head);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: inherit;
    text-decoration: none;
  }

  /* ── Cross-page motion ───────────────────────────────────────────────────
     A light, progressive enhancement for browsers that support cross-document
     View Transitions. It makes navigation feel like a change of scene rather
     than a hard cut; unsupported browsers retain the normal fast navigation.
     ──────────────────────────────────────────────────────────────────────── */
  @view-transition {
    navigation: auto;
  }

  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-old(root) {
      animation: page-scene-out 260ms var(--ease-out) both;
      mix-blend-mode: normal;
    }

    ::view-transition-new(root) {
      animation: page-scene-in 520ms var(--ease-out) both;
      mix-blend-mode: normal;
    }
  }

  @keyframes page-scene-out {
    to {
      opacity: 0;
      filter: blur(2px);
      transform: scale(0.992);
    }
  }

  @keyframes page-scene-in {
    from {
      opacity: 0;
      filter: blur(5px);
      transform: scale(1.012);
    }
    to {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    @view-transition {
      navigation: none;
    }
  }

  /* ── THE THEME WIPE ──────────────────────────────────────────────────────
     The page-scene keyframes above are for NAVIGATION. A theme change is a
     same-document transition and wants the opposite treatment: the two
     snapshots are the identical layout in two palettes, so fading or blurring
     them against each other just produces mud in the middle of the sweep.

     So during a theme change both roots hold still at full opacity and the
     only thing that moves is the circular clip on the incoming one, animated
     from the toggle's position by the script in cursor_fluid.html. The old
     snapshot stays put underneath and is revealed away.

     Scoped behind .is-theme-wipe so navigation keeps its own animation. */
  html.is-theme-wipe::view-transition-old(root),
  html.is-theme-wipe::view-transition-new(root) {
    animation: none;
    mix-blend-mode: normal;
  }
  html.is-theme-wipe::view-transition-old(root) {
    z-index: 0;
  }
  html.is-theme-wipe::view-transition-new(root) {
    z-index: 1;
  }
  /* The nav and the cube carry their own transition names, which would make
     them separate groups floating above the wipe and travelling on their own
     while the palette changes underneath. For this one transition they belong
     to the page. */
  html.is-theme-wipe .nav,
  html.is-theme-wipe .sid-cube,
  html.is-theme-wipe [style*="view-transition-name"] {
    view-transition-name: none !important;
  }

  /* ── VIDEO CHROME ──────────────────────────────────────────────────────
     Every frame on this site is composed. The covers are cropped, the media
     blocks have a curved leading edge, the reels have their own counters and
     captions — and then a video with `controls` paints a light grey capsule
     with a blue-ish progress bar across the bottom of it, because that is
     what the user agent ships. On /ai-prototypes/ there are twelve of them,
     stacked down a page whose entire argument is that these are finished
     pieces of work. The default panel is the single loudest thing on it.

     Removing `controls` is not the answer for those twelve: they are films a
     visitor is meant to start, pause and scrub. The answer is to dress the
     panel instead of the video, which Chromium and Safari both allow through
     the media-controls pseudo-elements. Two rules do nearly all of it.

     The enclosure inherits the element's own radius so the bar stops
     squaring off the bottom corners of a media block that is rounded
     everywhere else. The panel's opaque capsule becomes a gradient scrim in
     the page's own ink — transparent at the top, near-solid where the
     buttons sit — so the controls read as sitting ON the footage rather than
     as a tray bolted under it. The glyphs the UA draws are white either way,
     and white on a 0.82 scrim is more legible than white on the default grey.

     Firefox exposes none of this and keeps its own controls, which is the
     behaviour today, so nothing regresses there. */
  video::-webkit-media-controls-enclosure {
    border-radius: inherit;
  }
  video::-webkit-media-controls-panel {
    background-color: transparent;
    background-image: linear-gradient(180deg, rgba(4, 7, 13, 0) 0%, rgba(4, 7, 13, 0.4) 40%, rgba(4, 7, 13, 0.82) 100%);
  }

  /* ── FOCUS ─────────────────────────────────────────────────────────────
     Several pages set a proper ring on their own controls and several do
     not, so a keyboard walk of the home page landed on the skip link, the
     "Open to roles" chip, the "Selected work" link and the reel button with
     nothing but the UA default — a 1px near-black outline, on a near-black
     page. Invisible. This is the floor, defined once where every layout
     already includes it; pages with a stronger ring still override it.

     `video` was the gap. It is not a link, a button or a [tabindex] — it is
     focusable purely because it carries `controls`, so it fell through every
     selector in this list while still taking two tab stops apiece (the
     element, then its shadow-DOM control bar). On /ai-prototypes/ that is
     ten consecutive stops with no ring at all: a keyboard user tabbing the
     page simply loses the caret for a third of it. `audio` and `iframe` are
     here for the same reason, before they become the next version of it. */
  a:focus-visible,
  button:focus-visible,
  summary:focus-visible,
  [tabindex]:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible,
  video:focus-visible,
  audio:focus-visible,
  iframe:focus-visible {
    outline: 2px solid rgba(140, 200, 255, 0.75);
    outline-offset: 3px;
    border-radius: 3px;
  }
  html[data-theme="light"] a:focus-visible,
  html[data-theme="light"] button:focus-visible,
  html[data-theme="light"] summary:focus-visible,
  html[data-theme="light"] [tabindex]:focus-visible,
  html[data-theme="light"] input:focus-visible,
  html[data-theme="light"] textarea:focus-visible,
  html[data-theme="light"] select:focus-visible,
  html[data-theme="light"] video:focus-visible,
  html[data-theme="light"] audio:focus-visible,
  html[data-theme="light"] iframe:focus-visible {
    outline-color: rgba(24, 68, 140, 0.7);
  }
  /* Mouse users should never see it; a bare :focus rule would flash the ring
     on every click on the custom-cursor pages. */
  :focus:not(:focus-visible) {
    outline: none;
  }

  /* ── OUTBOUND ARROW ────────────────────────────────────────────────────
     Every link on this site that leaves the page ends in a ↗, and until now
     that arrow was a literal character sitting in the label — which means it
     was the one part of the link that could not move. The links themselves
     are careful: the contact row draws its rule in from the left, the about
     actions lift. The arrow just sat there through all of it, and a mark that
     stays put while everything around it responds reads as a typo rather than
     as restraint.

     So the glyph becomes a slot instead: a square the size of the text, with
     the arrow inside it and a second copy of the arrow waiting one diagonal
     step down and to the left, outside the clip. On hover the pair travels
     along that diagonal together — the first arrow leaves through the top-
     right corner exactly as the second arrives in its place. It is the same
     move the arrow itself describes, performed by the arrow, and it costs two
     pseudo-elements and no markup beyond an empty span.

     The diagonal is 110% rather than 100% so both glyphs are fully outside
     the box at the midpoint and the swap never shows two arrows at once. The
     easing is the site's own 0.16/1/0.3/1, and it runs on :focus-visible as
     well as :hover so a keyboard walk sees the same thing a cursor does.

     Written here, in the one include every layout carries, because the same
     arrow appears on contact, about, the project pages and the reels — this
     is the class they can all reach for. */
  .xarrow {
    display: inline-block;
    position: relative;
    width: 1em;
    height: 1em;
    margin-left: 0.34em;
    overflow: hidden;
    vertical-align: -0.08em;
    line-height: 1;
  }
  .xarrow::before,
  .xarrow::after {
    content: "↗";
    position: absolute;
    inset: 0;
    display: block;
    text-align: center;
    line-height: 1em;
    font-size: 0.94em;
    transition: transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .xarrow::after {
    transform: translate(-110%, 110%);
  }
  /* Keyed to the DIRECT parent rather than to `a` or `button`, because a third
     of the arrows on this site hang off neither: the reels on /ai-prototypes/
     open through `<span data-href>` handlers, and those were about to be the
     only outbound marks that stayed still. `:hover >` is the honest expression
     of the rule — the arrow answers to the thing it is inside, whatever that
     thing happens to be — and it keeps ancestor hovers from firing it. */
  :hover > .xarrow::before,
  :focus-visible > .xarrow::before {
    transform: translate(110%, -110%);
  }
  :hover > .xarrow::after,
  :focus-visible > .xarrow::after {
    transform: translate(0, 0);
  }
  /* The same slot, turned on its side, for the arrows that mean "onward" rather
     than "away": the works CTA, the 404 escape hatches, the home index row, the
     loader's enter button. Those all point → instead of ↗, so the handoff runs
     along the horizontal rather than the diagonal — the arrow still leaves in
     exactly the direction it is pointing, which is the whole idea.

     Wider than the diagonal slot because → is a wider glyph than ↗ and a 1em
     box clips its tail. Declared after the base rules so the identical-
     specificity overrides land; the travel is 120% so the outgoing mark is
     fully clear of the box before the incoming one arrives. */
  .xarrow--right {
    width: 1.15em;
  }
  .xarrow--right::before,
  .xarrow--right::after {
    content: "→";
  }
  .xarrow--right::after {
    transform: translate(-120%, 0);
  }
  :hover > .xarrow--right::before,
  :focus-visible > .xarrow--right::before {
    transform: translate(120%, 0);
  }
  :hover > .xarrow--right::after,
  :focus-visible > .xarrow--right::after {
    transform: translate(0, 0);
  }

  @media (prefers-reduced-motion: reduce) {
    .xarrow::before,
    .xarrow::after {
      transition-duration: 1ms;
    }
  }

  /* ══ TOUCH TARGETS ═════════════════════════════════════════════════════
     From the mobile audit at 390x844. Horizontal scroll was clean on every
     page, but six controls measured under the 44px minimum a finger needs:

       .contact-copybtn      44x23  -- the Copy buttons beside the address
       .ai-featured-action  187x22  -- the prototype links. That element is
                                       gone: the AI page is one entry shape
                                       now and its single link is .proto__open,
                                       which grows its own 44px hit area with a
                                       transparent ::after in that layout. Done
                                       there rather than here because it is a
                                       grid item with justify-self, so adding
                                       min-height would stretch the row instead
                                       of the target -- and because (pointer:
                                       coarse) is the real condition, where
                                       max-width: 900px only approximates it.
       .studio-mark          36x48  -- the logo, 8px narrow
       .skip-link          163x30
       .cc-close / toggles   39x39

     None of these are visible faults, which is why they survived every
     screenshot pass. They are the difference between a link that works on a
     phone and one you have to aim at twice.

     Height is added with padding rather than by growing the box, and the
     inline controls get a centred flex so the label stays where it was --
     these are all things sitting inside laid-out rows, and making them
     taller must not move their neighbours. */
  @media (max-width: 900px) {
    .contact-copybtn,
    .skip-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
    }
    .studio-mark {
      min-width: 44px;
      justify-content: center;
    }
    /* Round buttons that are close but under: grown from the centre so the
       icon inside does not shift. */
    .cc-close,
    .theme-toggle,
    .contact-copybtn {
      min-width: 44px;
    }

    /* Second sweep, after the first fixed contact and ai-prototypes: the home
       page still had three, and the nav had four I had not thought to check.

       .studio-link measured 42x40 -- the nav itself, four times, and the most
       tapped thing on any page. Two pixels short in each direction is the
       worst kind of miss: it works most of the time, so it never gets
       reported, it just quietly costs a tap now and then.

       .obj-face--left is the exception that stays: a 23x232 sliver is one
       face of the rotating cube gallery, and the whole point of its shape is
       that it is a face seen edge-on. Making it 44 wide would deform the
       object. Its front face is a full-size target for the same project, so
       the destination is reachable -- this is decoration that happens to be
       an anchor, not a control a thumb is meant to find. */
    /* Written through .studio-links: the bare .studio-link min-height was
       being out-specified by the nav's own mobile rule, so width reached 44
       and height stayed at 40. Only measuring again after the "fix" showed
       it -- the first pass reported success on half the property. */
    .studio-links .studio-link {
      min-height: 44px;
      min-width: 44px;
    }
    #reel-open,
    .gal-go {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
    }
  }

  /* ══ PRESS ═════════════════════════════════════════════════════════════
     The site had focus-visible everywhere and :active almost nowhere -- two
     rules in the nav, one on works, none at all on the case studies. So
     hovering told you a thing was live and clicking it told you nothing: the
     press vanished into the navigation. On a portfolio that is a conspicuous
     gap, because a press is the one interaction a visitor performs
     deliberately.

     FIRST ATTEMPT USED transform: scale(0.985) AND WAS A NO-OP. Measured it:
     pressing a contact link returned matrix(1,0,0,1,0,-1.53) -- the link's
     own hover lift, not the press. Nearly every interactive thing on this
     site already animates transform on hover, and a component rule beats a
     bare element selector, so the one property I reached for was the one
     property that was already taken. It would have shipped looking like it
     worked, because it does work on the handful of elements with no hover
     transform.

     So the press drives brightness instead, which nothing else on the site
     animates and which composes with any transform rather than fighting it.
     40ms down, because a press is not an animation to admire -- it has to
     land inside the same moment as the finger -- and a slower release so the
     control settles rather than snapping. */
  a,
  button,
  summary,
  [role="button"] {
    transition: filter 150ms var(--ease-out);
  }
  a:active,
  button:active,
  summary:active,
  [role="button"]:active {
    filter: brightness(0.82);
    transition-duration: 40ms;
  }
  /* Light mode inverts it: on cream, dimming a control reads as disabled,
     while a touch of extra contrast reads as pressed. */
  html[data-theme="light"] a:active,
  html[data-theme="light"] button:active,
  html[data-theme="light"] summary:active,
  html[data-theme="light"] [role="button"]:active {
    filter: brightness(0.94) contrast(1.08);
  }
  /* Media keeps its own treatment: dimming a photograph on press looks like
     a loading state, not an acknowledgement. */
  .play-grid img:active,
  .sid-tile:active,
  .obj-face:active,
  .works-list-item:active {
    filter: none;
  }
  @media (prefers-reduced-motion: reduce) {
    a,
    button,
    summary,
    [role="button"] {
      transition: none;
    }
  }
</style>
