<style>
  /* ── DESIGN TOKENS ──────────────────────────────────────────────────────────
     Single source of truth for all design tokens. Included in <head> of every
     layout. Page-specific overrides live in each layout's own <style> block.
     ──────────────────────────────────────────────────────────────────────── */

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    /* ── Background & Foreground ── */
    --bg: #07060c;
    --fg: #fff;

    /* ── Muted palette ── */
    --muted: rgba(255, 255, 255, 0.38);
    --dim: rgba(255, 255, 255, 0.22);
    --border: rgba(255, 255, 255, 0.06);

    /* ── Accent (blue) ── */
    --accent: rgba(160, 200, 255, 1);
    --accent-dim: rgba(160, 200, 255, 0.55);

    /* ── Typography ── */
    --font-head: "Inter", sans-serif;
    --font-mono: "DM Mono", monospace;
    --font-title: "Inter", sans-serif;

    /* ── Layout ── */
    --nav-h: 64px;
    --gutter: max(24px, 4vw);
    --content-max: 1440px;

    /* ── Motion ── */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  @media (max-width: 600px) {
    :root {
      --nav-h: 56px;
    }
  }

  /* Light mode token overrides */
  html[data-theme="light"] {
    --bg: #f5f3ee;
    --fg: #1a1a22;
    --muted: rgba(26, 26, 34, 0.45);
    --dim: rgba(26, 26, 34, 0.22);
    --border: rgba(26, 26, 34, 0.08);
  }

  html {
    font-size: 16px;
    background: var(--bg);
    color: var(--fg);
    scroll-behavior: smooth;
  }
  body {
    font-family: var(--font-head);
    -webkit-font-smoothing: antialiased;
  }
  a {
    color: inherit;
    text-decoration: none;
  }
</style>
