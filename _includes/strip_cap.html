<!-- ══════════════════════════════════════════════════════════════════════════
     THE CAP

     Sid: "add this 3d model of my fav cap to get to know sid and let it rotate
     a bit or show its 3d modelness through a light shiny or reflective or idk."

     It is the cap he is wearing in the portrait two sections up, which is the
     reason it earns a tile: the rail is a set of things that are true about
     him, and this is the one object in it a visitor has already seen him in.

     ── SHOWING THAT IT IS A MODEL ───────────────────────────────────────────
     A 3D object rendered still is a photograph with extra steps, so the tile
     has to say "this is a solid" in the first second. Two things do that and
     neither is a spin: it turns slowly and unevenly -- a constant rotation
     reads as a turntable in a product listing -- and the environment gives it
     a specular that travels across the crown as it goes. The highlight moving
     independently of the silhouette is the actual cue that a surface is being
     lit rather than drawn.

     ── WHAT IT COSTS ────────────────────────────────────────────────────────
     The source was 15.6MB: 6.4 of that textures at full resolution, the rest
     an unsimplified Meshy mesh. At the size this renders, both are waste. The
     textures are repacked at 1024 and the mesh is simplified and meshopt
     compressed, which is 1.0MB -- the same order as the Buddha in the footer.

     Nothing is requested until the tile is near the viewport, and the rail
     clones its tiles for the drift loop, so only the first copy builds a
     renderer: two WebGL contexts for one hat would be an expensive joke.
     ══════════════════════════════════════════════════════════════════════ -->
<figure class="sid-tile sid-tile--type sid-tile--cap" style="--s: 0.95; --ar: 1">
  <!-- No id. The rail duplicates its tiles to make the drift loop seamless,
       so an id here becomes TWO elements with the same id on every page that
       renders the full footer -- invalid HTML, and the kind that breaks
       getElementById silently by returning whichever copy happens to be
       first in the document. Caught by auditing for duplicate ids: six
       routes, all of them the ones with the strip.

       Nothing referenced it. The include's own script has always queried
       `.cap__mount`, and so does the stylesheet, so the id was decoration
       that only created a bug. -->
  <div class="cap__mount" aria-hidden="true"></div>
  <figcaption><em>Never not wearing</em><b>The sunburst cap</b></figcaption>
</figure>

<style>
  .sid-tile--cap {
    position: relative;
    overflow: hidden;
  }
  .cap__mount {
    position: absolute;
    left: 50%;
    top: 45%;
    width: 86%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .cap__mount model-viewer {
    width: 100%;
    height: 100%;
    display: block;
    --progress-bar-color: transparent;
    background: transparent;
  }
</style>

<script>
  self.ModelViewerElement = self.ModelViewerElement || {};
  self.ModelViewerElement.meshoptDecoderLocation = "https://cdn.jsdelivr.net/npm/meshoptimizer/meshopt_decoder.js";
</script>

<script>
  (function () {
    /* ── DO NOT HOLD THE NODE ──────────────────────────────────────────
       The rail builds its drift loop by duplicating the row's contents, which
       happens after this script runs and replaces the original nodes. A
       reference captured here therefore points at something detached from the
       document, which never intersects anything and never builds -- measured:
       two mounts in the page and zero renderers.

       So the observer watches the STRIP, which is stable, and the mount is
       looked up fresh at the moment it is needed. */
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var strip = document.querySelector(".sid-strip");
    if (!strip) return;

    var SRC = "{{ site.baseurl }}/assets/models/cap-web.glb";
    var LIB = "https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js";
    var built = false;

    function ensureLib() {
      if (window.customElements && customElements.get("model-viewer")) return;
      if (document.querySelector("script[data-mv-lib]")) return;
      var s = document.createElement("script");
      s.type = "module";
      s.src = LIB;
      s.crossOrigin = "anonymous";
      s.setAttribute("data-mv-lib", "");
      document.head.appendChild(s);
    }

    function build() {
      if (built) return;
      var mount = document.querySelector(".cap__mount");
      if (!mount) return;
      built = true;
      ensureLib();
      var mv = document.createElement("model-viewer");
      mv.setAttribute("src", SRC);
      mv.setAttribute("camera-orbit", "18deg 74deg 116%");
      mv.setAttribute("field-of-view", "26deg");
      mv.setAttribute("interaction-prompt", "none");
      mv.setAttribute("disable-zoom", "");
      mv.setAttribute("disable-pan", "");
      mv.setAttribute("disable-tap", "");
      mv.setAttribute("loading", "lazy");
      /* The environment is the whole point. Without one the cap is flat
         albedo and could be a drawing; with one it carries a specular that
         travels as it turns, which is the cue that reads as "solid". */
      mv.setAttribute("environment-image", "neutral");
      mv.setAttribute("exposure", "1.15");
      mv.setAttribute("shadow-intensity", "0.35");
      mv.setAttribute("shadow-softness", "0.9");
      mv.setAttribute("auto-rotate", "");
      /* Slow, and slower than a product turntable on purpose: 9 degrees a
         second takes forty seconds to come round, so a visitor passing the
         rail sees it move without ever seeing it repeat. */
      mv.setAttribute("rotation-per-second", "9deg");
      mv.setAttribute("auto-rotate-delay", "0");
      mount.appendChild(mv);

      /* ── AND ONLY ONE OF THEM ──────────────────────────────────────────
         The rail may clone the row after this has built, and a cloned
         <model-viewer> is not an inert copy: it initialises its own renderer,
         so the page ends up with two WebGL contexts turning the same hat.
         Measured exactly that -- two viewers for one tile.

         The duplicate cannot be prevented, because the cloning is the rail's
         business and it is right to copy whatever is in the row. It can be
         swept up: any viewer after the first is removed, on a couple of beats
         because the clone's timing is not ours to know. */
      function dedupe() {
        var all = document.querySelectorAll(".cap__mount model-viewer");
        for (var i = 1; i < all.length; i++) {
          var host = all[i].parentElement;
          all[i].remove();
          /* The empty clone gets the caption and nothing else, which is the
             correct outcome: one hat, turning, once. */
          if (host) host.style.display = "none";
        }
      }
      [600, 1800, 4000].forEach(function (t) {
        setTimeout(dedupe, t);
      });

      /* model-viewer keeps rendering off screen. The strip is in the footer of
         every page, so that is a WebGL context turning a hat nobody is looking
         at for the life of the visit. */
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(
          function (es) {
            var vis = es[0].isIntersecting && !document.hidden;
            if (vis) mv.setAttribute("auto-rotate", "");
            else mv.removeAttribute("auto-rotate");
            mv.style.visibility = vis ? "visible" : "hidden";
          },
          { threshold: 0, rootMargin: "120px" }
        ).observe(strip);
      }
    }

    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(
        function (es) {
          if (!es[0].isIntersecting) return;
          io.disconnect();
          build();
        },
        { rootMargin: "500px" }
      );
      io.observe(strip);
    } else build();
  })();
</script>
