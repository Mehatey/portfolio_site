<!-- ============================================================
     Homepage act 2 — "the object".
     It sits directly after the hero film now: the first thing you
     scroll into is a real thing in perspective that answers to the
     wheel, which is the promise the rest of the page has to keep.
     A real cube in perspective space:
     six faces carrying six covers, spun by scroll position, and
     grabbable — drag it and it keeps spinning with inertia.

     Built with CSS 3D rather than WebGL on purpose. The faces stay
     crisp at any DPR, each one is a real <a> so it is keyboard
     reachable and crawlable, and there is no shader/context to lose
     on a backgrounded tab. Perspective, z-depth and lighting are
     genuine, not a sprite trick.
     ============================================================ -->

<style>
  .hs-object {
    position: relative;
    z-index: 6;
    background: var(--home-bg, #05070d);
    padding: 22vh clamp(24px, 5vw, 90px) 24vh;
    text-align: center;
    overflow: hidden;
  }
  .hs-object::before {
    /* Soft floor glow so the cube reads as sitting in a space. */
    content: "";
    position: absolute;
    left: 50%;
    top: 52%;
    width: min(900px, 90vw);
    height: min(900px, 90vw);
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(110, 168, 255, 0.13), rgba(185, 140, 255, 0.06) 42%, transparent 70%);
    pointer-events: none;
  }
  .obj-head {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: clamp(28px, 6vh, 64px);
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(230, 236, 244, 0.6);
  }
  .obj-head .cine-rule {
    width: min(180px, 18vw);
    height: 1px;
    background: rgba(230, 236, 244, 0.24);
  }
  .obj-stage {
    position: relative;
    height: clamp(460px, 74vh, 840px);
    /* Shorter camera. 1200px against a 420px cube is nearly orthographic --
       the faces barely converge, which is what made it read as a flat sticker
       sheet folded into a box rather than as a thing standing in a room. At
       860 the vanishing point is close enough that the far edges visibly
       taper. */
    perspective: 860px;
    perspective-origin: 50% 48%;
    touch-action: pan-y;
    cursor: grab;
  }
  .obj-stage.is-dragging {
    cursor: grabbing;
  }
  .obj-cube {
    /* Bigger. Sid: "the cube below should be a little bit bigger." With the
       chapter head gone there is room for it, and it has to hold the eye on
       its own now that nothing announces it. */
    /* Sid: "i also wanted cube to be bigger" and "more space around it to feel
       in a 3d space environment".

       Sized against the stage rather than picked: a cube tumbling on two axes
       presents its body diagonal at the extremes, which is sqrt(3) times its
       edge -- so a 480px cube sweeps an 831px circle and the stage has to be
       at least that or the section's own overflow clips the corners off at
       precisely the moments the tumble is most legible. 480 against an 840
       stage leaves 9px, which is the whole budget spent on the object. */
    --size: clamp(260px, 34vw, 480px);
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--size);
    height: var(--size);
    margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
    transform-style: preserve-3d;
    transform: rotateX(-18deg) rotateY(0deg);
    will-change: transform;
  }
  .obj-face {
    position: absolute;
    inset: 0;
    display: block;
    overflow: hidden;
    border-radius: 6px;
    text-decoration: none;
    background: #0a0d15;
    border: 1px solid rgba(255, 255, 255, 0.09);
    backface-visibility: hidden;
    box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.55);
  }
  /* ── THE CUBE IS DRAGGABLE AGAIN ──────────────────────────────────────
     Sid: "not able to drag while hovering on cube."

     Each face is an <a> wrapping an <img>, and both of those are things the
     browser has its own drag behaviour for: press and move on a link or an
     image and it starts a native drag of that link or that image. That
     gesture begins on pointermove and takes the pointer with it, so the
     stage's own pointermove handler stops receiving anything and the spin
     dies the instant you actually try to spin it. It only failed ON the cube,
     which is the one place you would ever try.

     Suppressing the native drag gives the gesture back. The links still work
     -- a click is not a drag -- and the drag handler already distinguishes
     the two. */
  .obj-face,
  .obj-face img {
    -webkit-user-drag: none;
    user-select: none;
  }
  .obj-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.9;
    transition:
      opacity 0.4s ease,
      transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .obj-face span {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 26px 12px 10px;
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #eef2f8;
    background: linear-gradient(180deg, transparent, rgba(5, 7, 13, 0.85));
  }
  .obj-face:hover img,
  .obj-face:focus-visible img {
    opacity: 1;
    transform: scale(1.06);
  }
  .obj-face:focus-visible {
    outline: 2px solid #eef2f8;
    outline-offset: 3px;
  }
  /* Six faces of a cube: each pushed out half the edge length. The
     shade darkens the sides so the form reads as lit from the front. */
  .obj-face--front {
    transform: translateZ(calc(var(--size) / 2));
  }
  .obj-face--back {
    transform: rotateY(180deg) translateZ(calc(var(--size) / 2));
  }
  .obj-face--right {
    transform: rotateY(90deg) translateZ(calc(var(--size) / 2));
  }
  .obj-face--left {
    transform: rotateY(-90deg) translateZ(calc(var(--size) / 2));
  }
  /* ── THE LID AND THE BASE READ THE RIGHT WAY UP ──────────────────────────
     These two were never seen before -- scroll drove one axis, so the four
     sides were all anyone got -- and the moment they came into view both were
     upside down. That is not a mistake in the markup, it is what a cube is: a
     face laid flat by rotateX(90) has its own "up" pointing back down the Z
     axis, so its artwork and its label arrive inverted to a camera looking at
     it from outside.

     A rotateZ appended after the translate turns the face about its own normal.
     The face is square and centred, so it occupies exactly the same box; only
     its contents come up the right way. Each needs the opposite sign, because
     the two are mirror images of each other. */
  .obj-face--top {
    transform: rotateX(90deg) translateZ(calc(var(--size) / 2)) rotate(180deg);
  }
  .obj-face--bottom {
    transform: rotateX(-90deg) translateZ(calc(var(--size) / 2));
  }
  .obj-face--right img,
  .obj-face--left img {
    filter: brightness(0.78);
  }
  .obj-face--top img,
  .obj-face--bottom img {
    filter: brightness(0.66);
  }
  /* ── THE CAPTION IS GONE ──────────────────────────────────────────────
     "DRAG TO SPIN · CLICK A FACE TO OPEN IT" used to sit under the cube.
     Sid: "let the cube not have text above it like drag to interact."

     He is right, and the argument for keeping it was never strong: the
     object already turns by itself as you scroll, the cursor is `grab` the
     moment you are over it and `grabbing` the moment you press, and every
     face is a link that lights up under the pointer. Three affordances,
     none of which need announcing. A label explaining how to use an object
     that is visibly moving is the thing that makes it read as a demo. */
  /* No JS, no motion preference, or a browser without preserve-3d:
     the faces collapse into a readable row of links instead. */
  .hs-object.is-flat .obj-stage {
    height: auto;
    perspective: none;
    cursor: default;
  }
  .hs-object.is-flat .obj-cube {
    position: static;
    width: auto;
    height: auto;
    margin: 0;
    transform: none;
    transform-style: flat;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  .hs-object.is-flat .obj-face {
    position: relative;
    inset: auto;
    aspect-ratio: 1;
    transform: none !important;
  }
  .hs-object.is-flat .obj-face img {
    filter: none;
  }

  /* ── Light theme ─────────────────────────────────────────────
     The cube keeps its lighting model — front bright, sides and
     top/bottom progressively shaded — but the floor glow and the
     face chrome move onto paper. */
  html[data-theme="light"] .hs-object::before {
    background: radial-gradient(circle, rgba(80, 132, 210, 0.14), rgba(150, 108, 220, 0.07) 42%, transparent 70%);
  }
  html[data-theme="light"] .obj-head {
    color: rgba(20, 22, 27, 0.6);
  }
  html[data-theme="light"] .obj-head .cine-rule {
    background: rgba(20, 22, 27, 0.24);
  }
  html[data-theme="light"] .obj-face {
    background: #e8e5de;
    border-color: rgba(20, 22, 27, 0.12);
    box-shadow: inset 0 0 60px rgba(24, 28, 38, 0.14);
  }
  html[data-theme="light"] .obj-face span {
    color: #14161b;
    background: linear-gradient(180deg, transparent, rgba(245, 243, 238, 0.9));
  }
  /* ── THE READOUT ──────────────────────────────────────────────────────── */
  .obj-readout {
    margin: clamp(28px, 5vh, 64px) auto 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    font-family: "DM Mono", ui-monospace, monospace;
  }
  .obj-readout__kind {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(232, 240, 255, 0.34);
  }
  .obj-readout__name {
    font-size: clamp(14px, 1.5vw, 19px);
    letter-spacing: 0.06em;
    color: rgba(236, 244, 255, 0.92);
    /* The name is swapped by script the instant a new face wins, so the fade
       has to live on the element rather than on the swap: without it the text
       hard-cuts mid-turn and reads as a glitch rather than as a reading. */
    animation: objReadIn 420ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes objReadIn {
    from {
      opacity: 0;
      transform: translateY(4px);
    }
  }
  html[data-theme="light"] .obj-readout__kind {
    color: rgba(20, 22, 27, 0.42);
  }
  html[data-theme="light"] .obj-readout__name {
    color: rgba(16, 18, 24, 0.9);
  }
  /* ── THE SIDE YOU ARE LOOKING AT ─────────────────────────────────────────
     Sid: "that side of the cube getting some effect."

     Only the facing side, and only while it faces. Its own label lifts out of
     the gradient it normally sits in and a cool edge picks out the border, so
     the face reads as lit rather than as merely nearer. Everything is on the
     face itself, so it turns away with it. */
  .obj-face.is-facing {
    box-shadow:
      inset 0 0 60px rgba(0, 0, 0, 0.3),
      0 0 0 1px rgba(150, 205, 255, 0.5),
      0 26px 70px -30px rgba(90, 170, 255, 0.5);
  }
  .obj-face.is-facing span {
    color: #fff;
    letter-spacing: 0.16em;
  }
  html[data-theme="light"] .obj-face.is-facing {
    box-shadow:
      inset 0 0 60px rgba(24, 28, 38, 0.08),
      0 0 0 1px rgba(36, 101, 174, 0.4),
      0 26px 70px -30px rgba(36, 101, 174, 0.35);
  }
  @media (prefers-reduced-motion: reduce) {
    .obj-readout__name {
      animation: none;
    }
  }

  html[data-theme="light"] .obj-face:focus-visible {
    outline-color: #14161b;
  }
</style>

<section class="hs-object" id="hs-object" aria-label="The work as an object">
  <!-- 01: the cube is the first chapter after the hero. It carried "03" from
       the layout it was built for, where the order was work → numbers → cube;
       the home rebuild moved it to the front and the number stayed behind, so
       the page counted 03 → 01 → 02 → 03 → 04 with 03 used twice. -->
  <!-- The chapter head is gone. Sid: "we dont need a section title for it."
       The figure above hands straight to this object as you scroll, and a
       mono label sitting between them was the one thing insisting they are
       two separate sections rather than one movement. -->
  <div class="obj-stage" id="obj-stage">
    <div class="obj-cube" id="obj-cube">
      <a class="obj-face obj-face--front" href="{{ site.baseurl }}/mool/">
        <!-- ── FACE SIZES ────────────────────────────────────────────────────────
       Each face carried its project's full master — 1500 to 2048px wide — on a
       surface that renders between 29 and 363px depending on where the cube has
       turned. Six masters, eager, to paint a spinning object the size of a
       postcard.

       Two rungs, and `sizes: 420px` deliberately generous: a face never draws
       wider than that, so on a 2x display the browser asks for ~840 and gets
       the 900 rung, which is still more pixels than the surface can show. No
       face ever renders from fewer pixels than it has room for. -->
        <img
          src="{{ site.baseurl }}/assets/img/work-previews/mool/cover-900.webp"
          srcset="{{ site.baseurl }}/assets/img/work-previews/mool/cover-480.webp 480w, {{ site.baseurl }}/assets/img/work-previews/mool/cover-900.webp 900w"
          sizes="420px"
          alt="Mool"
          loading="eager"
          decoding="async"
          fetchpriority="low"
        /><span>Mool &middot; Fintech</span>
      </a>
      <a class="obj-face obj-face--right" href="{{ site.baseurl }}/encoded/">
        <img
          src="{{ site.baseurl }}/1.met/0-900.webp"
          srcset="{{ site.baseurl }}/1.met/0-480.webp 480w, {{ site.baseurl }}/1.met/0-900.webp 900w"
          sizes="420px"
          alt="Encoded"
          loading="eager"
          decoding="async"
          fetchpriority="low"
        /><span>Encoded &middot; Spatial</span>
      </a>
      <a class="obj-face obj-face--back" href="{{ site.baseurl }}/m-health-fairview/">
        <img
          src="{{ site.baseurl }}/assets/img/fairview/cover-900.webp"
          srcset="{{ site.baseurl }}/assets/img/fairview/cover-480.webp 480w, {{ site.baseurl }}/assets/img/fairview/cover-900.webp 900w"
          sizes="420px"
          alt="M Health Fairview"
          loading="eager"
          decoding="async"
          fetchpriority="low"
        /><span>Fairview &middot; Health</span>
      </a>
      <a class="obj-face obj-face--left" href="{{ site.baseurl }}/marriott/">
        <img
          src="{{ site.baseurl }}/assets/img/marriott/cover-900.webp"
          srcset="{{ site.baseurl }}/assets/img/marriott/cover-480.webp 480w, {{ site.baseurl }}/assets/img/marriott/cover-900.webp 900w"
          sizes="420px"
          alt="Marriott"
          loading="eager"
          decoding="async"
          fetchpriority="low"
        /><span>Marriott &middot; Enterprise</span>
      </a>
      <a class="obj-face obj-face--top" href="{{ site.baseurl }}/naavo/">
        <img
          src="{{ site.baseurl }}/7.naavo/cover-900.webp"
          srcset="{{ site.baseurl }}/7.naavo/cover-480.webp 480w, {{ site.baseurl }}/7.naavo/cover-900.webp 900w"
          sizes="420px"
          alt="Naavo"
          loading="eager"
          decoding="async"
          fetchpriority="low"
        /><span>Naavo &middot; Brand</span>
      </a>
      <a class="obj-face obj-face--bottom" href="{{ site.baseurl }}/aananda/">
        <img
          src="{{ site.baseurl }}/9.aananda/cover-900.webp"
          srcset="{{ site.baseurl }}/9.aananda/cover-480.webp 480w, {{ site.baseurl }}/9.aananda/cover-900.webp 900w"
          sizes="420px"
          alt="Aananda"
          loading="eager"
          decoding="async"
          fetchpriority="low"
        /><span>Aananda &middot; Brand</span>
      </a>
    </div>
  </div>

  <!-- ── WHAT YOU ARE LOOKING AT ────────────────────────────────────────────
       Sid: "some scroll linked text to talk about ... what kinds of sid
       projects."

       Six covers turning past with a two-word label burned into each one told
       you the names and nothing else, and the label is on the face, so it is
       turned away or foreshortened exactly when you would want to read it.
       This sits still under the object and names the side currently pointed at
       you, so the object stays the thing you look at and the reading happens
       where reading is comfortable. It is driven by the same rotation the cube
       is, not by a timer, so it can never disagree with what is on screen. -->
  <p class="obj-readout" aria-hidden="true">
    <span class="obj-readout__kind">Currently facing</span>
    <span class="obj-readout__name">Mool &middot; Fintech</span>
  </p>
</section>

<script>
  (function () {
    try {
      var sec = document.getElementById("hs-object");
      var stage = document.getElementById("obj-stage");
      var cube = document.getElementById("obj-cube");
      if (!sec || !stage || !cube) return;

      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var supports3d = typeof CSS !== "undefined" && CSS.supports && CSS.supports("transform-style", "preserve-3d");
      if (reduce || !supports3d) {
        sec.classList.add("is-flat");
        return;
      }

      var rotY = 0; // driven by scroll, nudged by drag
      var rotX = -18;
      var velY = 0; // drag inertia
      var dragging = false;
      var moved = 0;
      var lastX = 0;
      var lastY = 0;
      var dragY = 0; // accumulated user offset, kept on top of scroll
      var dragXAxis = 0;
      var scrollY = 0;
      var scrollX = -16;
      var faces = sec.querySelectorAll(".obj-face");
      var readout = sec.querySelector(".obj-readout__name");

      var readScroll = function () {
        var r = sec.getBoundingClientRect();
        var vh = window.innerHeight || 1;
        // -1 (below the fold) .. 1 (scrolled past); 0 while centred.
        var p = (vh / 2 - (r.top + r.height / 2)) / (vh / 2 + r.height / 2);
        /* ── ALL SIX SIDES ────────────────────────────────────────────────
           Sid: "show all 6 sides."

           It could not. Scroll drove rotateY alone and rotateX sat at a fixed
           -18, and a cube spun about one axis only ever presents the four
           faces around that axis -- the top and bottom are mathematically
           unreachable. Naavo and Aananda have been on this object since it was
           built and no visitor has ever seen either of them.

           So the scroll drives both axes. Y turns 1.6 times across the
           section, which walks the four sides past twice over; X sweeps from
           -74 (looking down onto the lid) through the resting three-quarter
           view to +46 (looking up at the base), so the two faces the old
           mapping could not reach each get a clear moment. */
        /* ── AND THE TOUR HAS TO FINISH WHILE YOU CAN STILL SEE IT ─────────
           p reaches its ends when the SECTION has fully left the viewport,
           which is long after the CUBE has. Measured at 1440x900, walking the
           page in 50px steps and recording the facing face against the stage's
           on-screen box: the cube is visible from about 400 to 1700 and the
           six faces were winning at 400, 650, 900, 1200, 1550 and 2100. The
           last of those is 400px after the object is gone -- the base only
           ever came square to a camera that had nothing in front of it, and
           roughly a third of the turn was spent above the top of the screen.

           So the same fault the previous pass fixed, one layer out. That pass
           asked "which face wins" and got six of six; it did not ask whether
           the cube was on screen when it won, and the answer for one of the
           two faces it existed to reveal was no.

           The sweep is compressed onto the window where the object actually
           reads, and biased slightly early because the cube enters slowly and
           leaves fast. The ends now land near 520 and 1380, where it is about
           half in frame at both -- and half in frame the right way round, since
           entering from below shows its lid and leaving upward shows its base,
           which are precisely the two faces the ends of the sweep present. */
        var q = Math.max(-1, Math.min(1, (p + 0.08) * 2.4));
        scrollY = q * 300;
        scrollX = -16 + q * 58;
      };

      /* Which face is pointed most nearly at the camera, from the rotation
         alone -- no per-frame getBoundingClientRect, no reading matrices back.
         CSS applies `rotateX(a) rotateY(b)` as Rx*Ry, so a face's local normal
         goes through the same product. The winner is whichever ends up with
         the largest +Z. */
      var FACE_N = [
        ["front", 0, 0, 1],
        ["back", 0, 0, -1],
        ["right", 1, 0, 0],
        ["left", -1, 0, 0],
        /* rotateX(90) carries +Z to -Y. CSS +Y points DOWN the screen, so -Y
           is UP and that face is the TOP -- which is also what the stylesheet
           builds it as, `.obj-face--top { rotateX(90deg) translateZ(...) }`.
           These two were named the other way round, and since they are the
           only pair the readout can disagree with silently, it did: at the
           moment Naavo was square to the camera the line underneath read
           "Aananda - Brand", and the cool edge and the lifted label went on
           the face pointing directly away from the viewer. Caught by reading
           the readout against a screenshot rather than against this table. */
        ["top", 0, -1, 0],
        ["bottom", 0, 1, 0],
      ];
      var facing = "";
      var frontOf = function (xDeg, yDeg) {
        var a = (xDeg * Math.PI) / 180,
          b = (yDeg * Math.PI) / 180;
        var ca = Math.cos(a),
          sa = Math.sin(a),
          cb = Math.cos(b),
          sb = Math.sin(b);
        var best = null,
          bestZ = -2;
        for (var i = 0; i < FACE_N.length; i++) {
          var n = FACE_N[i];
          /* Ry then Rx, matching the order CSS composes them. */
          var x1 = n[1] * cb + n[3] * sb;
          var y1 = n[2];
          var z1 = -n[1] * sb + n[3] * cb;
          var z2 = y1 * sa + z1 * ca;
          if (z2 > bestZ) {
            bestZ = z2;
            best = n[0];
          }
        }
        return best;
      };

      var render = function () {
        var y = scrollY + dragY;
        var x = Math.max(-80, Math.min(80, scrollX + dragXAxis));
        cube.style.transform = "rotateX(" + x.toFixed(2) + "deg) rotateY(" + y.toFixed(2) + "deg)";
        var f = frontOf(x, y);
        if (f !== facing) {
          facing = f;
          sec.setAttribute("data-facing", f);
          for (var i = 0; i < faces.length; i++) {
            faces[i].classList.toggle("is-facing", faces[i].className.indexOf("obj-face--" + f) > -1);
          }
          if (readout) {
            var live = sec.querySelector(".obj-face--" + f + " span");
            readout.textContent = live ? live.textContent : "";
          }
        }
      };

      var raf = null;
      var loop = function () {
        raf = null;
        if (!dragging && Math.abs(velY) > 0.02) {
          dragY += velY;
          velY *= 0.94; // friction
          request();
        }
        render();
      };
      var request = function () {
        if (raf === null) raf = requestAnimationFrame(loop);
      };

      var onScroll = function () {
        readScroll();
        request();
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll, { passive: true });

      /* Firefox has no -webkit-user-drag, so the CSS above does not reach it.
         Refusing the dragstart outright covers every engine. */
      stage.addEventListener("dragstart", function (e) {
        e.preventDefault();
      });

      stage.addEventListener("pointerdown", function (e) {
        dragging = true;
        moved = 0;
        velY = 0;
        lastX = e.clientX;
        lastY = e.clientY;
        stage.classList.add("is-dragging");
        try {
          stage.setPointerCapture(e.pointerId);
        } catch (err) {}
      });
      stage.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        moved += Math.abs(dx) + Math.abs(dy);
        dragY += dx * 0.42;
        dragXAxis -= dy * 0.26;
        velY = dx * 0.42;
        request();
      });
      var endDrag = function (e) {
        if (!dragging) return;
        dragging = false;
        stage.classList.remove("is-dragging");
        try {
          stage.releasePointerCapture(e.pointerId);
        } catch (err) {}
        request();
      };
      stage.addEventListener("pointerup", endDrag);
      stage.addEventListener("pointercancel", endDrag);
      // A drag that ends over a face must not count as a click on it.
      stage.addEventListener(
        "click",
        function (e) {
          if (moved > 8) {
            e.preventDefault();
            e.stopPropagation();
          }
        },
        true
      );

      onScroll();
    } catch (e) {}
  })();
</script>
