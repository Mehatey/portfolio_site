<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js" crossorigin="anonymous"></script>

<style>
  .site-footer {
    max-width: var(--content-max, 1440px);
    margin: 0 auto;
    padding: 80px max(32px, 5vw) 56px;
    position: relative;
    z-index: 5;
  }
  .site-footer::before {
    content: "";
    position: absolute;
    top: 0;
    left: max(28px, 5vw);
    right: max(28px, 5vw);
    height: 1px;
    background: rgba(255, 255, 255, 0.07);
  }

  .site-footer-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }

  /* Left — name + year range */
  .site-footer-name {
    position: relative;
    display: inline-block;
    font-family: var(--font-title, "Inter", sans-serif);
    font-size: 20px;
    font-weight: 300;
    letter-spacing: -0.01em;
    color: rgba(255, 255, 255, 0.55);
    cursor: default;
    transition: color 0.3s ease;
    white-space: nowrap;
  }
  .site-footer-name:hover { color: rgba(255, 255, 255, 0.88); }

  /* Particles spawned on name hover */
  .site-footer-particle {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    border-radius: 1px;
    image-rendering: pixelated;
    will-change: transform, opacity;
    z-index: 2;
  }

  /* Right — time + CO₂ */
  .site-footer-meta {
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: "DM Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
    flex-shrink: 0;
  }
  .site-footer-meta-item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .site-footer-time-dot {
    width: 5px; height: 5px;
    background: rgba(180, 220, 255, 0.55);
    box-shadow: 0 0 5px rgba(180, 220, 255, 0.35);
    image-rendering: pixelated;
    animation: footerTimeBlink 2.6s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes footerTimeBlink {
    0%, 100% { opacity: 0.35; transform: scale(1); }
    50%       { opacity: 1;    transform: scale(1.3); }
  }
  @media (prefers-reduced-motion: reduce) {
    .site-footer-time-dot { animation: none; }
  }

  /* ── CUBE GUY ── cursor-reactive 3D model sitting in the footer */
  .site-footer-cube {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
    pointer-events: auto;
    z-index: 10;
    /* No opacity transition — we want it always present */
  }
  .site-footer-cube model-viewer {
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
    overflow: hidden;
  }
  /* Glow under the cube */
  .site-footer-cube::after {
    content: "";
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 24px;
    background: radial-gradient(ellipse at center, rgba(140, 200, 255, 0.18) 0%, transparent 70%);
    pointer-events: none;
    filter: blur(6px);
  }
  @media (max-width: 700px) {
    .site-footer-cube { width: 140px; height: 140px; }
  }

  /* Light mode */
  html[data-theme="light"] .site-footer::before { background: rgba(0,0,0,0.07); }
  html[data-theme="light"] .site-footer-name    { color: rgba(7,9,15,0.45); }
  html[data-theme="light"] .site-footer-name:hover { color: #07090f; }
  html[data-theme="light"] .site-footer-meta    { color: rgba(7,9,15,0.42); }

  @media (max-width: 600px) {
    .site-footer { padding: 36px 22px 28px; }
    .site-footer-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
</style>

<footer class="site-footer">
  <!-- Cube guy — centered, sits above the footer bar -->
  <div class="site-footer-cube" id="footer-cube-stage" aria-hidden="true">
    <model-viewer
      id="footer-cube-mv"
      src="{{ site.baseurl }}/assets/models/cube_guy.glb"
      camera-orbit="0deg 78deg 105%"
      auto-rotate
      rotation-per-second="14deg"
      interaction-prompt="none"
      disable-zoom
      disable-pan
      disable-tap
      environment-image="neutral"
      exposure="1.1"
      shadow-intensity="0"
    ></model-viewer>
  </div>

  <div class="site-footer-inner">
    <span class="site-footer-name" id="site-footer-name" aria-label="Siddharth Mehta">
      Siddharth&nbsp;Mehta
    </span>
    <div class="site-footer-meta" aria-label="Site metadata">
      <span class="site-footer-meta-item">
        <span class="site-footer-time-dot" aria-hidden="true"></span>
        <span id="site-footer-time" aria-label="Current time in New York">--:--</span>
      </span>
      <span class="site-footer-meta-item" id="site-footer-co2" aria-label="Estimated carbon per visit">~--g CO₂</span>
    </div>
  </div>
</footer>

<script>
  // ── CURSOR-REACTIVE CUBE GUY ──
  // Tracks cursor across the whole page and tilts the camera orbit to face it.
  // Smoothly interpolates so the model follows with inertia, not instant snap.
  (function () {
    var mv = document.getElementById("footer-cube-mv");
    if (!mv) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    // Target + current orbit values
    var targetYaw = 0, targetPitch = 78;
    var currentYaw = 0, currentPitch = 78;
    var baseRotPerSec = 14;
    var rafId = 0;
    var isHovering = false;

    function lerp(a, b, t) { return a + (b - a) * t; }

    // Convert page cursor position to orbit angles.
    // Yaw swings ±35° horizontally; pitch swings 65°–90° vertically.
    document.addEventListener("mousemove", function (e) {
      var nx = e.clientX / window.innerWidth;  // 0..1
      var ny = e.clientY / window.innerHeight; // 0..1
      targetYaw   = (nx - 0.5) * 70;           // -35..+35
      targetPitch = 78 + (ny - 0.5) * 24;      // 66..90
    }, { passive: true });

    // Speed up on hover over the stage
    var stage = document.getElementById("footer-cube-stage");
    if (stage) {
      stage.addEventListener("mouseenter", function () {
        isHovering = true;
        mv.setAttribute("rotation-per-second", "28deg");
      });
      stage.addEventListener("mouseleave", function () {
        isHovering = false;
        mv.setAttribute("rotation-per-second", baseRotPerSec + "deg");
      });
    }

    function tick() {
      var speed = isHovering ? 0.12 : 0.06;
      currentYaw   = lerp(currentYaw,   targetYaw,   speed);
      currentPitch = lerp(currentPitch, targetPitch, speed);
      mv.setAttribute("camera-orbit", currentYaw.toFixed(1) + "deg " + currentPitch.toFixed(1) + "deg 105%");
      rafId = requestAnimationFrame(tick);
    }

    // Start once the model is visible
    mv.addEventListener("load", function () { tick(); }, { once: true });
    // Fallback: start after 2s regardless
    setTimeout(function () { if (!rafId) tick(); }, 2000);
  })();

  // ── NAME PARTICLE BLOOM ──
  (function () {
    var name = document.getElementById("site-footer-name");
    if (!name) return;
    var mq = window.matchMedia;
    if (mq && mq("(hover: none), (pointer: coarse)").matches) return;
    if (mq && mq("(prefers-reduced-motion: reduce)").matches) return;
    var palette = ["rgba(160,220,255,", "rgba(180,230,220,", "rgba(255,200,160,"];
    var live = 0, MAX = 20, lastSpawn = 0;
    function spawn(x, y) {
      if (live >= MAX || document.visibilityState !== "visible") return;
      var p = document.createElement("span");
      p.className = "site-footer-particle";
      var sz = 2 + Math.random() * 2.5;
      var color = palette[Math.floor(Math.random() * palette.length)];
      var alpha = 0.55 + Math.random() * 0.4;
      p.style.cssText = "width:" + sz + "px;height:" + sz + "px;transform:translate(" + x + "px," + y + "px);background:" + color + alpha + ");box-shadow:0 0 5px " + color + "0.4)";
      name.appendChild(p);
      live++;
      var driftX = (Math.random() - 0.5) * 28, driftY = -(16 + Math.random() * 32);
      var dur = 680 + Math.random() * 520, start = 0;
      function frame(t) {
        if (!start) start = t;
        var k = (t - start) / dur;
        if (k >= 1) { p.remove(); live--; return; }
        var ease = 1 - Math.pow(1 - k, 2);
        p.style.transform = "translate(" + (x + driftX * ease) + "px," + (y + driftY * ease) + "px)";
        p.style.opacity = (1 - k) * alpha;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
    name.addEventListener("mousemove", function (e) {
      if (e.timeStamp - lastSpawn < 44) return;
      lastSpawn = e.timeStamp;
      var r = name.getBoundingClientRect();
      spawn(e.clientX - r.left, e.clientY - r.top);
    }, { passive: true });
  })();

  // ── LIVE NYC TIME ──
  (function () {
    var el = document.getElementById("site-footer-time");
    if (!el) return;
    function tick() {
      try {
        el.textContent = new Intl.DateTimeFormat("en-US", {
          hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "America/New_York"
        }).format(new Date()) + " NYC";
      } catch (_) { el.style.display = "none"; }
    }
    tick();
    setInterval(tick, 30000);
  })();

  // ── CO₂ ESTIMATE ──
  (function () {
    var el = document.getElementById("site-footer-co2");
    if (!el) return;
    function compute() {
      try {
        var total = 0;
        performance.getEntriesByType("resource").forEach(function (r) { total += r.transferSize || r.encodedBodySize || 0; });
        var nav = performance.getEntriesByType("navigation")[0];
        if (nav) total += nav.transferSize || nav.encodedBodySize || 0;
        if (!total) { el.style.display = "none"; return; }
        el.textContent = "~" + ((total * 0.5) / (1024 * 1024)).toFixed(2) + "g CO₂";
      } catch (_) { el.style.display = "none"; }
    }
    if (document.readyState === "complete") setTimeout(compute, 800);
    else window.addEventListener("load", function () { setTimeout(compute, 800); });
  })();
</script>
