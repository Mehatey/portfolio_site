<style>
  /* Global footer — calm, centered. Name is the focal point with a soft
     particle bloom on hover; a quiet last-updated line and a single
     understated row of links. No oversized CTA, no magnetic motion. */
  .site-footer {
    max-width: 1320px;
    margin: 0 auto;
    padding: 88px max(28px, 5vw) 64px;
    position: relative;
    z-index: 5;
  }
  .site-footer::before {
    content: "";
    position: absolute;
    top: 0;
    left: max(28px, 5vw);
    right: max(28px, 5vw);
    height: 1px;
    background: rgba(255, 255, 255, 0.08);
  }

  .site-footer-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 16px;
  }

  /* Focal name — sized to sit calmly below project "Next" titles, not compete */
  .site-footer-name {
    position: relative;
    display: inline-block;
    font-family: var(--font-title, "Inter", sans-serif);
    font-size: clamp(22px, 2.6vw, 32px);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: rgba(255, 255, 255, 0.92);
    cursor: default;
    transition: color 0.3s ease;
  }
  .site-footer-name:hover {
    color: #fff;
  }
  .site-footer-year {
    font-family: "DM Mono", monospace;
    font-size: 0.42em;
    font-weight: 400;
    letter-spacing: 0.1em;
    vertical-align: 0.28em;
    color: rgba(255, 255, 255, 0.45);
    margin-left: 12px;
  }

  /* Particles spawned on name hover */
  .site-footer-particle {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    border-radius: 1px;
    image-rendering: pixelated;
    will-change: transform, opacity;
    z-index: 2;
  }

  .site-footer-updated {
    margin: 0;
    font-family: "DM Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
  }

  /* Quiet single-line links */
  .site-footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 22px;
    margin-top: 4px;
  }
  .site-footer-links a {
    font-family: "DM Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
    text-decoration: none;
    transition: color 0.25s ease;
  }
  .site-footer-links a:hover {
    color: rgba(255, 255, 255, 0.92);
  }

  /* Quiet meta line — live NYC time + estimated carbon per visit */
  .site-footer-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-top: 6px;
    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.5);
  }
  .site-footer-meta-item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .site-footer-time-dot {
    width: 6px;
    height: 6px;
    background: rgba(180, 220, 255, 0.6);
    box-shadow: 0 0 6px rgba(180, 220, 255, 0.4);
    image-rendering: pixelated;
    animation: footerTimeBlink 2.6s ease-in-out infinite;
  }
  @keyframes footerTimeBlink {
    0%,
    100% {
      opacity: 0.4;
      transform: scale(1);
    }
    50% {
      opacity: 1;
      transform: scale(1.25);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .site-footer-time-dot {
      animation: none;
    }
  }

  /* Light mode */
  html[data-theme="light"] .site-footer::before {
    background: rgba(0, 0, 0, 0.1);
  }
  html[data-theme="light"] .site-footer-name {
    color: #07090f;
  }
  html[data-theme="light"] .site-footer-year {
    color: rgba(7, 9, 15, 0.5);
  }
  html[data-theme="light"] .site-footer-updated {
    color: rgba(7, 9, 15, 0.5);
  }
  html[data-theme="light"] .site-footer-links a {
    color: rgba(7, 9, 15, 0.6);
  }
  html[data-theme="light"] .site-footer-links a:hover {
    color: #07090f;
  }
  html[data-theme="light"] .site-footer-meta {
    color: rgba(7, 9, 15, 0.6);
  }

  @media (max-width: 700px) {
    .site-footer {
      padding: 60px 22px 40px;
    }
    .site-footer-inner {
      gap: 14px;
    }
  }
</style>

<footer class="site-footer">
  <div class="site-footer-inner">
    <span class="site-footer-name" id="site-footer-name" aria-label="Siddharth Mehta, 2026">
      Siddharth&nbsp;Mehta <span class="site-footer-year">2026</span>
    </span>
    <p class="site-footer-updated">Last updated {{ site.time | date: "%B %d, %Y" }}</p>
    <nav class="site-footer-links" aria-label="Links">
      <a href="mailto:sidmehtadesign@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/siddharth-mehta-35560916b/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.instagram.com/cubeofcreation/" target="_blank" rel="noopener">Instagram</a>
      <a href="{{ site.baseurl }}/now/">Now</a>
    </nav>
    <div class="site-footer-meta">
      <span class="site-footer-meta-item">
        <span class="site-footer-time-dot" aria-hidden="true"></span>
        <span id="site-footer-time" aria-label="Current time in New York">—:—</span>
      </span>
      <span class="site-footer-meta-item" id="site-footer-co2" aria-label="Estimated carbon per visit">~—g CO₂</span>
    </div>
  </div>
</footer>

<script>
  // Soft particle bloom — pixel motes drift up from the name on hover, then fade.
  // Desktop only; respects reduced-motion. No layout impact (absolutely positioned).
  (function () {
    var name = document.getElementById("site-footer-name");
    if (!name) return;
    var mq = window.matchMedia;
    if (mq && mq("(hover: none), (pointer: coarse)").matches) return;
    if (mq && mq("(prefers-reduced-motion: reduce)").matches) return;

    var palette = ["rgba(160,220,255,", "rgba(180,230,220,", "rgba(255,200,160,"];
    var live = 0;
    var MAX = 26;
    var lastSpawn = 0;

    function spawn(x, y) {
      if (live >= MAX || document.visibilityState !== "visible") return;
      var p = document.createElement("span");
      p.className = "site-footer-particle";
      var sz = 2 + Math.random() * 3;
      var color = palette[Math.floor(Math.random() * palette.length)];
      var alpha = 0.65 + Math.random() * 0.35;
      p.style.width = sz + "px";
      p.style.height = sz + "px";
      p.style.transform = "translate(" + x + "px," + y + "px)";
      p.style.background = color + alpha + ")";
      p.style.boxShadow = "0 0 6px " + color + "0.5)";
      name.appendChild(p);
      live++;

      var driftX = (Math.random() - 0.5) * 34;
      var driftY = -(22 + Math.random() * 42);
      var dur = 720 + Math.random() * 620;
      var start = 0;
      function frame(t) {
        if (!start) start = t;
        var k = (t - start) / dur;
        if (k >= 1) {
          p.remove();
          live--;
          return;
        }
        var ease = 1 - Math.pow(1 - k, 2);
        p.style.transform = "translate(" + (x + driftX * ease) + "px," + (y + driftY * ease) + "px)";
        p.style.opacity = (1 - k) * alpha;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    name.addEventListener(
      "mousemove",
      function (e) {
        if (e.timeStamp - lastSpawn < 42) return;
        lastSpawn = e.timeStamp;
        var r = name.getBoundingClientRect();
        spawn(e.clientX - r.left, e.clientY - r.top);
      },
      { passive: true }
    );
  })();

  // Live NYC time
  (function () {
    var el = document.getElementById("site-footer-time");
    if (!el) return;
    function tick() {
      try {
        var fmt = new Intl.DateTimeFormat("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: "America/New_York",
        }).format(new Date());
        el.textContent = fmt + " NYC";
      } catch (_) {
        el.style.display = "none";
      }
    }
    tick();
    setInterval(tick, 30 * 1000);
  })();

  // Estimated carbon per visit, from this page's transferred bytes
  (function () {
    var el = document.getElementById("site-footer-co2");
    if (!el) return;
    function compute() {
      try {
        var total = 0;
        performance.getEntriesByType("resource").forEach(function (r) {
          total += r.transferSize || r.encodedBodySize || 0;
        });
        var nav = performance.getEntriesByType("navigation")[0];
        if (nav) total += nav.transferSize || nav.encodedBodySize || 0;
        if (total === 0) {
          el.style.display = "none";
          return;
        }
        var co2 = ((total * 0.5) / (1024 * 1024)).toFixed(2);
        el.textContent = "~" + co2 + "g CO₂";
        el.title = "Estimated carbon footprint per page visit";
      } catch (_) {
        el.style.display = "none";
      }
    }
    if (document.readyState === "complete") setTimeout(compute, 800);
    else
      window.addEventListener("load", function () {
        setTimeout(compute, 800);
      });
  })();
</script>
