<style>
  /* A footer should read as a quiet signature, not a second navigation system. */
  .site-footer {
    max-width: none;
    margin: 0 auto;
    /* Reserve visual space for the persistent cube control at bottom-right. */
    padding: 72px max(var(--gutter), calc(88px + env(safe-area-inset-right, 0px))) 34px var(--gutter);
    position: relative;
    z-index: 5;
  }
  .site-footer-inner {
    display: grid;
    grid-template-columns: minmax(210px, 0.75fr) minmax(260px, 1.25fr) auto;
    align-items: center;
    gap: clamp(18px, 3vw, 44px);
    padding: 18px 22px;
    border: 1px solid rgba(205, 229, 255, 0.14);
    border-radius: 26px;
    background:
      radial-gradient(260px 86px at 10% 0%, rgba(255, 255, 255, 0.1), transparent 70%),
      linear-gradient(112deg, rgba(11, 16, 25, 0.56), rgba(8, 11, 18, 0.34));
    backdrop-filter: blur(20px) saturate(1.25);
    -webkit-backdrop-filter: blur(20px) saturate(1.25);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.15),
      0 18px 60px rgba(0, 0, 0, 0.18);
  }
  .site-footer-identity {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
  }
  .site-footer-buddha {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    opacity: 0.82;
    transition:
      opacity 0.24s ease,
      transform 0.32s var(--ease-out);
  }
  .site-footer-buddha:hover {
    opacity: 1;
    transform: translateY(-2px);
  }
  .site-footer-buddha model-viewer {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
  }
  .site-footer-mark {
    margin: 0;
    font-family: var(--font-head, sans-serif);
    font-size: 14px;
    letter-spacing: -0.01em;
    line-height: 1.35;
    text-transform: none;
    color: rgba(255, 255, 255, 0.82);
  }
  .site-footer-mark span {
    color: rgba(255, 255, 255, 0.3);
  }
  .site-footer-note {
    margin: 0;
    max-width: 44ch;
    font-family: var(--font-head, sans-serif);
    font-size: clamp(14px, 1.05vw, 16px);
    line-height: 1.45;
    color: rgba(226, 236, 247, 0.64);
  }
  .site-footer-meta {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 14px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    line-height: 1.5;
    text-transform: none;
    color: var(--muted);
    white-space: nowrap;
  }
  .site-footer-meta a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    transition:
      color 0.2s ease,
      border-color 0.2s ease;
  }
  .site-footer-meta a:hover {
    color: rgba(255, 255, 255, 0.9);
    border-color: rgba(255, 255, 255, 0.65);
  }
  html[data-theme="light"] .site-footer-inner {
    border-color: rgba(31, 65, 108, 0.14);
    background:
      radial-gradient(260px 86px at 10% 0%, rgba(255, 255, 255, 0.86), transparent 72%),
      linear-gradient(112deg, rgba(255, 255, 252, 0.68), rgba(234, 240, 248, 0.46));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      0 18px 54px rgba(31, 56, 90, 0.1);
  }
  html[data-theme="light"] .site-footer-mark {
    color: rgba(7, 9, 15, 0.78);
  }
  html[data-theme="light"] .site-footer-note {
    color: rgba(7, 9, 15, 0.58);
  }
  html[data-theme="light"] .site-footer-mark span,
  html[data-theme="light"] .site-footer-meta {
    color: var(--muted);
  }
  html[data-theme="light"] .site-footer-meta a {
    border-color: rgba(7, 9, 15, 0.22);
  }
  html[data-theme="light"] .site-footer-meta a:hover {
    color: rgba(7, 9, 15, 0.9);
    border-color: rgba(7, 9, 15, 0.6);
  }
  html[data-theme="light"] .site-footer-buddha {
    opacity: 0.82;
  }
  #site-footer-time {
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 600px) {
    .site-footer {
      margin-top: 0;
      padding: 44px var(--gutter) 28px;
    }
    .site-footer-inner {
      grid-template-columns: 1fr;
      align-items: start;
      gap: 14px;
      border-radius: 22px;
    }
    .site-footer-meta {
      justify-content: flex-start;
      flex-wrap: wrap;
      white-space: normal;
    }
  }
</style>

<footer class="site-footer" aria-label="Site footer">
  <div class="site-footer-inner">
    <div class="site-footer-identity">
      <div class="site-footer-buddha" aria-hidden="true">
        <model-viewer
          src="{{ site.baseurl }}/assets/models/buddha.glb"
          auto-rotate
          rotation-per-second="14deg"
          camera-orbit="0deg 80deg 105%"
          interaction-prompt="none"
          disable-zoom
          disable-pan
          disable-tap
          environment-image="neutral"
          exposure="1.08"
          shadow-intensity="0"
        ></model-viewer>
      </div>
      <p class="site-footer-mark">Siddharth Mehta <span>· New York</span></p>
    </div>
    <p class="site-footer-note">Product design, spatial systems, and coded prototypes, held together with a little cube-shaped weirdness.</p>
    <div class="site-footer-meta">
      <span>© 2026</span>
      <span id="site-footer-time">--:-- NYC</span>
      <a href="mailto:sidmehtadesign@gmail.com">Email</a>
    </div>
  </div>
</footer>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js" crossorigin="anonymous"></script>

<script>
  (function () {
    var el = document.getElementById("site-footer-time");
    if (!el) return;
    function tick() {
      try {
        el.textContent =
          new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
            timeZone: "America/New_York",
          }).format(new Date()) + " NYC";
      } catch (_) {
        el.style.display = "none";
      }
    }
    tick();
    setInterval(tick, 30000);
  })();
</script>
