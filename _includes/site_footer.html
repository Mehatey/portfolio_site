<style>
  /* A footer should read as a quiet signature, not a second navigation system. */
  .site-footer {
    max-width: none;
    margin: 0 auto;
    /* Reserve visual space for the persistent cube control at bottom-right. */
    padding: 72px max(var(--gutter), calc(88px + env(safe-area-inset-right, 0px))) 34px var(--gutter);
    position: relative;
    z-index: 5;
  }
  .site-footer-inner {
    display: grid;
    grid-template-columns: minmax(210px, 0.9fr) minmax(220px, 1fr) auto;
    align-items: center;
    gap: clamp(18px, 3vw, 44px);
    padding: 16px 0 18px;
    border: 1px solid rgba(205, 229, 255, 0.08);
    border-right: 0;
    border-left: 0;
    border-radius: 0;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    box-shadow: none;
  }
  .site-footer-identity {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
  }
  .site-footer-buddha {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    opacity: 0.82;
    transition:
      opacity 0.24s ease,
      transform 0.32s var(--ease-out);
  }
  .site-footer-buddha:hover {
    opacity: 1;
    transform: translateY(-2px);
  }
  .site-footer-buddha model-viewer {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
  }
  .site-footer-mark {
    margin: 0;
    font-family: var(--font-head, sans-serif);
    font-size: 14px;
    letter-spacing: -0.01em;
    line-height: 1.35;
    text-transform: none;
    color: rgba(255, 255, 255, 0.82);
  }
  .site-footer-mark span {
    color: rgba(255, 255, 255, 0.3);
  }
  .site-footer-note {
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    align-items: baseline;
    max-width: none;
    font-family: var(--font-head, sans-serif);
    font-size: clamp(14px, 1.05vw, 16px);
    line-height: 1.45;
    color: rgba(226, 236, 247, 0.54);
  }
  .site-footer-note a {
    color: rgba(238, 246, 255, 0.9);
    text-decoration: none;
    border-bottom: 1px solid rgba(174, 209, 255, 0.42);
    transition:
      color 200ms ease,
      border-color 200ms ease,
      transform 200ms var(--ease-out);
  }
  .site-footer-note span {
    color: rgba(226, 236, 247, 0.42);
  }
  .site-footer-note a:hover,
  .site-footer-note a:focus-visible {
    color: #fff;
    border-color: rgba(221, 238, 255, 0.82);
    transform: translateY(-1px);
  }
  .site-footer-meta {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 14px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    line-height: 1.5;
    text-transform: none;
    color: var(--muted);
    white-space: nowrap;
  }
  .site-footer-meta a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    transition:
      color 0.2s ease,
      border-color 0.2s ease;
  }
  .site-footer-meta a:hover {
    color: rgba(255, 255, 255, 0.9);
    border-color: rgba(255, 255, 255, 0.65);
  }
  html[data-theme="light"] .site-footer-inner {
    border-color: rgba(31, 65, 108, 0.1);
    background: transparent;
    box-shadow: none;
  }
  html[data-theme="light"] .site-footer-mark {
    color: rgba(7, 9, 15, 0.78);
  }
  html[data-theme="light"] .site-footer-note {
    color: rgba(7, 9, 15, 0.58);
  }
  html[data-theme="light"] .site-footer-note span {
    color: rgba(7, 9, 15, 0.46);
  }
  html[data-theme="light"] .site-footer-note a {
    color: rgba(8, 20, 38, 0.88);
    border-color: rgba(34, 80, 142, 0.32);
  }
  html[data-theme="light"] .site-footer-mark span,
  html[data-theme="light"] .site-footer-meta {
    color: var(--muted);
  }
  html[data-theme="light"] .site-footer-meta a {
    border-color: rgba(7, 9, 15, 0.22);
  }
  html[data-theme="light"] .site-footer-meta a:hover {
    color: rgba(7, 9, 15, 0.9);
    border-color: rgba(7, 9, 15, 0.6);
  }
  html[data-theme="light"] .site-footer-buddha {
    opacity: 0.82;
  }
  #site-footer-time {
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 600px) {
    .site-footer {
      margin-top: 0;
      padding: 44px var(--gutter) 28px;
    }
    .site-footer-inner {
      grid-template-columns: 1fr;
      align-items: start;
      gap: 14px;
    }
    .site-footer-meta {
      justify-content: flex-start;
      flex-wrap: wrap;
      white-space: normal;
    }
  }
</style>

<footer class="site-footer" aria-label="Site footer">
  <div class="site-footer-inner">
    <div class="site-footer-identity">
      <div class="site-footer-buddha" aria-hidden="true">
        <model-viewer
          src="{{ site.baseurl }}/assets/models/buddha.glb"
          auto-rotate
          rotation-per-second="14deg"
          camera-orbit="0deg 80deg 105%"
          interaction-prompt="none"
          disable-zoom
          disable-pan
          disable-tap
          environment-image="neutral"
          exposure="1.08"
          shadow-intensity="0"
        ></model-viewer>
      </div>
      <p class="site-footer-mark">Siddharth Mehta <span>· New York</span></p>
    </div>
    <p class="site-footer-note">
      <a href="{{ site.baseurl }}/contact/">Start a conversation</a>
      <a href="{{ site.baseurl }}/assets/pdf/Siddharth_Mehta_Resume.pdf" target="_blank" rel="noopener noreferrer">Resume</a>
      <a href="{{ site.baseurl }}/works/">Selected work</a>
    </p>
    <div class="site-footer-meta">
      <span>© 2026</span>
      <span id="site-footer-time">--:-- NYC</span>
      <a href="mailto:sidmehtadesign@gmail.com">Email</a>
    </div>
  </div>
</footer>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js" crossorigin="anonymous"></script>

<script>
  (function () {
    var el = document.getElementById("site-footer-time");
    if (!el) return;
    function tick() {
      try {
        el.textContent =
          new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
            timeZone: "America/New_York",
          }).format(new Date()) + " NYC";
      } catch (_) {
        el.style.display = "none";
      }
    }
    tick();
    setInterval(tick, 30000);
  })();
</script>
