<style>
  .site-footer {
    position: relative;
    z-index: 5;
    padding: clamp(72px, 9vw, 132px) var(--gutter, clamp(20px, 4vw, 64px)) 28px;
  }

  .site-footer-inner {
    display: grid;
    grid-template-columns: minmax(230px, 1fr) auto;
    align-items: end;
    gap: 32px;
    padding-top: 24px;
    border-top: 1px solid color-mix(in srgb, currentColor 16%, transparent);
  }

  .site-footer-copy,
  .site-footer-meta {
    display: grid;
    gap: 9px;
  }

  .site-footer-copy strong {
    font: 500 16px/1.25 var(--font-head, "Figtree", sans-serif);
    letter-spacing: -0.01em;
  }

  .site-footer-copy > span,
  .site-footer-meta {
    color: var(--muted, rgba(230, 236, 244, 0.58));
    font: 400 10px/1.5 var(--font-mono, "DM Mono", monospace);
    letter-spacing: 0.05em;
  }

  .site-footer-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    margin-top: 2px;
  }

  .site-footer a {
    color: inherit;
    text-decoration: none;
  }

  .site-footer-links a {
    position: relative;
    min-height: 28px;
    color: currentColor;
    font-size: 12px;
  }

  .site-footer-links a::after {
    content: "";
    position: absolute;
    right: 100%;
    bottom: 5px;
    left: 0;
    height: 1px;
    background: currentColor;
    transition: right 260ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .site-footer-links a:hover::after,
  .site-footer-links a:focus-visible::after {
    right: 0;
  }

  .site-footer-meta {
    justify-items: end;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .site-footer-meta-row:first-child::before {
    content: "";
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-right: 8px;
    border-radius: 50%;
    background: #78dd89;
    box-shadow: 0 0 8px rgba(120, 221, 137, 0.55);
  }

  html[data-theme="light"] .site-footer-copy > span,
  html[data-theme="light"] .site-footer-meta {
    color: rgba(15, 25, 38, 0.64);
  }

  @media (max-width: 680px) {
    .site-footer {
      padding-bottom: 22px;
    }
    .site-footer-inner {
      grid-template-columns: 1fr;
    }
    .site-footer-meta {
      justify-items: start;
      text-align: left;
    }
  }
</style>

<footer class="site-footer" aria-label="Site footer">
  <div class="site-footer-inner">
    <div class="site-footer-copy">
      <strong>Siddharth Mehta</strong>
      <span>Product designer and creative technologist in New York.</span>
      <nav class="site-footer-links" aria-label="Footer links">
        <a href="{{ site.baseurl }}/works/">Selected work</a>
        <a href="{{ site.baseurl }}/contact/">Contact</a>
        <a href="{{ site.baseurl }}/assets/resume.pdf" target="_blank" rel="noopener noreferrer">Resume</a>
        <a href="https://www.linkedin.com/in/siddharth-mehta-design/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </div>

    <div class="site-footer-meta">
      <span class="site-footer-meta-row">Open to product design roles</span>
      <span class="site-footer-meta-row">Updated Jul 2026</span>
      <span class="site-footer-meta-row" id="site-footer-time">--:-- NYC</span>
      <span class="site-footer-meta-row" id="site-footer-carbon" title="Approximation based on transferred bytes for this visit"
        >~-- g CO₂ · this view</span
      >
    </div>
  </div>
</footer>

<script>
  (function () {
    var time = document.getElementById("site-footer-time");
    var carbon = document.getElementById("site-footer-carbon");

    function tick() {
      if (!time) return;
      try {
        time.textContent =
          new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
            timeZone: "America/New_York",
          }).format(new Date()) + " NYC";
      } catch (_) {
        time.hidden = true;
      }
    }

    function measureCarbon() {
      if (!carbon || !window.performance || !performance.getEntriesByType) return;
      var bytes = performance.getEntriesByType("resource").reduce(function (total, entry) {
        return total + (entry.transferSize || entry.encodedBodySize || 0);
      }, 0);
      if (!bytes) return;
      var grams = (bytes / 1073741824) * 0.81 * 442 * 0.75;
      carbon.textContent = "~" + Math.max(0.01, grams).toFixed(2) + " g CO₂ · this view";
    }

    tick();
    setInterval(tick, 30000);
    window.addEventListener("load", function () {
      window.setTimeout(measureCarbon, 800);
    });
  })();
</script>
