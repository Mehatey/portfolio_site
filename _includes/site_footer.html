<style>
  /* A footer should read as an endpoint, not another interactive scene. */
  .site-footer {
    max-width: none;
    margin: 0 auto;
    padding: 56px var(--gutter) 32px;
    position: relative;
    z-index: 5;
  }
  .site-footer-inner {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }
  .site-footer-mark {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    line-height: 1.5;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.58);
  }
  .site-footer-mark span {
    color: rgba(255, 255, 255, 0.3);
  }
  .site-footer-meta {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 14px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    line-height: 1.5;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.34);
    white-space: nowrap;
  }
  .site-footer-meta a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    transition:
      color 0.2s ease,
      border-color 0.2s ease;
  }
  .site-footer-meta a:hover {
    color: rgba(255, 255, 255, 0.9);
    border-color: rgba(255, 255, 255, 0.65);
  }
  html[data-theme="light"] .site-footer-inner {
    border-top-color: rgba(7, 9, 15, 0.14);
  }
  html[data-theme="light"] .site-footer-mark {
    color: rgba(7, 9, 15, 0.62);
  }
  html[data-theme="light"] .site-footer-mark span,
  html[data-theme="light"] .site-footer-meta {
    color: rgba(7, 9, 15, 0.4);
  }
  html[data-theme="light"] .site-footer-meta a {
    border-color: rgba(7, 9, 15, 0.22);
  }
  html[data-theme="light"] .site-footer-meta a:hover {
    color: rgba(7, 9, 15, 0.9);
    border-color: rgba(7, 9, 15, 0.6);
  }
  @media (max-width: 600px) {
    .site-footer {
      margin-top: 0;
      padding: 44px var(--gutter) 28px;
    }
    .site-footer-inner {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .site-footer-meta {
      justify-content: flex-start;
      flex-wrap: wrap;
      white-space: normal;
    }
  }
</style>

<footer class="site-footer" aria-label="Site footer">
  <div class="site-footer-inner">
    <p class="site-footer-mark">Siddharth Mehta <span>· New York</span></p>
    <div class="site-footer-meta">
      <span>© 2026</span>
      <span id="site-footer-time">--:-- NYC</span>
      <a href="mailto:sidmehtadesign@gmail.com">Email</a>
    </div>
  </div>
</footer>

<script>
  (function () {
    var el = document.getElementById("site-footer-time");
    if (!el) return;
    function tick() {
      try {
        el.textContent =
          new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
            timeZone: "America/New_York",
          }).format(new Date()) + " NYC";
      } catch (_) {
        el.style.display = "none";
      }
    }
    tick();
    setInterval(tick, 30000);
  })();
</script>
