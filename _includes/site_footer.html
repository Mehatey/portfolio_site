<style>
  .site-footer {
    position: relative;
    z-index: 5;
    padding: clamp(70px, 9vw, 124px) var(--gutter) 28px;
  }

  .site-footer-inner {
    display: grid;
    grid-template-columns: minmax(210px, 1fr) auto minmax(210px, 1fr);
    align-items: end;
    gap: clamp(24px, 5vw, 88px);
    min-height: 126px;
    padding: 22px 0 4px;
    border-top: 1px solid rgba(205, 229, 255, 0.11);
  }

  .site-footer-copy,
  .site-footer-meta {
    display: grid;
    gap: 8px;
    font: 400 10px/1.5 var(--font-mono);
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .site-footer-copy strong {
    color: rgba(255, 255, 255, 0.78);
    font: 500 14px/1.25 var(--font-head, sans-serif);
    letter-spacing: -0.01em;
  }

  .site-footer-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
  }

  .site-footer a {
    color: inherit;
    text-decoration: none;
  }

  .site-footer-links a {
    position: relative;
    color: rgba(255, 255, 255, 0.62);
  }

  .site-footer-links a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 100%;
    bottom: -3px;
    height: 1px;
    background: currentColor;
    transition: right 240ms var(--ease-out);
  }

  .site-footer-links a:hover::after,
  .site-footer-links a:focus-visible::after {
    right: 0;
  }

  .site-footer-avatar {
    position: relative;
    width: 104px;
    height: 104px;
    place-self: end center;
    isolation: isolate;
  }

  .site-footer-avatar::before,
  .site-footer-avatar::after {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 30px;
    pointer-events: none;
  }

  .site-footer-avatar::before {
    z-index: -1;
    background:
      radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.26), transparent 34%),
      linear-gradient(145deg, rgba(161, 210, 255, 0.16), rgba(7, 12, 21, 0.42));
    border: 1px solid rgba(208, 233, 255, 0.16);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.22),
      inset 0 -18px 30px rgba(62, 129, 194, 0.07),
      0 18px 50px rgba(0, 0, 0, 0.26);
    backdrop-filter: blur(20px) saturate(1.55);
    -webkit-backdrop-filter: blur(20px) saturate(1.55);
    transform: rotate(6deg);
    transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .site-footer-avatar::after {
    inset: 13px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    transform: rotate(-4deg);
  }

  .site-footer-avatar:hover::before {
    transform: rotate(-5deg) scale(1.04);
  }

  .site-footer-avatar model-viewer {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
    filter: drop-shadow(0 13px 18px rgba(0, 0, 0, 0.38));
  }

  .site-footer-avatar-label {
    position: absolute;
    left: 50%;
    bottom: -5px;
    transform: translateX(-50%);
    width: max-content;
    padding: 3px 7px;
    border-radius: 999px;
    background: rgba(6, 10, 17, 0.76);
    border: 1px solid rgba(208, 233, 255, 0.12);
    font: 400 8px/1.3 var(--font-mono);
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase;
  }

  .site-footer-meta {
    justify-items: end;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .site-footer-meta-row {
    display: flex;
    gap: 9px;
    align-items: center;
  }

  .site-footer-meta-row::before {
    content: "";
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(143, 196, 238, 0.7);
    box-shadow: 0 0 10px rgba(143, 196, 238, 0.5);
  }

  html[data-theme="light"] .site-footer-inner {
    border-color: rgba(31, 65, 108, 0.12);
  }

  html[data-theme="light"] .site-footer-copy strong,
  html[data-theme="light"] .site-footer-links a {
    color: rgba(7, 9, 15, 0.76);
  }

  html[data-theme="light"] .site-footer-avatar::before {
    background:
      radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.98), transparent 35%),
      linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(172, 202, 233, 0.28));
    border-color: rgba(31, 65, 108, 0.13);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      0 18px 45px rgba(26, 48, 76, 0.14);
  }

  @media (max-width: 720px) {
    .site-footer {
      padding: 62px var(--gutter) 26px;
    }

    .site-footer-inner {
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 18px;
      min-height: 0;
    }

    .site-footer-avatar {
      grid-column: 2;
      grid-row: 1 / span 2;
      width: 78px;
      height: 78px;
    }

    .site-footer-meta {
      grid-column: 1;
      justify-items: start;
      text-align: left;
    }
  }
</style>

<footer class="site-footer" aria-label="Site footer">
  <div class="site-footer-inner">
    <div class="site-footer-copy">
      <strong>Siddharth Mehta</strong>
      <span>Designer and builder · New York</span>
      <nav class="site-footer-links" aria-label="Footer links">
        <a href="{{ site.baseurl }}/works/">Selected work</a>
        <a href="{{ site.baseurl }}/contact/">Contact</a>
        <a href="{{ site.baseurl }}/assets/resume.pdf" target="_blank" rel="noopener noreferrer">Resume</a>
      </nav>
    </div>

    <div class="site-footer-avatar" aria-label="Rotating Buddha sculpture inside the cube mark">
      <model-viewer
        src="{{ site.baseurl }}/assets/models/buddha-web.glb"
        tabindex="-1"
        auto-rotate
        rotation-per-second="11deg"
        camera-orbit="0deg 78deg 108%"
        interaction-prompt="none"
        disable-zoom
        disable-pan
        disable-tap
        environment-image="neutral"
        exposure="1.12"
        shadow-intensity="0"
      ></model-viewer>
      <span class="site-footer-avatar-label">still thinking</span>
    </div>

    <div class="site-footer-meta">
      <span class="site-footer-meta-row">Updated Jul 2026</span>
      <span class="site-footer-meta-row" id="site-footer-time">--:-- NYC</span>
      <span class="site-footer-meta-row" id="site-footer-carbon" title="Approximation based on transferred bytes for this visit"
        >~-- g CO₂ · this view</span
      >
    </div>
  </div>
</footer>

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js" crossorigin="anonymous"></script>

<script>
  (function () {
    var time = document.getElementById("site-footer-time");
    var carbon = document.getElementById("site-footer-carbon");

    function tick() {
      if (!time) return;
      try {
        time.textContent =
          new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
            timeZone: "America/New_York",
          }).format(new Date()) + " NYC";
      } catch (_) {
        time.hidden = true;
      }
    }

    function measureCarbon() {
      if (!carbon || !window.performance || !performance.getEntriesByType) return;
      var bytes = performance.getEntriesByType("resource").reduce(function (total, entry) {
        return total + (entry.transferSize || entry.encodedBodySize || 0);
      }, 0);
      if (!bytes) return;
      // Sustainable Web Design v3-style transfer estimate. It is deliberately
      // labelled approximate because cache state and grid intensity vary.
      var grams = (bytes / 1073741824) * 0.81 * 442 * 0.75;
      carbon.textContent = "~" + Math.max(0.01, grams).toFixed(2) + " g CO₂ · this view";
    }

    tick();
    setInterval(tick, 30000);
    window.addEventListener("load", function () {
      window.setTimeout(measureCarbon, 800);
    });
  })();
</script>
