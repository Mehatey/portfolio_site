<style>
  .site-footer {
    position: relative;
    z-index: 5;
    padding: clamp(76px, 9vw, 128px) var(--gutter, clamp(20px, 4vw, 64px)) 28px;
  }

  .site-footer-inner {
    display: grid;
    grid-template-columns: minmax(210px, 1fr) auto minmax(210px, 1fr);
    align-items: end;
    gap: clamp(28px, 5vw, 76px);
    padding-top: 26px;
    border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent);
  }

  .site-footer-identity {
    display: grid;
    gap: 8px;
  }

  .site-footer-identity strong {
    font: 500 16px/1.25 var(--font-head, "Figtree", sans-serif);
    letter-spacing: -0.01em;
  }

  .site-footer-identity > span,
  .site-footer-updated,
  .site-footer-meta {
    color: var(--muted, rgba(230, 236, 244, 0.6));
    font: 400 10px/1.5 var(--font-mono, "DM Mono", monospace);
    letter-spacing: 0.035em;
  }

  .site-footer-updated {
    opacity: 0.72;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .site-footer-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 1px;
  }

  .site-footer a {
    color: inherit;
    text-decoration: none;
  }

  .site-footer-links a {
    position: relative;
    min-height: 30px;
    font-size: 12px;
  }

  .site-footer-links a::after,
  .site-footer-conversation::after {
    content: "";
    position: absolute;
    right: 100%;
    bottom: 3px;
    left: 0;
    height: 1px;
    background: currentColor;
    transition: right 280ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .site-footer-links a:hover::after,
  .site-footer-links a:focus-visible::after,
  .site-footer-conversation:hover::after,
  .site-footer-conversation:focus-visible::after {
    right: 0;
  }

  .site-footer-conversation {
    position: relative;
    justify-self: end;
    max-width: 15ch;
    padding-bottom: 7px;
    font: 430 clamp(20px, 2vw, 30px) / 1.12 var(--font-head, "Figtree", sans-serif);
    letter-spacing: -0.025em;
    text-align: right;
    text-wrap: balance;
  }

  .site-footer-mark {
    position: relative;
    display: grid;
    place-items: center;
    width: 82px;
    height: 82px;
    color: rgba(225, 239, 255, 0.72);
    transform: perspective(500px) rotateX(var(--footer-tilt-y, 0deg)) rotateY(var(--footer-tilt-x, 0deg));
    transition: transform 420ms cubic-bezier(0.16, 1, 0.3, 1), color 240ms ease;
  }

  .site-footer-mark::before {
    content: "";
    position: absolute;
    inset: 9px 0;
    border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
    border-radius: 50%;
    transform: rotate(-22deg) scaleX(0.72);
    transition: transform 500ms cubic-bezier(0.16, 1, 0.3, 1), border-color 240ms ease;
  }

  .site-footer-mark::after {
    content: "";
    position: absolute;
    top: 5px;
    right: 15px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #78dd89;
    box-shadow: 0 0 14px rgba(120, 221, 137, 0.7);
    transition: transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .site-footer-mark .logo-cube {
    position: relative;
    z-index: 1;
    width: 42px;
    height: 42px;
    color: currentColor;
  }

  .site-footer-mark:hover,
  .site-footer-mark:focus-visible {
    color: rgba(244, 249, 255, 0.98);
  }

  .site-footer-mark:hover::before,
  .site-footer-mark:focus-visible::before {
    border-color: color-mix(in srgb, currentColor 52%, transparent);
    transform: rotate(22deg) scaleX(0.82);
  }

  .site-footer-mark:hover::after,
  .site-footer-mark:focus-visible::after {
    transform: translate(-4px, 4px);
  }

  .site-footer-meta {
    display: grid;
    justify-items: end;
    gap: 7px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .site-footer-meta-row:first-child::before {
    content: "";
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-right: 8px;
    border-radius: 50%;
    background: #78dd89;
    box-shadow: 0 0 8px rgba(120, 221, 137, 0.55);
  }

  html[data-theme="light"] .site-footer-identity > span,
  html[data-theme="light"] .site-footer-meta {
    color: rgba(15, 25, 38, 0.66);
  }

  @media (max-width: 760px) {
    .site-footer {
      padding-bottom: 22px;
    }

    .site-footer-inner {
      grid-template-columns: 1fr;
      align-items: start;
    }

    .site-footer-mark {
      order: 3;
      justify-self: start;
      margin-top: 10px;
    }

    .site-footer-conversation {
      justify-self: start;
      max-width: 16ch;
      text-align: left;
    }

    .site-footer-meta {
      justify-items: start;
      text-align: left;
    }
  }
</style>

<footer class="site-footer" aria-label="Site footer">
  <div class="site-footer-inner">
    <div class="site-footer-identity">
      <strong>Siddharth Mehta</strong>
      <span>Product designer and creative technologist in New York.</span>
      <span class="site-footer-updated">Updated {{ site.time | date: "%b %Y" }}</span>
      <nav class="site-footer-links" aria-label="Footer links">
        <a href="{{ site.baseurl }}/assets/resume.pdf" target="_blank" rel="noopener noreferrer">Resume</a
        ><a href="https://www.linkedin.com/in/siddharth-mehta-design/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
    </div>

    <a class="site-footer-mark" href="{{ site.baseurl }}/" aria-label="Return to Sid Mehta home">
      {% include site_logo.html %}
    </a>

    <a class="site-footer-conversation" href="{{ site.baseurl }}/contact/">Let’s make something useful.</a>
  </div>
</footer>

<script>
  (function () {
    var mark = document.querySelector(".site-footer-mark");
    var fine = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    if (!mark || !fine) return;
    mark.addEventListener("pointermove", function (event) {
      var rect = mark.getBoundingClientRect();
      var x = (event.clientX - rect.left) / rect.width - 0.5;
      var y = (event.clientY - rect.top) / rect.height - 0.5;
      mark.style.setProperty("--footer-tilt-x", (x * 8).toFixed(2) + "deg");
      mark.style.setProperty("--footer-tilt-y", (y * -8).toFixed(2) + "deg");
    });
    mark.addEventListener("pointerleave", function () {
      mark.style.removeProperty("--footer-tilt-x");
      mark.style.removeProperty("--footer-tilt-y");
    });
  })();
</script>

<script>
  (function () {
    var time = document.getElementById("site-footer-time");
    var carbon = document.getElementById("site-footer-carbon");

    function tick() {
      if (!time) return;
      try {
        time.textContent =
          new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
            timeZone: "America/New_York",
          }).format(new Date()) + " NYC";
      } catch (_) {
        time.hidden = true;
      }
    }

    function measureCarbon() {
      if (!carbon || !window.performance || !performance.getEntriesByType) return;
      var bytes = performance.getEntriesByType("resource").reduce(function (total, entry) {
        return total + (entry.transferSize || entry.encodedBodySize || 0);
      }, 0);
      if (!bytes) return;
      var grams = (bytes / 1073741824) * 0.81 * 442 * 0.75;
      carbon.textContent = "~" + Math.max(0.01, grams).toFixed(2) + " g CO₂ · this view";
    }

    tick();
    setInterval(tick, 30000);
    window.addEventListener("load", function () {
      window.setTimeout(measureCarbon, 800);
    });
  })();
</script>
