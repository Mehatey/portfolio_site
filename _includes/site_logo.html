<!-- ── SID'S MARK ─────────────────────────────────────────────────────────────
     Sid: "also the logo rethink."

     It was a rounded square with a second one peeking out behind it, two tall
     pill "eyes" and a short line under them. Three things were wrong with it.
     It read as a face, which is the same children's-drawing register the old
     nav icons were in. At small sizes the two vertical pills read as a pause
     button, so the most-clicked target in the header looked like a transport
     control. And once the nav icons were rebuilt, the Work mark — two offset
     rounded squares — became the logo's twin sitting 90px to its right.

     This is the actual cube instead. Not a square standing in for one: a real
     isometric projection, hexagonal silhouette with the three-edge Y that
     makes the eye resolve it into a solid. The cube is the site's motif — it
     is on the home page in three dimensions and it is what /cube-guy/ is about
     — so the mark should be the thing itself rather than a reference to it.
     It also shares nothing with any nav icon: the set is monoline at 24px on
     orthogonal and circular geometry, this is a filled solid at 42px on 60°
     diagonals.

     The class names are unchanged on purpose. All the hover choreography —
     the three faces fading up and sliding home, the scan drawn across the top,
     the 360° turn under a 340px perspective — already lives in studio_nav.html
     tuned to `.cube-face` / `.cube-top` / `.cube-right` / `.logo-scan`, and it
     is choreography for assembling a cube. It was always describing this mark;
     it just did not have it to work with.
     ───────────────────────────────────────────────────────────────────────── -->
<svg class="logo-cube" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
  <!-- The silhouette, and the only part visible at rest. -->
  <path class="cube-front" d="M18 6.7 L29 12.9 L29 24.1 L18 30.3 L7 24.1 L7 12.9 Z" />
  <!-- The three near edges meeting at the centre vertex. Without these the
       hexagon is a hexagon; with them it is a cube, and there is no third
       reading available. In a true isometric projection the far vertex
       projects exactly onto the near one, so these same three lines are also
       the hidden edges — which is why the mark needs no ghosted back layer to
       feel solid. -->
  <path class="cube-edges" d="M18 18.5 L18 30.3 M18 18.5 L7 12.9 M18 18.5 L29 12.9" />
  <!-- The three faces, held apart and invisible until hover, then fading up
       and sliding home. Each one leaves along its own face normal, so the
       cube comes apart the way a cube would rather than scattering. -->
  <path class="cube-face cube-top" d="M18 6.7 L29 12.9 L18 18.5 L7 12.9 Z" />
  <path class="cube-face cube-right" d="M29 12.9 L29 24.1 L18 30.3 L18 18.5 Z" />
  <path class="cube-face cube-left" d="M7 12.9 L7 24.1 L18 30.3 L18 18.5 Z" />
  <!-- Light crossing the top face along its long diagonal. Drawn with
       dashoffset rather than faded in, so it sweeps. -->
  <path class="logo-scan" d="M7 12.9 L29 12.9" />
</svg>
