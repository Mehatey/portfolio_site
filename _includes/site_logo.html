<!-- ── SID'S MARK: THE BLINKING CUBE FACE, RESTORED ──────────────────────────
     Sid: "get my old blinking cube face logo back."

     I replaced this with a strict isometric cube and argued at length in the
     comment that used to live here that the mark should be "the thing itself
     rather than a reference to it" — a real hexagonal projection instead of a
     square standing in for one. The reasoning was tidy and it threw away the
     only thing on the site that looked back at you.

     Two facts make the restore easy, and both say the face was never really
     gone. `cursor_fluid.html` still carries `@keyframes sid-logo-blink`,
     bound to `.logo-cube .logo-eye` with an `!important` — a blink animation
     with nothing left to blink. And it still runs the eye-tracking loop that
     writes `--eye-x` / `--eye-y` on every mousemove, for eyes that no longer
     existed. So the choreography survived my redesign as dead code for days.
     This file gives it back its subject.

     The class contract is exactly what that surviving code expects:

       .cube-front   the body, filled dark with a currentColor stroke
       .logo-eye     the two eyes — blink on the 8.4s cycle, and drift with
                     the cursor through --eye-x / --eye-y
       .logo-mouth   the short line under them
       .cube-top     hover choreography, already tuned in studio_nav.html
       .cube-right   ditto
       .logo-scan    the line drawn across the mark on hover

     The eyes are set as rounded rects rather than circles because that is
     what made it read as pixel art rather than as a smiley, which is the
     same register as the nav icons it now sits beside again.
     ───────────────────────────────────────────────────────────────────── -->
<svg class="logo-cube" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
  <!-- The two faces behind, hidden at rest and sliding home on hover. They
       MUST carry .cube-face: that is the class the rest-state rule in
       cursor_fluid.html uses to hold them at opacity 0, and the hover rules in
       studio_nav.html use to bring them up. Without it they sit visible behind
       the body at rest and the hover assembly has nothing left to assemble. -->
  <!-- All three rects are now the SAME box as the body: same x, y, width and
       height. That is what lets the hover build an actual isometric solid —
       the top and right faces are the front face, skewed and scaled about
       their own edges, so they meet it exactly instead of being two more
       squares parked near it. Their offset at rest is a transform, not
       geometry, which means one set of numbers to keep in step instead of
       three. See the assembly in studio_nav.html. -->
  <rect class="cube-face cube-top" x="7.5" y="7.5" width="21" height="21" rx="3.2" />
  <rect class="cube-face cube-right" x="7.5" y="7.5" width="21" height="21" rx="3.2" />

  <!-- The body. Sid: "reduce curve on edges a bit" — 4.5 on a 21-unit square
       is a squircle, and at 36px it read closer to a blob than to a die. -->
  <rect class="cube-front" x="7.5" y="7.5" width="21" height="21" rx="3.2" />

  <!-- ── THE FACE HAS MORE ROOM ─────────────────────────────────────────
       Sid: "increase the width around the face to the border of the square by
       one point. its a little too compressed."

       Everything below is the previous face scaled 0.82 about the square's
       centre, rather than each mark nudged inward on its own. Pulling the
       eyes in individually would have closed the gap between them by the
       same amount it opened at the edges — the face would have gained margin
       by going cross-eyed. A scale keeps the expression and moves only the
       air: eyes 5.25 units from the border, now 6.2; mouth 5.2 below, now
       6.16. About one unit all round, which is what he asked for.

       transform-box: fill-box and transform-origin: center are set on
       .logo-eye in cursor_fluid.html, so the blink scales each eye about its
       own centre rather than about the SVG origin. The translate below is the
       cursor drift; the blink's scaleY composes on top of it. -->
  <g style="transform: translate(calc(var(--eye-x, 0) * 0.9px), calc(var(--eye-y, 0) * 0.7px))">
    <rect class="logo-eye" x="13.83" y="13.9" width="1.3" height="4.8" rx="0.65" />
    <rect class="logo-eye" x="20.88" y="13.9" width="1.3" height="4.8" rx="0.65" />
  </g>

  <!-- The mouth: one short line, deliberately not a curve. A smile would make
       this a face; a line makes it a device that happens to have a face.

       Sid: "make my mouth a little shorter in horizontal width and move it a
       little bit more down... make the eyes a little longer and move them up,
       and reduce the width of the eye a little bit."

       Both marks keep their centres so the face stays symmetrical: the eyes
       are centred on x 14.48 and 21.53 and the mouth on 18.005, which is the
       midpoint of the pair, so width changes are applied either side of those
       numbers rather than by moving the left edge. Eyes 1.56->1.3 wide and
       4.1->4.8 tall with the top raised 0.66; mouth 5.25->4.3 wide, dropped
       0.46. Taller narrower eyes set higher and a shorter mouth set lower
       reads as more alert without turning the line into an expression. -->
  <rect class="logo-mouth" x="15.86" y="21.9" width="4.3" height="0.9" rx="0.45" />

  <!-- Drawn across the mark on hover — dasharray and offset are already set
       on .logo-scan in cursor_fluid.html. -->
  <path class="logo-scan" d="M8.5 18 H27.5" />
</svg>
