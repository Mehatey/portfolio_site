<!-- Sid's navigation mark — rests as a layered cube-of-creation with a quiet
     two-eye face, then assembles + spins into a full cube on hover. -->
<svg class="logo-cube" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
  <!-- Persistent depth face: a subtle offset plane behind the front so the mark
       reads as a dimensional cube even at rest, not a flat square. -->
  <rect class="logo-depth" x="10" y="10" width="20" height="20" rx="2.4"
        fill="#0a111c" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.2" />
  <!-- Faces that fade + slide into alignment on hover (styled in cursor_fluid). -->
  <rect class="cube-face cube-top" x="6.5" y="6.5" width="20" height="20" rx="2.4" />
  <rect class="cube-face cube-right" x="6.5" y="6.5" width="20" height="20" rx="2.4" />
  <!-- The resting front face. -->
  <rect class="cube-front" x="6.5" y="6.5" width="20" height="20" rx="2.4" />
  <g class="logo-gaze">
    <rect class="logo-eye" x="12.15" y="13.4" width="1.7" height="7.2" rx="0.85" fill="#e7f1ff" />
    <rect class="logo-eye" x="19.15" y="13.4" width="1.7" height="7.2" rx="0.85" fill="#e7f1ff" />
  </g>
  <path class="logo-scan" d="M12.4 24h8.2" />
</svg>
