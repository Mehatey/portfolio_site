{% when 'contact' %}
<!-- Third attempt, and the two failures are the argument for this one.

     The ripple was thin strokes around a hole -- a shape from nowhere. The
     envelope was a shape from everywhere, the glyph every product ships. Then
     the transmission mark: a block with three pixels leaving it. Sid: "can u
     make it more dense like one thing like we have a flower this trail is
     taking attention and not turipoise an that is same as about."

     Three separate faults in one sentence, all correct. The trail was three
     small objects strung diagonally, so the mark had no centre and the eye
     went to the sparse end rather than the mass. The flower works because it
     is ONE thing, dense, symmetrical about its own middle. And the teal was a
     straight duplicate of the About mark two slots along, so the row read
     blue / pink / teal / teal.

     So: a bird, dense, one object, amber. It carries a message, which is the
     oldest way of saying contact and not an icon anybody ships. Amber gives
     the row four distinct temperatures -- blue, pink, amber, teal -- and it is
     the warm note Sid asked for elsewhere on the page. Built on the same 1px
     grid as the About face so it holds at 24px. -->
<svg class="nav-pixel nav-pixel--contact" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="nav-pixel__ray" x="5" y="10" width="11" height="7" rx="1.6" />
  <rect class="nav-pixel__ray" x="13" y="6" width="6" height="6" rx="1.4" />
  <rect class="nav-pixel__ray" x="18" y="8" width="3" height="2" rx="0.5" />
  <rect class="nav-pixel__ray" x="3" y="11" width="4" height="4" rx="1" />
  <rect class="nav-pixel__core" x="7" y="11" width="6" height="4" rx="1.2" />
  <rect class="nav-pixel__eye" x="16" y="8" width="1.6" height="1.6" rx="0.8" />
</svg>
