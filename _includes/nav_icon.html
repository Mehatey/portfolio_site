<!-- ── THE NAV MARKS ──────────────────────────────────────────────────────────
     Third attempt, and the first two are the reason this one is shaped the way
     it is.

     Attempt one was a monoline illustration set: a sprout, a drop on water, a
     spiral, a stack of frames. Sid: "childish and not finesse." Attempt two
     removed pictures entirely and used an index -- 01 02 03 04. Sid: "numbered
     tags to the pages looks fuckin horrible i wanted nice icons man."

     Both notes are correct and they are not in conflict, which took me two
     tries to see. The illustrations failed because of scale, not taste: at
     27px a sprout is four strokes and a dot, and four strokes and a dot is a
     stick. The numerals failed because an ordinal is not a mark -- it sits in
     the reading path and competes with the word beside it instead of standing
     apart from it, so the row reads as a contents page.

     What survives at 10px is a primitive. One closed form, no interior detail,
     no representation. A square reads at 10px. A drawing of a plant does not.

     So the set is four primitives, and they are not arbitrary primitives:
     each one is the cube seen from somewhere. The cube is already the mark, on
     the home page in three dimensions and in the header as a solid, and
     /cube-guy/ is a project about it.

       Work     a square      one face, straight on. Work is a body of faces.
       Play     a triangle    the isometric corner, where three faces meet.
       Contact  a circle      the ripple. Already the footer pond's language.
       About    a hexagon     the cube in isometric -- the silhouette of the
                              logo itself, which is the honest mark for the
                              page about where all of it comes from.

     Hollow at rest, filled when the page is active. That gives the row a state
     indicator that costs no extra element and reads instantly, because filled
     against hollow is the loudest difference two identical shapes can have.
     ────────────────────────────────────────────────────────────────────── -->
{% case include.icon %} {% when 'work' %}
<svg class="nav-mark" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
  <rect x="2.7" y="2.7" width="6.6" height="6.6" rx="0.35" />
</svg>
{% when 'play' %}
<svg class="nav-mark" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
  <path d="M6 2.3 L10.05 9.35 L1.95 9.35 Z" />
</svg>
{% when 'contact' %}
<svg class="nav-mark" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
  <circle cx="6" cy="6" r="3.55" />
</svg>
{% when 'about' %}
<svg class="nav-mark" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
  <!-- Widened from the logo's proportions and drawn a touch lighter: a
       regular hexagon at 10px closes into a circle, and the whole point of
       this one is that it is not the circle two items to its left. -->
  <path class="nav-mark__hex" d="M6 1.95 L9.9 4.2 L9.9 7.8 L6 10.05 L2.1 7.8 L2.1 4.2 Z" />
</svg>
{% endcase %}
