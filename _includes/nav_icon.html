{% when 'contact' %}
<!-- Back to the ripple, which was the right idea. Sid: "do a similar one as
     the last one just make it lighter and thinner and a little different."

     The speech bubble I put here in between was a mistake worth naming: it
     was a generic chat glyph sitting next to a hand-drawn spiral, a plant and
     a cube face. Every other mark in this set is specific to Sid's work; that
     one could have come from any icon library, and it broke the register of
     the whole row.

     So: the same radial figure, rebuilt lighter. Three changes from the
     original. The rays are 1.4 wide instead of 2 and pulled further out from
     the middle, so the mark reads as something spreading rather than as a
     sun with a solid centre. The four diagonals drop from bars to single
     pixels, which is where most of the weight comes off. And the core is a
     ring rather than a filled block -- that is the "little different": a
     ripple has an empty middle, because the thing that made it has already
     passed through. -->
<svg class="nav-pixel nav-pixel--contact" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="nav-pixel__ray" x="11.3" y="1.6" width="1.4" height="5" rx="0.7" />
  <rect class="nav-pixel__ray" x="11.3" y="17.4" width="1.4" height="5" rx="0.7" />
  <rect class="nav-pixel__ray" x="1.6" y="11.3" width="5" height="1.4" rx="0.7" />
  <rect class="nav-pixel__ray" x="17.4" y="11.3" width="5" height="1.4" rx="0.7" />
  <rect class="nav-pixel__spark" x="5.1" y="5.1" width="1.6" height="1.6" rx="0.8" />
  <rect class="nav-pixel__spark" x="17.3" y="5.1" width="1.6" height="1.6" rx="0.8" />
  <rect class="nav-pixel__spark" x="5.1" y="17.3" width="1.6" height="1.6" rx="0.8" />
  <rect class="nav-pixel__spark" x="17.3" y="17.3" width="1.6" height="1.6" rx="0.8" />
  <circle class="nav-pixel__ring" cx="12" cy="12" r="3.6" fill="none" stroke-width="1.4" />
</svg>
