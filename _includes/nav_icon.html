<!-- ── THE NAV MARKS ──────────────────────────────────────────────────────────
     Sid: "rethink icons they look a little childish and not finesse."

     They were: a blue spiral, a red-and-green daisy, an orange sparkle, and a
     teal square with two eyes and a mouth. Four icons carrying seven saturated
     hues between them, built out of chunky rounded rectangles at 24px, one of
     them a literal smiley face. Two separate failures — a rainbow with no
     system behind it, and a drawing register borrowed from a children's game.

     The replacement is one construction grammar, held to strictly:

       · Monoline. 1.6px stroke, round caps and joins, `fill: none`.
         Weight, not colour, is what distinguishes parts.
       · One ink. Everything is currentColor, so each mark inherits the exact
         value of the label beside it and the set stays legible in both themes
         without a single theme override.
       · Emphasis is a filled dot. Every icon has exactly one, and it is the
         only filled shape in the set — so the eye lands in the same place on
         all four, which is what makes a row of them read as a row.
       · Depth is opacity. Where a mark has a back layer it is drawn at
         reduced alpha rather than in a second colour.

     The subjects are the site's own vocabulary rather than generic UI nouns.
     Work is a stack of pieces. Play is a sprout — the same thing growing in
     the footer, and the thing the About page is about ("you plant a thing
     long before you know what it becomes"). Contact is a drop and its rings,
     which is the pond's language for something set in motion. About is a
     spiral, because Sid draws mandalas by hand and a spiral is the honest
     mark for a page about where the work comes from.
     ────────────────────────────────────────────────────────────────────── -->
{% case include.icon %} {% when 'work' %}
<!-- WORK — two frames, the front one offset off the back. A body of pieces
     with one of them in hand. -->
<svg class="nav-mark nav-mark--work" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="nav-mark__back" x="4.6" y="3.6" width="12.8" height="12.8" rx="2.2" />
  <rect class="nav-mark__front" x="7.4" y="7.4" width="12.8" height="12.8" rx="2.2" />
  <circle class="nav-mark__dot" cx="10.9" cy="10.9" r="1.15" />
</svg>
{% when 'play' %}
<!-- PLAY — a sprout: one rising stem, two leaves on alternating sides, a bud
     at the tip. The stem is drawn past the leaves rather than between them so
     the plant reads as one continuous thing that grew, not three parts
     assembled. -->
<svg class="nav-mark nav-mark--play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path class="nav-mark__stem" d="M12 20.8 C12 16.4 12 12.4 12 8.6" />
  <path class="nav-mark__leaf" d="M12 15.2 C9.1 15.2 7.1 13.7 6.9 11.1 C9.7 11.1 11.7 12.6 12 15.2 Z" />
  <path class="nav-mark__leaf" d="M12 11.9 C14.9 11.9 16.9 10.4 17.1 7.8 C14.3 7.8 12.3 9.3 12 11.9 Z" />
  <circle class="nav-mark__dot" cx="12" cy="6.6" r="1.3" />
</svg>
{% when 'contact' %}
<!-- CONTACT — a drop and the rings it makes. The first draft of this drew the
     rings as quarter-turn arcs opening up and right from a dot in the bottom
     left corner, on the theory that widening the spacing outward would stop it
     reading as a signal glyph. It did not: a dot with arcs fanning off one
     corner IS the RSS mark, and no amount of spacing changes what that
     silhouette says. Looking at the render was the only way to find that out.

     Drawn in the water's own plane instead — three flattened rings seen at an
     angle, sharing a centre, with the drop suspended above them — the shape has
     no signal-glyph reading available to it, because signal glyphs are always
     drawn as concentric *arcs from a corner*, never as closed rings in
     perspective. It also happens to be the exact thing the footer does.

     ry is 0.36 of rx throughout: one viewing angle for both rings, which is what
     makes them read as lying on a single surface.

     Two rings, not three. Three fit geometrically at 24px but the innermost
     closed to a filled lozenge at render size and the set turned into a blob
     with a halo. A ring you cannot see through is not a ring. -->
<svg class="nav-mark nav-mark--contact" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <ellipse class="nav-mark__ring nav-mark__ring--1" cx="12" cy="15.4" rx="4.7" ry="1.7" />
  <ellipse class="nav-mark__ring nav-mark__ring--2" cx="12" cy="15.4" rx="9.1" ry="3.3" />
  <circle class="nav-mark__dot" cx="12" cy="6.2" r="1.35" />
</svg>
{% when 'about' %}
<!-- ABOUT — a spiral wound from the outside in, built as six half-turns of
     shrinking radius. Each half is a semicircle whose radius is exactly half
     the distance between its endpoints, which is what keeps the curvature
     continuous across the joins; picking radii freehand puts a visible kink
     at every hand-off. -->
<svg class="nav-mark nav-mark--about" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path
    class="nav-mark__coil"
    d="M20.5 12
       A7.85 7.85 0 0 1 4.8 12
       A6.35 6.35 0 0 1 17.5 12
       A4.85 4.85 0 0 1 7.8 12
       A3.55 3.55 0 0 1 14.9 12
       A2.25 2.25 0 0 1 10.4 12"
  />
  <circle class="nav-mark__dot" cx="11.9" cy="12" r="1.15" />
</svg>
{% endcase %}
