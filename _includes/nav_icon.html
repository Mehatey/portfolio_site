{% case include.icon %}
  {% when 'work' %}

      <rect class="nav-pixel__tile" x="4" y="5" width="16" height="15" rx="1" />
      <path class="nav-pixel__edge" d="M4 5h16M20 5v15M4 20h16" />

      <rect class="nav-pixel__eye" x="14" y="11" width="2" height="3" />
    </svg>
  {% when 'play' %}
    <svg class="nav-pixel nav-pixel--play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

      <rect class="nav-pixel__petal" x="14" y="7" width="4" height="3" />
      <rect class="nav-pixel__petal" x="10" y="9" width="4" height="4" />
      <rect class="nav-pixel__core" x="11" y="8" width="2" height="2" />
    </svg>
  {% when 'contact' %}
    <svg class="nav-pixel nav-pixel--contact" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect class="nav-pixel__ray" x="11" y="2" width="2" height="6" />
      <rect class="nav-pixel__ray" x="11" y="16" width="2" height="6" />
      <rect class="nav-pixel__ray" x="2" y="11" width="6" height="2" />
      <rect class="nav-pixel__ray" x="16" y="11" width="6" height="2" />
      <rect class="nav-pixel__ray" x="6" y="6" width="3" height="3" />

      <rect class="nav-pixel__core" x="9" y="9" width="6" height="6" />

  {% when 'about' %}
    <svg class="nav-pixel nav-pixel--about" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect class="nav-pixel__tile" x="4" y="8" width="16" height="8" rx="1" />
      <rect class="nav-pixel__tile" x="8" y="4" width="8" height="16" rx="1" />
      <rect class="nav-pixel__eye" x="8" y="10" width="2" height="2" />
      <rect class="nav-pixel__eye" x="14" y="10" width="2" height="2" />
      <rect class="nav-pixel__mouth" x="10" y="14" width="4" height="1" />

{% endcase %}
