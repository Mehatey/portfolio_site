    stroke-width="2"

  />
  <rect class="nav-pixel__core" x="10.5" y="10.5" width="3" height="3" rx="1" />
</svg>

<svg class="nav-pixel nav-pixel--play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

{% when 'contact' %}
<!-- The ripple is gone. It was four 1.4-wide bars, four single-pixel corner
     sparks and an unfilled ring, spread over the whole 24 box from 1.6 to
     22.4. Every other mark in the row is a solid block inside 4..20 -- a cube
     face, a flower, a face -- so this one was simultaneously the widest thing
     in the nav and the emptiest, thin strokes around a hole. At 24px that
     stops reading as a ripple and starts reading as an aerial.

     Two further notes on what it cost. In the `.nav` variant the sparks and
     the ring were never given a fill or a stroke at all, so there only the
     four bars painted; the studio nav did colour them, which is why the mark
     looks different depending on which nav you are under. And the hover on
     `__core` was a 45-degree rotation, which suits one ring in the middle and
     nothing else.

     So: an envelope, built the way the About mark is built -- a filled block
     with the detail cut into it in the lighter tone, on a 2px grid, inside the
     same 4..20 box. It keeps the `__ray` and `__core` class names on purpose.
     Those two already carry a dark fill, a light-theme fill, a studio-nav teal
     and a hover fill; renaming them would have meant re-deriving colours that
     are already right. -->
<svg class="nav-pixel nav-pixel--contact" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="nav-pixel__ray" x="4" y="6" width="16" height="12" rx="1" />
  <rect class="nav-pixel__core" x="4" y="6" width="2" height="2" />
  <rect class="nav-pixel__core" x="18" y="6" width="2" height="2" />
  <rect class="nav-pixel__core" x="6" y="8" width="2" height="2" />
  <rect class="nav-pixel__core" x="16" y="8" width="2" height="2" />
  <rect class="nav-pixel__core" x="8" y="10" width="2" height="2" />
  <rect class="nav-pixel__core" x="14" y="10" width="2" height="2" />
  <rect class="nav-pixel__core" x="10" y="12" width="2" height="2" />
  <rect class="nav-pixel__core" x="12" y="12" width="2" height="2" />
</svg>
{% when 'about' %}
<svg class="nav-pixel nav-pixel--about" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="nav-pixel__tile" x="4" y="8" width="16" height="8" rx="1" />
  <rect class="nav-pixel__tile" x="8" y="4" width="8" height="16" rx="1" />
  <rect class="nav-pixel__eye" x="8" y="9" width="2" height="4" />
  <rect class="nav-pixel__eye" x="14" y="9" width="2" height="4" />
  <rect class="nav-pixel__mouth" x="10" y="14" width="4" height="1" />
</svg>
{% endcase %}
