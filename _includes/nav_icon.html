{% case include.icon %} {% when 'work' %}
<svg class="nav-pixel nav-pixel--work" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path
    d="M12 12c0-2.1 3.8-2.3 4.2.5.5 3.8-5.1 6.3-8.7 3.1C3.3 11.9 6.2 4.7 12.2 4c6.8-.8 10.4 6.9 6.7 12.2"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />
  <rect class="nav-pixel__core" x="10.5" y="10.5" width="3" height="3" rx="1" />
</svg>
{% when 'play' %}
<svg class="nav-pixel nav-pixel--play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="nav-pixel__stem" x="11" y="12" width="2" height="8" rx="1" />
  <rect class="nav-pixel__leaf" x="7" y="16" width="4" height="2" rx="1" />
  <rect class="nav-pixel__leaf" x="13" y="15" width="4" height="2" rx="1" />
  <rect class="nav-pixel__petal" x="10" y="3" width="4" height="4" rx="1" />
  <rect class="nav-pixel__petal" x="6" y="7" width="4" height="4" rx="1" />
  <rect class="nav-pixel__petal" x="14" y="7" width="4" height="4" rx="1" />
  <rect class="nav-pixel__petal" x="10" y="9" width="4" height="4" rx="1" />
  <rect class="nav-pixel__core" x="11" y="8" width="2" height="2" rx="1" />
</svg>
{% when 'contact' %}
<!-- Was a radiating ripple -- eight rays around a core. Sid asked for
     something else, and the ripple was the weakest of the four anyway: at
     nav size the rays read as a sun or a loading spinner, and it duplicated
     the pond's language in the footer without meaning the same thing.

     A speech bubble instead, in the same chunky pixel register as its
     neighbours. It says the one thing this link is for, and it matches the
     contact page's own headline -- "Start a conversation." The three dots
     inside are what stop it reading as a plain rounded rectangle at 24px. -->
<svg class="nav-pixel nav-pixel--contact" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="nav-pixel__bubble" x="3" y="4" width="18" height="13" rx="2.5" />
  <rect class="nav-pixel__tail" x="7" y="17" width="4" height="2" rx="1" />
  <rect class="nav-pixel__tail" x="7" y="19" width="2" height="2" rx="1" />
  <rect class="nav-pixel__dot" x="7" y="9.5" width="2.6" height="2.6" rx="1.3" />
  <rect class="nav-pixel__dot" x="10.7" y="9.5" width="2.6" height="2.6" rx="1.3" />
  <rect class="nav-pixel__dot" x="14.4" y="9.5" width="2.6" height="2.6" rx="1.3" />
</svg>
{% when 'about' %}
<svg class="nav-pixel nav-pixel--about" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="nav-pixel__tile" x="4" y="8" width="16" height="8" rx="1" />
  <rect class="nav-pixel__tile" x="8" y="4" width="8" height="16" rx="1" />
  <rect class="nav-pixel__eye" x="8" y="9" width="2" height="4" />
  <rect class="nav-pixel__eye" x="14" y="9" width="2" height="4" />
  <rect class="nav-pixel__mouth" x="10" y="14" width="4" height="1" />
</svg>
{% endcase %}
