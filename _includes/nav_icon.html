<!-- ── THE NAV MARKS ──────────────────────────────────────────────────────────
     Sid, twice: "rethink icons they look a little childish and not finesse",
     and then, about the replacements, "i hate all the new nav icons".

     He was right both times, and the second time is the interesting one,
     because the replacements were not childish. They were a properly built
     monoline set: one stroke weight, one ink, one filled dot for emphasis, a
     coherent subject vocabulary drawn from the site's own motifs. Every rule
     an icon set is supposed to follow, followed.

     They still failed, and looking at them at render size says why. At 27px a
     sprout is four strokes and a dot, and four strokes and a dot is not a
     plant — it is a stick. Two flattened ellipses under a dot is not a drop
     on water, it is a blob with a halo. A six-turn spiral at 27px closes into
     a smudge. The drawings were fine at 200px and none of them survived the
     size they actually ship at. That is not a taste failure, it is a scale
     failure, and no amount of redrawing fixes it while the labels sitting
     right beside them already say Work, Play, Contact, About in plain words.

     Which is the real point: this nav has never needed pictures. Every item
     is labelled. The icon was decoration carrying a risk and no information.

     So the marks are numerals now. Not an icon set — an index. The site
     already counts things everywhere: 01 Selected work in the home hero, the
     numbered lanes on /works/, the chapter rail on every project page, the
     ordinals beside every list row. Four mono figures in the nav is the same
     system arriving at the top of the page instead of a fifth visual language
     bolted on. They are legible at any size because digits are, they inherit
     the label's ink so they cannot drift out of theme, and they give the row
     a rhythm the icons never did: a fixed-width column of numbers before a
     variable-width column of words.
     ────────────────────────────────────────────────────────────────────── -->
{% case include.icon %} {% when 'work' %}
<i class="nav-idx" aria-hidden="true">01</i>
{% when 'play' %}
<i class="nav-idx" aria-hidden="true">02</i>
{% when 'contact' %}
<i class="nav-idx" aria-hidden="true">03</i>
{% when 'about' %}
<i class="nav-idx" aria-hidden="true">04</i>
{% endcase %}
