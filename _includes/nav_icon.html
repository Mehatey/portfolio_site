{% when 'contact' %}
<!-- The envelope came out. Sid: "contact icon mail is too generic can do
     something abstract."

     He is right and it is the same fault the ripple had, arriving from the
     opposite direction. The ripple was a shape from nowhere; the envelope is a
     shape from everywhere -- it is the icon every product ships, so it says
     "message" and nothing about whose message. The other three marks in this
     row are all specific to him: a spiral he drew, a flower, his own cube
     face. An envelope between them is the one item you could swap for a stock
     glyph and lose nothing.

     So: a transmission. A solid block, and three pixels leaving it on a
     diagonal, each one further out and each one lighter. Nothing in it is a
     picture of anything -- it is a mark that has departed, which is what
     sending is. It reads at 24px because it is four objects and they are all
     on the same 2px grid the About mark uses, and it keeps the __ray and
     __core class names so the four colours already derived for it -- dark
     fill, light-theme fill, studio-nav teal, hover -- all still apply. -->
<svg class="nav-pixel nav-pixel--contact" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="nav-pixel__ray" x="3" y="13" width="8" height="8" rx="1" />
  <rect class="nav-pixel__core" x="13" y="10" width="3" height="3" rx="0.6" />
  <rect class="nav-pixel__core" x="16.5" y="6.5" width="2.5" height="2.5" rx="0.5" />
  <rect class="nav-pixel__core" x="19.5" y="3.5" width="2" height="2" rx="0.4" />
</svg>
{% when 'about' %}
<svg class="nav-pixel nav-pixel--about" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect class="nav-pixel__tile" x="4" y="8" width="16" height="8" rx="1" />
  <rect class="nav-pixel__tile" x="8" y="4" width="8" height="16" rx="1" />
  <rect class="nav-pixel__eye" x="8" y="9" width="2" height="4" />
  <rect class="nav-pixel__eye" x="14" y="9" width="2" height="4" />
  <rect class="nav-pixel__mouth" x="10" y="14" width="4" height="1" />
</svg>
{% endcase %}
