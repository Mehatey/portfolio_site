<header class="studio-nav" aria-label="Primary navigation">
  <a class="studio-mark" href="{{ site.baseurl }}/" aria-label="Sid Mehta, home">
    <span class="studio-glass-noise" aria-hidden="true"></span>
    {% include site_logo.html %}
  </a>

  <nav class="studio-links" aria-label="Portfolio sections">
    <span class="studio-glass-noise" aria-hidden="true"></span>
    <a
      class="nav-icon studio-link{% if include.active == 'work' %} is-active{% endif %}"
      href="{{ site.baseurl }}/works/"
      data-label="Work"
      aria-label="Work"
    >
      {% include nav_icon.html icon="work" %}
    </a>
    <a
      class="nav-icon studio-link{% if include.active == 'play' %} is-active{% endif %}"
      href="{{ site.baseurl }}/play/"
      data-label="Play"
      aria-label="Play"
    >
      {% include nav_icon.html icon="play" %}
    </a>
    <a
      class="nav-icon studio-link{% if include.active == 'contact' %} is-active{% endif %}"
      href="{{ site.baseurl }}/contact/"
      data-label="Contact"
      aria-label="Contact"
    >
      {% include nav_icon.html icon="contact" %}
    </a>
    <a
      class="nav-icon studio-link{% if include.active == 'about' %} is-active{% endif %}"
      href="{{ site.baseurl }}/about/"
      data-label="About"
      aria-label="About"
    >
      {% include nav_icon.html icon="about" %}
    </a>
  </nav>
</header>

<style>
  .studio-nav {
    --nav-ink: #edf5ff;
    --glass-x: 50%;
    --glass-y: 50%;
    position: fixed;
    z-index: 9000;
    inset: 22px 24px auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }

  .studio-mark,
  .studio-links {
    position: relative;
    isolation: isolate;
    overflow: visible;
    pointer-events: auto;
    border: 1px solid rgba(200, 224, 255, 0.18);
    background:
      radial-gradient(circle at var(--glass-x) var(--glass-y), rgba(255, 255, 255, 0.16), transparent 34%),
      linear-gradient(140deg, rgba(197, 219, 244, 0.13), rgba(7, 15, 28, 0.38) 48%, rgba(116, 164, 211, 0.12));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.22),
      inset 0 -1px 0 rgba(74, 126, 179, 0.12),
      0 14px 38px rgba(0, 0, 0, 0.22);
    -webkit-backdrop-filter: blur(24px) saturate(1.65) contrast(1.05);
    backdrop-filter: blur(24px) saturate(1.65) contrast(1.05);
  }

  .studio-mark::before,
  .studio-links::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 1px;
    border-radius: inherit;
    background: linear-gradient(115deg, rgba(255, 255, 255, 0.14), transparent 28%, transparent 70%, rgba(111, 184, 255, 0.12));
    pointer-events: none;
  }

  .studio-glass-noise {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    opacity: 0.12;
    mix-blend-mode: soft-light;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E");
  }

  .studio-mark {
    width: 66px;
    height: 66px;
    display: grid;
    place-items: center;
    border-radius: 22px 18px 24px 20px;
    color: var(--nav-ink);
    transform: translateZ(0);
    transition:
      transform 500ms cubic-bezier(0.16, 1, 0.3, 1),
      border-radius 500ms cubic-bezier(0.16, 1, 0.3, 1),
      box-shadow 500ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-mark:hover,
  .studio-mark:focus-visible {
    transform: translateY(-2px) rotate(-2deg);
    border-radius: 18px 24px 19px 26px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.3),
      0 18px 44px rgba(0, 0, 0, 0.28),
      0 0 28px rgba(111, 184, 255, 0.12);
  }

  .studio-mark .logo-cube {
    width: 34px;
    height: 34px;
    overflow: visible;
  }

  .studio-mark .cube-front,
  .studio-mark .cube-face,
  .studio-mark .logo-scan {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.35;
    vector-effect: non-scaling-stroke;
  }

  .studio-mark .cube-face {
    opacity: 0;
    transform-origin: center;
    transition: opacity 400ms ease;
  }

  .studio-mark:hover .cube-face,
  .studio-mark:focus-visible .cube-face {
    opacity: 0.72;
  }

  .studio-mark .logo-gaze {
    transform-origin: 15px 21px;
    transition: transform 450ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-mark:hover .logo-gaze,
  .studio-mark:focus-visible .logo-gaze {
    transform: scaleY(1.14);
  }

  .studio-links {
    min-height: 66px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px;
    border-radius: 27px 23px 29px 25px;
  }

  .studio-link {
    position: relative;
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    color: var(--nav-ink);
    text-decoration: none;
    outline: none;
    transition:
      transform 450ms cubic-bezier(0.16, 1, 0.3, 1),
      background-color 350ms ease,
      box-shadow 450ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-link svg {
    width: 26px;
    height: 26px;
    image-rendering: pixelated;
    filter: saturate(1.12) brightness(1.08);
    transform-origin: center;
    transition: transform 500ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-link::after {
    content: attr(data-label);
    position: absolute;
    top: calc(100% + 13px);
    left: 50%;
    transform: translate(-50%, -4px);
    padding: 7px 10px;
    border: 1px solid rgba(199, 224, 255, 0.16);
    border-radius: 999px;
    color: #eaf3ff;
    background: rgba(6, 12, 21, 0.82);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    font:
      500 10px/1 "DM Mono",
      monospace;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition:
      opacity 180ms ease,
      transform 280ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-link:hover,
  .studio-link:focus-visible,
  .studio-link.is-active {
    transform: translateY(-2px);
    background: rgba(215, 233, 255, 0.1);
    box-shadow:
      inset 0 0 0 1px rgba(223, 239, 255, 0.1),
      0 8px 24px rgba(0, 0, 0, 0.15);
  }

  .studio-link:hover::after,
  .studio-link:focus-visible::after {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .studio-link:nth-of-type(1):hover svg,
  .studio-link:nth-of-type(1):focus-visible svg {
    transform: rotate(180deg) scale(1.08);
  }

  .studio-link:nth-of-type(2):hover svg,
  .studio-link:nth-of-type(2):focus-visible svg {
    transform: translateY(-2px) rotate(-7deg) scale(1.08);
  }

  .studio-link:nth-of-type(3):hover svg,
  .studio-link:nth-of-type(3):focus-visible svg {
    transform: scale(1.14) rotate(45deg);
  }

  .studio-link:nth-of-type(4):hover svg,
  .studio-link:nth-of-type(4):focus-visible svg {
    transform: rotate(-8deg) scale(1.1);
  }

  html[data-theme="light"] .studio-nav {
    --nav-ink: #0b2b4c;
  }

  html[data-theme="light"] .studio-mark,
  html[data-theme="light"] .studio-links {
    border-color: rgba(24, 58, 94, 0.14);
    background:
      radial-gradient(circle at var(--glass-x) var(--glass-y), rgba(255, 255, 255, 0.72), transparent 36%),
      linear-gradient(145deg, rgba(255, 255, 255, 0.6), rgba(198, 215, 233, 0.35));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.82),
      inset 0 -1px 0 rgba(42, 85, 129, 0.08),
      0 14px 38px rgba(22, 44, 69, 0.12);
  }

  html[data-theme="light"] .studio-link svg {
    filter: saturate(1.2) brightness(0.94) contrast(1.1);
  }

  @media (max-width: 720px) {
    .studio-nav {
      inset: 14px 14px auto;
    }

    .studio-mark {
      width: 54px;
      height: 54px;
      border-radius: 18px;
    }

    .studio-mark .logo-cube {
      width: 29px;
      height: 29px;
    }

    .studio-links {
      min-height: 54px;
      gap: 2px;
      padding: 5px;
      border-radius: 21px;
    }

    .studio-link {
      width: 42px;
      height: 42px;
      border-radius: 14px;
    }

    .studio-link svg {
      width: 23px;
      height: 23px;
    }

    .studio-link::after {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .studio-mark,
    .studio-mark .logo-gaze,
    .studio-link,
    .studio-link svg {
      transition-duration: 1ms !important;
    }
  }
</style>

<script>
  (() => {
    const nav = document.currentScript?.previousElementSibling?.previousElementSibling;
    if (!nav || !nav.classList.contains("studio-nav")) return;

    nav.addEventListener("pointermove", (event) => {
      const rect = nav.getBoundingClientRect();
      nav.style.setProperty("--glass-x", `${event.clientX - rect.left}px`);
      nav.style.setProperty("--glass-y", `${event.clientY - rect.top}px`);
    });
  })();
</script>
