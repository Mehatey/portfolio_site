<header class="studio-nav" aria-label="Primary navigation">
  <a class="studio-mark" href="{{ site.baseurl }}/" aria-label="Sid Mehta, home">
    {% include site_logo.html %}
    <span class="studio-mark-label">Sid Mehta</span>
  </a>

  <nav class="studio-links" aria-label="Portfolio sections">
    <a class="studio-link{% if include.active == 'work' %} is-active{% endif %}" href="{{ site.baseurl }}/works/" aria-label="Work">
      {% include nav_icon.html icon="work" %}<span><b data-roll="Work">Work</b></span>
    </a>
    <a class="studio-link{% if include.active == 'play' %} is-active{% endif %}" href="{{ site.baseurl }}/play/" aria-label="Play">
      {% include nav_icon.html icon="play" %}<span><b data-roll="Play">Play</b></span>
    </a>
    <a class="studio-link{% if include.active == 'contact' %} is-active{% endif %}" href="{{ site.baseurl }}/contact/" aria-label="Contact">
      {% include nav_icon.html icon="contact" %}<span><b data-roll="Contact">Contact</b></span>
    </a>
    <a class="studio-link{% if include.active == 'about' %} is-active{% endif %}" href="{{ site.baseurl }}/about/" aria-label="About">
      {% include nav_icon.html icon="about" %}<span><b data-roll="About">About</b></span>
    </a>
    <a class="studio-hire" href="mailto:sidmehtadesign@gmail.com" aria-label="Open to roles — email Sid Mehta">
      <span class="studio-hire__dot" aria-hidden="true"></span>
      <span class="studio-hire__label"><b data-roll="Say hello →">Open to roles</b></span>
    </a>
  </nav>
</header>

<style>
  .studio-nav {
    --nav-ink: #f5f7fb;
    position: fixed;
    z-index: 9000;
    inset: 22px clamp(18px, 2.5vw, 40px) auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    pointer-events: none;
  }

  .studio-mark,
  .studio-link {
    pointer-events: auto;
    color: var(--nav-ink);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .studio-mark {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 48px;
    outline: none;
  }

  .studio-mark .logo-cube {
    width: 38px;
    height: 38px;
    overflow: visible;
    filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.32));
    transition: transform 560ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-mark .cube-front,
  .studio-mark .cube-face,
  .studio-mark .logo-scan {
    fill: rgba(5, 12, 23, 0.82);
    stroke: currentColor;
    stroke-width: 1.2;
    vector-effect: non-scaling-stroke;
  }

  .studio-mark .logo-scan {
    fill: none;
    opacity: 0.55;
  }

  .studio-mark .logo-gaze {
    transform-origin: 15px 21px;
    transition: transform 460ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-mark-label {
    font:
      500 11px/1.2 "DM Mono",
      monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateX(-7px);
    transition:
      opacity 220ms ease,
      transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
  }

  .studio-mark:hover .logo-gaze,
  .studio-mark:focus-visible .logo-gaze {
    transform: scaleY(1.1);
  }

  .studio-mark-label {
    display: none;
  }

  /* ── LIQUID GLASS ───────────────────────────────────────────────────────
     The old glass lived on `.nav .nav-links`, an element this nav replaced
     months ago, so every one of those rules has been painting nothing. This
     is the real thing, on the element that actually exists.

     Four layers, because that is what glass is: a blurred, saturated backdrop
     so the page's colour bleeds through; a specular sheen along the top lip;
     a moving highlight that tracks the pointer, so the surface reads as
     curved rather than flat; and a refraction ring at the very edge, blurred
     harder than the body, which is what sells a thick piece of glass — light
     bends most where the surface turns away from you. */
  .studio-links {
    --gx: 72%;
    --gy: 8%;
    position: relative;
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.25vw, 20px);
    padding: 5px clamp(10px, 1vw, 15px);
    border-radius: 999px;
    pointer-events: auto;
    isolation: isolate;
    background:
      radial-gradient(120px 70px at var(--gx) var(--gy), rgba(255, 255, 255, 0.17), transparent 66%),
      linear-gradient(168deg, rgba(126, 165, 208, 0.16), rgba(6, 11, 20, 0.3) 58%, rgba(88, 132, 180, 0.12));
    backdrop-filter: blur(20px) saturate(1.9) brightness(0.94);
    -webkit-backdrop-filter: blur(20px) saturate(1.9) brightness(0.94);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.34),
      inset 0 -1px 0 rgba(255, 255, 255, 0.07),
      inset 0 0 24px rgba(160, 200, 245, 0.06),
      0 12px 34px rgba(0, 0, 0, 0.26);
    transition:
      box-shadow 420ms ease,
      background 420ms ease,
      transform 560ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* The refraction ring. Blurring the backdrop twice as hard in a 1.5px band
     at the perimeter is what a real bevel does to whatever is behind it. */
  .studio-links::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    padding: 1.5px;
    background: linear-gradient(
      150deg,
      rgba(255, 255, 255, 0.62),
      rgba(255, 255, 255, 0.06) 38%,
      rgba(255, 255, 255, 0.03) 64%,
      rgba(190, 222, 255, 0.4)
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
  }

  /* The travelling caustic. It is deliberately larger than the capsule and
     clipped by it, so the bright part sweeps rather than sits. */
  .studio-links::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    overflow: hidden;
    background: radial-gradient(64px 34px at var(--gx) var(--gy), rgba(226, 242, 255, 0.3), transparent 70%);
    opacity: 0;
    transition: opacity 320ms ease;
    pointer-events: none;
  }

  .studio-links:hover::after,
  .studio-links:focus-within::after {
    opacity: 1;
  }

  /* Once the page has moved, the glass thickens — more blur, deeper shadow —
     because by then it is floating over content rather than over the header. */
  body.nav-lifted .studio-links {
    background:
      radial-gradient(120px 70px at var(--gx) var(--gy), rgba(255, 255, 255, 0.2), transparent 66%),
      linear-gradient(168deg, rgba(126, 165, 208, 0.2), rgba(5, 9, 17, 0.44) 58%, rgba(88, 132, 180, 0.16));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      inset 0 -1px 0 rgba(255, 255, 255, 0.08),
      inset 0 0 26px rgba(160, 200, 245, 0.08),
      0 16px 44px rgba(0, 0, 0, 0.38);
  }

  html[data-theme="light"] .studio-links {
    background:
      radial-gradient(120px 70px at var(--gx) var(--gy), rgba(255, 255, 255, 0.95), transparent 66%),
      linear-gradient(168deg, rgba(255, 255, 255, 0.66), rgba(214, 227, 240, 0.36));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 1),
      inset 0 -1px 0 rgba(60, 104, 148, 0.1),
      0 12px 32px rgba(30, 56, 84, 0.12);
    backdrop-filter: blur(21px) saturate(1.7);
    -webkit-backdrop-filter: blur(21px) saturate(1.7);
  }

  html[data-theme="light"] .studio-links::before {
    background: linear-gradient(150deg, rgba(255, 255, 255, 1), rgba(120, 158, 196, 0.22) 40%, rgba(255, 255, 255, 0.5));
  }

  /* Contact is hard-dark at every theme, so it opts back out of the above. */
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-links {
    background:
      radial-gradient(120px 70px at var(--gx) var(--gy), rgba(255, 255, 255, 0.17), transparent 66%),
      linear-gradient(168deg, rgba(126, 165, 208, 0.16), rgba(6, 11, 20, 0.3) 58%, rgba(88, 132, 180, 0.12));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.34),
      inset 0 -1px 0 rgba(255, 255, 255, 0.07),
      0 12px 34px rgba(0, 0, 0, 0.26);
  }
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-links::before {
    background: linear-gradient(150deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.06) 38%, rgba(190, 222, 255, 0.4));
  }

  /* The mark gets the same material so the two ends of the bar belong to each
     other, at circle rather than capsule proportion. */
  .studio-mark {
    padding: 5px;
    border-radius: 50%;
    background: linear-gradient(168deg, rgba(126, 165, 208, 0.14), rgba(6, 11, 20, 0.26));
    backdrop-filter: blur(18px) saturate(1.7);
    -webkit-backdrop-filter: blur(18px) saturate(1.7);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.3),
      0 10px 28px rgba(0, 0, 0, 0.24);
  }
  html[data-theme="light"] .studio-mark {
    background: linear-gradient(168deg, rgba(255, 255, 255, 0.72), rgba(214, 227, 240, 0.4));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 1),
      0 10px 26px rgba(30, 56, 84, 0.12);
  }
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-mark {
    background: linear-gradient(168deg, rgba(126, 165, 208, 0.14), rgba(6, 11, 20, 0.26));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.3),
      0 10px 28px rgba(0, 0, 0, 0.24);
  }

  .studio-link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    outline: none;
    opacity: 0.86;
    transition:
      opacity 180ms ease,
      transform 380ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-link svg {
    width: 25px;
    height: 25px;
    overflow: visible;
    filter: drop-shadow(0 2px 7px rgba(0, 0, 0, 0.4));
    transform-origin: center;
    transition:
      transform 460ms cubic-bezier(0.16, 1, 0.3, 1),
      filter 220ms ease;
  }

  .studio-link > span {
    font:
      500 11px/1 "DM Mono",
      monospace;
    letter-spacing: 0.06em;
    text-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
    display: inline-block;
    overflow: hidden;
    vertical-align: middle;
  }
  /* The k95 rolling label. Two copies of the word stacked in one clipped box;
     the visible one leaves upward as its duplicate arrives from below, so the
     label re-sets itself rather than just changing colour. */
  .studio-link > span > b {
    position: relative;
    display: block;
    font-weight: inherit;
    transition: transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .studio-link > span > b::after {
    content: attr(data-roll);
    position: absolute;
    left: 0;
    top: 100%;
    width: 100%;
  }
  .studio-link:hover > span > b,
  .studio-link:focus-visible > span > b,
  .studio-link.is-active > span > b {
    transform: translateY(-100%);
  }
  @media (prefers-reduced-motion: reduce) {
    .studio-link > span > b {
      transition: none;
    }
  }

  .studio-link::after {
    content: "";
    position: absolute;
    left: 33px;
    right: 0;
    bottom: 4px;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-link:hover,
  .studio-link:focus-visible,
  .studio-link.is-active {
    opacity: 1;
    transform: translateY(-2px);
  }

  .studio-link:hover::after,
  .studio-link:focus-visible::after,
  .studio-link.is-active::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  .studio-link:nth-child(1):hover svg,
  .studio-link:nth-child(1):focus-visible svg {
    transform: rotate(135deg) scale(1.08);
  }
  .studio-link:nth-child(2):hover svg,
  .studio-link:nth-child(2):focus-visible svg {
    transform: translateY(-2px) rotate(-7deg) scale(1.08);
  }
  .studio-link:nth-child(3):hover svg,
  .studio-link:nth-child(3):focus-visible svg {
    transform: rotate(45deg) scale(1.1);
  }
  .studio-link:nth-child(4):hover svg,
  .studio-link:nth-child(4):focus-visible svg {
    transform: rotate(-7deg) scale(1.08);
  }

  .studio-link:active,
  .studio-mark:active {
    transform: scale(0.96);
  }

  .studio-link:focus-visible,
  .studio-mark:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 5px;
  }

  .studio-link .nav-pixel--work path {
    stroke: #168cff;
  }
  .studio-link .nav-pixel--work rect {
    fill: #168cff;
  }
  .studio-link .nav-pixel--play .nav-pixel__stem,
  .studio-link .nav-pixel--play .nav-pixel__leaf {
    fill: #44b84d;
  }
  .studio-link .nav-pixel--play .nav-pixel__petal {
    fill: #ff2459;
  }
  .studio-link .nav-pixel--play .nav-pixel__core {
    fill: #ffd7c9;
  }
  .studio-link .nav-pixel--contact .nav-pixel__ray {
    fill: #d9683f;
  }
  .studio-link .nav-pixel--contact .nav-pixel__core {
    fill: #ff9a72;
  }
  .studio-link .nav-pixel--about .nav-pixel__tile {
    fill: #009b90;
  }
  .studio-link .nav-pixel--about .nav-pixel__eye,
  .studio-link .nav-pixel--about .nav-pixel__mouth {
    fill: #eaffff;
  }

  html[data-theme="light"] .studio-nav {
    --nav-ink: #0a1727;
  }
  html[data-theme="light"] .studio-mark .cube-front {
    fill: rgba(237, 243, 248, 0.92);
  }
  html[data-theme="light"] .studio-mark-label,
  html[data-theme="light"] .studio-link > span {
    text-shadow: 0 1px 7px rgba(255, 255, 255, 0.9);
  }
  .home-page .studio-nav,
  .contact-page .studio-nav,
  .play-page .studio-nav {
    --nav-ink: #f5f7fb;
  }

  /* Contact is hard-dark at every theme (#020407, no light rules at all),
     so the light-theme nav treatment above must not reach it — its
     [data-theme] selector outweighs the page-class rule and was painting
     near-black labels and a white-filled mark onto a black page.

     Home is in the list too. The comment that used to sit here said it
     was not - that the home rebuild had given it a cream --home-bg and the
     exception was forcing white labels onto it. That is still true of the
     document background, but the current home is a full-viewport dark
     portal: the smoke canvas and cube stage cover the cream at every
     theme, so what the nav actually sits on is black. Screenshotting it in
     light theme showed near-white labels on a near-white capsule over that
     black. Judge by what is painted, not by what the root computes to.

     Play is still deliberately NOT in this list. It used to be dark-canvas at
     every theme, but the home rebuild gave it a real light palette
     (--home-bg: #f2efe8), and this exception kept forcing #f5f7fb labels
     onto that cream — white-on-cream, contrast about 1.05, the nav simply
     vanished. It is the standalone root page and
     carries its own nav, so it never included this partial. */
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-nav {
    --nav-ink: #f5f7fb;
  }
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-mark .cube-front {
    fill: rgba(5, 12, 23, 0.82);
  }
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-mark-label,
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-link > span {
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
  }
  /* Contact stays hard-dark at every theme, so the hire pill has to opt back
     out of the light treatment or it lands white-on-black-on-white. */
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-hire {
    border-color: rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.05);
  }
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-hire:hover,
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-hire:focus-visible {
    border-color: rgba(255, 255, 255, 0.42);
    background: rgba(255, 255, 255, 0.1);
  }
  html[data-theme="light"] :is(.contact-page, .home-page) .studio-hire__label {
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.75);
  }

  /* noth.in keeps a "let's chat" affordance visible on every screen rather than
     parking it behind a contact page. Same idea, stated as availability instead
     of a sales button: a live dot and four words, present on every page, one
     click from an email. The label rolls to "Say hello →" on hover — the same
     two-copy roll the nav items use, so it reads as part of the nav rather
     than an ad stuck to it. */
  .studio-hire {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 12px 0 10px;
    margin-left: 2px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    color: var(--nav-ink);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition:
      border-color 300ms ease,
      background 300ms ease,
      transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .studio-hire:hover,
  .studio-hire:focus-visible {
    border-color: rgba(255, 255, 255, 0.42);
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
  }
  html[data-theme="light"] .studio-hire {
    border-color: rgba(7, 9, 15, 0.2);
    background: rgba(255, 255, 255, 0.5);
  }
  html[data-theme="light"] .studio-hire:hover,
  html[data-theme="light"] .studio-hire:focus-visible {
    border-color: rgba(7, 9, 15, 0.45);
    background: rgba(255, 255, 255, 0.78);
  }
  .studio-hire__dot {
    position: relative;
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6fdca4;
    box-shadow: 0 0 0 0 rgba(111, 220, 164, 0.55);
    animation: hire-pulse 2600ms ease-out infinite;
  }
  @keyframes hire-pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(111, 220, 164, 0.5);
    }
    70% {
      box-shadow: 0 0 0 7px rgba(111, 220, 164, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(111, 220, 164, 0);
    }
  }
  .studio-hire__label {
    font:
      500 11px/1 "DM Mono",
      monospace;
    letter-spacing: 0.06em;
    display: inline-block;
    overflow: hidden;
    vertical-align: middle;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
  }
  html[data-theme="light"] .studio-hire__label {
    text-shadow: none;
  }
  .studio-hire__label > b {
    position: relative;
    display: block;
    font-weight: inherit;
    white-space: nowrap;
    transition: transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .studio-hire__label > b::after {
    content: attr(data-roll);
    position: absolute;
    left: 0;
    top: 100%;
    width: 100%;
    white-space: nowrap;
  }
  .studio-hire:hover .studio-hire__label > b,
  .studio-hire:focus-visible .studio-hire__label > b {
    transform: translateY(-100%);
  }
  @media (prefers-reduced-motion: reduce) {
    .studio-hire__dot {
      animation: none;
    }
    .studio-hire__label > b {
      transition: none;
    }
  }

  @media (max-width: 760px) {
    .studio-nav {
      inset: 13px 14px auto;
    }
    /* Narrow screens keep the signal, drop the words: the pill collapses to the
       live dot, which is still a tap target to the same mailto. */
    .studio-hire {
      width: 32px;
      padding: 0;
      justify-content: center;
      margin-left: 2px;
    }
    .studio-hire__label {
      display: none;
    }
    .studio-mark .logo-cube {
      width: 34px;
      height: 34px;
    }
    .studio-mark-label,
    .studio-link > span {
      display: none;
    }
    .studio-links {
      gap: 4px;
      padding: 4px 7px;
    }
    .studio-mark {
      padding: 3px;
    }
    .studio-link {
      width: 42px;
      justify-content: center;
    }
    .studio-link::after {
      left: 9px;
      right: 9px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .studio-mark .logo-cube,
    .studio-mark .cube-face,
    .studio-mark .logo-gaze,
    .studio-mark-label,
    .studio-link,
    .studio-link svg,
    .studio-link::after {
      transition-duration: 1ms !important;
    }
  }
</style>

<script>
  /* The highlight has to follow the pointer for the surface to read as curved.
     Tracked on the capsule itself rather than on the window, so it costs
     nothing until the pointer is actually over the glass. `nav-lifted` is the
     scroll state: past the first screenful the bar is floating over content,
     and the material thickens to match. */
  (function () {
    var caps = document.querySelector(".studio-links");
    if (!caps) return;
    var fine = !(window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse)").matches);
    if (fine) {
      caps.addEventListener(
        "pointermove",
        function (e) {
          var r = caps.getBoundingClientRect();
          caps.style.setProperty("--gx", (((e.clientX - r.left) / r.width) * 100).toFixed(1) + "%");
          caps.style.setProperty("--gy", (((e.clientY - r.top) / r.height) * 100).toFixed(1) + "%");
        },
        { passive: true }
      );
      caps.addEventListener("pointerleave", function () {
        caps.style.setProperty("--gx", "72%");
        caps.style.setProperty("--gy", "8%");
      });
    }
    var lifted = false;
    var ticking = false;
    function read() {
      ticking = false;
      var want = (window.scrollY || document.documentElement.scrollTop || 0) > 40;
      if (want === lifted) return;
      lifted = want;
      document.body.classList.toggle("nav-lifted", want);
    }
    window.addEventListener(
      "scroll",
      function () {
