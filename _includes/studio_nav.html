<header class="studio-nav" aria-label="Primary navigation">
  <a class="studio-mark" href="{{ site.baseurl }}/" aria-label="Sid Mehta, home">
    {% include site_logo.html %}
    <span class="studio-mark-label">Sid Mehta</span>
  </a>

  <nav class="studio-links" aria-label="Portfolio sections">
    <a class="studio-link{% if include.active == 'work' %} is-active{% endif %}" href="{{ site.baseurl }}/works/" aria-label="Work">
      {% include nav_icon.html icon="work" %}<span>Work</span>
    </a>
    <a class="studio-link{% if include.active == 'play' %} is-active{% endif %}" href="{{ site.baseurl }}/play/" aria-label="Play">
      {% include nav_icon.html icon="play" %}<span>Play</span>
    </a>
    <a class="studio-link{% if include.active == 'contact' %} is-active{% endif %}" href="{{ site.baseurl }}/contact/" aria-label="Contact">
      {% include nav_icon.html icon="contact" %}<span>Contact</span>
    </a>
    <a class="studio-link{% if include.active == 'about' %} is-active{% endif %}" href="{{ site.baseurl }}/about/" aria-label="About">
      {% include nav_icon.html icon="about" %}<span>About</span>
    </a>
  </nav>
</header>

<style>
  .studio-nav {
    --nav-ink: #f5f7fb;
    position: fixed;
    z-index: 9000;
    inset: 22px clamp(18px, 2.5vw, 40px) auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    pointer-events: none;
  }

  /* Legibility scrim: keeps nav readable when it overlaps bright imagery on
     scroll (e.g. the home work grid). Invisible over the site's dark surfaces
     because it fades to transparent and sits within the nav's stacking context. */
  .studio-nav::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 118px;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(4, 6, 11, 0.8) 0%, rgba(4, 6, 11, 0.42) 45%, transparent 100%);
  }
  .studio-link span {
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
  }
  .studio-link .nav-pixel,
  .studio-mark .logo-cube {
    filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.6));
  }
  @media (prefers-reduced-motion: reduce) {
    .studio-nav::before {
      transition: none;
    }
  }

  .studio-mark,
  .studio-link {
    pointer-events: auto;
    color: var(--nav-ink);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .studio-mark {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 48px;
    outline: none;
  }

  .studio-mark .logo-cube {
    width: 38px;
    height: 38px;
    overflow: visible;
    filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.32));
    transition: transform 560ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-mark .cube-front,
  .studio-mark .cube-face,
  .studio-mark .logo-scan {
    fill: rgba(5, 12, 23, 0.82);
    stroke: currentColor;
    stroke-width: 1.2;
    vector-effect: non-scaling-stroke;
  }

  .studio-mark .logo-scan {
    fill: none;
    opacity: 0.55;
  }

  .studio-mark .logo-gaze {
    transform-origin: 15px 21px;
    transition: transform 460ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-mark-label {
    font:
      500 11px/1.2 "DM Mono",
      monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateX(-7px);
    transition:
      opacity 220ms ease,
      transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
  }

  .studio-mark:hover .logo-gaze,
  .studio-mark:focus-visible .logo-gaze {
    transform: scaleY(1.1);
  }

  .studio-mark-label {
    display: none;
  }

  .studio-links {
    display: flex;
    align-items: center;
    gap: clamp(14px, 1.7vw, 28px);
    pointer-events: auto;
  }

  .studio-link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    outline: none;
    opacity: 0.7;
    transition:
      opacity 180ms ease,
      transform 380ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-link svg {
    width: 25px;
    height: 25px;
    overflow: visible;
    filter: drop-shadow(0 2px 7px rgba(0, 0, 0, 0.4));
    transform-origin: center;
    transition:
      transform 460ms cubic-bezier(0.16, 1, 0.3, 1),
      filter 220ms ease;
  }

  .studio-link > span {
    font:
      500 11px/1 "DM Mono",
      monospace;
    letter-spacing: 0.06em;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.62);
  }

  .studio-link::after {
    content: "";
    position: absolute;
    left: 33px;
    right: 0;
    bottom: 4px;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-link:hover,
  .studio-link:focus-visible,
  .studio-link.is-active {
    opacity: 1;
    transform: translateY(-2px);
  }

  .studio-link:hover::after,
  .studio-link:focus-visible::after,
  .studio-link.is-active::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  .studio-link:nth-child(1):hover svg,
  .studio-link:nth-child(1):focus-visible svg {
    transform: rotate(135deg) scale(1.08);
  }
  .studio-link:nth-child(2):hover svg,
  .studio-link:nth-child(2):focus-visible svg {
    transform: translateY(-2px) rotate(-7deg) scale(1.08);
  }
  .studio-link:nth-child(3):hover svg,
  .studio-link:nth-child(3):focus-visible svg {
    transform: rotate(45deg) scale(1.1);
  }
  .studio-link:nth-child(4):hover svg,
  .studio-link:nth-child(4):focus-visible svg {
    transform: rotate(-7deg) scale(1.08);
  }

  .studio-link:active,
  .studio-mark:active {
    transform: scale(0.96);
  }

  .studio-link:focus-visible,
  .studio-mark:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 5px;
  }

  .studio-link .nav-pixel--work path {
    stroke: #168cff;
  }
  .studio-link .nav-pixel--work rect {
    fill: #168cff;
  }
  .studio-link .nav-pixel--play .nav-pixel__stem,
  .studio-link .nav-pixel--play .nav-pixel__leaf {
    fill: #44b84d;
  }
  .studio-link .nav-pixel--play .nav-pixel__petal {
    fill: #ff2459;
  }
  .studio-link .nav-pixel--play .nav-pixel__core {
    fill: #ffc928;
  }
  .studio-link .nav-pixel--contact .nav-pixel__ray {
    fill: #e69b00;
  }
  .studio-link .nav-pixel--contact .nav-pixel__core {
    fill: #ffc631;
  }
  .studio-link .nav-pixel--about .nav-pixel__tile {
    fill: #009b90;
  }
  .studio-link .nav-pixel--about .nav-pixel__eye,
  .studio-link .nav-pixel--about .nav-pixel__mouth {
    fill: #eaffff;
  }

  html[data-theme="light"] .studio-nav {
    --nav-ink: #0a1727;
  }
  html[data-theme="light"] .studio-mark .cube-front {
    fill: rgba(237, 243, 248, 0.92);
  }
  html[data-theme="light"] .studio-mark-label,
  html[data-theme="light"] .studio-link > span {
    text-shadow: 0 1px 7px rgba(255, 255, 255, 0.9);
  }
  .home-page .studio-nav,
  .contact-page .studio-nav,
  .play-page .studio-nav {
    --nav-ink: #f5f7fb;
  }

  @media (max-width: 760px) {
    .studio-nav {
      inset: 13px 14px auto;
    }
    .studio-mark .logo-cube {
      width: 34px;
      height: 34px;
    }
    .studio-mark-label {
      display: none;
    }
    .studio-links {
      gap: 6px;
    }
    /* Mobile: keep the pixel-icon identity but add a tiny label under each
       so the icons are legible to first-time visitors. */
    .studio-link {
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 52px;
      justify-content: flex-start;
      opacity: 0.85;
    }
    .studio-link svg {
      width: 22px;
      height: 22px;
    }
    .studio-link > span {
      display: block;
      font:
        500 8.5px/1 "DM Mono",
        monospace;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      opacity: 0.92;
    }
    .studio-link.is-active {
      opacity: 1;
    }
    .studio-link::after {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .studio-mark .logo-cube,
    .studio-mark .cube-face,
    .studio-mark .logo-gaze,
    .studio-mark-label,
    .studio-link,
    .studio-link svg,
    .studio-link::after {
      transition-duration: 1ms !important;
    }
  }

  /* ── Logo life: living gaze + click-to-celebrate (classes toggled by the
       script below). Scoped to the nav mark; reduced-motion disables it all. ── */
  .studio-mark .logo-cube.look-l .logo-gaze {
    transform: translateX(-2px);
  }
  .studio-mark .logo-cube.look-r .logo-gaze {
    transform: translateX(2px);
  }
  .studio-mark .logo-cube.look-u .logo-gaze {
    transform: translateY(-1.5px) scaleY(0.92);
  }
  @keyframes sid-mark-celebrate {
    0% {
      transform: rotate(0) scale(1);
    }
    55% {
      transform: rotate(210deg) scale(1.12);
    }
    100% {
      transform: rotate(360deg) scale(1);
    }
  }
  @keyframes sid-eye-celebrate {
    0%,
    100% {
      fill: #e7f1ff;
    }
    25% {
      fill: #9cd0ff;
    }
    55% {
      fill: #ffc478;
    }
    80% {
      fill: #c9a2ff;
    }
  }
  .studio-mark .logo-cube.celebrate {
    animation: sid-mark-celebrate 0.9s cubic-bezier(0.16, 1, 0.3, 1) !important;
  }
  .studio-mark .logo-cube.celebrate .logo-eye {
    animation: sid-eye-celebrate 0.9s ease-in-out !important;
  }
  .studio-mark .logo-cube.celebrate .logo-gaze {
    transform: scaleY(0.6);
  }
  /* Walkabout companion: as the flying mark reaches each nav icon, that icon
     springs and glows in greeting. The flight itself is JS-driven (position-
     aware, off the icons' live coordinates); this is just the icons' reaction.
     Reduced-motion disables the spring. */
  @keyframes sid-nav-poke {
    0% {
      transform: translateY(0) scale(1) rotate(0);
    }
    35% {
      transform: translateY(-4px) scale(1.3) rotate(-7deg);
    }
    62% {
      transform: translateY(0) scale(0.95) rotate(4deg);
    }
    100% {
      transform: translateY(0) scale(1) rotate(0);
    }
  }
  .studio-link.nav-poke svg {
    transform-origin: center;
    animation: sid-nav-poke 0.62s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: brightness(1.35) drop-shadow(0 0 5px rgba(255, 255, 255, 0.45));
  }
  @media (prefers-reduced-motion: reduce) {
    .studio-mark .logo-cube.look-l .logo-gaze,
    .studio-mark .logo-cube.look-r .logo-gaze,
    .studio-mark .logo-cube.look-u .logo-gaze,
    .studio-mark .logo-cube.celebrate .logo-gaze {
      transform: none;
    }
    .studio-mark .logo-cube.celebrate,
    .studio-mark .logo-cube.celebrate .logo-eye,
    .studio-link.nav-poke svg {
      animation: none !important;
    }
  }
</style>

<script>
  (function () {
    var mark = document.querySelector(".studio-nav .studio-mark");
    if (!mark) return;
    var cube = mark.querySelector(".logo-cube");
    if (!cube) return;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Living gaze — an occasional glance so the mark feels quietly attentive.
    if (!reduce) {
      var dirs = ["look-l", "look-r", "look-u"];
      var i = 0;
      function glance() {
        var d = dirs[i % dirs.length];
        i += 1;
        cube.classList.add(d);
        setTimeout(function () {
          cube.classList.remove(d);
        }, 720);
      }
      function schedule() {
        var wait = 24000 + (i % 6) * 2600; // 24-37s, non-metronomic
        setTimeout(function () {
          if (!document.hidden) glance();
          schedule();
        }, wait);
      }
      schedule();
    }

    // Walkabout — a rare, contained flight where the mark drifts across the nav
    // and boops each icon (which springs in greeting), then returns home.
    // Position-aware via the Web Animations API so it lands on the real icons at
    // any width. Pointer-events off mid-flight so it never blocks a click.
    var walkAnim = null;
    function poke(link) {
      link.classList.add("nav-poke");
      setTimeout(function () {
        link.classList.remove("nav-poke");
      }, 640);
    }
    function walkabout() {
      var links = Array.prototype.slice.call(document.querySelectorAll(".studio-links .studio-link"));
      if (!links.length || typeof cube.animate !== "function") return;
      var cr = cube.getBoundingClientRect();
      var cx = cr.left + cr.width / 2;
      var cy = cr.top + cr.height / 2;
      var stops = links.map(function (l) {
        var g = l.querySelector("svg") || l;
        var r = g.getBoundingClientRect();
        return {
          dx: r.left + r.width / 2 - cx,
          dy: r.top + r.height / 2 - cy,
          link: l,
        };
      });
      var n = stops.length;
      var frames = [{ transform: "translate(0,0) rotate(0) scale(1)", offset: 0 }];
      stops.forEach(function (s, idx) {
        s.at = +(0.14 + (0.72 * idx) / n).toFixed(3);
        frames.push({
          transform: "translate(" + s.dx.toFixed(1) + "px," + s.dy.toFixed(1) + "px) rotate(" + (idx % 2 ? 12 : -12) + "deg) scale(1.05)",
          offset: s.at,
        });
      });
      frames.push({ transform: "translate(0,0) rotate(0) scale(1)", offset: 1 });
      var dur = 4200 + n * 560;
      cube.style.pointerEvents = "none";
      walkAnim = cube.animate(frames, {
        duration: dur,
        easing: "cubic-bezier(0.45,0,0.25,1)",
      });
      stops.forEach(function (s) {
        setTimeout(function () {
          poke(s.link);
        }, s.at * dur);
      });
      function done() {
        cube.style.pointerEvents = "";
        cube.style.transform = "";
        walkAnim = null;
      }
      walkAnim.onfinish = done;
      walkAnim.oncancel = done;
    }
    if (!reduce && window.innerWidth >= 700) {
      var firstWalk = true;
      function scheduleWalk() {
        var wait = firstWalk ? 75000 + Math.random() * 55000 : 210000 + Math.random() * 150000;
        firstWalk = false;
        setTimeout(function () {
          if (!document.hidden && !cube.classList.contains("celebrate") && !walkAnim) {
            walkabout();
          }
          scheduleWalk();
        }, wait);
      }
      scheduleWalk();
    }

    // Click to celebrate — only when clicking the logo is already a no-op (we
    // are on the home page), so it never blocks navigating home from elsewhere.
    mark.addEventListener("click", function (e) {
      var here = location.pathname.replace(/\/+$/, "");
      var dest = (mark.getAttribute("href") || "").replace(/\/+$/, "");
      if (here !== dest) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      if (reduce) return;
      if (walkAnim) walkAnim.cancel();
      cube.classList.remove("celebrate");
      void cube.offsetWidth;
      cube.classList.add("celebrate");
      setTimeout(function () {
        cube.classList.remove("celebrate");
      }, 950);
    });
  })();
</script>
