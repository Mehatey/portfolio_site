<!-- ══ THE OLD NAV, RESTORED ═════════════════════════════════════════════
     Sid: "get my old blinking cube face logo back and my old pixel art type
     of icons like spiral for work and the line under the text meaning they
     are enabled. that design was way better than this real estate hoarding
     ugly pill like thing u have tried."

     I replaced a set of coloured pixel-art marks -- a spiral, a plant, a
     ripple, a cube face -- with four monochrome geometric primitives, arguing
     that a drawing cannot survive being shrunk to 10px. The reasoning was
     sound and the conclusion was wrong: these marks were never meant to
     survive shrinking, they were meant to be seen. Making them small and grey
     was solving a problem I created by putting them in a capsule.

     Restored from af4f315d^ -- the pixel icons, their colours, and the
     underline that grows from the left on the active page. Two changes on
     top: the "Open to roles" chip is removed, and spacing is re-rounded to
     the 4pt scale so the restore does not undo the system pass. -->
<header class="studio-nav" aria-label="Primary navigation">
  <a class="studio-mark" href="{{ site.baseurl }}/" aria-label="Sid Mehta, home">
    {% include site_logo.html %}
    <span class="studio-mark-label">Sid Mehta</span>
  </a>

  <nav class="studio-links" aria-label="Portfolio sections">
    <a class="studio-link{% if include.active == 'work' %} is-active{% endif %}" href="{{ site.baseurl }}/works/" aria-label="Work">
      {% include nav_icon.html icon="work" %}<span aria-hidden="true"><b>Work</b></span>
    </a>
    <a class="studio-link{% if include.active == 'play' %} is-active{% endif %}" href="{{ site.baseurl }}/play/" aria-label="Play">
      {% include nav_icon.html icon="play" %}<span aria-hidden="true"><b>Play</b></span>
    </a>
    <a class="studio-link{% if include.active == 'contact' %} is-active{% endif %}" href="{{ site.baseurl }}/contact/" aria-label="Contact">
      {% include nav_icon.html icon="contact" %}<span aria-hidden="true"><b>Contact</b></span>
    </a>
    <a class="studio-link{% if include.active == 'about' %} is-active{% endif %}" href="{{ site.baseurl }}/about/" aria-label="About">
      {% include nav_icon.html icon="about" %}<span aria-hidden="true"><b>About</b></span>
    </a>
    <!-- The "Open to roles" chip is gone. Sid: "remove open to work contact
         from nav bar." It is still said on the home page, the contact page
         and the footer, which is three times more than a nav needs to. -->
  </nav>
</header>

<style>
  /* ── THE GLASS LAYER ──────────────────────────────────────────────────
     The canvas that draws the refracting capsules. Behind the nav's own
     content and above the scrim, spanning the whole bar so one surface can
     hold both the links pill and the mark -- two canvases would be two
     contexts to keep in step for one piece of material.

     Inert to the pointer: the links underneath are the targets.

     See assets/js/nav-glass.js for why this exists rather than a
     backdrop-filter, and for the honest limit on what it can refract. */
  .nav-glass {
    position: absolute;
    /* Bled past the nav's own box. The capsule is drawn a few pixels larger
       than the links it wraps -- that lip is what stops it ending exactly at
       the text -- and the canvas is what clips it. At 1440 the nav box ends
       at x=1400 and the pill's right lip wanted 1415, so the glass was cut
       flat through the last letter of "About". */
    inset: -10px -28px;
    z-index: -1;
    pointer-events: none;
  }
  .nav-glass canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* The hire chip is removed from the markup above. Its rules are left in
     place deliberately rather than stripped: they now match nothing, and
     deleting them by pattern is how the first attempt at this broke the
     stylesheet. PurgeCSS drops them at build time anyway. */
  .studio-hire {
    display: none !important;
  }

  /* The bar is pinned to the viewport edges, which is right up to about
     1600px and wrong above it. Every page on this site lays its content out
     on a measure — --content-max is 1440, /about/ narrower still — and
     centres it. The header did not participate. At 2560 the mark sat at
     x=40 while "Selected work" began at x=563, and the links capsule ended
     at x=2520 against a content edge at x=1997: five hundred pixels of bare
     viewport on each side, with the two heaviest objects on the page parked
     out in it. It read as browser chrome rather than as part of the page —
     the one thing this nav was built not to look like.

     So give it the same measure the content has, plus 120px, so it frames
     the column rather than aligning flush to it: the mark sits just outside
     the first character of the heading, the capsule just outside the right
     edge of the preview. The +120 is what keeps it reading as a header over
     a page instead of as a table of contents pretending to be one.

     Auto margins on a fixed box with both left and right resolved split the
     leftover space equally, so this centres without a transform and without
     a wrapper element. And because the inset clamp already tops out at 40px,
     the constraint is inert below ~1640px — at 1440 and 1280 the computed
     box is unchanged to the pixel. The scrim is a separate fixed layer at
     inset: 0 0 auto 0 and stays full-bleed, which is correct: the dimming
     covers the whole band, only the objects are on the measure. */
  .studio-nav {
    --nav-ink: var(--ink-page);
    /* The plane the mobile top band is painted on. Same ink the scrim
       gradient already used, promoted to a token so the light theme can swap
       it in one place instead of restating the gradient. */
    --nav-ground: rgba(3, 6, 11, 0.92);
    position: fixed;
    z-index: 9000;
    /* ── SHORTER ──────────────────────────────────────────────────────
       Sid: "the top bar is a little too tall."

       22px of inset plus a 40px pill plus its own padding put the bar's
       bottom edge at 70px, and the scrim behind it ran to 96 -- so on a page
       whose first line of type starts at 240 the chrome was occupying the
       top eighth of every screen. 14px, and the pill loses two of its own,
       which takes the whole assembly to 54. */
    inset: 14px clamp(18px, 2.5vw, 40px) auto;
    max-width: calc(var(--content-max, 1440px) + 120px);
    margin-inline: auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    pointer-events: none;
  }

  /* THE NAV BAND SCRIM.

     Both nav pieces are thick glass, and both are legible. The problem was
     never transmission through them — it was the hole between them. The bar
     is a flex row with space-between and nothing in the middle, so at 1440
     the mark ends at x=188 and the links capsule starts at x=859: 671px of
     completely bare viewport with a fixed header's worth of page scrolling
     underneath it. On /about/ that meant EYEJACK, PHILIPS and MARRIOTT
     BONVOY sliding through the gap at full contrast while the two glass
     pieces either side sat there looking composed. At 390 the same hole is
     x 56-144, and the awards row read straight through it.

     Filling the gap with more glass was the obvious move and the wrong one:
     a continuous capsule across the whole width is a chrome bar, which is
     exactly the generic look this nav was built to avoid, and it would put
     a hard bottom edge across every hero on the site.

     So instead the band gets a scrim — the page's own background colour,
     full-bleed, falling to nothing over ~104px. It is not a surface, it has
     no edge, and it is invisible on any page whose top is already dark.
     What it does is guarantee that whatever scrolls under the nav arrives
     dimmed rather than at full strength, so type passing behind the bar
     reads as depth instead of as a collision.

     Mechanics worth keeping straight. `position: fixed` rather than
     absolute, because the parent's inset box starts 22px down and stops at
     the content — the scrim has to cover the strip above and outside it.
     `z-index: -1` paints it behind the mark and the links but still inside
     the nav's own z-index: 9000 stacking context, so it stays above the
     page. Pointer-events are already none on the parent and inherit down,
     so nothing here can eat a click.

     The stops are eased rather than linear. A two-stop gradient over 100px
     of near-black has a visible shoulder where it lands; four stops on an
     ease-out curve put most of the falloff in the first third and let the
     tail approach zero asymptotically, which is what makes it read as a
     dimming of the page rather than as a rectangle drawn on it. */
  /* ── LIQUID GLASS, NOT A GRADIENT ───────────────────────────────────────
     Sid: "just a top blur on the nav bar panel should be good and it should
     feel like apple liquid glass not just a blur."

     What was here was a plain dark gradient with NO backdrop-filter at all,
     which is why it read as a fade rather than as a surface: nothing behind
     it was being altered, so there was no glass, only a scrim.

     Four things make it read as glass rather than as blur, and it needs all
     four:

       1. THE BLUR ITSELF, with saturation pushed past 1. Real glass
          concentrates colour as it diffuses it; a plain blur greys
          everything and looks like fog.
       2. A SPECULAR TOP EDGE. One hairline of near-white along the very top
          is what tells the eye there is a physical edge catching light. It
          is the single most important line here.
       3. A GRADIENT MASK, so the panel has weight at the top and dissolves
          at the bottom instead of ending on a hard line. The blur fades out
          WITH it — masking the element fades the backdrop-filter too, which
          is what stops the "pane of frosted glass floating in the page" look.
       4. A FAINT INNER SHADOW under the top edge, so the light sits ON
          something rather than being painted over it.

     Height stays 104px and the ink stays where it was; this replaces how the
     band is drawn, not where it is or what it holds. */
  .studio-nav::before {
    content: "";
    position: fixed;
    inset: 0 0 auto 0;
    height: 104px;
    z-index: -1;
    pointer-events: none;
    /* ── THE GLASS IS FLAT, THEN IT STOPS ─────────────────────────────────
       Sid: "just above the navbar we have a little bit which is still kind of
       not blurred ... it's not clear to me where the navbar really starts and
       where that content is getting blurred. Can you just start it as a direct
       flat from above the navbar?"

       The mask ran #000 to 52%, 0.55 at 76%, transparent at 100% — a long
       dissolve across half the panel's height. Two things went wrong with it.
       The band nearest the top was never at full strength, so content sliding
       under the very top of the window stayed legible through it; and because
       the falloff was gradual there was no edge anywhere, so the nav had no
       readable boundary at all — it was a smear of half-blur about a hundred
       pixels deep.

       Flat to 88% and out over the last twelve. The panel is one weight from
       the top of the viewport down, which is what makes the nav a surface
       rather than a haze, and the short feather is only there to stop the
       bottom reading as a ruled line. */
    /* ── ONE EDGE, NOT TWO ────────────────────────────────────────────────
       Sid: "why are there two different visible blurs."

       There is only one backdrop-filter in this nav -- the glass capsules
       further down this file were neutralised in an earlier pass, so the
       pill's 32px has not run for some time. What Sid is seeing is one blur
       with TWO EDGES, which looks exactly like two blurs stacked.

       The tint and the mask had different falloffs. The gradient dropped to
       0.52 alpha at 88% and to nothing at 100%; the mask held full strength
       flat to 88% and then feathered out. So between those two points there
       was a stripe that was still fully BLURRED but had almost no tint left
       on it -- a second, paler band hanging below the first, with a visible
       line between them where the tint gave up and the blur did not.

       They run together now. The tint holds its weight to the same 88% the
       mask does and both release across the same last twelve per cent, so
       the panel has one boundary. Nothing about the blur changed; it never
       was the problem. */
    /* ── AND LESS OF IT ───────────────────────────────────────────────
       Sid: "doesnt blur and liquid glass things properly."

       The band was 0.76 solid for nearly its whole height, which is not
       glass -- it is a painted panel with a blur behind it, and the blur is
       invisible under a tint that opaque. Glass is mostly clear and reads by
       its EDGES.

       Half the opacity, released earlier, so what you actually see is the
       refraction and the rim rather than the paint. Legibility is unchanged
       because the type it protects sits in the pill, which has its own
       surface. */
    background: linear-gradient(180deg, rgba(6, 10, 16, 0.42) 0%, rgba(6, 10, 16, 0.34) 55%, rgba(6, 10, 16, 0.18) 84%, rgba(6, 10, 16, 0) 100%);
    -webkit-backdrop-filter: blur(30px) saturate(1.9) brightness(0.9);
    backdrop-filter: blur(30px) saturate(1.9) brightness(0.9);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 88%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 88%, transparent 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }
  /* The specular edge, as its own element so it is not subject to the mask
     that dissolves the panel below it. A single hairline, brightest in the
     middle where a curved surface would catch the most light. */
  .studio-nav::after {
    content: "";
    position: fixed;
    inset: 0 0 auto 0;
    height: 1px;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.16) 18%,
      rgba(255, 255, 255, 0.34) 50%,
      rgba(255, 255, 255, 0.16) 82%,
      rgba(255, 255, 255, 0) 100%
    );
  }

  /* Same shape, the page's paper instead of its ink. Cream needs to sit a
     touch stronger at the top than black does: a dark wordmark passing
     under a pale veil keeps more of its contrast than a light one passing
     under a dark veil, so 0.90 here does roughly the work 0.86 does above. */
  /* ── THE SCRIM HAS TO OUTLAST THE NAV ROW ──────────────────────────────
     Sid: "the nav bar and the logo and images and text and buttons become
     invisible or washed out."

     Reproduced by scrolling a dark project card up under the nav in light
     mode: Play, Contact and About are dark ink, and by their baseline this
     gradient had already thinned to about 0.5 — half-cream over a dark
     photograph is a mid-grey, and dark ink on mid-grey is the washout he is
     describing. On a pale card nothing looked wrong, which is why it
     survived; the failure only exists over dark art.

     The stops move rather than the colours. Full strength is held to 52%,
     which is past the bottom of the nav row at every breakpoint, and the
     fade happens in the empty band below it. The scrim is the same height
     and still invisible at its own edge — it just stops fading out from
     underneath the thing it exists to support.

     Dark mode does not need the same change: its ink is light and its scrim
     is dark, so the equivalent failure needs a very bright image under the
     nav, and the pages that have one keep it below the fold. */
  /* Cream glass. The tint stays strong through the nav row for the reason
     recorded above — dark ink over a dark photograph needs a real ground,
     not a veil — but it is now doing that on top of the same blur and
     saturation, so it reads as the same material in both themes rather than
     as glass on one and paint on the other. */
  html[data-theme="light"] .studio-nav::before {
    background: linear-gradient(
      180deg,
      rgba(246, 244, 239, 0.5) 0%,
      rgba(246, 244, 239, 0.4) 55%,
      rgba(246, 244, 239, 0.2) 84%,
      rgba(246, 244, 239, 0) 100%
    );
    /* Same fix as the dark band: the tint used to give out at 78% while the
       mask carried the blur to 88, leaving a pale blurred stripe under the
       panel with a line across the top of it. On cream that stripe was the
       more obvious of the two. */
    -webkit-backdrop-filter: blur(30px) saturate(1.4) brightness(1.05);
    backdrop-filter: blur(30px) saturate(1.4) brightness(1.05);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  html[data-theme="light"] .studio-nav::after {
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.5) 18%,
      rgba(255, 255, 255, 0.85) 50%,
      rgba(255, 255, 255, 0.5) 82%,
      rgba(255, 255, 255, 0) 100%
    );
  }

  /* Play used to be the one exception here, on the premise that it "paints a
     dark stage at every theme": `play/index.html` sets `color-scheme: dark`
     and a hardcoded `#020409` on html,body, so a cream scrim would have been
     a pale bar across the top of a black room.

     That premise has now expired the same way home's did. Play is no longer a
     standalone dark document — it picks up the site-wide includes, and those
     paint it cream in light theme. Measured, not assumed: on /play/ with
     data-theme="light", body background computes to rgb(245, 243, 238), the
     same paper as every other page. The #020409 on line 50 of that file is
     still in the source but is overridden and never reaches the screen.

     Left in, the exception did exactly what it did on home: laid a near-black
     0.86 veil down over 104px of cream, which read as a grey smear across the
     top of the page — and the "Play" wordmark is dark ink, so the top third of
     the heading was dark-on-dark. The scrim was costing contrast in the one
     place a scrim exists to buy it.

     Play now inherits the cream scrim above. Judge by what is painted. */

  .studio-mark,
  .studio-link {
    pointer-events: auto;
    color: var(--nav-ink);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  .studio-mark {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    outline: none;
  }

  .studio-mark .logo-cube {
    width: 42px;
    height: 42px;
    overflow: visible;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55)) drop-shadow(0 4px 14px rgba(0, 0, 0, 0.3)) drop-shadow(0 0 11px rgba(150, 200, 255, 0.2));
    transition: transform 560ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-mark .cube-front,
  .studio-mark .cube-face,
  .studio-mark .logo-scan {
    fill: rgba(5, 12, 23, 0.82);
    stroke: currentColor;
    stroke-width: 1.55;
    vector-effect: non-scaling-stroke;
  }

  .studio-mark .logo-scan {
    fill: none;
    opacity: 0.82;
  }

  .studio-mark .logo-gaze {
    transform-origin: 15px 21px;
    transition: transform 460ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-mark-label {
    font:
      500 11px/1.2 "DM Mono",
      monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateX(-7px);
    transition:
      opacity 220ms ease,
      transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
  }

  .studio-mark:hover .logo-gaze,
  .studio-mark:focus-visible .logo-gaze {
    transform: scaleY(1.1);
  }

  .studio-mark-label {
    display: none;
  }
  @media (min-width: 1100px) {
    .studio-mark-label {
      display: inline-block;
      opacity: 0.88;
      transform: translateX(0);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.55),
        0 1px 9px rgba(0, 0, 0, 0.4);
    }
    html[data-theme="light"] .studio-mark-label {
      text-shadow: 0 1px 7px rgba(255, 255, 255, 0.9);
    }
    /* Play opts back out — see the note beside `.play-page .studio-nav`. */
    html[data-theme="light"] .play-page .studio-mark-label {
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.55),
        0 1px 9px rgba(0, 0, 0, 0.4);
    }
    /* .studio-mark's glass rule sits further down the sheet, so match its
       weight here or the capsule stays a circle stretched into an ellipse. */
    .studio-nav .studio-mark {
      padding: 8px 16px 8px 8px;
      border-radius: 27px;
    }
    .studio-mark:hover .studio-mark-label,
    .studio-mark:focus-visible .studio-mark-label {
      opacity: 1;
    }
  }

  /* ── LIQUID GLASS ───────────────────────────────────────────────────────
     The old glass lived on `.nav .nav-links`, an element this nav replaced
     months ago, so every one of those rules has been painting nothing. This
     is the real thing, on the element that actually exists.

     Four layers, because that is what glass is: a blurred, saturated backdrop
     so the page's colour bleeds through; a specular sheen along the top lip;
     a moving highlight that tracks the pointer, so the surface reads as
     curved rather than flat; and a refraction ring at the very edge, blurred
     harder than the body, which is what sells a thick piece of glass — light
     bends most where the surface turns away from you. */
  .studio-links {
    --gx: 72%;
    --gy: 8%;
    position: relative;
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.25vw, 20px);
    padding: 3px clamp(10px, 1vw, 15px);
    border-radius: 999px;
    pointer-events: auto;
    isolation: isolate;
    background:
      radial-gradient(120px 70px at var(--gx) var(--gy), rgba(255, 255, 255, 0.18), transparent 66%),
      linear-gradient(168deg, rgba(126, 165, 208, 0.28), rgba(6, 11, 20, 0.5) 58%, rgba(88, 132, 180, 0.22));
    backdrop-filter: blur(32px) saturate(1.9) brightness(0.84);
    -webkit-backdrop-filter: blur(32px) saturate(1.9) brightness(0.84);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.34),
      inset 0 -1px 0 rgba(255, 255, 255, 0.07),
      inset 0 0 24px rgba(160, 200, 245, 0.06),
      0 12px 34px rgba(0, 0, 0, 0.26);
    transition:
      box-shadow 420ms ease,
      background 420ms ease,
      transform 560ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* The refraction ring. Blurring the backdrop twice as hard in a 1.5px band
     at the perimeter is what a real bevel does to whatever is behind it. */
  .studio-links::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    padding: 4px;
    background: linear-gradient(
      150deg,
      rgba(255, 255, 255, 0.62),
      rgba(255, 255, 255, 0.06) 38%,
      rgba(255, 255, 255, 0.03) 64%,
      rgba(190, 222, 255, 0.4)
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
  }

  /* The travelling caustic. It is deliberately larger than the capsule and
     clipped by it, so the bright part sweeps rather than sits. */
  .studio-links::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    overflow: hidden;
    background: radial-gradient(64px 34px at var(--gx) var(--gy), rgba(226, 242, 255, 0.3), transparent 70%);
    opacity: 0;
    transition: opacity 320ms ease;
    pointer-events: none;
  }

  .studio-links:hover::after,
  .studio-links:focus-within::after {
    opacity: 1;
  }

  /* Once the page has moved, the glass thickens — more blur, deeper shadow —
     because by then it is floating over content rather than over the header. */
  body.nav-lifted .studio-links {
    background:
      radial-gradient(120px 70px at var(--gx) var(--gy), rgba(255, 255, 255, 0.2), transparent 66%),
      linear-gradient(168deg, rgba(126, 165, 208, 0.2), rgba(5, 9, 17, 0.44) 58%, rgba(88, 132, 180, 0.16));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      inset 0 -1px 0 rgba(255, 255, 255, 0.08),
      inset 0 0 26px rgba(160, 200, 245, 0.08),
      0 16px 44px rgba(0, 0, 0, 0.38);
  }

  html[data-theme="light"] .studio-links {
    background:
      radial-gradient(120px 70px at var(--gx) var(--gy), rgba(255, 255, 255, 0.95), transparent 66%),
      linear-gradient(168deg, rgba(255, 255, 255, 0.84), rgba(206, 222, 238, 0.62));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 1),
      inset 0 -1px 0 rgba(60, 104, 148, 0.1),
      0 12px 32px rgba(30, 56, 84, 0.14);
    backdrop-filter: blur(32px) saturate(1.6) brightness(1.04);
    -webkit-backdrop-filter: blur(32px) saturate(1.6) brightness(1.04);
  }

  html[data-theme="light"] .studio-links::before {
    background: linear-gradient(150deg, rgba(255, 255, 255, 1), rgba(120, 158, 196, 0.22) 40%, rgba(255, 255, 255, 0.5));
  }

  /* Play opts back out — see the note beside `.play-page .studio-nav`. */
  html[data-theme="light"] .play-page .studio-links {
    background:
      radial-gradient(120px 70px at var(--gx) var(--gy), rgba(255, 255, 255, 0.17), transparent 66%),
      linear-gradient(168deg, rgba(126, 165, 208, 0.16), rgba(6, 11, 20, 0.3) 58%, rgba(88, 132, 180, 0.12));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.34),
      inset 0 -1px 0 rgba(255, 255, 255, 0.07),
      0 12px 34px rgba(0, 0, 0, 0.26);
  }
  html[data-theme="light"] .play-page .studio-links::before {
    background: linear-gradient(150deg, rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.06) 38%, rgba(190, 222, 255, 0.4));
  }

  /* The mark gets the same material so the two ends of the bar belong to each
     other, at circle rather than capsule proportion.

     It did not, previously. The comment above claimed parity but the mark was
     built from a single 0.14→0.26 gradient at blur(18px) with no sheen and no
     refraction ring, while the links capsule had a radial highlight, a 1.5px
     bevel and brightness(0.94) on top of blur(20px). The mark was thin glass
     pretending to be thick, and the result was the oldest complaint about this
     site: works-list titles read letter-for-letter straight through SID MEHTA.

     Thin glass is a tint; thick glass is a wash. The distinction is physical —
     what destroys a letterform behind a pane is the depth of the pane, i.e. how
     far the blur kernel spreads relative to the glyph, plus how much of the
     transmitted light the body of the glass absorbs. 18px of blur across a 30px
     cap-height leaves the strokes perfectly reconstructable, and a 0.26 tint
     absorbs almost nothing. So: the blur goes deep enough to spread past a
     glyph rather than smudge it, brightness() gives the glass some actual body,
     and the fill carries enough alpha to build a wash instead of a film. Same
     four layers as the links capsule now, including the bevel — the two ends of
     the bar are finally cut from one block. */
  .studio-mark {
    position: relative;
    padding: 8px;
    border-radius: 50%;
    isolation: isolate;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background:
      radial-gradient(90px 52px at 26% 6%, rgba(255, 255, 255, 0.18), transparent 68%),
      linear-gradient(168deg, rgba(126, 165, 208, 0.3), rgba(6, 11, 20, 0.52) 58%, rgba(88, 132, 180, 0.24));
    backdrop-filter: blur(32px) saturate(1.8) brightness(0.84);
    -webkit-backdrop-filter: blur(32px) saturate(1.8) brightness(0.84);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.34),
      inset 0 -1px 0 rgba(255, 255, 255, 0.07),
      0 12px 32px rgba(0, 0, 0, 0.3);
  }
  /* Same refraction ring as the links capsule — a 1.5px band at the perimeter
     carrying the bevel highlight, masked to the border only. */
  .studio-mark::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    padding: 4px;
    background: linear-gradient(150deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.05) 42%, rgba(190, 222, 255, 0.38));
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
  }
  html[data-theme="light"] .studio-mark {
    border-color: rgba(24, 48, 78, 0.16);
    background:
      radial-gradient(90px 52px at 26% 6%, rgba(255, 255, 255, 0.9), transparent 70%),
      linear-gradient(168deg, rgba(255, 255, 255, 0.88), rgba(206, 222, 238, 0.66));
    backdrop-filter: blur(32px) saturate(1.6) brightness(1.04);
    -webkit-backdrop-filter: blur(32px) saturate(1.6) brightness(1.04);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 1),
      0 12px 30px rgba(30, 56, 84, 0.14);
  }
  html[data-theme="light"] .studio-mark::before {
    background: linear-gradient(150deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.1) 42%, rgba(190, 222, 255, 0.5));
  }
  /* Play opts back out — see the note beside `.play-page .studio-nav`. */
  html[data-theme="light"] .play-page .studio-mark {
    border-color: rgba(255, 255, 255, 0.22);
    background:
      radial-gradient(90px 52px at 26% 6%, rgba(255, 255, 255, 0.18), transparent 68%),
      linear-gradient(168deg, rgba(126, 165, 208, 0.3), rgba(6, 11, 20, 0.52) 58%, rgba(88, 132, 180, 0.24));
    backdrop-filter: blur(32px) saturate(1.8) brightness(0.84);
    -webkit-backdrop-filter: blur(32px) saturate(1.8) brightness(0.84);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.34),
      inset 0 -1px 0 rgba(255, 255, 255, 0.07),
      0 12px 32px rgba(0, 0, 0, 0.3);
  }
  html[data-theme="light"] .play-page .studio-mark::before {
    background: linear-gradient(150deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.05) 42%, rgba(190, 222, 255, 0.38));
  }

  .studio-link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    outline: none;
    opacity: 0.94;
    transition:
      opacity 180ms ease,
      transform 380ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-link svg {
    width: 27px;
    height: 27px;
    overflow: visible;
    /* Two shadows, not one: a tight dark contact shadow that separates the
       glyph from whatever is directly behind it, and a wide soft one that
       does the atmospheric work. A single blurred shadow does neither job
       well, which is why the icons were reading as smudges. */
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6)) drop-shadow(0 3px 10px rgba(0, 0, 0, 0.34));
    transform-origin: center;
    transition:
      transform 460ms cubic-bezier(0.16, 1, 0.3, 1),
      filter 220ms ease;
  }

  .studio-link > span {
    font:
      600 12.5px/1 "DM Mono",
      monospace;
    letter-spacing: 0.07em;
    text-shadow:
      0 1px 2px rgba(0, 0, 0, 0.6),
      0 1px 9px rgba(0, 0, 0, 0.42);
    display: inline-block;
    overflow: hidden;
    vertical-align: middle;
  }
  /* This used to be the k95 rolling label — two copies of the same word
     stacked in a clipped box, the visible one leaving upward as its duplicate
     arrived from below. It is a good effect for a label that says something
     *new* on hover, which is why the "Open to roles" pill still uses it: that
     one rolls to "Say hello →". But "Work" rolling to "Work" is motion with
     nothing behind it, and four of those firing across the bar was the most
     decorative thing in the nav.

     The word now re-forms instead: it drops into noise and resolves
     left-to-right, one character at a time. It reads as the label being
     *assembled* rather than replaced, which is the difference between an
     effect and a gesture.

     Nothing about it is in CSS beyond this, because the whole thing is one
     text node being rewritten — which is also why it costs no layout: the
     labels are set in DM Mono and every substitute glyph is exactly as wide
     as the letter it stands in for. A proportional face here would make the
     capsule breathe on every hover. */
  .studio-link > span > b {
    position: relative;
    display: block;
    font-weight: inherit;
    font-variant-ligatures: none;
  }
  /* While a label is mid-resolve the unsettled characters are held back a
     little, so the eye follows the resolved edge travelling left to right
     rather than reading the noise. */
  .studio-link > span > b > i {
    font-style: inherit;
    opacity: 0.45;
  }

  .studio-link::after {
    content: "";
    position: absolute;
    left: 35px;
    right: 0;
    bottom: 3px;
    height: 2px;
    border-radius: 2px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .studio-link:hover,
  .studio-link:focus-visible,
  .studio-link.is-active {
    opacity: 1;
    transform: translateY(-2px);
  }

  .studio-link:hover::after,
  .studio-link:focus-visible::after,
  .studio-link.is-active::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  .studio-link:nth-child(1):hover svg,
  .studio-link:nth-child(1):focus-visible svg {
    transform: rotate(135deg) scale(1.08);
  }
  .studio-link:nth-child(2):hover svg,
  .studio-link:nth-child(2):focus-visible svg {
    transform: translateY(-2px) rotate(-7deg) scale(1.08);
  }
  .studio-link:nth-child(3):hover svg,
  .studio-link:nth-child(3):focus-visible svg {
    transform: rotate(45deg) scale(1.1);
  }
  .studio-link:nth-child(4):hover svg,
  .studio-link:nth-child(4):focus-visible svg {
    transform: rotate(-7deg) scale(1.08);
  }

  .studio-link:active,
  .studio-mark:active {
    transform: scale(0.96);
  }

  .studio-link:focus-visible,
  .studio-mark:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 5px;
  }

  .studio-link .nav-pixel--work path {
    stroke: #3aa0ff;
  }
  .studio-link .nav-pixel--work rect {
    fill: #3aa0ff;
  }
  .studio-link .nav-pixel--play .nav-pixel__stem,
  .studio-link .nav-pixel--play .nav-pixel__leaf {
    fill: #5ad167;
  }
  .studio-link .nav-pixel--play .nav-pixel__petal {
    fill: #ff2459;
  }
  .studio-link .nav-pixel--play .nav-pixel__core {
    fill: #ffd7c9;
  }
  /* The bubble keeps the ripple's warm orange, so the four-mark row still
     reads as blue / pink-green / orange / teal from across the page. Body and
     tail take the saturated tone; the three dots take the lighter one, which
     is the same figure-on-field split the plant and the old ripple used. */
  /* ── THE CONTACT MARK COMES DOWN OFF ORANGE ───────────────────────────
     Sid: "can you change the colour of the Contact sort of thing? That orange
     red is way too in your face."

     He is right, and the reason is that it was the only warm mark in a cool
     row: work is blue, about is teal, and an orange sun between them is the
     highest-contrast thing in the nav on every page. On a site whose whole
     palette he has just asked to move toward blue and turquoise, the loudest
     pixel on the screen was pointing at Contact.

     A cooler amber, desaturated and lighter, so it is still distinguishable
     from its neighbours — the four marks have to stay tellable apart at 24px
     — without being the first thing the eye lands on. */
  .studio-link .nav-pixel--contact .nav-pixel__ray {
    fill: #f0ad3e;
  }
  .studio-link .nav-pixel--contact .nav-pixel__eye {
    fill: #2a1a06;
  }
  /* The flap sits lighter than the body, which is the same figure-on-field
     split the plant and the face use. It replaces the old corner sparks and
     ring; the mark is an envelope now, not a sun. */
  .studio-link .nav-pixel--contact .nav-pixel__core {
    fill: #ffd88c;
  }
  .studio-link .nav-pixel--about .nav-pixel__tile {
    fill: #0ac0b2;
  }
  .studio-link .nav-pixel--about .nav-pixel__eye,
  .studio-link .nav-pixel--about .nav-pixel__mouth {
    fill: #eaffff;
  }

  /* Light theme has to be stated here too. `cursor_fluid.html` still carries the
     ripple's light-theme pair -- a burnt orange body over a dark brown detail --
     and with the mark now a solid block that is a large slab of exactly the
     orange Sid asked to get rid of. One extra class beats it wherever the two
     files land relative to each other. Deeper than the dark-theme teal so it
     holds on cream, and still clear of the About mark next to it. */
  html[data-theme="light"] .studio-link .nav-pixel--contact .nav-pixel__ray {
    fill: #c8791a;
  }
  /* The trail sits ON the page now, not inside a dark envelope body, so the
     near-white that read as "the lighter half of the mark" reads as nothing at
     all on cream. It has to be a lighter TEAL rather than a lighter tone. */
  html[data-theme="light"] .studio-link .nav-pixel--contact .nav-pixel__core {
    fill: #f2c064;
  }

  html[data-theme="light"] .studio-nav {
    --nav-ink: #0a1727;
    --nav-ground: rgba(244, 241, 235, 0.92);
  }
  /* No light-theme face override here. `cursor_fluid.html` paints the mark as
     a dark face (#172a4c) with light eyes (#f8f5ee) in light theme, and that
     pair is what makes the two eyes readable. This rule used to flip the face
     to near-white at the same specificity but later in the document, which won
     — leaving light eyes on a light face, so the mark rendered as an empty
     rounded square on the cream capsule. */
  html[data-theme="light"] .studio-mark-label,
  html[data-theme="light"] .studio-link > span {
    text-shadow: 0 1px 7px rgba(255, 255, 255, 0.9);
  }
  .home-page .studio-nav,
  .play-page .studio-nav {
    --nav-ink: var(--ink-page);
  }

  /* The contact page used to opt out of every light-theme nav rule here,
     because it was hard-dark at every theme (#020407, no light rules at
     all) and the light treatment painted near-black labels onto a black
     page. That premise is gone: contact.html now carries a full daylight
     palette, so the page underneath this bar is cream like every other
     one, and the exceptions were the only thing left making the nav
     unreadable there — pale grey labels and a dark glass capsule floating
     on paper.

     Home was removed from this list earlier for exactly the same reason.
     Contact followed. Judge by what is painted, not by what the root
     computes to.

     Play was the last page holding an exception, and it has now met the
     exit condition the previous note wrote for it: "if it ever does gain a
     daylight palette, delete these five blocks and it will inherit the
     shared treatment."

     It has. Play is no longer the standalone dark document those blocks
     were written against. It picks up the site-wide includes now, and they
     paint it cream in light theme — measured on /play/ with
     data-theme="light", body background computes to rgb(245, 243, 238),
     the same paper as every other page. The `color-scheme: dark` and the
     hardcoded #020409 on html,body are still in `play/index.html`, which
     is what made the old premise look true from the source; both are
     overridden and neither reaches the screen.

     Left in, the five blocks pinned --nav-ink to #f5f7fb and hung a dark
     text-shadow behind it, so once the matching near-black top scrim was
     removed the labels were pale-on-cream with a black halo — the same
     light-theme nav blackout this file has now regressed into three times,
     just inverted. Deleted, Play inherits the shared light treatment.

     Every page now takes the same path; there are no per-page nav colour
     exceptions left. Judge by what is painted, not by what the source of a
     standalone file says it sets. */
  /* noth.in keeps a "let's chat" affordance visible on every screen rather than
     parking it behind a contact page. Same idea, stated as availability instead
     of a sales button: a live dot and four words, present on every page, one
     click from an email. The label rolls to "Say hello →" on hover — the same
     two-copy roll the nav items use, so it reads as part of the nav rather
     than an ad stuck to it. */
  .studio-hire {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 12px 0 8px;
    margin-left: 4px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    color: var(--nav-ink);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition:
      border-color 300ms ease,
      background 300ms ease,
      transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .studio-hire:hover,
  .studio-hire:focus-visible {
    border-color: rgba(255, 255, 255, 0.42);
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
  }
  html[data-theme="light"] .studio-hire {
    border-color: rgba(7, 9, 15, 0.2);
    background: rgba(255, 255, 255, 0.5);
  }
  html[data-theme="light"] .studio-hire:hover,
  html[data-theme="light"] .studio-hire:focus-visible {
    border-color: rgba(7, 9, 15, 0.45);
    background: rgba(255, 255, 255, 0.78);
  }
  .studio-hire__dot {
    position: relative;
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6fdca4;
    box-shadow: 0 0 0 0 rgba(111, 220, 164, 0.55);
    animation: hire-pulse 2600ms ease-out infinite;
  }
  @keyframes hire-pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(111, 220, 164, 0.5);
    }
    70% {
      box-shadow: 0 0 0 7px rgba(111, 220, 164, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(111, 220, 164, 0);
    }
  }
  .studio-hire__label {
    font:
      500 11px/1 "DM Mono",
      monospace;
    letter-spacing: 0.06em;
    display: inline-block;
    overflow: hidden;
    vertical-align: middle;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
  }
  html[data-theme="light"] .studio-hire__label {
    text-shadow: none;
  }
  .studio-hire__label > b {
    position: relative;
    display: block;
    font-weight: inherit;
    white-space: nowrap;
    transition: transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .studio-hire__label > b::after {
    content: attr(data-roll);
    position: absolute;
    left: 0;
    top: 100%;
    width: 100%;
    white-space: nowrap;
  }
  .studio-hire:hover .studio-hire__label > b,
  .studio-hire:focus-visible .studio-hire__label > b {
    transform: translateY(-100%);
  }
  @media (prefers-reduced-motion: reduce) {
    .studio-hire__dot {
      animation: none;
    }
    .studio-hire__label > b {
      transition: none;
    }
  }

  @media (max-width: 760px) {
    .studio-nav {
      inset: 13px 14px auto;
    }
    /* The bar starts 9px higher here and the pieces are the same height, so
       its underside lands at 61 instead of 70. Scaling the scrim to match
       keeps the ratio of covered band to falloff identical; leaving it at
       104 would put a third of the fade below the nav on a screen that has
       far less room to spend on it.

       The gradient alone was not enough ground. A fade that reaches zero has
       no plane in it, so on a phone the nav read as loose parts floating over
       whatever scrolled beneath — and the parts are opaque. On the section
       titled "How I think" the logo tile sat on the code block and ate the
       first character of `function`, and the spiral landed inside
       `design(problem)`. Type was not passing under a bar, it was being
       covered by a mark.

       So the top band is now a real plane: a flat ground held at full opacity
       to the nav's underside, blurred so the page reads as continuing behind
       it rather than being clipped, then the existing gradient carries the
       last 27px to nothing. Content passes beneath a surface instead of
       colliding with floating glyphs. Chromium gets the blur; everywhere else
       the flat ground alone already fixes the occlusion. */
    .studio-nav::before {
      height: 88px;
      background: linear-gradient(180deg, var(--nav-ground) 0%, var(--nav-ground) 61px, transparent 100%), var(--nav-ground);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
      backdrop-filter: blur(14px) saturate(1.1);
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 69%, transparent 100%);
      mask-image: linear-gradient(180deg, #000 0%, #000 69%, transparent 100%);
    }
    /* Narrow screens keep the signal, drop the words: the pill collapses to the
       live dot, which is still a tap target to the same mailto. */
    .studio-hire {
      position: relative;
      width: 32px;
      padding: 0;
      justify-content: center;
      margin-left: 4px;
    }
    /* 32x30 is the painted pill, and it is also everything a thumb was given
       to aim at — well under the 44px minimum, on the one control in the nav
       that is a job enquiry. The ring cannot simply be drawn bigger without
       turning the dot back into the pill the collapse exists to avoid, so the
       hit area goes on ::before instead, which nothing else here claims.

       44px centred puts it at x 331-375 in a bar that runs to 376, with its
       left edge landing exactly on the right edge of the last nav link: the
       full minimum, and not one pixel of it stolen from a neighbour. */
    .studio-hire::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .studio-hire__label {
      display: none;
    }
    .studio-mark .logo-cube {
      width: 34px;
      height: 34px;
    }
    /* The wordmark label still goes: it is the one label whose glyph already
       says the same thing, and it is the widest thing competing for the row. */
    .studio-mark-label {
      display: none;
    }
    /* The nav labels come back.
       Dropping them left four hand-drawn glyphs — a spiral, a flower, a sun, a
       pixel face — carrying the entire information architecture. They are good
       marks and they are not a menu: nothing in them says "the work is here",
       and a phone is where a link from LinkedIn lands. Measured at 390 the row
       fits with the tightening below, so there is no reason to make a recruiter
       guess which glyph is the portfolio. */
    .studio-link > span {
      display: inline;
      font-size: 10px;
      letter-spacing: 0.06em;
    }
    .studio-links {
      gap: 0;
      padding: 4px 6px;
    }
    .studio-mark {
      padding: 4px;
    }
    .studio-link {
      width: auto;
      gap: 3px;
      padding: 0 5px;
      justify-content: center;
    }
    .studio-link svg {
      width: 18px;
      height: 18px;
    }
    .studio-link::after {
      left: 5px;
      right: 5px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .studio-mark .logo-cube,
    .studio-mark .cube-face,
    .studio-mark .logo-gaze,
    .studio-mark-label,
    .studio-link,
    .studio-link svg,
    .studio-link::after {
      transition-duration: 1ms !important;
    }
  }

  /* ── THE MARK ACTUALLY OPENS ───────────────────────────────────────────
     site_logo.html says, at the top of the file, that the mark "rests as a
     layered cube-of-creation with a quiet two-eye face, then assembles +
     spins into a full cube on hover." It has never done the second half.
     The choreography exists — three faces, a scan line, a 360° turn — and
     it lives in cursor_fluid.html scoped to `.nav > a:hover`. There is no
     `.nav` on this site and has not been for months; it is the same corpse
     as the `.nav .nav-links` glass rules the LIQUID GLASS note further up
     already records as painting nothing. So the biggest, most-clicked
     target in the header answers the cursor with a 0.88 → 1 opacity nudge
     on its wordmark and a 1.1 scaleY on a 1.7px-wide eye. That is not a
     hover state, it is a rounding error.

     Two other things fall out of the same fault. The extra faces and the
     scan line are only switched off by cursor_fluid, and cursor_fluid is
     not included by sid_home — so on the home page alone, `.cube-top` and
     `.cube-right` paint at full strength directly on top of `.cube-front`
     (identical geometry, their separating transforms also live in
     cursor_fluid), trebling the stroke, and `.logo-scan` sits visible at
     0.82 where every other page hides it. The mark is quietly a different
     mark on the front page.

     Both are fixed by moving the whole thing here, into the file that owns
     the nav and is included wherever the nav is. Selectors are written
     `.studio-mark .logo-cube …` — three classes — so they outrank
     cursor_fluid's two-class copies on the pages that load both, whatever
     order the includes land in.

     The one change of substance: perspective. The original spun a flat SVG
     with none, and orthographically a rotateY is not a turn — it is a
     horizontal squash and un-squash, the flat fake of a card flip. It has
     to be the `perspective()` function inside the transform list, not the
     `perspective` property: the property applies a camera to an element's
     CHILDREN, and the rotation here is on the cube itself, so the property
     would sit there measuring nothing. 340px on a 42px glyph is a close,
     strong camera — the leading edge genuinely comes at you and the
     trailing one recedes. It is a cube; it should turn like one. */
  /* ── IT EVOLVES, IT DOES NOT SNAP ────────────────────────────────────────
     Sid: "when i leave hover of on the cube logo it feels weird and not
     smooth can u do an evolving slow animation maybe 2 to 3 sec like a
     pokemon evolution ... it feels too fast."

     420ms in and 560ms out is a UI transition — right for a button, wrong for
     the one mark on the site that is supposed to be a creature. The assembly
     runs 2.2s in and 2.6s out now, on a curve that is slow at both ends and
     quickest in the middle, so the flat face swells into a solid and settles
     back rather than flicking between two states.

     The pointer tilt is deliberately NOT on this clock — it stays at 120ms
     further down, because a camera that lags two seconds behind your hand is
     not slow, it is broken. Slow is the transformation; the tracking is
     immediate. */
  .studio-mark .logo-cube .cube-face {
    fill: currentColor;
    fill-opacity: 0;
    stroke: currentColor;
    stroke-width: 1.35;
    stroke-linejoin: round;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transition:
      opacity 2.6s cubic-bezier(0.62, 0, 0.32, 1),
      transform 2.6s cubic-bezier(0.62, 0, 0.32, 1),
      fill-opacity 2.6s ease;
  }
  .studio-mark:hover .logo-cube .cube-face,
  .studio-mark:focus-visible .logo-cube .cube-face {
    transition-duration: 2.2s;
  }
  .studio-mark .logo-cube .cube-top {
    transform: translateY(1.8px);
  }
  .studio-mark .logo-cube .cube-right {
    transform: translateX(-1.8px);
  }

  /* ── THE HOVER BUILDS A SOLID ────────────────────────────────────────────
     Sid: "on hover let it do cooler stuff and become 3d."

     The old hover span the flat mark through rotateY(360deg) under a
     perspective. It is a nice turn and it is not three-dimensional: a full
     revolution starts and ends at the identity matrix, and what happens in
     between is one flat card showing you its back. The mark was never a
     solid at any frame of it.

     This builds one. The two spare faces are the same 21×21 box as the body,
     so each can be skewed about the edge it shares with it:

       · the top face scales to a quarter height and skews so its far edge
         runs 10.5 units right and 5.25 up — the standard 2:1 construction —
         and lands exactly on the body's top edge;
       · the right face scales to half width and skews down the same slope,
         landing exactly on the body's right edge.

     Two parallelograms and a square, meeting at real corners: an isometric
     cube, drawn rather than faked with a squash. The faces also take a fill
     so it reads as a solid with a lit face rather than as wireframe.

     What makes it feel three-dimensional is that it then answers the hand.
     `--mx` / `--my` come from the pointer's position across the mark (see the
     script below) and tilt the whole glyph under a 300px camera, so the
     nearest corner really does come at you. That part is on the <svg>
     element, which is an ordinary HTML box and takes 3D transforms happily —
     SVG children do not, which is why the faces are built in 2D. */
  .studio-mark:hover .logo-cube .cube-top,
  .studio-mark:focus-visible .logo-cube .cube-top {
    transform-origin: 0 100%;
    transform: translateY(-21px) skewX(-63.435deg) scaleY(0.25);
  }
  .studio-mark:hover .logo-cube .cube-right,
  .studio-mark:focus-visible .logo-cube .cube-right {
    transform-origin: 0 0;
    transform: translateX(21px) skewY(-26.565deg) scaleX(0.5);
  }

  /* Drawn, not faded: dashoffset runs the stroke across the face from one
     side, which is what makes it read as something sweeping rather than
     something appearing. */
  .studio-mark .logo-cube .logo-scan {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.1;
    stroke-linecap: round;
    stroke-dasharray: 15 22;
    stroke-dashoffset: 15;
    opacity: 0;
    /* On the same slow clock as the faces, so the line draws across the solid
       as it forms instead of arriving before it. */
    transition:
      opacity 1.6s ease,
      stroke-dashoffset 2.4s cubic-bezier(0.62, 0, 0.32, 1);
  }

  .studio-mark:hover .logo-cube,
  .studio-mark:focus-visible .logo-cube {
    /* --mx / --my are the pointer's position across the mark, -1 to 1, set by
       the script at the foot of this file. They default to 0, so a keyboard
       focus gets a still, slightly turned cube rather than nothing. */
    transform: perspective(300px) rotateY(calc(var(--mx, 0) * 26deg)) rotateX(calc(var(--my, 0) * -22deg)) translateZ(6px) scale(1.06);
    color: rgba(206, 228, 255, 0.98);
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.55)) drop-shadow(0 6px 18px rgba(0, 0, 0, 0.34)) drop-shadow(0 0 16px rgba(150, 200, 255, 0.42));
  }
  /* Tracking a pointer through a 560ms ease is a lag, not a follow. While the
     mark is under the hand the tilt is nearly immediate; the settle back to
     rest keeps the long curve. */
  .studio-mark:hover .logo-cube {
    transition:
      transform 120ms linear,
      color 300ms ease,
      filter 300ms ease;
  }
  .studio-mark:hover .logo-cube .cube-face,
  .studio-mark:focus-visible .logo-cube .cube-face {
    opacity: 0.9;
    fill-opacity: 0.14;
  }
  .studio-mark:hover .logo-cube .logo-scan,
  .studio-mark:focus-visible .logo-cube .logo-scan {
    opacity: 0.72;
    stroke-dashoffset: 0;
  }

  /* Hold the assembled solid — that is what the mark turns into, and it is
     information rather than decoration — and drop the tilt that chases the
     pointer, which is the part that moves without being asked to. */
  @media (prefers-reduced-motion: reduce) {
    .studio-mark .logo-cube .logo-scan {
      transition-duration: 1ms !important;
    }
    .studio-mark:hover .logo-cube,
    .studio-mark:focus-visible .logo-cube {
      transform: none;
      transition: none;
    }
  }

  /* The turn had a transition; the colour and the shadow did not, so they
     snapped while the cube was still coming round. Same rule as line ~150,
     later in the same block, so it simply replaces it. */
  .studio-mark .logo-cube {
    transition:
      transform 560ms cubic-bezier(0.16, 1, 0.3, 1),
      color 300ms ease,
      filter 300ms ease;
  }

  /* ── AND IT HAS TO SURVIVE THE LIGHT THEME ─────────────────────────────
     Two separate faults, both only visible on cream, and they are opposite
     faults — which is what made them worth chasing rather than patching.

     On every page that loads cursor_fluid, `html[data-theme="light"]
     .logo-cube { color: … !important }` pins the mark's ink, so the hover
     colour never lands at all: the cube assembles, turns, draws its scan,
     and stays exactly the shade it started. The deeper blue that was meant
     to arrive with it — rgba(27, 67, 135, 1) — sits four lines below that
     rule scoped to `.nav > a:hover`, dead in the same way and for the same
     reason as everything else that used to hang off `.nav`.

     On the home page, which does not load cursor_fluid, there is no
     !important and so the dark-theme hover colour wins instead. That colour
     is rgba(206, 228, 255, 0.98) — a pale blue built to read against a dark
     page. The cube's strokes are `stroke: currentColor` and the capsule
     under them is near-white glass on cream. Hovering the mark on the front
     page in light mode was, in effect, erasing it.

     So: state the light hover here, where the nav lives and every page can
     reach it, and carry the !important only because the base rule it has to
     outrank carries one. The colour goes the right way — deeper and more
     saturated than at rest, which is what "you are about to click this"
     looks like on a pale ground; on dark it stays the pale blue, for the
     same reason inverted. The filter is rebuilt too: the dark hover stacks
     three black drop-shadows and a blue bloom, which on cream reads as
     grime around the glyph rather than lift. One soft blue-grey shadow is
     enough over white glass. */
  html[data-theme="light"] .studio-mark:hover .logo-cube,
  html[data-theme="light"] .studio-mark:focus-visible .logo-cube {
    color: rgba(23, 60, 126, 1) !important;
    filter: drop-shadow(0 2px 6px rgba(30, 56, 84, 0.26)) drop-shadow(0 0 14px rgba(120, 165, 220, 0.3));
  }
  html[data-theme="light"] .studio-mark .logo-cube .cube-face {
    stroke-width: 1.25;
  }
  html[data-theme="light"] .studio-mark:hover .logo-cube .cube-face,
  html[data-theme="light"] .studio-mark:focus-visible .logo-cube .cube-face {
    opacity: 0.72;
    fill-opacity: 0.1;
  }

  /* ══ THE GLASS COMES OFF ════════════════════════════════════════════════
     Sid: "remove the pill around the logo and the icons its not needed."

     It is not. The capsules were doing one real job -- holding a legible
     backdrop under the nav while it floats over photographs -- and paying for
     it with two heavy blurred surfaces parked over the top of every page. The
     job is already covered without them: every label and the mark itself
     carry text-shadow / drop-shadow built for exactly this, and the marks are
     saturated colours rather than thin grey strokes, so they hold against
     both a dark cover and cream paper.

     Neutralised here rather than deleted from the rules above -- the same
     lesson as the hire chip. Pattern-deleting CSS is how the nav labels
     vanished last time. */
  .studio-links,
  .studio-mark {
    background: none !important;
    border-color: transparent !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
  .studio-links::before,
  .studio-links::after,
  .studio-mark::before,
  .studio-mark::after {
    display: none !important;
  }
  html[data-theme="light"] .studio-links,
  html[data-theme="light"] .studio-mark {
    background: none !important;
    border-color: transparent !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
  /* With no capsule the padding was holding air around nothing; the row keeps
     its own rhythm from the link gaps. */
  .studio-links {
    padding: 0 !important;
  }
  .studio-mark {
    padding: 0 !important;
  }
  /* Sid: "we dont need sid mehta written". The mark is the mark -- a logo
     that needs its own name spelled out beside it is a logo that is not
     working, and this one is. It stays in the markup for screen readers via
     the anchor's aria-label, which already says "Sid Mehta, home". */
  /* Written with the full ancestor chain, not as a bare class. The one-class
     version was losing on /about/ -- and only there -- to a broader rule in
     that layout's own stylesheet that also carries !important, which
     !important alone cannot settle: between two important declarations
     specificity decides, and (0,1,0) loses to anything longer. The visual QA
     pass caught it; every other page had it hidden, so a spot check would
     have said the job was done. */
  .studio-nav .studio-mark .studio-mark-label {
    display: none !important;
  }

  /* ── THE CUBE GETS RESTLESS ──────────────────────────────────────────
     Sid: "check that my cube logo is interactive and on hover becomes 3d and
     also blinks and flys around sometimes."

     Hover-to-3D and the blink were already wired -- the 360 turn under a
     340px perspective lives in this file, the 8.4s blink and the cursor-
     tracking eyes live in cursor_fluid.html. What was missing is the third
     one: at rest the mark just sat there.

     So it drifts. A long, mostly-still cycle -- 19 seconds, of which about
     four have any movement in them -- that lifts, tips and settles. Long
     enough that it reads as the thing being alive rather than as an
     animation running; short enough that you catch it if you linger. It
     yields entirely on hover, because the turn is the payoff and two motions
     fighting is neither. */
  @keyframes sid-logo-fly {
    0%,
    62% {
      transform: translate(0, 0) rotate(0deg);
    }
    68% {
      transform: translate(2px, -5px) rotate(-7deg);
    }
    74% {
      transform: translate(-2px, -7px) rotate(6deg);
    }
    80% {
      transform: translate(1px, -3px) rotate(-3deg);
    }
    86%,
    100% {
      transform: translate(0, 0) rotate(0deg);
    }
  }
  .studio-mark .logo-cube {
    animation: sid-logo-fly 19s cubic-bezier(0.16, 1, 0.3, 1) infinite;
  }
  .studio-mark:hover .logo-cube,
  .studio-mark:focus-visible .logo-cube {
    animation: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .studio-mark .logo-cube {
      animation: none;
    }
  }

  /* ══ STATES ════════════════════════════════════════════════════════════
     Sid: "check hover effects and when one is selected the other get duller
     in opacity or idk i hope u have thought for and designed for different
     states."

     Fair, and no: I had inherited the states rather than designed them. What
     was here was one rule -- everything at 0.94, hover and active both going
     to 1.0 with the same 2px lift and the same underline. Which means the
     row had effectively TWO states wearing three names: the page you are on
     looked exactly like the link you happen to be pointing at, and neither
     looked much different from the four at rest. A nav with 0.06 of opacity
     between "you are here" and "everything else" is not signalling anything.

     Four states now, each doing one job:

       rest        0.62   quiet enough that the active one can lead
       active      1.00   full strength, underline held at scaleX(1), and the
                          only one that keeps its colour when the row is idle
       hover       1.00   plus the 2px lift and the underline drawing in from
                          the left -- the draw is what separates it from
                          active, which is simply already there
       dimmed      0.30   any sibling while another link is hovered

     The dimming is the part he asked for and it is doing real work: with
     four saturated marks in a row, pointing at one should quiet the other
     three so the eye is not still choosing. The active link dims too when
     you point elsewhere, but only to 0.5 rather than 0.3 -- losing your
     place while browsing the nav is worse than a slightly uneven row.

     Marks desaturate rather than fade at rest. Opacity alone on a coloured
     glyph makes it muddy; pulling saturation keeps the shape crisp and lets
     colour itself be the active signal. */
  /* ── DIM IS A RELATIONSHIP, NOT A RESTING STATE ────────────────────────
     Sid: "dont let the top right labels look so washed out ... opacity only
     when one is selected otherwise when none selected all full opacity."

     Every link sat at 0.62 and desaturated whether or not anything was
     selected, so the nav read as permanently disabled — four grey words in
     the corner of a page with nothing chosen. Dimming only means something
     when something else is bright; on its own it just looks switched off.

     So the resting state is bright, and the fade is applied only when there
     is a thing to fade AGAINST: the pointer inside the row, or a section that
     is genuinely current. On the homepage, where no section is active,
     nothing is dimmed at all. */
  /* ── THE NAV STOPS DIMMING ITSELF ─────────────────────────────────────
     Sid: "the nav buttons are very washed out. just keep them normal
     opacity."

     There were FIVE stacked rules taking opacity off these four links, and
     together they meant a nav item was almost never at full strength:

       0.95  at rest
       0.55  every inactive item, on any page with a current section — which
             is every page, so this was the normal state of three of the four
       0.45  all four, the moment the pointer entered the row
       0.30  every item you were not pointing at
       0.50  the active one, if you were pointing at a sibling

     plus saturate(0.25) to 0.4 draining the colour out of the pixel marks
     underneath. Each was defensible on its own — "the rest step back so the
     current one can be read as current" — and stacked they made a permanent
     haze out of the only navigation on the site.

     They are all gone. Every link sits at full opacity with its mark at full
     colour, always. Current is already signalled twice without spending any
     contrast: the label goes bold and the underline draws in. Hover keeps
     the 2px lift and a small saturation lift on the mark, which is a reply
     to the pointer rather than a penalty on everything else. */
  .studio-link {
    opacity: 1;
    transition:
      filter 240ms ease,
      transform 380ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .studio-link .nav-pixel {
    filter: saturate(1);
    transition: filter 260ms ease;
    /* Sid: "the contact icon size needs to be reduced a little bit." Applied
       to all four rather than to one, because a row of marks that are not the
       same size stops reading as a set. */
    transform: scale(0.88);
  }
  .studio-link:hover .nav-pixel,
  .studio-link:focus-visible .nav-pixel {
    filter: saturate(1.15);
  }

  /* ── THE COLOUR ARRIVES, IT IS NOT ALWAYS ON ────────────────────────────
     Sid: "make them black and white or in a neutral sort of a colour. When
     you hover on it or when it's enabled or clicked, the colour fills in and
     animates into the nav icons so that we don't have so many glyphs."

     Two stacked copies of the same mark (see nav_icon.html). The ghost is
     desaturated to the nav's own ink so the resting row reads as one
     material instead of four colours; the coloured copy sits exactly on top,
     clipped to zero height, and the clip opens upward on hover, keyboard
     focus, or the current page. Clip rather than opacity because a fade just
     dims the neutral state, while a wipe reads as the mark filling. */
  .nav-ico {
    position: relative;
    display: inline-flex;
    line-height: 0;
    /* <i> for the harness contract above, so the inherited italic has to go. */
    font-style: normal;
  }
  .nav-ico__ghost,
  .nav-ico__color {
    display: inline-flex;
    line-height: 0;
  }
  /* Flattened to the nav ink rather than plain grayscale: grayscale(1) keeps
     each hue's own lightness, so the four marks stayed four different greys
     and the row still read as a set of unrelated objects. */
  .nav-ico__ghost {
    filter: grayscale(1) brightness(1.45) opacity(0.55);
    transition: filter 260ms ease;
  }
  /* The ghost has to move AWAY from the page, not toward white. brightness
     1.45 lifts a desaturated mark off a near-black bar, and on cream it does
     the opposite: measured in light theme the three inactive marks were all
     but invisible and only the active blue survived. Same idea, inverted. */
  html[data-theme="light"] .nav-ico__ghost {
    filter: grayscale(1) brightness(0.42) opacity(0.62);
  }
  .nav-ico__color {
    position: absolute;
    inset: 0;
    clip-path: inset(100% 0 0 0);
    transition: clip-path 460ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .studio-link:hover .nav-ico__color,
  .studio-link:focus-visible .nav-ico__color,
  .studio-link.is-active .nav-ico__color {
    clip-path: inset(0 0 0 0);
  }
  /* The ghost steps back as the colour lands, so the two layers do not both
     read at once through the anti-aliased edges. */
  .studio-link:hover .nav-ico__ghost,
  .studio-link:focus-visible .nav-ico__ghost,
  .studio-link.is-active .nav-ico__ghost {
    filter: grayscale(1) brightness(1.45) opacity(0);
  }
  html[data-theme="light"] .studio-link:hover .nav-ico__ghost,
  html[data-theme="light"] .studio-link:focus-visible .nav-ico__ghost,
  html[data-theme="light"] .studio-link.is-active .nav-ico__ghost {
    filter: grayscale(1) brightness(0.42) opacity(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .nav-ico__color,
    .nav-ico__ghost {
      transition-duration: 1ms;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .studio-link,
    .studio-link .nav-pixel {
      transition-duration: 1ms;
    }
  }
</style>

<script>
  /* The highlight has to follow the pointer for the surface to read as curved.
     Tracked on the capsule itself rather than on the window, so it costs
     nothing until the pointer is actually over the glass. `nav-lifted` is the
     scroll state: past the first screenful the bar is floating over content,
     and the material thickens to match. */
  (function () {
    var caps = document.querySelector(".studio-links");
    if (!caps) return;
    var fine = !(window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse)").matches);
    if (fine) {
      caps.addEventListener(
        "pointermove",
        function (e) {
          var r = caps.getBoundingClientRect();
          caps.style.setProperty("--gx", (((e.clientX - r.left) / r.width) * 100).toFixed(1) + "%");
          caps.style.setProperty("--gy", (((e.clientY - r.top) / r.height) * 100).toFixed(1) + "%");
        },
        { passive: true }
      );
      caps.addEventListener("pointerleave", function () {
        caps.style.setProperty("--gx", "72%");
        caps.style.setProperty("--gy", "8%");
      });
    }
    var lifted = false;
    var ticking = false;
    function read() {
      ticking = false;
      var want = (window.scrollY || document.documentElement.scrollTop || 0) > 40;
      if (want === lifted) return;
      lifted = want;
      document.body.classList.toggle("nav-lifted", want);
    }
    window.addEventListener(
      "scroll",
      function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(read);
      },
      { passive: true }
    );
    read();
  })();
</script>

<script>
  /* ── THE RE-FORMING LABEL ─────────────────────────────────────────────────
     Sid: "the animation when u hover on text in nav bar can we have the text
     reforming like the cryptic text on hover."

     A label drops into noise and resolves left to right, one character at a
     time, so the word assembles itself under the cursor.

     Four decisions are what keep it from being the stock decrypt effect.

     The alphabet is the site's own. Not `!@#$%^&*` — that set is loud, it is
     mostly punctuation, and its glyphs sit at wildly different visual weights
     so the noise flickers in brightness as it cycles. This one is drawn from
     the marks the rest of the site is built out of: the plant and fish glyphs
     in the footer pond, the arrows, the box rules. Uppercase letters are in
     it too, because a decrypt made only of symbols never reads as *text*
     becoming text.

     It resolves in one direction and never scrambles a character twice after
     it has landed. A scramble that keeps re-noising settled letters has no
     shape — you cannot tell how far through it is. With a travelling front
     you can read the progress, and reading the progress is the whole effect.

     Leaving mid-run does not snap. The word finishes assembling and then
     stops. Cancelling on mouseout is the reflex, and it produces a label
     that flicks back to noise-then-nothing every time the pointer grazes it,
     which is the twitchiest thing a nav can do.

     And it never runs twice at once on the same label, so crossing the bar
     quickly leaves four words resolving in sequence rather than four
     independent timers fighting over the same text nodes.

     Accessibility: the visible label is aria-hidden and every link already
     carries an aria-label, so a screen reader reads "Work", not "W7<K". And
     under prefers-reduced-motion nothing here binds at all — the underline
     and the colour shift, which were always doing the real work of saying
     "this is the thing you are pointing at", carry the whole interaction. */
  (function () {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var NOISE = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<>/\\|^~*+=-_()".split("");

    /* Per character. 34ms is roughly three frames — fast enough to read as
       churn rather than as a slideshow of wrong letters, slow enough that
       each substitution is actually visible. */
    var CHURN = 34;
    /* How long the front takes to travel one character. Deliberately slower
       than the churn: if the front moved at the churn rate every character
       would show exactly one piece of noise and the whole thing would look
       like a typo correcting itself. */
    var STEP = 52;

    function pick(prev) {
      var c;
      do {
        c = NOISE[(Math.random() * NOISE.length) | 0];
      } while (c === prev && NOISE.length > 1);
      return c;
    }

    function reform(el) {
      if (el.__reforming) return;
      var word = el.__word || (el.__word = el.textContent);
      el.__reforming = true;

      var chars = word.split("");
      var state = chars.map(function () {
        return "";
      });
      var tick = chars.map(function () {
        return -1;
      });
      var t0 = null;

      function frame(now) {
        if (t0 === null) t0 = now;
        var elapsed = now - t0;
        /* The front is a position, not an index — the character it is
           currently sitting on is the last one still churning. */
        var front = elapsed / STEP;
        var done = true;
        var out = "";

        for (var i = 0; i < chars.length; i++) {
          if (chars[i] === " ") {
            out += " ";
            continue;
          }
          if (i < front) {
            state[i] = chars[i];
            out += chars[i];
          } else {
            done = false;
            /* Every unsettled character advances on its own phase offset so
               the noise does not pulse in lockstep across the word — without
               the offset all four or seven letters flip on the same frame and
               the label strobes instead of churning. */
            var k = ((elapsed + i * 11) / CHURN) | 0;
            if (k !== tick[i]) {
              tick[i] = k;
              state[i] = pick(state[i]);
            }
            out += "<i>" + state[i] + "</i>";
          }
        }

        el.innerHTML = out;
        if (done) {
          el.textContent = word;
          el.__reforming = false;
          return;
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    var labels = document.querySelectorAll(".studio-link > span > b");
    for (var i = 0; i < labels.length; i++) {
      (function (el) {
        var link = el.closest(".studio-link");
        if (!link) return;
        var go = function () {
          reform(el);
        };
        link.addEventListener("pointerenter", go);
        link.addEventListener("focus", go);
      })(labels[i]);
    }
  })();
</script>

<script>
  /* ── THE MARK ANSWERS THE HAND ────────────────────────────────────────────
     Sid: "on hover let it do cooler stuff and become 3d."

     The CSS builds the solid; this gives it a camera. --mx and --my are the
     pointer's position across the mark normalised to -1..1, read off the
     mark's own box, and the tilt is applied in CSS so the whole thing stays
     one composited transform.

     Written against `.studio-mark` rather than `.logo-cube` because the
     pointer target is the link — the glyph inside it is 36px and a tilt that
     only starts once you are dead on it never gets found. */
  (function () {
    var marks = document.querySelectorAll(".studio-mark");
    if (!marks.length) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (window.matchMedia && !window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

    for (var i = 0; i < marks.length; i++) {
      (function (mark) {
        var cube = mark.querySelector(".logo-cube");
        if (!cube) return;
        var raf = 0;
        var px = 0;
        var py = 0;

        var write = function () {
          raf = 0;
          cube.style.setProperty("--mx", px.toFixed(3));
          cube.style.setProperty("--my", py.toFixed(3));
        };

        mark.addEventListener("pointermove", function (e) {
          if (e.pointerType === "touch") return;
          var b = mark.getBoundingClientRect();
          /* Clamped because the link box is wider than the glyph — without
             it the wordmark end of the target drives the tilt past its
             hinge and the cube reads as broken rather than turned. */
          px = Math.max(-1, Math.min(1, ((e.clientX - b.left) / b.width) * 2 - 1));
          py = Math.max(-1, Math.min(1, ((e.clientY - b.top) / b.height) * 2 - 1));
          if (!raf) raf = requestAnimationFrame(write);
        });

        mark.addEventListener("pointerleave", function () {
          px = 0;
          py = 0;
          if (!raf) raf = requestAnimationFrame(write);
        });
      })(marks[i]);
    }
  })();
</script>
