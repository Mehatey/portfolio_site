<style>
  #site-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    overflow: hidden;
  }
  /* Solid backdrop — hides homepage content (desk WebGL, marquee, bottom-bar) during entry + loader scenes.
     The work-collage shader paints above this; cube video + typewriter paint above the shader. */
  #enter-backdrop {
    position: fixed;
    inset: 0;
    z-index: 8000;
    background: #000;
    pointer-events: none;
  }
  .sl-phase {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .sl-phase.active {
    opacity: 1;
  }
  .sl-phase.exit {
    opacity: 0;
  }

  /* Phase 1: Video + typewriter. The source footage carries a black matte, so
     this scene uses the same exact black instead of compositing it over smoke. */
  #sl-video-phase {
    background: #000;
  }
  #sl-video-phase video {
    max-width: 1322px;
    width: min(100vw, 1322px);
    border-radius: 0;
    margin-top: 4vh;
    filter: contrast(1.1) brightness(1.08);
    mix-blend-mode: normal;
  }
  /* Mobile: fill the viewport edge-to-edge using object-fit cover so the cube
     character sits centered and any visible "black box" framing the video is
     cropped out of frame. mix-blend-mode kept for the screens that honor it
     (most do); on the ones that don't, the cover-crop hides the black bars. */
  @media (max-width: 700px) {
    #sl-video-phase {
      /* Override default flex layout so video can fill */
      padding: 0;
    }
    #sl-video-phase video {
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      margin-top: 0;
    }
  }
  /* Phase 2 loading-ani video — bigger on mobile so the brain/eyes read clearly */
  @media (max-width: 700px) {
    #sl-loading-phase video {
      width: 90vw;
      max-width: 90vw;
    }
  }
  /* Hello — bigger, more confident, distinct from the mono const() stream so they don't clash */
  #sl-hello {
    font-family: var(--font-head);
    font-size: clamp(40px, 6vw, 72px);
    font-weight: 200;
    letter-spacing: -0.02em;
    color: rgba(245, 250, 255, 0.96);
    text-shadow: 0 0 28px rgba(140, 200, 255, 0.55);
    min-height: 1.2em;
    text-align: center;
    white-space: nowrap;
  }
  /* Loader dust */
  #loader-dust {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  /* The intro remains part of the experience, but never traps a visitor who
     already knows where they want to go. */
  #loader-skip {
    position: absolute;
    top: max(24px, 4vh);
    right: max(24px, 4vw);
    z-index: 20;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 12px;
    /* ── IT WAS THERE AND NOBODY COULD FIND IT ──────────────────────────
       Measured on the live site: from Enter, the button is actionable at
       0.5s and taking it puts a visitor on the revealed page at 4.3s
       instead of 19s. The escape hatch works. It was simply 113x32px of
       9px mono at 0.68 alpha, in the top-right corner of a sixteen-second
       film that is moving in the middle of the screen — so the visitor who
       needs it most is the one who never sees it.

       This is not a licence to shout. The intro is the door and it stays.
       10.5px, a stronger hairline and a readable alpha is the difference
       between a control a stranger can find and one only its author knows
       about, and it is still the quietest thing on the screen.

       ── WHY THERE IS NO html[data-theme="light"] RULE FOR THIS ──────────
       Because the premise for one is false, and it took sampling the real
       pixels to find that out. #enter-backdrop IS cream in light theme, so
       a computed read says this pill sits on rgb(245,243,238) and needs
       inverting. It does not: the button only exists while `.is-running`,
       and for the whole of that window the cube video and #loader-collage
       paint over the backdrop, so the ground behind it is the dark film in
       both themes. A theme branch here would have solved a problem that is
       not on screen and made the control louder in light than in dark for
       no reason.

       The pill is 0.72 rather than 0.42 so it does not depend on that being
       true. Over the dark film it is still a dark pill; over bare cream —
       the narrow case where the video never arrives and the 25s failsafe is
       what ends the sequence — it composites to about rgb(74,78,85) and
       holds the pale text at roughly 6.4:1 instead of 2.4:1. One value,
       correct on either ground. */
    border: 1px solid rgba(170, 215, 250, 0.34);
    border-radius: 999px;
    background: rgba(8, 14, 26, 0.72);
    color: rgba(226, 241, 252, 0.86);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    opacity: 0;
    pointer-events: none;
    text-transform: uppercase;
    transition:
      opacity 0.35s ease,
      color 0.2s ease,
      border-color 0.2s ease,
      background 0.2s ease;
  }
  #site-loader.is-running #loader-skip {
    opacity: 1;
    pointer-events: auto;
  }
  #loader-skip:hover,
  #loader-skip:focus-visible {
    border-color: rgba(180, 225, 255, 0.56);
    background: rgba(100, 155, 215, 0.14);
    color: rgba(245, 251, 255, 0.96);
    outline: none;
  }

  /* (The #loader-stream terminal typewriter's styles lived here. The markup was
     removed as visually noisy on the loader scene; the styles went with it.) */

  /* Loader work-collage — top-level fixed so it backs both the Enter gate and the cube animation.
     z-index: 8500 sits above the solid #enter-backdrop (8000) and below the cube + Enter button (9999+).
     Opacity 1 from start (instant, no fade-in) — was 1.4s transition that read as "shader takes 2s". */
  #loader-collage {
    position: fixed;
    inset: 0;
    z-index: 8500;
    pointer-events: none;
    opacity: 1;
    overflow: hidden;
  }
  #loader-smoke-bg {
    position: fixed;
    inset: 0;
    width: 100%; /* override the canvas's width attribute (set to W*0.5 for perf) so it stretches to fill viewport */
    height: 100%;
    z-index: 8450;
    pointer-events: none;
    opacity: 0.65;
  }
  /* Imagery removed per design call — collage is now pure shader (gradient layers only) */
  .lc-grid {
    display: none;
  }
  /* Static fallback gradient — hidden by default; JS adds .no-shader to <html> if WebGL init fails / reduced-motion.
     Keeps the WebGL smoke shader as the SOLE background when it works (no double-paint). */
  html.no-shader #loader-collage::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(40, 70, 130, 0.4) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 70%, rgba(60, 40, 100, 0.28) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(15, 25, 55, 0.55) 0%, rgba(5, 10, 22, 0.92) 75%);
    pointer-events: none;
    z-index: 0;
  }
  /* (Cursor halo from old design removed — the WebGL smoke shader now handles cursor reveal natively) */
  @media (prefers-reduced-motion: reduce) {
    #loader-collage {
      display: none;
    }
  }

  /* Phase 2: Loading animation (replaces eye + brain) */
  #sl-loading-phase video {
    width: 380px;
    max-width: 70vw;
    height: auto;
    display: block;
  }

  /* ── REMOVED: the memory tiles and the onboarding icon row ───────────
     The four .sl-memory-tile rules had no markup left to style at all — the
     JS still queries for them and gets an empty list — and the icon row went
     with the nav map it drew. Roughly 170 lines of CSS for two things that
     are not on the screen. */
  @media (max-width: 700px) {
    #loader-skip {
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      font-size: 8.5px;
    }
  }
</style>

<!-- Underwater turbulence filter — used by the work-collage during enter + loader scenes -->
<svg style="position: fixed; width: 0; height: 0; overflow: hidden" aria-hidden="true">
  <defs>
    <filter id="lc-water" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.020" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" values="0.014 0.020;0.020 0.014;0.014 0.020" dur="18s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="32" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<!-- Solid dark backdrop — hides homepage content during entry + loader phases -->
<div id="enter-backdrop"></div>

<!-- Portal flash — the payoff beat when Buddha collapses into the loader on Enter click -->
<div id="enter-flash" aria-hidden="true"></div>

<!-- WebGL smoke shader — same blue-noise field as home #smoke-bg, mounted at loader z-index so it backs the Enter scene -->
<canvas id="loader-smoke-bg" aria-hidden="true"></canvas>

<!-- Loader shader fallback gradient (paints if WebGL fails) + cursor halo -->
<div id="loader-collage" class="is-on" aria-hidden="true"></div>

<!-- Enter gate — Buddha IS the enter button; hover reveals ENTER label -->
<div id="enter-gate" style="position: fixed; inset: 0; z-index: 10000; background: transparent; cursor: none">
  <!-- Hidden trigger preserves all existing JS event wiring (keyboard, speech, etc.) -->
  <button
    id="enter-btn"
    aria-label="Enter site"
    aria-hidden="true"
    tabindex="-1"
    style="position: absolute; opacity: 0; width: 0; height: 0; overflow: hidden; pointer-events: none; border: none; background: none"
  ></button>

  <!-- One clear threshold object. The Buddha is the entry companion; project
       imagery belongs in the Works index, where it has context and room to read. -->
  <div id="enter-buddha-wrap">
    <div id="enter-3d-stage" aria-hidden="true">
      <div id="enter-3d-mount"></div>
    </div>
    <button id="enter-label" type="button">Enter portfolio<span class="xarrow xarrow--right" aria-hidden="true"></span></button>
  </div>

  <!-- Mobile fallback — simple text button, hidden on desktop -->
  <button id="enter-btn-mobile" class="enter-btn-mobile" aria-label="Enter site">Enter</button>

  <!-- A quiet recruiter path: the opening remains experiential, while visitors who
       arrive with a specific purpose can immediately understand the practice and
       jump to the two most useful destinations. -->
  <p class="entry-identity">
    <span class="entry-name">Sid Mehta</span>
    <span class="entry-role">Product designer building AI tools, fintech products, and spatial systems people can actually use.</span>
    <span class="entry-scope">Webby Awards · Deloitte Digital · EyeJack · Philips</span>
  </p>
  <nav class="enter-quick-links" aria-label="Recruiter shortcuts">
    <a href="{{ site.baseurl }}/works/">Selected work<span class="xarrow" aria-hidden="true"></span></a>
    <a href="{{ site.baseurl }}/assets/resume.pdf" target="_blank" rel="noopener noreferrer"
      >Resume PDF<span class="sr-only"> (opens in a new tab)</span><span class="xarrow" aria-hidden="true"></span
    ></a>
  </nav>

  <div id="buddha-speech" aria-hidden="true"></div>
</div>

<style>
  /* ── BUDDHA WRAPPER — centers the Buddha on screen ── */
  #enter-buddha-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 9050;
  }

  /* Buddha stage — the one focal object at the entry threshold. */
  #enter-3d-stage {
    position: relative;
    width: clamp(220px, 23vw, 320px);
    height: clamp(220px, 23vw, 320px);
    pointer-events: auto;
    opacity: 0;
    cursor: none;
    transition:
      opacity 0.4s ease,
      filter 0.5s ease;
    filter: drop-shadow(0 0 18px rgba(180, 220, 255, 0.15));
    animation: buddhaBreathe 6s ease-in-out infinite;
  }
  /* ── THE PORTAL RING IS GONE ────────────────────────────────────────────
     Sid: "in the beginning there is a circle and then the buddha enters."

     It was a pulsing ring holding the first paint while the GLB streams in,
     and that is exactly how it read: a loading spinner, then the actual
     object, so the door had two openings. A threshold that announces itself
     twice is not a threshold. The stage simply stays empty until the model
     arrives and then the model fades in, which is one event instead of two.

     The is-model-ready class still does its job — it is what the script
     waits on and what .is-model-absent is measured against — it just no
     longer has a ring to dismiss. */
  #enter-3d-stage.is-on {
    opacity: 1;
  }
  /* Set only when the model missed its deadline -- see the note beside the
     timeout in the script below. The stage stops breathing and stops holding
     320px of empty space, so the label rises to where the object would have
     been rather than floating under a hole. */
  #enter-3d-stage.is-model-absent {
    height: 0;
    animation: none;
    filter: none;
  }
  #enter-buddha-wrap:has(.is-model-absent) #enter-label {
    opacity: 1;
    transform: none;
    font-size: 13px;
  }
  @keyframes buddhaBreathe {
    0%,
    100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-8px);
    }
  }
  #enter-3d-stage:hover {
    filter: drop-shadow(0 0 32px rgba(160, 210, 255, 0.34));
  }
  /* Collapse — a contained transition cue that preserves the model's clean silhouette. */
  #enter-3d-stage.is-collapsing {
    animation: none;
    transition:
      transform 0.5s cubic-bezier(0.6, 0, 0.9, 0.4),
      opacity 0.4s ease 0.15s,
      filter 0.5s ease;
    transform: scale(0.04);
    opacity: 0;
    filter: drop-shadow(0 0 60px rgba(180, 220, 255, 0.6));
  }
  #enter-3d-mount {
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 1;
    pointer-events: none;
  }
  #enter-3d-mount model-viewer {
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
  }

  /* The entry label sits below the object with deliberate breathing room. */
  #enter-label {
    border: 0;
    background: transparent;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(220, 240, 255, 0.92);
    text-shadow:
      0 0 12px rgba(140, 200, 255, 0.55),
      0 0 28px rgba(100, 160, 255, 0.3);
    margin-top: 22px;
    /* The entry affordance is present before hover, so first-time visitors do
       not have to infer that the sculpture is interactive. */
    opacity: 0.62;
    /* ── THE GLITCH WAS THE BUTTON MOVING OUT FROM UNDER THE CURSOR ──────
       Sid: "when i hover on enter portfolio the button glitches a bit."

       It rested at translateY(6px) and hovered to translateY(0), so the
       control lifted 6px toward the cursor. Land on its lower edge and it
       slides up out from under the pointer, hover is lost, it drops back
       down, hover is regained — a flicker loop at the transition's own
       frequency. #enter-buddha-wrap:hover does not save it either: the wrap
       is pointer-events:none, so the moment the label leaves the cursor
       there is nothing under it to hold the hover.

       The lift is gone and only opacity animates. A hit target that moves
       when you point at it is a broken control, and the fade alone already
       says the thing is live. */
    transition: opacity 0.3s ease;
    cursor: pointer;
    pointer-events: auto;
    padding-left: 0.32em;
  }
  #enter-label:hover,
  #enter-label:focus-visible {
    opacity: 1;
  }
  #enter-label:focus-visible {
    outline: 1px solid rgba(180, 220, 255, 0.7);
    outline-offset: 7px;
  }
  #enter-buddha-wrap:hover #enter-label {
    opacity: 1;
  }
  /* The arrow's own trigger is `:hover > .xarrow`, keyed to its direct parent,
     which is deliberate everywhere else on the site — it stops an ancestor
     hover from firing arrows nested three levels down. Here the hit target is
     genuinely the wrap and not the button: the whole sculpture lifts the label
     out of its resting state, and if the arrow waited for the cursor to reach
     the twelve-pixel button itself it would be the one part of this control
     that did not respond to the gesture that reveals it. So the wrap gets an
     explicit rule, at a specificity the base class cannot reach. */
  #enter-buddha-wrap:hover #enter-label .xarrow--right::before {
    transform: translate(120%, 0);
  }
  #enter-buddha-wrap:hover #enter-label .xarrow--right::after {
    transform: translate(0, 0);
  }

  /* First-frame context and a purposeful bypass for recruiter visits. The
     typography intentionally stays quieter than the sculpture. */
  .entry-identity {
    position: fixed;
    left: max(32px, 4.5vw);
    bottom: max(28px, 4vh);
    z-index: 10001;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: min(420px, 34vw);
    margin: 0;
    pointer-events: none;
    font-family: var(--font-head);
    text-shadow: 0 0 16px rgba(120, 190, 255, 0.22);
  }
  .entry-name {
    font-family: var(--font-mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(230, 243, 255, 0.82);
    font-size: 11px;
  }
  .entry-role {
    color: rgba(232, 242, 252, 0.78);
    font-family: var(--font-title);
    font-size: clamp(17px, 1.45vw, 22px);
    letter-spacing: -0.018em;
    line-height: 1.22;
    text-wrap: pretty;
  }
  .entry-scope {
    color: rgba(186, 213, 236, 0.48);
    font-size: 12px;
    letter-spacing: 0.01em;
    line-height: 1.35;
  }
  .enter-quick-links {
    position: fixed;
    right: max(32px, 4.5vw);
    bottom: max(28px, 4vh);
    z-index: 10002;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .enter-quick-links a {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 0 3px;
    border-bottom: 1px solid rgba(208, 231, 250, 0.28);
    color: rgba(208, 231, 250, 0.68);
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.13em;
    text-decoration: none;
    text-transform: uppercase;
    transition:
      color 0.2s ease,
      border-color 0.2s ease;
  }
  .enter-quick-links a:hover,
  .enter-quick-links a:focus-visible {
    border-color: rgba(240, 249, 255, 0.72);
    color: rgba(240, 249, 255, 0.96);
    outline: none;
  }

  /* First-frame portfolio fragments. They establish the material range behind the
     enter object, then leave with the gate. The images stay crisp and intentionally
     quiet: atmosphere comes from depth and timing, not hover treatments or blur. */
  #entry-memory-field {
    position: fixed;
    inset: 0;
    z-index: 9040;
    pointer-events: none;
    perspective: 1300px;
  }
  .entry-memory-fragment {
    position: absolute;
    width: clamp(88px, 12vw, 176px);
    margin: 0;
    opacity: 0;
    transform-style: preserve-3d;
    animation: entryMemoryArrive 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .entry-memory-fragment:nth-child(1) {
    top: 20%;
    left: clamp(28px, 7vw, 132px);
    animation-delay: 0.18s;
    --entry-tilt: -11deg;
    --entry-depth: -42px;
  }
  .entry-memory-fragment:nth-child(2) {
    bottom: 16%;
    left: clamp(72px, 17vw, 286px);
    animation-delay: 0.36s;
    --entry-tilt: 7deg;
    --entry-depth: 38px;
  }
  .entry-memory-fragment:nth-child(3) {
    top: 24%;
    right: clamp(28px, 7vw, 132px);
    animation-delay: 0.54s;
    --entry-tilt: 10deg;
    --entry-depth: 12px;
  }
  .entry-memory-fragment:nth-child(4) {
    right: clamp(72px, 17vw, 286px);
    bottom: 17%;
    animation-delay: 0.72s;
    --entry-tilt: -8deg;
    --entry-depth: -24px;
  }
  .entry-memory-fragment img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    border: 1px solid rgba(216, 235, 252, 0.24);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
    animation: entryMemoryDrift 8s ease-in-out 1.2s infinite alternate;
  }
  @keyframes entryMemoryArrive {
    from {
      opacity: 0;
      transform: translate3d(0, 26px, var(--entry-depth)) rotateZ(var(--entry-tilt)) rotateY(48deg) scale(0.78);
    }
    to {
      opacity: 0.82;
      transform: translate3d(0, 0, var(--entry-depth)) rotateZ(var(--entry-tilt)) rotateY(0) scale(1);
    }
  }
  @keyframes entryMemoryDrift {
    from {
      transform: translate3d(0, 0, 0);
    }
    to {
      transform: translate3d(0, -8px, 0);
    }
  }
  @media (max-width: 900px) {
    #entry-memory-field {
      display: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .entry-memory-fragment,
    .entry-memory-fragment img {
      animation: none;
    }
    .entry-memory-fragment {
      opacity: 0.72;
      transform: translate3d(0, 0, var(--entry-depth)) rotateZ(var(--entry-tilt));
    }
  }

  /* Mobile fallback — simple minimal button, hidden on desktop */
  .enter-btn-mobile {
    display: none;
  }
  @media (max-width: 700px) {
    #enter-buddha-wrap {
      display: flex;
    }
    .enter-btn-mobile {
      display: none;
    }
    .entry-identity {
      top: max(72px, 10vh);
      bottom: auto;
      left: 50%;
      max-width: min(320px, calc(100vw - 40px));
      align-items: center;
      text-align: center;
      transform: translateX(-50%);
    }
    .entry-name {
      font-size: 10px;
    }
    .entry-role {
      font-size: 16px;
      max-width: 18ch;
    }
    .entry-scope {
      font-size: 10.5px;
    }
    .enter-quick-links {
      right: auto;
      bottom: max(24px, 4vh);
      left: 50%;
      justify-content: center;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .enter-quick-links a {
      font-size: 8.5px;
      padding: 7px 9px;
    }
  }

  /* Reduced-motion desktop fallback — #enter-3d-stage is hidden entirely under
     prefers-reduced-motion (see below), which left mouse users with no visible
     way in (only the hidden #enter-btn, reachable by keyboard). Reuse the same
     mobile button here so a click path always exists regardless of viewport. */
  @media (prefers-reduced-motion: reduce) {
    .enter-btn-mobile {
      display: inline-flex;
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 10004;
      align-items: center;
      justify-content: center;
      min-width: 132px;
      min-height: 48px;
      border: 1px solid rgba(220, 238, 255, 0.28);
      border-radius: 999px;
      background: rgba(8, 12, 18, 0.72);
      color: rgba(245, 250, 255, 0.94);
      font: 500 12px/1 var(--font-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: translate(-50%, -50%);
    }
  }

  /* Idle thought — an occasional fragment rather than a UI speech bubble. It sits
     near the sculpture, then dissolves again without asking for attention. */
  #buddha-speech {
    position: fixed;
    z-index: 9060;
    pointer-events: none;

     glows come off entirely — a halo tuned to bloom against black reads as

<!-- Keep the loader compatible with Meshopt-compressed GLB files as well. -->
<script>
  self.ModelViewerElement = self.ModelViewerElement || {};
  self.ModelViewerElement.meshoptDecoderLocation = "https://cdn.jsdelivr.net/npm/meshoptimizer/meshopt_decoder.js";
</script>
<!-- ── 933KB THAT MOST VISITS NEVER USED ────────────────────────────────────
     This was a plain <script type="module"> and it was the single largest
     asset on the home page after the film — measured at 933KB decoded, ahead
     of the point cloud, the albedo and every image on the page.

     It is only ever needed by the Enter gate's Buddha. The gate is skipped
     entirely for anyone who has been here before: `sid_loaded` in
     localStorage means the loader removes itself and the gate from the DOM
     within a tick of parsing (see the skip path below). The library
     downloaded, parsed and defined its custom elements anyway, on every one
     of those visits, for an element that no longer existed by the time it
     finished.

     So it is requested by the Buddha's own bootstrap instead, which runs only
     when the gate is actually going to be shown. _includes/footer_buddha.html
     has always done it this way and guards on the same customElements check,
     so whichever of the two needs it first pays for it and the other one
     finds it already there. -->
<script>
  window.__mvLib = function () {
    if (window.customElements && customElements.get("model-viewer")) return;
    if (document.querySelector("script[data-mv-lib]")) return;
    var s = document.createElement("script");
    s.type = "module";
    s.src = "https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js";
    s.crossOrigin = "anonymous";
    s.setAttribute("data-mv-lib", "");
    document.head.appendChild(s);
  };
</script>

<script>
  // Floating buddha head — single model that DVD-bounces around. Slowly grows in size and rotation
  // speed over time. Hover triggers a playful wiggle + soft glow.
  (function () {
    var stage = document.getElementById("enter-3d-stage");
    var mount = document.getElementById("enter-3d-mount");
    if (!stage || !mount) return;
    /* ── THE GATE IS NOT ALWAYS SHOWN ─────────────────────────────────────
       This block runs from an inline script above the skip path, so on a
       return visit it was building the Buddha — and requesting the library
       for it — a few hundred milliseconds before the skip path removed the
       gate from the document. The elements were still present, which is the
       only thing the guard above tests, so nothing about it looked wrong.

       Same flag the skip path reads, read here first. Anyone who has been
       through Enter once never pays for the 3D again. */
    try {
      if (localStorage.getItem("sid_loaded") || sessionStorage.getItem("sid_loaded")) return;
    } catch (_) {}
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    // Buddha now runs on touch too — user wants it visible on mobile. CSS already
    // shrinks the stage on small screens, and the rAF loop is light (<1ms/frame).

    var BUDDHA_SRC = "{{ site.baseurl }}/assets/models/buddha-web.glb";
    var mv;
    function buildViewer() {
      /* The one place on this page that needs the library. Called from the
         gate's bootstrap below, which does not run when the gate is skipped. */
      if (window.__mvLib) window.__mvLib();
      mount.innerHTML = "";
      mv = document.createElement("model-viewer");
      mv.setAttribute("src", BUDDHA_SRC);
      mv.setAttribute("auto-rotate", "");
      mv.setAttribute("rotation-per-second", "18deg");
      mv.setAttribute("camera-orbit", "0deg 75deg 110%");
      mv.setAttribute("interaction-prompt", "none");
      mv.setAttribute("disable-zoom", "");
      mv.setAttribute("disable-pan", "");
      mv.setAttribute("disable-tap", "");
      mv.setAttribute("environment-image", "neutral");
      mv.setAttribute("exposure", "0.95");
      mv.setAttribute("shadow-intensity", "0");
      mv.style.pointerEvents = "none";
      mount.appendChild(mv);
      return mv;
    }

    var W, H;
    function measure() {
      W = window.innerWidth;
      H = window.innerHeight;
    }
    measure();
    window.addEventListener("resize", measure, { passive: true });

    var baseSize = stage.offsetWidth || 130; // reference at scale 1 (matches new CSS width)

    // DVD-bounce around the full viewport. On every wall hit the buddha gets slightly bigger
    // and spins slightly faster — playful payoff for "leaving it alone".
    var startCx = W / 2,
      startCy = H / 2;
    // Spawn somewhere off-center so first bounce is visible
    var x = Math.random() * (W - baseSize - 200) + 100;
    var y = Math.random() * (H - baseSize - 200) + 100;
    var SPEED = 1.4; // px/frame
    var ang = Math.random() * Math.PI * 2;
    var vx = Math.cos(ang) * SPEED;
    var vy = Math.sin(ang) * SPEED;
    // Per-collision growth + rotation increments — capped so it doesn't take over the scene
    var growth = 1.0;
    var GROW_PER_HIT = 0.025; // +2.5% scale each wall hit
    var GROW_CAP = 1.8; // stop growing at 180% of base
    var rotPerSec = 14; // starts calm
    var ROT_PER_HIT = 1.4; // +1.4 deg/s per hit
    var ROT_CAP = 60;

    function bumpOnHit() {
      growth = Math.min(growth + GROW_PER_HIT, GROW_CAP);
      rotPerSec = Math.min(rotPerSec + ROT_PER_HIT, ROT_CAP);
      if (mv && !stage.classList.contains("is-hovering")) {
        mv.setAttribute("rotation-per-second", rotPerSec + "deg");
      }
    }

    // Speech-bubble tracking state — declared early so tick() can reference safely.
    // The actual speech wiring lives below (sayings, timers, showSpeech, etc.).
    var speech,
      speechVisible = false,
      placeSpeech = function () {};

    // Hover playfulness — liquify animation. Rotation slows on hover so the warp reads.
    stage.addEventListener("mouseenter", function () {
      stage.classList.add("is-hovering");
      if (mv) mv.setAttribute("rotation-per-second", "8deg");
    });
    stage.addEventListener("mouseleave", function () {
      stage.classList.remove("is-hovering");
      if (mv) mv.setAttribute("rotation-per-second", rotPerSec + "deg");
    });

    // Mount model. Buddha is centered via flexbox — no bounce loop needed.
    var inst = buildViewer();
    stage.classList.add("is-on");
    inst.addEventListener(
      "load",
      function () {
        stage.classList.add("is-model-ready");
      },
      { once: true }
    );

    /* The portal ring is a placeholder that only ever gets removed by the
       model's own load event, and that event has three ways of never firing:
       the model-viewer module is a cross-origin script from a CDN, the model
       itself is 1.8MB, and WebGL can be off. In any of those cases the front
       door of this site is a pulsing empty circle above the words ENTER
       PORTFOLIO, permanently -- which is what it renders as offline, and what
       it will look like to anyone on a bad connection or a locked-down
       browser. A placeholder that outlives the thing it is holding space for
       is not a placeholder, it is the design.

       So it gets a deadline. Three and a half seconds is long enough that a
       normal load never sees this path and short enough that a failed one
       does not sit there. The ring goes, the label comes up to full weight,
       and the threshold becomes what it can actually be under those
       conditions: a line of type you click. If the model turns up later it
       still fades in over the top -- nothing here cancels it. */
    var portalDeadline = setTimeout(function () {
      if (stage.classList.contains("is-model-ready")) return;
      stage.classList.add("is-model-ready", "is-model-absent");
    }, 3500);
    inst.addEventListener(
      "load",
      function () {
        clearTimeout(portalDeadline);
      },
      { once: true }
    );

    // Wire click on the Buddha to trigger site entry
    stage.addEventListener("click", function () {
      var btn = document.getElementById("enter-btn");
      if (btn) btn.click();
    });

    // ── IDLE BUDDHA THOUGHT ── a small ambient fragment if someone lingers.
    // Cancelled the moment Enter is clicked or the gate is removed.
    speech = document.getElementById("buddha-speech");
    var sayings = [
      { at: 6000, text: "take your time." },
      { at: 15000, text: "notice what stays with you." },
      { at: 26000, text: "make something useful." },
    ];
    var speechTimers = [];
    placeSpeech = function () {
      /* ── IT GOES WHERE THERE IS ROOM ────────────────────────────────────
         This was one rule: sit above the sculpture, flip below if that would
         land under the nav. Right on a wide screen, where the sculpture
         floats in the middle of an empty page. Wrong on a phone, where the
         layout stacks and the sculpture has the identity block immediately
         above it and ENTER PORTFOLIO immediately below. Rendered at 390x844,
         "TAKE YOUR TIME." sat across "EyeJack · Philips"; flipping it below
         put it across ENTER PORTFOLIO instead. No single offset is free on
         both layouts.

         So it picks a SLOT rather than an offset — above the sculpture, below
         the sculpture, or below the enter label, that last being the open
         band a phone actually has between the call to action and the two
         links at the foot. Each candidate is tested against everything it
         could land on, and the first clear one wins. If none is clear the
         thought is not shown at all: a legible page with no idle musing beats
         a musing printed over the way in.

         No breakpoint in any of it. Every element reports its own rect, so
         this holds at widths nobody thought to check. */
      if (!speech || !speechVisible) return;
      var r = stage.getBoundingClientRect();
      var bx = Math.max(150, Math.min(W - 150, r.left + r.width / 2));

      var obstacles = [];
      [".entry-identity", "#enter-label", ".enter-quick-links", ".studio-nav", ".enter-btn-mobile"].forEach(function (sel) {
        var e = document.querySelector(sel);
        if (!e) return;
        var q = e.getBoundingClientRect();
        if (q.width > 0 && q.height > 0) obstacles.push(q);
      });

      var sh = speech.offsetHeight || 20;
      var sw = speech.offsetWidth || 160;
      var slots = [r.top - 14 - sh, r.bottom + 14];
      var enterEl = document.getElementById("enter-label");
      if (enterEl) slots.push(enterEl.getBoundingClientRect().bottom + 18);

      function clear(top) {
        if (top < 74 || top + sh > window.innerHeight - 8) return false;
        for (var i = 0; i < obstacles.length; i++) {
          var q = obstacles[i];
          var oy = Math.min(top + sh, q.bottom) - Math.max(top, q.top);
          var ox = Math.min(bx + sw / 2, q.right) - Math.max(bx - sw / 2, q.left);
          if (oy > 2 && ox > 2) return false;
        }
        return true;
      }

      var by = null;
      for (var si = 0; si < slots.length; si++) {
        if (clear(slots[si])) {
          by = slots[si];
          break;
        }
      }
      if (by === null) {
        speech.classList.remove("show");
        return;
      }

      speech.style.left = bx + "px";
      speech.style.top = by + "px";
    };
    function showSpeech(text) {
      if (!speech || !stage.parentNode) return;
      speech.textContent = text;
      speechVisible = true;
      placeSpeech();
      speech.classList.add("show");
      var hideId = setTimeout(function () {
        speech.classList.remove("show");
        speechVisible = false;
      }, 4000);
      speechTimers.push(hideId);
    }
    function cancelSpeech() {
      speechTimers.forEach(clearTimeout);
      speechTimers = [];
      speechVisible = false;
      if (speech) speech.classList.remove("show");
    }
    sayings.forEach(function (s) {
      var id = setTimeout(function () {
        showSpeech(s.text);
      }, s.at);
      speechTimers.push(id);
    });
    // Stop speech the moment user clicks Enter or hits Enter/Space.
    // (Don't use { once: true } on keydown — would detach on the first stray key
    // and miss the actual Enter press.)
    var btn = document.getElementById("enter-btn");
    if (btn) btn.addEventListener("click", cancelSpeech, { once: true });
    function speechKeyHandler(e) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        cancelSpeech();
        window.removeEventListener("keydown", speechKeyHandler);
      }
    }
    window.addEventListener("keydown", speechKeyHandler);
  })();
</script>

<script>
  // The entry model receives one clean exit beat. It deliberately avoids a displacement
  // effect so the opening has a stable silhouette instead of a visual glitch.
  (function () {
    var stage = document.getElementById("enter-3d-stage");
    var flash = document.getElementById("enter-flash");
    if (!stage) return;
    var collapsing = false;
    window.__buddhaCollapse = function (done) {
      if (collapsing || stage.offsetWidth === 0) {
        done();
        return;
      }
      collapsing = true;
      stage.classList.add("is-collapsing");

        void flash.offsetWidth;
        flash.classList.add("is-flashing");
      }
      setTimeout(done, 520);
    };
  })();
</script>

<script>
  // ── LOADER SMOKE SHADER ── same WebGL noise field used on home #smoke-bg.
  // Runs from page load so the Enter scene has a live shader backdrop, not a static gradient.
  // Cleaned up on loaderDone alongside #loader-collage.
  // If WebGL fails → set html.no-shader so the static gradient fallback paints instead.
  (function () {
    var c = document.getElementById("loader-smoke-bg");
    if (!c) {
      document.documentElement.classList.add("no-shader");
      return;
    }
    var prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (prefersReduced) {
      document.documentElement.classList.add("no-shader");
      return;
    }
    // Skip the loader fbm shader on touch+small — let the static gradient fallback paint instead.
    var isTouchSmall =
      window.matchMedia && (window.matchMedia("(hover: none) and (pointer: coarse)").matches || window.matchMedia("(max-width: 700px)").matches);
    if (isTouchSmall) {
      document.documentElement.classList.add("no-shader");
      return;
    }
    var gl = c.getContext("webgl", { alpha: true, premultipliedAlpha: false });
    if (!gl) {
      document.documentElement.classList.add("no-shader");
      return;
    }
    function resize() {
      c.width = window.innerWidth * 0.5;
      c.height = window.innerHeight * 0.5;
      gl.viewport(0, 0, c.width, c.height);
    }
    resize();
    window.addEventListener("resize", resize);
    var VS = "attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}";
    var FS = [
      "precision mediump float;",
      "uniform float u_time;",
      "uniform vec2 u_res;",
      "uniform vec2 u_mouse;",
      "vec3 mod289(vec3 x){return x-floor(x/289.0)*289.0;}",
      "vec2 mod289(vec2 x){return x-floor(x/289.0)*289.0;}",
      "vec3 permute(vec3 x){return mod289((x*34.0+1.0)*x);}",
      "float snoise(vec2 v){",
      "  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);",
      "  vec2 i=floor(v+dot(v,C.yy));",
      "  vec2 x0=v-i+dot(i,C.xx);",
      "  vec2 i1=x0.x>x0.y?vec2(1,0):vec2(0,1);",
      "  vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;",
      "  i=mod289(i);",
      "  vec3 p=permute(permute(i.y+vec3(0,i1.y,1))+i.x+vec3(0,i1.x,1));",
      "  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);",
      "  m=m*m;m=m*m;",
      "  vec3 x=2.0*fract(p*C.www)-1.0;",
      "  vec3 h=abs(x)-0.5;",
      "  vec3 ox=floor(x+0.5);",
      "  vec3 a0=x-ox;",
      "  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);",
      "  vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;",
      "  return 130.0*dot(m,g);",
      "}",
      "float fbm(vec2 p){float f=0.0;f+=0.5*snoise(p);p*=2.02;f+=0.25*snoise(p);p*=2.03;f+=0.125*snoise(p);p*=2.01;f+=0.0625*snoise(p);return f;}",
      "void main(){",
      "  vec2 uv=gl_FragCoord.xy/u_res;",
      "  float t=u_time*0.15;",
      "  // Cursor influence — creates swirl around mouse",
      "  vec2 mouse=u_mouse;",
      "  vec2 d=uv-mouse;",
      "  float dist=length(d);",
      "  float curl=exp(-dist*3.0)*0.4;",
      "  vec2 swirl=vec2(-d.y,d.x)*curl;",
      "  // Multi-layer smoke",
      "  float n1=fbm(uv*3.0+vec2(t*0.8,t*0.6)+swirl*2.0);",
      "  float n2=fbm(uv*2.0+vec2(-t*0.5,t*0.7)+swirl*1.5+0.5);",
      "  float n3=fbm(uv*4.5+vec2(t*0.3,-t*0.4)+swirl*3.0+1.0);",
      "  float smoke=n1*0.5+n2*0.3+n3*0.2;",
      "  smoke=smoke*0.5+0.5;",
      "  smoke=smoothstep(0.25,0.75,smoke);",
      "  // Exact match to home #smoke-bg — cursor-revealed cyan smoke on near-black, seamless across loader scene + home",
      "  vec3 deep=vec3(0.01,0.02,0.04);",
      "  vec3 mid=vec3(0.04,0.12,0.18);",
      "  vec3 light=vec3(0.15,0.30,0.35);",
      "  vec3 highlight=vec3(0.35,0.50,0.48);",
      "  vec3 col=mix(deep,mid,smoothstep(0.2,0.45,smoke));",
      "  col=mix(col,light,smoothstep(0.45,0.65,smoke));",
      "  col=mix(col,highlight,smoothstep(0.7,0.9,smoke)*0.3);",
      "  // Cursor proximity — smoke only visible near cursor, like home",
      "  float proximity=exp(-dist*12.0);",
      "  col*=proximity*2.5+0.005;",
      "  // Cursor glow — tight + bright",
      "  float glow=exp(-dist*18.0)*0.25;",
      "  col+=vec3(0.30,0.50,0.55)*glow;",
      "  // Vignette darken edges",
      "  float vig=1.0-dot((uv-0.5)*1.6,(uv-0.5)*1.6);",
      "  col*=vig;",
      "  gl_FragColor=vec4(col,1.0);",
      "}",
    ].join("\n");
    function mkShader(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    }
    var prog = gl.createProgram();
    gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var a = gl.getAttribLocation(prog, "a");
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    var uTime = gl.getUniformLocation(prog, "u_time");
    var uRes = gl.getUniformLocation(prog, "u_res");
    var uMouse = gl.getUniformLocation(prog, "u_mouse");
    var mx = 0.5,
      my = 0.5,
      tmx = 0.5,
      tmy = 0.5,
      alive = true;
    document.addEventListener(
      "mousemove",
      function (e) {
        tmx = e.clientX / window.innerWidth;
        tmy = 1.0 - e.clientY / window.innerHeight;
      },
      { passive: true }
    );
    var t0 = performance.now();
    var tOffset = 0; // ms paused while tab hidden — keeps shader time continuous
    var pauseAt = 0;
    var hidden = false;
    var rafId = 0;
    function tick() {
      if (!alive || !c.parentNode) return;
      mx += (tmx - mx) * 0.05;
      my += (tmy - my) * 0.05;
      gl.uniform1f(uTime, (performance.now() - t0 - tOffset) / 1000);
      gl.uniform2f(uRes, c.width, c.height);
      gl.uniform2f(uMouse, mx, my);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      if (!hidden) rafId = requestAnimationFrame(tick);
    }
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        hidden = true;
        pauseAt = performance.now();
        if (rafId) cancelAnimationFrame(rafId);
      } else if (hidden) {
        hidden = false;
        tOffset += performance.now() - pauseAt;
        if (alive && c.parentNode) tick();
      }
    });
    tick();
    window.addEventListener("loaderDone", function () {
      setTimeout(function () {
        alive = false;
        if (c.parentNode) {
          c.style.transition = "opacity 0.6s ease";
          c.style.opacity = "0";
          setTimeout(function () {
            if (c.parentNode) c.remove();
          }, 700);
        }
      }, 200);
    });
  })();

  // ── ENTRY-SCENE WORK-COLLAGE — top-level cursor reveal + auto-pan, runs from page load (backs Enter gate too).
  // Removed cleanly when the loader sequence completes; home page has its own #work-collage that takes over.
  (function () {
    var lc = document.getElementById("loader-collage");
    if (!lc) return;
    var prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (prefersReduced) return;
    var t0 = performance.now();
    var userTook = false;
    var lastUserMove = 0;
    function tick(now) {
      if (!lc.parentNode) return;
      var elapsed = (now - t0) / 1000;
      var w = window.innerWidth,
        h = window.innerHeight;
      if (userTook && now - lastUserMove < 1200) {
        // already set by mousemove handler
      } else {
        var cx = (0.5 + 0.32 * Math.sin(elapsed * 0.4)) * w;
        var cy = (0.5 + 0.22 * Math.sin(elapsed * 0.62)) * h;
        lc.style.setProperty("--lcx", cx + "px");
        lc.style.setProperty("--lcy", cy + "px");
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    document.addEventListener(
      "mousemove",
      function (e) {
        userTook = true;
        lastUserMove = performance.now();
        lc.style.setProperty("--lcx", e.clientX + "px");
        lc.style.setProperty("--lcy", e.clientY + "px");
      },
      { passive: true }
    );
    // When the loader sequence finishes, fade + remove so home page's own work-collage takes over
    window.addEventListener("loaderDone", function () {
      setTimeout(function () {
        // Backdrop fades out first so home reveals smoothly
        var backdrop = document.getElementById("enter-backdrop");
        if (backdrop) {
          backdrop.style.transition = "opacity 0.6s ease";
          backdrop.style.opacity = "0";
          setTimeout(function () {
            if (backdrop.parentNode) backdrop.remove();
          }, 700);
        }
        if (!lc || !lc.parentNode) return;
        lc.style.transition = "opacity 0.6s ease";
        lc.style.opacity = "0";
        setTimeout(function () {
          if (lc && lc.parentNode) lc.remove();
        }, 700);
      }, 200);
    });
  })();

  (function () {
    var loader = document.getElementById("site-loader");
    if (!loader) return;

    var enterGate = document.getElementById("enter-gate");
    var enterBtn = document.getElementById("enter-btn");
    var enterLabel = document.getElementById("enter-label");

    // Loader gate — once a visitor has gone through Enter + cube once, never replay it.
    // We use localStorage (persists across tabs/sessions) instead of sessionStorage (per-tab),
    // because the previous behavior re-played the cube every time someone came back to home
    // from another page in a fresh tab. localStorage means: first visit ever → see the show;
    // every visit after that (today, tomorrow, next month) → skip straight to the desk.
    // Legacy sessionStorage flag honored too, in case someone has it from before.
    if (localStorage.getItem("sid_loaded") || sessionStorage.getItem("sid_loaded")) {
      if (enterGate) enterGate.remove();
      loader.remove();
      // Defer to next tick so listeners attached later in the document still receive it
      window.__loaderInstantDone = true;
      setTimeout(function () {
        window.dispatchEvent(new CustomEvent("loaderDone", { detail: { instant: true } }));
      }, 0);
      return;
    }

    // Wait for Enter click
    function onEnter() {
      try {
        localStorage.setItem("sid_loaded", "1");
      } catch (_) {
        // Private mode or storage full — fall back to sessionStorage so at least within
        // this tab the loader doesn't replay between page nav (the original behavior).
        sessionStorage.setItem("sid_loaded", "1");
      }

      function proceed() {
        if (enterGate) enterGate.remove();
        /* ── THE OPENING IS BACK ────────────────────────────────────────────
           This used to remove the loader here and hand straight to the site,
           on the reasoning left in place by e8c24b20 (14 Jul): "the threshold
           is now the whole opening ... do not make a visitor pass through a
           second video scene."

           Sid: "bring back cube getting up intro sequence." The whole thing
           was still in this file — startLoader() below runs the cube waking
           up, the brain-and-eyes phase, the Hello and the collage, and it was
           simply never being called. Nothing had to be rebuilt; it had to be
           reconnected.

           startLoader() owns its own ending: it removes the loader and fires
           loaderDone with instant:false when the sequence finishes, and it
           carries a 25 second failsafe that tears everything down if a video
           never arrives, so a visitor can never be stranded in it. */
        /* Reduced motion goes straight in. The sequence is sixteen seconds of
           video with a scrambling type effect over it, which is precisely
           what somebody who has asked for less motion is asking not to sit
           through — and unlike a decorative flourish they cannot scroll past
           it, because it is the door. */
        var lessMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (lessMotion) {
          if (loader && loader.parentNode) loader.remove();
          window.__loaderInstantDone = true;
          window.dispatchEvent(new CustomEvent("loaderDone", { detail: { instant: true } }));
          return;
        }
        window.__loaderInstantDone = false;
        startLoader();
      }

      // The Buddha resolves into the portfolio with one brief, contained motion.
      // It is a transition cue, not a second loading sequence.
      if (window.__buddhaCollapse && !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) {
        window.__buddhaCollapse(proceed);
      } else {
        proceed();
      }
    }
    // Wire mobile enter button
    var mobileBtn = document.getElementById("enter-btn-mobile");
    if (mobileBtn) mobileBtn.addEventListener("click", onEnter);
    if (enterLabel) {
      enterLabel.addEventListener("click", function () {
        if (enterBtn) enterBtn.click();
      });
    }

    if (enterBtn) {
      enterBtn.addEventListener("click", onEnter);
      // Keyboard: Enter or Space anywhere triggers entry while gate is showing
      var keyHandler = function (e) {
        if (document.activeElement && document.activeElement.id === "skip-intro") return;
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
          // Don't fire if user is typing in an input (defensive — no inputs on this scene, but safe)
          var tag = document.activeElement && document.activeElement.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA") return;
          e.preventDefault();
          onEnter();
          window.removeEventListener("keydown", keyHandler);
        }
      };
      window.addEventListener("keydown", keyHandler);
    }

    function startLoader() {
      /* ── SHOW THE THING ───────────────────────────────────────────────────
         Sid: "in the beginning, when i clicked Enter, the screen was blank,
         and then i had to click on the top-left logo, and then i saw my
         homepage."

         The markup carries `style="display: none"` inline, and nothing in
         this file ever took it off. So the entire opening ran — the video
         played, the three Hello lines resolved, the collage assembled, the
         teardown fired on schedule — inside an element that was never
         displayed. What a visitor got was a black screen for twenty-five
         seconds until the failsafe removed it, because the site underneath
         does not reveal until `loaderDone`.

         It also explains why the last check passed: it read video
         currentTime and textContent, both of which advanced perfectly. An
         inline style beats the stylesheet's `display: flex`, and no amount of
         asking the sequence how it is doing will tell you nobody can see it.

         `is-running` goes on here too — the skip button's rule keys off it,
         so the escape hatch has never been visible either. */
      loader.style.display = "flex";
      loader.classList.add("is-running");

      setTimeout(function () {
        if (loader && loader.parentNode) {
          loader.remove();
          window.dispatchEvent(new CustomEvent("loaderDone", { detail: { instant: true } }));
        }
      }, 25000);

      var videoPhase = document.getElementById("sl-video-phase");
      var video = document.getElementById("sl-video");
      var hello = document.getElementById("sl-hello");
      var loadingPhase = document.getElementById("sl-loading-phase");
      var loadingVideo = document.getElementById("sl-loading-video");

      function hydrateVideo(media) {
        if (!media || media.getAttribute("src") || !media.dataset.src) return;
        media.src = media.dataset.src;
        media.removeAttribute("data-src");
        media.load();
      }

      // The first cinematic request begins only after the explicit Enter gesture.
      // The handoff animation waits until phase two, so neither video competes
      // with the initial Buddha/model render or a return visitor's first paint.
      hydrateVideo(video);

      // (The memory-tile hydration loop was here. Its markup and CSS are
      //  both gone, so it was iterating an empty list every entry.)

      // (typing.mp3 sound removed — Hello/scramble effect doesn't need it)

      // Loader dust particles
      (function () {
        var dc = document.getElementById("loader-dust");
        if (!dc) return;
        var ctx = dc.getContext("2d");
        dc.width = window.innerWidth;
        dc.height = window.innerHeight;
        var dots = [];
        for (var d = 0; d < 40; d++) {
          dots.push({
            x: Math.random() * dc.width,
            y: Math.random() * dc.height,
            r: 0.5 + Math.random() * 1.5,
            vx: (Math.random() - 0.5) * 0.3,
            vy: -0.1 - Math.random() * 0.2,
            a: 0.15 + Math.random() * 0.25,
          });
        }
        function drawDust() {
          ctx.clearRect(0, 0, dc.width, dc.height);
          dots.forEach(function (p) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -10) {
              p.y = dc.height + 10;
              p.x = Math.random() * dc.width;
            }
            if (p.x < -10) p.x = dc.width + 10;
            if (p.x > dc.width + 10) p.x = -10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255," + p.a + ")";
            ctx.fill();
          });
          if (document.getElementById("loader-dust")) requestAnimationFrame(drawDust);
        }
        drawDust();
      })();

      // Phase 1: cube video + the scramble-reveal headline
      videoPhase.classList.add("active");
      video.play().catch(function () {});

      /* ── ONE THING TO SAY ───────────────────────────────────────────────
         Sid: "in the first onboarding theres too much other info it needs to
         be concise ... it should be hey I'm Sid, welcome to my portfolio. I
         hope you feel the love I put into it."

         It was three beats that each replaced the one before it — a name, a
         job title, and an instruction — over a sixteen second film, plus a
         four-icon map of the nav, which is a nav a visitor is about to be
         handed anyway and was on screen the whole time. Four things saying
         four different things at a door.

         It is one sentence now, in two beats because the sentence has two
         halves and the scramble needs somewhere to land. The greeting, then
         the reason. Nothing instructs, nothing lists, nothing duplicates the
         nav. The film carries the rest. */
      var lines = [
        { text: "Hey, I'm Sid. Welcome to my portfolio.", startAt: 800 },
        { text: "I hope you feel the love I put into it.", startAt: 5200 },
      ];

      // ── SCRAMBLE REVEAL ── each char cycles through random glyphs then settles to the real char.
      // Replaces the typewriter; reads as a creative-tech / hacker reveal that suits the Inter 200 face.
      var SCRAMBLE_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!?#@*<>/\\";
      function scrambleTo(el, target, opts) {
        opts = opts || {};
        var duration = opts.duration || 900;
        var fps = 30;
        var totalFrames = Math.round((duration / 1000) * fps);
        var startTime = performance.now();
        // Per-char: assign a random "settle frame" so chars resolve at staggered times
        var settleFrames = [];
        for (var i = 0; i < target.length; i++) {
          settleFrames.push(Math.floor(totalFrames * (0.3 + 0.65 * (i / Math.max(1, target.length - 1)))));
        }
        function frame(now) {
          var elapsed = now - startTime;
          var f = Math.floor((elapsed / 1000) * fps);
          if (f >= totalFrames) {
            el.textContent = target;
            if (opts.done) opts.done();
            return;
          }
          var out = "";
          for (var i = 0; i < target.length; i++) {
            if (f >= settleFrames[i]) {
              out += target[i];
            } else if (target[i] === " ") {
              out += " ";
            } else {
              out += SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
            }
          }
          el.textContent = out;
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      lines.forEach(function (line, idx) {
        setTimeout(function () {
          // Fade out previous (opacity 0 + heavy blur).
          hello.style.transition = "opacity 0.35s ease, filter 0.35s ease";
          hello.style.opacity = "0";
          hello.style.filter = "blur(8px)";
          setTimeout(function () {
            // SCRAMBLE PHASE: low opacity + light blur so the cycling random characters are visible
            // but quiet — they don't steal attention while the text is still forming.
            hello.style.transition = "none";
            hello.style.opacity = "0.32";
            hello.style.filter = "blur(3px)";
            scrambleTo(hello, line.text, {
              duration: 900,
              done: function () {
                // RESOLVE PHASE: text has fully formed. Smoothly ramp opacity → 1 and unblur.
                hello.style.transition = "opacity 0.7s var(--ease-out), filter 0.7s ease";
                hello.style.opacity = "1";
                hello.style.filter = "blur(0)";
              },
            });
          }, 350);
        }, line.startAt);
      });

      // When the cube video ends, fade the Hello text out so it doesn't linger past the cube exit
      var fadeHelloOnVideoEnd = function () {
        hello.style.transition = "opacity 0.5s ease, filter 0.5s ease";
        hello.style.opacity = "0";
        hello.style.filter = "blur(6px)";
      };

      // Video ends → loading animation → dissolve
      var videoEnded = false;
      var loadingEnded = false;

      function onLoadingEnd() {
        if (loadingEnded) return;
        loadingEnded = true;
        loader.classList.remove("is-running");
        video.pause();
        loadingVideo.pause();
        // Brief hold, then dissolve
        setTimeout(function () {
          loader.style.transition = "opacity 0.8s ease";
          loader.style.opacity = "0";

          setTimeout(function () {
            if (loader.parentNode) loader.remove();
            window.dispatchEvent(new CustomEvent("loaderDone", { detail: { instant: false } }));
          }, 800);
        }, 200);
      }

      var skipButton = document.getElementById("loader-skip");
      if (skipButton) skipButton.addEventListener("click", onLoadingEnd, { once: true });

      /* Escape ends the intro too. The button is a 113px target in one
         corner of a moving screen; Escape is what a person who wants out of
         something already reaches for, and it costs nothing to honour. Not
         Enter or Space — those are the gate's own keys a moment earlier
         (see the keyHandler above), and a visitor still holding Space from
         opening the door would skip the film they just chose to watch.

         Removed on the way out rather than { once: true }, so a stray
         Escape during the sequence's own teardown cannot re-enter it. */
      function skipKeyHandler(e) {
        if (e.key === "Escape" || e.key === "Esc") {
          window.removeEventListener("keydown", skipKeyHandler);
          onLoadingEnd();
        }
      }
      window.addEventListener("keydown", skipKeyHandler);
      window.addEventListener("loaderDone", function () {
        window.removeEventListener("keydown", skipKeyHandler);
      });

      function onVideoEnd() {
        if (videoEnded) return;
        videoEnded = true;
        videoPhase.classList.remove("active");
        videoPhase.classList.add("exit");
        // Fade Hello out — it overstayed its welcome past the cube exit
        fadeHelloOnVideoEnd();
        video.pause();
        hydrateVideo(loadingVideo);
        loadingPhase.classList.add("active");
        loadingVideo.play().catch(function () {});

        loadingVideo.addEventListener("ended", onLoadingEnd);
        // Fallback: clamp duration to 5.5s in case 'ended' doesn't fire
        setTimeout(onLoadingEnd, 5500);
      }

      video.addEventListener("ended", onVideoEnd);
      setTimeout(onVideoEnd, 11000);
    } // end startLoader
  })();
</script>
