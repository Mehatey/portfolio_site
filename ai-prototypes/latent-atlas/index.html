<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latent Atlas: a museum, by meaning</title>
    <meta
      name="description"
      content="An explorable WebGPU galaxy of 1500 real Met artworks, embedded with CLIP. Type a phrase and a model running in your browser flies you to the matching art by meaning."
    />
    <meta property="og:title" content="Latent Atlas — a museum, by meaning" />
    <meta property="og:description" content="1500 Met artworks embedded with CLIP, explorable in 3D. In-browser semantic search on WebGPU." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/ai-prototypes/latent-atlas/assets/cover-iHsdcUBA.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>◹</text></svg>"
    />
    <link rel="preconnect" href="https://images.metmuseum.org" />
    <link rel="stylesheet" crossorigin href="/ai-prototypes/latent-atlas/assets/index-B9kZPyGk.css" />
    <style>
      .demo-gate {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #060a12;
        color: #f4f7fb;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 320ms ease, visibility 320ms ease;
      }
      .demo-gate.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .demo-gate__card {
        width: min(100%, 760px);
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.9fr);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        background: #0b111d;
      }
      .demo-gate__poster {
        width: 100%;
        height: 100%;
        min-height: 360px;
        object-fit: cover;
      }
      .demo-gate__copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(28px, 5vw, 52px);
      }
      .demo-gate__copy h1 {
        margin: 0 0 14px;
        font-size: clamp(30px, 4vw, 48px);
        line-height: 0.98;
        letter-spacing: -0.035em;
      }
      .demo-gate__copy p {
        margin: 0;
        color: rgba(244, 247, 251, 0.76);
        font-size: 16px;
        line-height: 1.55;
      }
      .demo-gate__actions {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 28px;
      }
      .demo-gate__start {
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid #f4f7fb;
        border-radius: 6px;
        background: #f4f7fb;
        color: #07101c;
        font: 650 14px/1 ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }
      .demo-gate__start:focus-visible {
        outline: 3px solid #70a7ff;
        outline-offset: 3px;
      }
      .demo-gate__hint {
        color: rgba(244, 247, 251, 0.6);
        font-size: 12px;
        line-height: 1.4;
      }
      @media (max-width: 680px) {
        .demo-gate__card { grid-template-columns: 1fr; }
        .demo-gate__poster { min-height: 220px; max-height: 34vh; }
        .demo-gate__copy { padding: 26px; }
        .demo-gate__actions { align-items: flex-start; flex-direction: column; }
      }
      @media (prefers-reduced-motion: reduce) {
        .demo-gate { transition: none; }
      }
    </style>
  </head>
  <body>
    <section class="demo-gate" id="demo-gate" aria-labelledby="demo-gate-title">
      <div class="demo-gate__card">
        <img
          class="demo-gate__poster"
          src="/ai-prototypes/latent-atlas/assets/cover-iHsdcUBA.png"
          width="1200"
          height="630"
          alt="Latent Atlas, an explorable field of artworks from The Met"
          fetchpriority="high"
        />
        <div class="demo-gate__copy">
          <h1 id="demo-gate-title">Latent Atlas</h1>
          <p>Explore 1,500 works from The Met by visual meaning, with semantic search running entirely in your browser.</p>
          <div class="demo-gate__actions">
            <button class="demo-gate__start" id="start-demo" type="button">Start demo</button>
            <span class="demo-gate__hint" id="demo-gate-hint">About 300 MB. Best on desktop Wi-Fi.</span>
          </div>
        </div>
      </div>
    </section>
    <script>
      (function () {
        var button = document.getElementById("start-demo");
        var gate = document.getElementById("demo-gate");
        var hint = document.getElementById("demo-gate-hint");
        if (!button || !gate) return;
        button.addEventListener("click", function () {
          if (button.disabled) return;
          button.disabled = true;
          button.textContent = "Opening…";
          hint.textContent = "Loading the collection. Model progress appears in the search bar.";
          var script = document.createElement("script");
          script.type = "module";
          script.crossOrigin = "anonymous";
          script.src = "/ai-prototypes/latent-atlas/assets/index-kIKLrk04.js";
          script.addEventListener("load", function () {
            gate.classList.add("is-leaving");
            window.setTimeout(function () { gate.remove(); }, 340);
          });
          script.addEventListener("error", function () {
            button.disabled = false;
            button.textContent = "Try again";
            hint.textContent = "The demo could not load. Check your connection and try again.";
          });
          document.head.appendChild(script);
        });
      })();
    </script>
    <canvas id="scene"></canvas>

    <!-- HUD -->
    <header id="hud">
      <div class="title"><span class="mark">◹</span> <span id="count">…</span> works from The Met</div>
    </header>

    <!-- search -->
    <form id="search" autocomplete="off">
      <input id="q" type="text" placeholder="describe what you want to see — “storms at sea”, “gold and shadow”, “a quiet interior”" />
      <button type="submit" id="go">search</button>
      <span id="model-status" class="status"></span>
    </form>
    <div id="chips">
      <button class="chip" data-q="storms at sea">storms at sea</button>
      <button class="chip" data-q="gold and shadow">gold and shadow</button>
      <button class="chip" data-q="a quiet interior">a quiet interior</button>
      <button class="chip" data-q="faces in red">faces in red</button>
      <button class="chip" data-q="geometric abstraction">geometric abstraction</button>
    </div>

    <!-- top matches strip -->
    <div id="results" hidden></div>

    <!-- artwork detail card -->
    <aside id="card" hidden>
      <img id="card-img" alt="" />
      <div id="card-body">
        <h2 id="card-title"></h2>
        <p id="card-artist"></p>
        <p id="card-meta"></p>
        <p id="card-tags"></p>
        <a id="card-link" target="_blank" rel="noopener">view at the Met ↗</a>
      </div>
    </aside>

    <!-- small caption under the focused work -->
    <div id="focus-label" hidden>
      <span id="focus-title"></span>
      <span id="focus-artist"></span>
    </div>

    <!-- loading -->
    <div id="loader">
      <div class="bar"><i></i></div>
      <span id="loader-text">loading the collection…</span>
    </div>

    <footer id="legend">drag to orbit · scroll to zoom · click a work to focus · esc to return</footer>
  </body>
</html>
