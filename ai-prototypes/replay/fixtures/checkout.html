<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>North checkout fixture</title>
    <link rel="stylesheet" href="./checkout.css" />
  </head>
  <body>
    <header>
      <a href="#" class="logo">NORTH<span>®</span></a>
      <nav aria-label="Store"><a href="#">Shop</a><a href="#">Journal</a><button type="button">Bag · 2</button></nav>
    </header>
    <main>
      <section class="summary" aria-labelledby="checkout-title">
        <p class="step">CHECKOUT · 02 OF 03</p>
        <h1 id="checkout-title">How should it arrive?</h1>
        <div class="delivery-card">
          <div class="delivery-icon" aria-hidden="true">↗</div>
          <div><strong>Standard delivery</strong><span>Thursday, September 10 · Free</span></div>
          <button id="delivery-trigger" type="button">Change delivery method</button>
        </div>
        <form>
          <label>Email<input type="email" value="maya@example.com" autocomplete="email" /></label>
          <label>Delivery note<input type="text" value="Leave with concierge" /></label>
          <button class="continue" type="button">Continue to payment</button>
        </form>
      </section>
      <aside class="cart" aria-label="Order summary">
        <p>ORDER 4168</p>
        <div class="product">
          <div class="product-art" aria-hidden="true"></div>
          <div><strong>Field jacket</strong><span>Clay · Medium</span><span>1 × $168</span></div>
        </div>
        <dl>
          <div>
            <dt>Subtotal</dt>
            <dd>$168</dd>
          </div>
          <div>
            <dt>Delivery</dt>
            <dd>Free</dd>
          </div>
          <div class="total">
            <dt>Total</dt>
            <dd>$168</dd>
          </div>
        </dl>
      </aside>
    </main>

    <div id="scrim" hidden></div>
    <section id="delivery-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden>
      <p class="dialog-step">DELIVERY</p>
      <h2 id="dialog-title">Choose delivery method</h2>
      <button class="option is-selected" type="button">
        <span><strong>Standard</strong><small>Thursday, September 10</small></span
        ><b>Free</b>
      </button>
      <button class="option" type="button">
        <span><strong>Express</strong><small>Tomorrow</small></span
        ><b>$18</b>
      </button>
      <button id="apply-delivery" class="apply" type="button">Use this method</button>
      <button id="close-dialog" class="close" type="button" aria-label="Close delivery dialog">×</button>
    </section>
    <script src="./checkout.js"></script>
  </body>
</html>
