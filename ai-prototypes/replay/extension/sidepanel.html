<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Replay</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header><b>REPLAY</b><span>LOCAL</span></header>
    <main>
      <p class="label">KEYBOARD EVIDENCE RECORDER</p>
      <h1>Capture where focus went.</h1>
      <p>Navigation keys and accessible focus names only. Character keys and field values never leave the page.</p>
      <button id="start" type="button"><i></i>Start on this tab</button>
      <div id="status" role="status">Waiting.</div>
      <ol id="events"></ol>
      <button id="mark" type="button" disabled>Mark failure</button>
      <button id="export" type="button" disabled>Export Playwright test</button>
      <button id="download" type="button" disabled>Download trace JSON</button>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
