<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WATCHER</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 fill=%22%230a0a0a%22/><circle cx=%2216%22 cy=%2216%22 r=%225%22 fill=%22%23ff3b30%22/></svg>"
    />
    <meta
      name="description"
      content="AI surveillance satire on live public cameras. When no people appear, the system invents them, profiles them, and manufactures its own evidence."
    />
    <link rel="preload" as="image" type="image/webp" href="/ai-prototypes/watcher/watcher-cover.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="preload"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script type="module" crossorigin src="/ai-prototypes/watcher/assets/index-C-K1qab8.js"></script>
    <link rel="stylesheet" crossorigin href="/ai-prototypes/watcher/assets/index-BhSYS1aO.css" />
  </head>
  <body>
    <main id="main">
      <div id="grid">
        <article id="focus" class="tile focus">
          <canvas id="stage"></canvas>
          <button id="nav-prev" class="nav-btn" type="button" aria-label="Select previous live camera">‹</button>
          <button id="nav-next" class="nav-btn" type="button" aria-label="Select next live camera">›</button>
          <button id="hold-toggle" class="hold-toggle" type="button" aria-label="Pause automatic camera rotation" aria-pressed="false">
            <span aria-hidden="true">Ⅱ</span>
          </button>
          <div id="progress-track"><div id="progress-fill"></div></div>
        </article>
      </div>

      <aside id="log-panel">
        <div class="log-header">
          <span>ANALYSIS</span>
          <span id="analysis-place">—</span>
        </div>
        <div id="ai-inner" class="sr-only" aria-live="polite"></div>
        <div id="log-feed"></div>
      </aside>
    </main>

    <footer id="statusbar">
      <div class="sb-item">
        <span class="sb-label">SUBJECTS</span>
        <span id="cnt-subjects" class="sb-value">0</span>
      </div>
      <div class="sb-div"></div>
      <div class="sb-item">
        <span class="sb-label">NETWORK</span>
        <span id="cnt-online" class="sb-value">—</span>
      </div>
    </footer>

    <div id="gate">
      <div class="gate-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="gate-inner">
        <div class="gate-topline">
          <span>Public vision system</span>
          <span class="gate-live"><i></i> Live network</span>
        </div>

        <div class="gate-statement">
          <h1 class="gate-mark">WATCHER</h1>
          <p class="gate-copy">When surveillance finds no subject, it invents one.</p>
        </div>

        <div class="gate-launch">
          <button id="gate-go" type="button">Enter live system <span aria-hidden="true">↗</span></button>
          <p class="gate-network">
            <span>Camera network</span>
            <strong id="gate-status">Connecting</strong>
          </p>
        </div>

        <p class="gate-note">Live public cameras · synthetic subjects</p>
      </div>
    </div>
  </body>
</html>
