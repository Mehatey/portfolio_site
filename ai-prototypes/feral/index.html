<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ai-prototypes/feral/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FERAL — a living planet, scored in real time</title>
    <script type="module" crossorigin src="/ai-prototypes/feral/assets/index-BFd1fLdO.js"></script>
    <link rel="stylesheet" crossorigin href="/ai-prototypes/feral/assets/index-Jzw35wgZ.css" />
  </head>
  <body>
    <!-- The WebGPU/TSL globe renders here. -->
    <canvas id="field"></canvas>

    <!-- Audio needs a user gesture (autoplay policy). The whole machine starts
         on this click. -->
    <div id="gate">
      <div class="gate-inner">
        <h1>A living planet</h1>
        <p class="tag">Every pulse is a species sighting.</p>
        <p class="sub">Live observations and field recordings from iNaturalist. Sound begins when you enter.</p>
        <button id="begin">Enter live Earth</button>
      </div>
    </div>

    <!-- Minimal, intentional overlay. -->
    <header id="brand" class="veiled">
      <span class="mini-planet" aria-hidden="true"></span>
      <span class="sub-mark">Feral · live Earth</span>
    </header>

    <div id="live-beacon" class="veiled">
      <span class="beacon-dot" aria-hidden="true"></span>
      <span class="beacon-copy">waiting for live sightings</span>
    </div>

    <div id="audio-visual" class="veiled" aria-live="polite">
      <span class="audio-mark" aria-hidden="true"> <i></i><i></i><i></i><i></i><i></i><i></i><i></i> </span>
      <span class="audio-copy">
        <small>field recording</small>
        <strong>waiting for a voice</strong>
      </span>
    </div>

    <!-- One cinematic caption: what you're hearing, where it is. -->
    <div id="now" class="veiled">
      <div class="now-label">now hearing</div>
      <div class="now-name">—</div>
      <div class="now-meta"></div>
    </div>

    <!-- Clicked observations open here with the actual sighting data. -->
    <aside id="inspect" class="veiled" aria-hidden="true">
      <figure class="inspect-photo">
        <img alt="" />
      </figure>
      <div class="inspect-copy">
        <h2>Living thing</h2>
        <div class="inspect-grid"></div>
      </div>
    </aside>

    <!-- Small, deliberate credit — the tech story at a glance, not a readout. -->
    <footer id="credit" class="veiled">
      <span id="source">data from iNaturalist</span>
      <span id="counter"></span>
    </footer>
  </body>
</html>
