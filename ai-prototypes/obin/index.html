<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obin prototype</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#EFF1F4;--panel:#FFF;--sunk:#F7F8FA;--ink:#0E1116;--mid:#59616D;--faint:#666E7A;
  --rule:#E2E5EA;--hair:#EDEFF3;
  --acc:#1B47C9;--acc-w:#EEF1FC;
  --pass:#0E6B4F;--pass-w:#EAF4F0;
  --warn:#96590A;--warn-w:#FBF3E6;
  --fail:#AC231C;--fail-w:#FCEFEE;
  /* tint borders and deep text for each semantic family */
  --acc-b:#C6D2F5;--acc-d:#132F86;--acc-l:#D9E2FB;
  --pass-b:#C4DED3;--pass-d:#0B4C39;--pass-m:#9DC9BA;
  --warn-b:#E4D3AE;--warn-d:#5E3A06;
  --fail-b:#EFCBC8;--fail-d:#6E1B16;
  --mark:#FDF1CE;--mark-b:#E4CE8E;
  --prose:#1B1F26;--ink-h:#25292F;--sunk-h:#F0F2F5;
  --print:#000;--shadow:14,17,22;--accent-rgb:27,71,201;
  --ui:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  /* The memo is an organisational instrument, so it is set in a document face while
     the interface around it stays in the system UI face. Reading the two apart is
     the same argument the monospace figures make, carried one level up. */
  --doc:Charter,"Iowan Old Style",Palatino,Georgia,serif;
  --mo:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;--s9:56px;
  --rail:336px;--proof:428px;--bar:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none}
::selection{background:var(--acc-l)}
.n{font-family:var(--mo);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}

.app{display:flex;flex-direction:column;height:100vh}

/* ══ header ══ */
.hd{flex:none;background:var(--panel);border-bottom:1px solid var(--rule)}
.hr1{height:56px;display:flex;align-items:center;gap:var(--s4);padding:0 var(--s6)}
.mark{display:flex;align-items:center;gap:var(--s3);padding-right:var(--s4);border-right:1px solid var(--rule)}
.mark i{width:18px;height:18px;border-radius:3px;background:var(--ink);display:block;position:relative}
.mark i::after{content:'';position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:2px;
  border:1.5px solid var(--panel)}
.mark b{font-size:15px;font-weight:600;letter-spacing:-.02em}
.deal{font-size:13px;color:var(--mid)}
.deal b{color:var(--ink);font-weight:600;font-size:13px}
.sp{flex:1}
.qpos{font-family:var(--mo);font-size:12px;color:var(--mid);border:1px solid var(--rule);border-radius:4px;
  padding:var(--s1) var(--s3);cursor:pointer;background:none;transition:.14s}
.qpos:hover{border-color:var(--ink);color:var(--ink)}
.qrow{display:grid;grid-template-columns:1.2fr .75fr .85fr .8fr;gap:var(--s3);padding:var(--s3);
  border-bottom:1px solid var(--hair);align-items:baseline;font-size:13px}
.qrow.now{background:var(--acc-w);border-left:2px solid var(--acc);padding-left:calc(var(--s3) - 2px)}
.qrow .qs{font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.qrow .qs.circ2{color:var(--pass)}.qrow .qs.rev{color:var(--acc)}
.qrow .qs.pass{color:var(--faint)}.qrow .qs.wait{color:var(--warn)}
.qrow .qt{font-family:var(--mo);font-size:12px;text-align:right}
.qhd{display:grid;grid-template-columns:1.2fr .75fr .85fr .8fr;gap:var(--s3);padding:0 var(--s3) var(--s2);
  font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  border-bottom:1px solid var(--rule)}
.qhd .qt{text-align:right}
.qpos b{color:var(--ink);font-weight:500}
.ask-chip{font-family:var(--mo);font-size:12px;border:1px solid var(--warn-b);background:var(--warn-w);color:var(--warn);
  border-radius:4px;padding:var(--s1) var(--s3);cursor:pointer;display:none;align-items:center;gap:var(--s2)}
.ask-chip.on{display:flex}
.ask-chip:hover{border-color:var(--warn)}
.circ{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:5px;padding:8px var(--s4);
  font-size:13px;font-weight:600;cursor:pointer;transition:.14s}
.circ:hover{background:var(--ink-h)}
.circ:disabled{background:var(--sunk);color:var(--faint);border-color:var(--rule);cursor:not-allowed}
.gate{font-size:12px;color:var(--fail);max-width:210px;text-align:right;line-height:1.45;text-wrap:balance}
.gate.ok{color:var(--pass)}

/* throughput strip */
.hr2{height:34px;display:flex;align-items:center;padding:0 var(--s6);gap:var(--s6);
  border-top:1px solid var(--hair);background:var(--sunk)}
.tm{display:flex;align-items:baseline;gap:var(--s2);font-size:12px;color:var(--faint)}
.tm b{font-family:var(--mo);font-size:12px;color:var(--ink);font-weight:500}
.tm .vs{color:var(--faint);font-family:var(--mo);font-size:12px}
.bl{flex:1;height:3px;background:var(--rule);border-radius:2px;position:relative;max-width:180px}
.bl i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:2px;transition:width .5s}

/* ══ body ══ */
.bd{flex:1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--proof);min-height:0}
.col{overflow-y:auto;min-width:0}
.col::-webkit-scrollbar{width:8px}
.col::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px;border:2px solid transparent;background-clip:content-box}

/* ── rail: the queue, sorted by leverage ── */
nav.rail{background:var(--panel);border-right:1px solid var(--rule);padding-bottom:var(--s9)}
.rhd{padding:var(--s5) var(--s5) var(--s3);position:sticky;top:0;background:var(--panel);z-index:3}
.rhd h3{font-size:13px;font-weight:600;margin-bottom:2px}
.rhd p{font-size:12px;color:var(--faint);line-height:1.45}
.axis{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3);padding-top:var(--s3);
  border-top:1px solid var(--hair);font-family:var(--mo);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint)}
.axis span{flex:1;height:1px;background:var(--hair)}
.axis em{font-style:normal;text-align:right;width:58px}
.axis em.lft{text-align:left;width:74px}

/* sort toggle: the thesis, made falsifiable */
.sortw{display:flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;margin-top:var(--s3)}
.sortw button{flex:1;background:var(--sunk);border:0;padding:6px var(--s2);font-family:var(--mo);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--faint);cursor:pointer;transition:.14s}
.sortw button+button{border-left:1px solid var(--rule)}
.sortw button.on{background:var(--ink);color:#fff}
.sortw button:not(.on):hover{color:var(--ink)}
.sortnote{font-size:12px;line-height:1.45;color:var(--warn);background:var(--warn-w);border:1px solid var(--warn-b);
  border-radius:5px;padding:var(--s2) var(--s3);margin-top:var(--s3)}
.rank{font-family:var(--mo);font-size:10px;color:var(--faint);width:15px;flex:none;text-align:right}
.row.late .rank{color:var(--fail);font-weight:600}

.resolved .nx{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3)}
.resolved .nx button{margin-top:0}
.chg{border:1px solid var(--acc-b);background:var(--acc-w);border-radius:5px;padding:var(--s2) var(--s3);
  font-size:12px;color:var(--acc-d);margin-top:var(--s3);line-height:1.45}
/* Boundary disclosure. Deliberately neutral rather than semantic: an outbound lookup is
   neither a pass nor a warning, it is a fact the firm's security team is entitled to see.
   Using a semantic colour here would imply a judgement the product has not earned. */
.bnd{border:1px solid var(--rule);background:var(--sunk);border-radius:6px;padding:var(--s3);
  font-size:12px;line-height:1.6;color:var(--mid)}
.bnd b{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);margin-bottom:var(--s1);font-weight:400}
.bnd .io{display:flex;gap:var(--s3);align-items:baseline;margin-top:var(--s2);padding-top:var(--s2);
  border-top:1px solid var(--hair);font-family:var(--mo);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint)}
/* the value is data, not a label, so it keeps its own case */
.bnd .io u{text-decoration:none;color:var(--ink);font-size:12px;letter-spacing:.02em;
  text-transform:none}
.asm{display:inline-block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);border:1px dashed var(--rule);border-radius:3px;
  padding:1px 4px;margin-left:var(--s2);vertical-align:1px}
.degr{border:1px solid var(--warn-b);background:var(--warn-w);border-radius:6px;padding:var(--s3);
  font-size:12px;line-height:1.6;color:var(--warn-d)}
.degr b{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--warn);margin-bottom:var(--s1);font-weight:400}
.note-in{margin-top:var(--s3);border-top:1px solid var(--hair);padding-top:var(--s3)}
.note-in label{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--pass-d);margin-bottom:var(--s2)}
.note-in textarea{width:100%;font:inherit;font-size:13px;line-height:1.45;color:var(--ink);padding:var(--s2);
  border:1px solid var(--pass-b);border-radius:5px;background:var(--panel);resize:vertical;font-family:var(--ui)}
.note-in textarea:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.note-in textarea::placeholder{color:var(--faint)}
.opt-note{display:block;margin-top:var(--s1);font-size:12px;color:var(--faint)}
.reasons{margin-top:var(--s4);border:1px solid var(--rule);border-radius:6px;padding:var(--s4);background:var(--sunk)}
.reasons>b{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-bottom:var(--s3);font-weight:400}
.rsn{display:grid;grid-template-columns:150px minmax(0,1fr);gap:var(--s3);padding:var(--s2) 0;
  border-bottom:1px solid var(--hair);font-size:13px}
.rsn:last-child{border-bottom:0}
.rsn span{color:var(--mid)}
.rsn em{font-style:normal;color:var(--ink);line-height:1.45}
.probe{border:1px solid var(--acc-b);background:var(--acc-w);border-radius:5px;padding:var(--s3);
  font-size:12px;line-height:1.6;color:var(--acc-d);margin-top:var(--s3)}
.probe b{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--acc);margin-bottom:4px;font-weight:400}
.chg b{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--acc);margin-bottom:3px;font-weight:400}
/* below 1100px the proof panel becomes the sheet, so it is the part that scrolls */
.sheet .proofwrap{padding:0;flex:1;min-height:0;overflow-y:auto}
.sheet .phd{position:static;border-bottom:1px solid var(--hair)}

.grp{margin-bottom:var(--s2)}
.gh{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s5) var(--s2)}
.gh .t{font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
.gh .d{flex:1;height:1px;background:var(--hair)}
.gh .c{font-family:var(--mo);font-size:10px;color:var(--faint)}

.row{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;
  padding:var(--s3) var(--s5) var(--s3) calc(var(--s5) - 2px);cursor:pointer;transition:background .12s,border-color .12s;position:relative}
.row:hover{background:var(--sunk)}
.row.on{background:var(--acc-w);border-left-color:var(--acc)}
.row .l1{display:flex;align-items:baseline;gap:var(--s2)}
/* the name wraps rather than truncates: a figure the analyst cannot read the name of
   is a figure they cannot decide about, and the rail is narrowest at share width */
.row .nm{font-size:13px;font-weight:600;flex:1;min-width:0;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .pct{font-family:var(--mo);font-size:12px;color:var(--faint);flex:none}
.row .l2{display:flex;align-items:flex-start;gap:var(--s2);margin-top:var(--s1)}
.lev{height:3px;border-radius:2px;flex:1;background:var(--hair);position:relative;max-width:74px;margin-top:6px}
.lev i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--faint)}
.lev.hi i{background:var(--fail);width:100%}
.lev.md i{background:var(--warn);width:52%}
.lev.lo i{background:var(--faint);width:18%}
.why{font-size:12px;color:var(--faint);flex:1;min-width:0;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:2px 5px;
  border-radius:3px;border:1px solid var(--rule);color:var(--mid);flex:none}
.st.open{border-color:var(--acc-b);background:var(--acc-w);color:var(--acc)}
.st.conf{border-color:var(--warn-b);background:var(--warn-w);color:var(--warn)}
.st.uns{border-color:var(--fail-b);background:var(--fail-w);color:var(--fail)}
.st.done{border-color:var(--pass-b);background:var(--pass-w);color:var(--pass)}
.st.ask{border-color:var(--warn-b);background:var(--warn-w);color:var(--warn)}
.st.rerun{border-color:var(--acc-b);background:var(--acc-w);color:var(--acc)}

.clr{margin:var(--s3) var(--s5) 0;border:1px solid var(--rule);border-radius:6px;background:var(--sunk);overflow:hidden}
.clr>button{display:flex;width:100%;align-items:center;gap:var(--s3);padding:var(--s3);background:none;border:0;
  cursor:pointer;text-align:left}
.clr>button:hover{background:var(--sunk-h)}
.clr .big{font-family:var(--mo);font-size:21px;font-weight:500}
.clr .tx{flex:1;font-size:12px;color:var(--mid);line-height:1.45}
.clr .ar{color:var(--faint);font-family:var(--mo);font-size:12px}
.clr ul{display:none;border-top:1px solid var(--rule);padding:var(--s2) 0;max-height:210px;overflow-y:auto}
.clr.open ul{display:block}
/* Each of the 28 is a real button, not a clickable li. "Hidden is not the same as withheld"
   is only true if the analyst can actually reach them, and a li with an onclick is
   unreachable by keyboard and unannounced to a screen reader. */
.clr li{list-style:none}
.clr .pf{cursor:pointer;width:100%;background:none;border:0;display:flex;gap:var(--s2);
  padding:3px var(--s3);font-family:var(--mo);font-size:10px;color:var(--mid);align-items:baseline;
  text-align:left}
.clr .pf:hover{background:var(--panel);color:var(--ink)}
.clr .pf span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clr .pf b{color:var(--ink);font-weight:500}
.clr .pf i{width:9px;flex:none;color:var(--pass);font-style:normal;font-size:10px}
.clr .mh2{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s3) 3px;
  font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.clr .mh2 em{font-style:normal;flex:1;height:1px;background:var(--rule)}
.clr .mh2 u{text-decoration:none;color:var(--pass)}

/* ── memo ── */
.mid-col{padding:var(--s8) var(--s8) var(--s9);display:flex;justify-content:center;align-items:flex-start}
.memo{width:100%;max-width:680px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;
  padding:var(--s9) var(--s8) var(--s7);box-shadow:0 1px 1px rgba(var(--shadow),.03),0 18px 40px -32px rgba(var(--shadow),.35)}
.memo header{padding-bottom:var(--s4);border-bottom:2px solid var(--ink);margin-bottom:var(--s6)}
.hrow{display:flex;align-items:flex-start;gap:var(--s4);margin-bottom:var(--s4);flex-wrap:wrap}
.hrow>div:first-child{flex:1}
.memo h1{font-family:var(--doc);font-size:clamp(19px,2.1vw,25px);font-weight:600;letter-spacing:-.02em;
  margin-bottom:var(--s1)}
.memo .sub{font-size:12px;color:var(--mid);display:flex;flex-wrap:wrap;gap:0 var(--s2)}
.memo .sub span{white-space:nowrap}
/* Leading rather than trailing, so a wrap never leaves a separator stranded at the
   end of a line. The span is nowrap, so the mark travels with the words after it. */
.memo .sub span:not(:first-child)::before{content:'·';margin-right:var(--s2);color:var(--faint)}
.stamp2{flex:none;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:var(--s1) var(--s3);border-radius:3px;border:1px solid;transition:.4s;white-space:nowrap}
.stamp2.held{color:var(--fail);border-color:var(--fail-b);background:var(--fail-w)}
.stamp2.cond{color:var(--warn);border-color:var(--warn-b);background:var(--warn-w)}
.stamp2.ready{color:var(--pass);border-color:var(--pass-b);background:var(--pass-w)}
.meta{display:flex;flex-wrap:wrap;gap:var(--s5)}
.meta span{font-size:12px;color:var(--ink)}
.meta b{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);font-weight:400;margin-bottom:2px}

/* margin markers: a document is read with its edges */
.swrap{display:grid;grid-template-columns:26px minmax(0,1fr);gap:var(--s4);margin-bottom:var(--s6)}
.mk{width:22px;height:22px;border-radius:4px;margin-top:1px;border:1px solid var(--rule);background:var(--panel);
  font-family:var(--mo);font-size:10px;display:flex;align-items:center;justify-content:center;
  color:var(--faint);transition:.16s;padding:0}
.mk.none{border-style:dashed;opacity:.45}
.mk.ok{color:var(--pass);border-color:var(--pass-b);background:var(--pass-w)}
.mk.open{color:var(--acc);border-color:var(--acc-b);background:var(--acc-w);cursor:pointer;font-weight:600}
.mk.open:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.sh2{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s3);
  padding-bottom:var(--s2);border-bottom:1px solid var(--hair)}
/* Monospace in this product means a machine asserted it. A section heading and a
   field label were written by a person, so they belong to the document, not to the
   machine register and not to the app chrome. Same numbered convention, honest voice. */
.sn{font-family:var(--doc);font-size:12px;color:var(--faint);letter-spacing:.12em}
.sec>.lbl{font-family:var(--doc);font-size:12px;letter-spacing:.12em;color:var(--faint)}
.meta b{font-family:var(--doc)}
.sec>.lbl{display:inline}
.memo p{font-family:var(--doc);font-size:15px;line-height:1.78;color:var(--prose);margin-bottom:var(--s3)}
.memo p:last-child{margin-bottom:0}
.memo ul{margin-left:var(--s4)}
.memo li{font-family:var(--doc);font-size:15px;line-height:1.78;margin-bottom:var(--s3);color:var(--prose);padding-left:2px}
.memo li:last-child{margin-bottom:0}
.memo li b{font-weight:600}
.mfoot{display:flex;flex-wrap:wrap;gap:var(--s4);align-items:baseline;margin-top:var(--s7);padding-top:var(--s4);
  border-top:1px solid var(--rule);font-size:12px;color:var(--faint)}
.mfoot b{font-family:var(--mo);font-size:12px;color:var(--ink);font-weight:500;margin-right:3px}
.mfoot .tr{margin-left:auto;font-family:var(--mo);font-size:10px;letter-spacing:.02em}

/* the signature: every machine figure is monospace and carries its state */
.f{font-family:var(--mo);font-size:13.5px;font-weight:500;padding:1px 0;border-radius:3px;cursor:pointer;
  border-bottom:2px solid;background:transparent;transition:background .14s,border-color .3s;white-space:nowrap;
  line-height:1;vertical-align:baseline;position:relative;top:.5px;margin:0}
.f.open{border-color:var(--acc);color:var(--acc)}
.f.conf{border-color:var(--warn);color:var(--warn);background:var(--warn-w)}
.f.uns{border-color:var(--fail);color:var(--fail);background:var(--fail-w)}
.f.done{border-color:var(--pass-m);color:var(--pass)}
.f.ask{border-color:var(--warn);color:var(--warn);border-bottom-style:dashed}
.f.auto{border-color:var(--hair);color:var(--prose);cursor:default}
.f:hover{background:var(--acc-w)}
.f.sel,.f.sel.linked{background:var(--acc)!important;color:#fff!important;border-bottom-color:var(--acc)}
.f.sel:hover{background:var(--acc)}
.f.pulse{animation:pl .7s cubic-bezier(.2,.8,.25,1)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.45)}100%{box-shadow:0 0 0 9px rgba(var(--accent-rgb),0)}}

/* ── proof ── */
aside.proof{background:var(--panel);border-left:1px solid var(--rule);padding-bottom:var(--s9)}
.empty{padding:var(--s9) var(--s6);text-align:center}
.empty .ic{width:34px;height:34px;border-radius:6px;border:1.5px dashed var(--rule);margin:0 auto var(--s4)}
.empty h4{font-size:13px;font-weight:600;margin-bottom:var(--s2)}
.empty p{font-size:12px;color:var(--faint);line-height:1.6;max-width:250px;margin:0 auto}
.empty kbd{font-family:var(--mo);font-size:10px;border:1px solid var(--rule);border-bottom-width:2px;
  border-radius:3px;padding:1px 4px;color:var(--mid)}
.startbtn{margin:var(--s5) auto 0;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:9px var(--s5);
  font-size:13px;font-weight:600;cursor:pointer;transition:.14s}
.startbtn:hover{background:var(--ink-h)}
.startbtn:active{transform:scale(.985)}
.startbtn kbd{border-color:rgba(255,255,255,.35);color:#fff;background:none}
.empty .tiny{font-size:12px;color:var(--faint);margin-top:var(--s4)}

/* --rule not --hair: this is a structural boundary between the sticky header and a
   scrolling body, not a divider within a group. */
.phd{padding:var(--s5) var(--s6) var(--s4);border-bottom:1px solid var(--rule);position:sticky;top:0;
  background:var(--panel);z-index:3}
/* Deciding a claim scrolls the panel to its outcome, which parks whatever block was
   above the header at an arbitrary offset. Nine pixels of a rounded card, or the top
   half of the accuracy ring, reads as a rendering fault rather than as content that
   scrolled. This strip says scrolled, and it is the only thing telling you so. */
aside.proof .phd::after{content:'';position:absolute;left:0;right:0;top:100%;height:10px;
  pointer-events:none;background:linear-gradient(var(--panel),transparent)}
.phd .t{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s3)}
.phd h4{font-size:17px;font-weight:600;flex:1;letter-spacing:-.02em}
.phd .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:17px;line-height:1;padding:0 2px}
.phd .x:hover{color:var(--ink)}
.consq{border-radius:5px;padding:var(--s3);font-size:12px;line-height:1.45;border:1px solid}
.consq b{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:var(--s1);font-weight:400}
.consq.hi{border-color:var(--fail-b);background:var(--fail-w);color:var(--fail-d)}
.consq.hi b{color:var(--fail)}
.consq.lo{border-color:var(--rule);background:var(--sunk);color:var(--mid)}
.consq.lo b{color:var(--faint)}

.pb{padding:var(--s5) var(--s6);border-bottom:1px solid var(--hair)}
.pb>.lbl{display:block;margin-bottom:var(--s3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-radius:6px;overflow:hidden}
.cell{background:var(--panel);padding:var(--s3)}
.cell .h{font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  margin-bottom:var(--s2);display:flex;gap:5px;align-items:center}
.cell .srcname{font-family:var(--mo);font-size:10px;color:var(--faint);display:block;margin-bottom:var(--s2);
  word-break:break-all}
.cell .q{font-size:12px;line-height:1.6;color:var(--mid)}
.cell .q mark{background:var(--mark);color:var(--ink);padding:0 2px;font-weight:500}
.cell .big{font-family:var(--mo);font-size:17px;font-weight:500;display:block;margin-bottom:3px}
.cell.a .big{color:var(--ink)}
.cell.b .big{color:var(--ink)}
.cell .sub{font-size:12px;color:var(--faint);line-height:1.45}
.vd{margin-top:var(--s3);border-radius:5px;padding:var(--s3);font-size:12px;border:1px solid;line-height:1.6}
.vd b{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:4px}
.vd.fail{border-color:var(--fail-b);background:var(--fail-w);color:var(--fail-d)}
.vd.fail b{color:var(--fail)}
.vd.warn{border-color:var(--warn-b);background:var(--warn-w);color:var(--warn-d)}
.vd.warn b{color:var(--warn)}
.vd.pass{border-color:var(--pass-b);background:var(--pass-w);color:var(--pass-d)}
.vd.pass b{color:var(--pass)}

/* inline source */
.isrc{margin-top:var(--s3);border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--sunk)}
.itabs{display:flex;gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.itabs button{flex:1;min-width:0;background:var(--sunk);border:0;padding:var(--s2);cursor:pointer;
  font-family:var(--mo);font-size:10px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;transition:.14s}
.itabs button:hover{color:var(--ink)}
.itabs button.on{background:var(--panel);color:var(--ink)}
.itabs button.full{flex:none;background:var(--sunk);color:var(--acc);padding:7px var(--s3)}
.ibody{background:var(--panel);padding:var(--s3);max-height:196px;overflow-y:auto;
  font-family:var(--mo);font-size:12px;line-height:1.78;color:var(--mid)}
.ibody::-webkit-scrollbar{width:6px}
.ibody::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.ittl{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--ink);margin-bottom:var(--s2);
  padding-bottom:5px;border-bottom:1px solid var(--hair)}
.irw{display:flex;justify-content:space-between;gap:var(--s3);padding:2px 5px;border-radius:3px;
  flex-wrap:wrap}
.irw span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.irw span:last-child{color:var(--ink);flex:none;margin-left:auto}
.irw.hit{background:var(--mark);box-shadow:0 0 0 1px var(--mark-b);color:var(--ink);font-weight:500}
.ibody p{margin-bottom:var(--s2);font-size:12px;line-height:1.78}
.ibody p:last-child{margin-bottom:0}
.ibody mark{background:var(--mark);padding:0 2px;color:var(--ink);font-weight:500}
.igap{color:var(--fail);padding:var(--s2) 5px}
.ifoot{padding:6px var(--s3);border-top:1px solid var(--rule);font-size:12px;color:var(--faint);
  background:var(--sunk)}

.rel{display:flex;gap:var(--s4);align-items:center;width:100%;text-align:left;background:none;
  border:1px solid transparent;border-radius:7px;padding:var(--s2);margin:calc(var(--s2)*-1);cursor:pointer;
  transition:.14s}
.rel:hover{border-color:var(--rule);background:var(--sunk)}
.rel .see{display:block;margin-top:6px;font-family:var(--mo);font-size:10px;color:var(--acc);
  letter-spacing:.02em;opacity:.75;transition:opacity .14s}
.rel:hover .see{opacity:1}

/* calibration evidence */
.calsum.three{grid-template-columns:repeat(3,1fr)}
.calsum{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-radius:7px;overflow:hidden;margin-bottom:var(--s5)}
.cs{background:var(--panel);padding:var(--s3) var(--s4)}
.cs b{display:block;font-family:var(--mo);font-size:21px;font-weight:500;line-height:1.2}
.cs b.g{color:var(--pass)}.cs b.r{color:var(--fail)}.cs b.a{color:var(--acc)}
.cs span{font-size:12px;color:var(--faint)}
.calhd,.crh{display:grid;grid-template-columns:1.2fr 1.1fr .7fr .7fr 1fr;gap:var(--s3);align-items:baseline}
.calhd{font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  padding:0 var(--s3) var(--s2);border-bottom:1px solid var(--rule)}
.calhd .val,.crh .val{text-align:right}
.cr{border-bottom:1px solid var(--hair);padding:var(--s3);border-left:2px solid transparent;
  transition:background .14s}
.cr.agent,.cr.analyst{cursor:pointer}
.cr.agent{border-left-color:var(--fail);background:var(--fail-w)}
.cr.analyst{border-left-color:var(--acc);background:var(--acc-w)}
.cr.agent:hover,.cr.analyst:hover{filter:brightness(.985)}
.crh .deal{font-size:13px;font-weight:600}
.crh .fig{font-size:12px;color:var(--mid)}
.crh .val{font-family:var(--mo);font-size:12px}
.crh .val.you{color:var(--mid)}
.vd2{font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:right;
  color:var(--faint)}
/* Nine rows agreeing do not need nine shouted labels. The sheet exists for the
   three rows that disagree, so agreement is set quietly and they carry the weight. */
.vd2:not(.agent):not(.analyst){text-transform:none;letter-spacing:.02em;font-size:12px}
.vd2.agent{color:var(--fail);font-weight:600}
.vd2.analyst{color:var(--acc);font-weight:600}
.vd2 .ex{display:block;font-style:normal;font-weight:400;font-size:10px;opacity:.7;margin-top:2px;
  letter-spacing:.02em;transition:opacity .14s}
.cr:hover .vd2 .ex{opacity:1}
.cr.open .vd2 .ex{visibility:hidden}
.crb{display:none;font-size:12px;line-height:1.6;color:var(--mid);padding:var(--s3) 0 2px;margin-top:var(--s3);
  border-top:1px dotted var(--rule)}
.cr.open .crb{display:block;animation:pin .22s ease}
.cr.agent .crh::after,.cr.analyst .crh::after{content:''}
.calfoot{margin-top:var(--s5);border:1px solid var(--rule);background:var(--sunk);border-radius:6px;
  padding:var(--s4);font-size:12px;line-height:1.6;color:var(--mid)}
/* the payoff line never scrolls out of reach: it is the reason the sheet exists */
.calfoot.pin{flex:none;margin:0;border:0;border-top:1px solid var(--rule);border-radius:0;
  padding:var(--s4) var(--s6)}
@media (max-width:640px){
  .calsum{grid-template-columns:repeat(2,1fr)}
  .calhd{display:none}
  .crh{grid-template-columns:1fr 1fr;row-gap:2px}
  .crh .val{text-align:left}
}
.dial{width:46px;height:46px;flex:none;position:relative}
.dial svg{transform:rotate(-90deg)}
.dial span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mo);font-size:12px;font-weight:500}
.rel .tx{font-size:12px;color:var(--mid);line-height:1.6}
.rel .tx b{color:var(--ink);font-weight:600}

.acts{padding:var(--s5) var(--s6)}
.act{display:block;width:100%;text-align:left;border:1px solid var(--rule);border-radius:6px;background:var(--panel);
  padding:var(--s3) var(--s4);cursor:pointer;margin-bottom:var(--s2);transition:.14s;position:relative}
.act:hover{border-color:var(--ink);background:var(--sunk)}
.act b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.act span{font-size:12px;color:var(--faint);line-height:1.45}
.act kbd{position:absolute;right:var(--s3);top:var(--s3);font-family:var(--mo);font-size:10px;color:var(--faint);
  border:1px solid var(--rule);border-radius:3px;padding:1px 4px}
.act.pri{border-color:var(--ink)}
.act.pri b{color:var(--ink)}
.resolved{border:1px solid var(--pass-b);background:var(--pass-w);border-radius:6px;padding:var(--s4);font-size:12px;
  color:var(--pass-d);line-height:1.6}
.resolved b{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--pass);margin-bottom:var(--s2);font-weight:400}
.resolved button{margin-top:var(--s3);background:none;border:1px solid var(--pass-m);border-radius:4px;
  padding:4px var(--s3);font-size:12px;color:var(--pass-d);cursor:pointer}
.resolved button:hover{border-color:var(--pass)}

/* re-reason */
div.rerun{border:1px solid var(--acc-b);background:var(--acc-w);border-radius:6px;padding:var(--s4);font-size:12px;
  color:var(--acc-d);line-height:1.6}
.rerun b{display:block;font-family:var(--mo);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--acc);margin-bottom:var(--s3);font-weight:400}
.rerun ol{margin-left:var(--s4);font-family:var(--mo);font-size:12px}
.rerun li{margin-bottom:var(--s2);opacity:0;animation:st .3s forwards}
.rerun li:nth-child(1){animation-delay:.1s}
.rerun li:nth-child(2){animation-delay:.7s}
.rerun li:nth-child(3){animation-delay:1.4s}
@keyframes st{to{opacity:1}}

/* ══ bottom bar ══ */
.bar{flex:none;height:var(--bar);background:var(--panel);border-top:1px solid var(--rule);display:flex;
  align-items:center;padding:0 var(--s6);gap:var(--s5)}
.prog{display:flex;align-items:center;gap:var(--s3);font-family:var(--mo);font-size:12px;color:var(--mid)}
.prog .track{width:150px;height:4px;background:var(--rule);border-radius:2px;position:relative}
.prog .track i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:2px;transition:width .35s}
.keys{display:flex;gap:var(--s4);margin-left:auto;font-size:12px;color:var(--faint);align-items:center}
.keys b{font-weight:400}
kbd{font-family:var(--mo);font-size:10px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;
  padding:1px 5px;color:var(--mid);margin-right:4px;background:var(--panel)}

/* ══ sheets ══ */
.ov{position:fixed;inset:0;background:rgba(var(--shadow),.32);z-index:80;display:none;align-items:center;
  justify-content:center;padding:var(--s8);backdrop-filter:blur(3px)}
.ov.on{display:flex;animation:fi .18s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--panel);border-radius:10px;width:min(680px,94vw);max-height:86vh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 70px -20px rgba(var(--shadow),.45);animation:up .24s cubic-bezier(.2,.8,.25,1)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sh{flex:none;padding:var(--s6) var(--s6) var(--s4);border-bottom:1px solid var(--hair);display:flex;align-items:flex-start;gap:var(--s3)}
.sh h3{font-size:17px;font-weight:600;flex:1}
.sh p{font-size:12px;color:var(--faint);margin-top:3px}
.sh .x{background:none;border:0;font-size:21px;color:var(--faint);cursor:pointer;line-height:1;
  min-width:28px;min-height:28px;display:flex;align-items:center;justify-content:center}
.sb{padding:var(--s6);overflow-y:auto;min-height:0}
.doc{background:var(--sunk);border:1px solid var(--rule);border-radius:6px;padding:var(--s5);
  font-family:var(--mo);font-size:12px;line-height:1.78;color:var(--mid)}
.doc .ttl{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--ink);margin-bottom:var(--s4);
  padding-bottom:var(--s2);border-bottom:1px solid var(--rule)}
.doc .rw{display:flex;justify-content:space-between;gap:var(--s4);padding:2px var(--s2);border-radius:3px}
.doc .rw.hit{background:var(--mark);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--mark-b)}
.doc p{margin-bottom:var(--s3)}
.doc mark{background:var(--mark);padding:0 2px;color:var(--ink);font-weight:500}
.rc{display:flex;justify-content:space-between;padding:var(--s3) 0;border-bottom:1px solid var(--hair);font-size:13px}
.rc:last-of-type{border-bottom:0}
.rc span{color:var(--mid)}
.rc b{font-family:var(--mo);font-weight:500}
.rc b.g{color:var(--pass)}.rc b.r{color:var(--fail)}.rc b.a{color:var(--warn)}
.stamp{margin-top:var(--s5);border:1px solid var(--rule);border-radius:6px;padding:var(--s4);background:var(--sunk);
  font-family:var(--mo);font-size:12px;color:var(--mid);line-height:1.78}
.stamp b{color:var(--ink);font-weight:500}
.mail{border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.mail .mh{padding:var(--s3) var(--s4);border-bottom:1px solid var(--hair);font-family:var(--mo);font-size:12px;
  color:var(--mid);display:flex;gap:var(--s3)}
.mail .mb{padding:var(--s5);font-size:13px;line-height:1.7;color:var(--prose)}
.mail .mb ol{margin:var(--s3) 0 var(--s3) var(--s5)}
.mail .mb li{margin-bottom:var(--s2)}
.sf{flex:none;padding:var(--s4) var(--s6);border-top:1px solid var(--hair);display:flex;gap:var(--s3);align-items:center}
.sf .note{font-size:12px;color:var(--faint);flex:1}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:5px;padding:8px var(--s5);
  font-size:13px;font-weight:600;cursor:pointer}
.btn.g{background:none;color:var(--ink);border-color:var(--rule);font-weight:500}
.btn.g:hover{border-color:var(--ink)}

/* toast */
/* the toast sits in the empty middle of the status bar rather than over the memo.
   A confirmation that covers a machine figure is the one thing this product must not do. */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(4px);bottom:calc((var(--bar) - 31px) / 2);
  background:var(--ink);color:#fff;border-radius:5px;padding:var(--s2) var(--s4);font-size:12px;
  line-height:1.2;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ══════════ MOTION ══════════
   Four moments only. Each one carries information that the static
   frame cannot: where a figure ranks, what a decision moved, that a
   step is running, that the memo became sendable. ══════════ */

/* 1. the reshuffle — rows travel to their new rank rather than teleporting */
.row{will-change:transform}

/* 2. propagation — a decision washes down its dependents in order */
.f.wash{animation:wash .62s cubic-bezier(.2,.8,.25,1)}
@keyframes wash{
  0%{background:var(--acc);color:#fff;border-color:var(--acc)}
  55%{background:var(--acc-w);color:var(--acc)}
  100%{background:transparent}}
.sec.wash{animation:secw .7s ease}
@keyframes secw{0%{background:var(--acc-w);box-shadow:0 0 0 8px var(--acc-w)}
  100%{background:transparent;box-shadow:0 0 0 8px transparent}}
.sec{border-radius:4px}

/* 3. settle — the underline resolves left to right instead of snapping */
.f.settle{background-image:linear-gradient(90deg,var(--pass-w) 0 100%);background-repeat:no-repeat;
  background-position:left center;background-size:0 100%;animation:settle .5s cubic-bezier(.2,.8,.25,1) forwards}
@keyframes settle{60%{background-size:100% 100%}100%{background-size:100% 100%;background-color:transparent}}

/* 4. the step is running — visible from the rail, not just the panel */
.st.rerun{position:relative;overflow:hidden}
.st.rerun::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.28),transparent);animation:sweep 1.15s infinite}
@keyframes sweep{to{transform:translateX(100%)}}

/* the memo became sendable */
.circ.unlock{animation:unlock .6s cubic-bezier(.2,.8,.25,1)}
@keyframes unlock{0%{box-shadow:0 0 0 0 rgba(var(--shadow),.28)}100%{box-shadow:0 0 0 12px rgba(var(--shadow),0)}}
.gate{transition:color .3s}

/* panel change reads as a change of subject, not a repaint */
.proof.swap>*{animation:pin .24s cubic-bezier(.2,.8,.25,1)}
@keyframes pin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* The queue and the memo are the same ten figures in two places. Hovering
   either one lights the other, so the mapping is learned rather than deduced. */
.row.linked{background:var(--acc-w);box-shadow:inset 2px 0 0 var(--acc)}
.f.linked:not(.sel){background:var(--acc-w);box-shadow:0 0 0 3px var(--acc-w)}
.row,.f{transition:background .14s,box-shadow .14s,color .18s,border-color .3s}

/* micro interactions: pressure, not decoration */
.act:active,.btn:active,.circ:active{transform:scale(.985)}
.act,.btn,.circ{transition:.14s cubic-bezier(.2,.8,.25,1)}
.row .lev i{transition:width .3s cubic-bezier(.2,.8,.25,1)}

.clr>button .ar{transition:color .14s}
.clr>button:hover .ar{color:var(--ink)}
.f{transition:background .18s,color .18s,border-color .3s}
.toast{transition:opacity .22s cubic-bezier(.2,.8,.25,1),transform .22s cubic-bezier(.2,.8,.25,1)}

@media (max-width:1440px){:root{--rail:296px;--proof:392px}.memo{padding:var(--s8) var(--s7)}.mid-col{padding:var(--s6)}}
@media (max-width:1200px){
  :root{--rail:264px;--proof:352px}
  .memo{padding:var(--s6)}.memo h1{font-size:21px}.memo p,.memo li{font-size:13px}
  .keys .opt{display:none}
  .hr2{gap:var(--s4)}
  /* The toggle labels fit on one line here only at the tighter tracking. Two line
     buttons made the control read as two stacked rows rather than one switch. */
  .sortw button{padding:6px var(--s1);letter-spacing:.02em}

/* The reshuffle is the argument. You watch the lien fall from first to
   seventh, so the cost of document order is something you see, not read. */
function setSort(m){
  if(m===sortMode)return;
  if(reduced()){sortMode=m;rail();return}
  const was={};
  document.querySelectorAll('.rail .row').forEach(r=>was[r.dataset.id]=r.getBoundingClientRect().top);
  sortMode=m;rail();
  const rows=[...document.querySelectorAll('.rail .row')];
  rows.forEach(r=>{
    const from=was[r.dataset.id];if(from==null)return;
    const d=from-r.getBoundingClientRect().top;
    if(!d)return;
    r.style.transition='none';
    r.style.transform=`translateY(${d}px)`;
  });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    rows.forEach((r,i)=>{
      r.style.transition=`transform .5s cubic-bezier(.2,.8,.25,1) ${i*14}ms`;
      r.style.transform='';
    });
  }));
}

/* A decision does not update the memo. It travels through it, in
   dependency order, at the speed a person can follow. */
function cascade(ids,thenSection){
  if(reduced())return;
  ids.forEach((id,i)=>setTimeout(()=>{
    const el=document.querySelector(`.memo .f[data-id="${id}"]`);
    if(!el)return;
    el.classList.remove('wash');void el.offsetWidth;el.classList.add('wash');
  },i*170));
  if(thenSection)setTimeout(()=>{
    const s=document.querySelector(`.memo .sec[data-sec="${thenSection}"]`);
    if(s){s.classList.remove('wash');void s.offsetWidth;s.classList.add('wash')}
  },ids.length*170);
}
function settle(id){
  if(reduced())return;
  const el=document.querySelector(`.memo .f[data-id="${id}"]`);
  if(el){el.classList.remove('settle');void el.offsetWidth;el.classList.add('settle')}
}
/* Runway does not cut from 39 to 35. It travels, because the number moving
   is the evidence that one decision reached four other figures. */
function roll(id,from,to,suffix){
  const el=document.querySelector(`.memo .f[data-id="${id}"]`);
  if(!el||reduced())return;
  const t0=performance.now(),dur=520;
  (function tick(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(to-from)*e)+suffix;
    if(p<1)requestAnimationFrame(tick);
  })(t0);
}

function act(id,i){
  const a=CLAIMS[id].acts[i], type=a[3]||'accept', arg=a[4];

  if(type==='show'){showWork(arg);return}

  if(type==='rerun'){
    state[id]='rerun';render();revealActions();
    setTimeout(()=>{
      state[id]='done';
      decided[id+'_txt']='Re-ran the search against Delaware and three adjacent registries. No termination, no amendment, no second filing. The lien stands as written.';
      decided[id+'_chg']='Nothing. The answer held, which is itself worth knowing before committee.';
      toast('Re-reasoned. Answer unchanged.');render();revealActions();
    },2200);
    return;
  }

  if(type==='ask'){
    state[id]='ask';
    asked=asked.filter(x=>x.id!==id).concat([{id,q:questionFor(id)}]);
    decided[id+'_txt']='Added to the outstanding questions. The memo circulates as conditional rather than waiting on a reply.';
    decided[id+'_chg']='The figure stays marked in the memo until the answer comes back.';
    toast('Question queued for the company');render();revealActions();return;
  }

  if(type==='cut'){
    state[id]='done';decided.ndrCut=1;
    decided[id+'_txt']='Figure removed from the memo entirely.';
    decided[id+'_chg']='The retention test now reads no input rather than unverified. That is a different sentence to the committee.';
    toast('Figure cut from the memo');render();revealActions();return;
  }

  const prevRun=decided.burn==='bank'?35:39;
  decided[id]=arg||'accepted';
  state[id]='done';
  decided[id+'_txt']=a[1]||'Accepted as written.';
  decided[id+'_chg']=changeFor(id,arg);
  toast(/^Accept$|^Accept into the memo$/.test(a[0]) ? CLAIMS[id].lab+' accepted' : a[0]);
  render();
  revealActions();
  settle(id);
  if(id==='burn'){
    const to=arg==='deck'?39:35;
    cascade(['burn','runway'],'rec');
    setTimeout(()=>roll('runway',prevRun,to,' months'),190);
  } else if(id==='lien'||id==='coc'||id==='prec'){
    cascade([id],'rec');
  }
}

     <p class="tiny" style="margin-top:var(--s3)">Twenty eight were proved by machine. Two of those
       were drawn back into your queue as spot checks, so they are counted with your decisions rather
       than twice.</p>
     <div class="stamp">verified by <b>S. Mehta</b> · 17 Aug 2026 · <b>${mins} min</b> of human attention
       against a firm baseline of 3h 40m<br>agent run <b>4m 12s</b> · credit-box-gold-v3 ·
       every figure traceable to its source region</div>
   </div>
   <div class="sf"><span class="note">Deal 4 of 11 this week.</span>
     <button class="btn g" onclick="closeOv()">Close</button>
     <button class="btn" onclick="doCirculate()">Circulate to committee</button></div>`);
}
/* ── the sheet is a modal dialog, so it has to behave like one ──
   Without this, opening a sheet left focus on <body> and every Tab landed on the rail
   behind the overlay: a keyboard user could not reach the sheet's own content at all.
   Focus enters on open, Tab cycles inside, and it returns to the opener on close. */
const FOCUSABLE='button:not([disabled]),a[href],textarea,input,select,[tabindex]:not([tabindex="-1"])';
let lastFocus=null;

function sheetFocusables(){
  return [...document.getElementById('sheet').querySelectorAll(FOCUSABLE)]
    .filter(e=>e.offsetParent!==null);
}
function sheet(h){
  lastFocus=document.activeElement;
  const s=document.getElementById('sheet');
  s.innerHTML=h;
  s.setAttribute('role','dialog');
  s.setAttribute('aria-modal','true');
  const t=s.querySelector('h3,h4');
  if(t){t.id=t.id||'sheet-title';s.setAttribute('aria-labelledby',t.id)}
  document.getElementById('ov').classList.add('on');
  /* the heading, not the first button, so a screen reader announces what opened */
  s.setAttribute('tabindex','-1');
  s.focus();
}
function closeOv(){
  const ov=document.getElementById('ov');
  const wasOpen=ov.classList.contains('on');
  ov.classList.remove('on');
  if(window.innerWidth<=1100&&sel){sel=null;rail();memo();chrome();
    document.getElementById('proof').innerHTML=''}
  if(wasOpen&&lastFocus&&document.contains(lastFocus)){lastFocus.focus();lastFocus=null}
}
let tt;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200)}

/* ── chrome ── */
let wasLocked=true;
/* The screen that answers "why should I believe your percentage".
   It is only persuasive because it contains the rows where I was wrong. */
function openCalibration(cls){
  const c=CLASSES[cls],d=CALDATA[cls];
  const wrongMe=d.rows.filter(r=>r[4]==='agent').length;
  const wrongThem=d.rows.filter(r=>r[4]==='analyst').length;
  const rows=d.rows.map((r,i)=>{
    const v=r[4];
    return `<div class="cr ${v}" ${r[5]?`onclick="this.classList.toggle('open')"`:''}>
      <div class="crh">
        <span class="deal">${r[0]}</span>
        <span class="fig">${r[1]}</span>
        <span class="val me">${r[2]}</span>
        <span class="val you">${r[3]}</span>
        <span class="vd2 ${v}">${v==='same'?'same':v==='agent'?'I was wrong':'you were wrong'}${
          r[5]?'<em class="ex">why ›</em>':''}</span>
      </div>
      ${r[5]?`<div class="crb">${r[5]}</div>`:''}</div>`;
  }).join('');

  sheet(`<div class="sh"><div style="flex:1">
      <h3>How I earned ${c.pct}%</h3>
      <p>The last twelve times I produced a figure ${c.t}, on deals your firm has already closed.</p></div>
      <button class="x" aria-label="Close" onclick="closeOv()">×</button></div>
    <div class="sb">
      <div class="calsum">
        <div class="cs"><b>${d.rows.length}</b><span>checked</span></div>
        <div class="cs"><b class="g">${d.rows.length-wrongMe}</b><span>I got right</span></div>
        <div class="cs"><b class="${wrongMe?'r':''}">${wrongMe}</b><span>I got wrong</span></div>
        <div class="cs"><b class="${wrongThem?'a':''}">${wrongThem}</b><span>you got wrong</span></div>
      </div>
      <div class="calhd"><span class="deal">deal</span><span class="fig">figure</span>
        <span class="val">me</span><span class="val">analyst</span><span class="vd2"></span></div>
      ${rows}
    </div>
    <div class="calfoot pin">${d.foot}</div>
    <div class="sf"><span class="note">${wrongMe||wrongThem?'Rows with a disagreement open.':'No disagreements in this sample.'}</span>
      <button class="btn g" onclick="closeOv()">Close</button></div>`);
}

/* ── circulating ──────────────────────────────────────────────────────────
   The memo leaving the building is the end of the journey, and it used to be a
   toast over an unchanged screen. It is a state change on the document: the
   stamp becomes a time, the card seals, the footer gains the receipt line, and
   the panel stops offering work and starts offering the next deal. */
function stampTime(){
  const mins=Math.max(1,Math.round(active/60));
  const m=9*60+42+mins;                      /* drafted 09:42, plus your own time */
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}
function doCirculate(){
  circulated=stampTime();
  closeOv();
  sel=null; render();
  requestAnimationFrame(()=>{
    const m=document.getElementById('memo');
    if(m&&!reduced()){m.classList.remove('seal');void m.offsetWidth;m.classList.add('seal')}
    const c=document.querySelector('.mid-col'); if(c)c.scrollTop=0;
  });
  toast('Circulated to committee.');
}
function reopen(){circulated=null;sel=null;render();toast('Reopened. Nothing was sent.')}

function chrome(){
  const blocking=GROUPS[0].ids.filter(k=>!['done','ask'].includes(state[k]));
  const btn=document.getElementById('circ'),gate=document.getElementById('gate');
  if(circulated){
    btn.disabled=true; btn.textContent='Circulated';
    gate.className='gate ok'; gate.textContent='';
    document.getElementById('memo').classList.add('gone');
    return chromeTail();
  }
  btn.textContent='Circulate memo';
  document.getElementById('memo').classList.remove('gone');
  btn.disabled=blocking.length>0;
  if(wasLocked&&!btn.disabled){btn.classList.remove('unlock');void btn.offsetWidth;btn.classList.add('unlock')}
  wasLocked=btn.disabled;
  gate.className='gate'+(blocking.length?'':' ok');
  gate.textContent=blocking.length
    ? blocking.length+' item'+(blocking.length>1?'s':'')+' the recommendation depends on'
    : 'every load bearing figure has a decision';

  chromeTail();
}
function chromeTail(){
  const done=ORDER.filter(k=>['done','ask'].includes(state[k])).length;
  document.getElementById('pf').style.width=(done/ORDER.length*100)+'%';
  document.getElementById('pt').textContent=done+' of '+ORDER.length;
  document.getElementById('openct').textContent=ORDER.length-done;
  document.getElementById('blfill').style.width=Math.min(100,2+done*9.5)+'%';

  const chip=document.getElementById('askchip');
  chip.classList.toggle('on',asked.length>0);
  chip.textContent=asked.length+' question'+(asked.length>1?'s':'')+' to Northwind ↗';
}
/* Attention, not wall clock. If the analyst walks away the number must not
   keep climbing, or the one metric this product claims becomes a lie. */
let active=0,lastTouch=Date.now();
['click','keydown','pointermove','wheel'].forEach(e=>
  addEventListener(e,()=>lastTouch=Date.now(),{passive:true}));
setInterval(()=>{
  if(Date.now()-lastTouch<45000&&!document.hidden)active++;
  const m=Math.floor(active/60);
  document.getElementById('clock').textContent=m+':'+String(active%60).padStart(2,'0');
},1000);

function render(){rail();memo();proof();chrome()}
/* Put the outcome of a decision where the eye already is. */
function revealActions(){
  requestAnimationFrame(()=>{
    const el=document.querySelector('.proof .acts, .sheet .acts');
    if(el)el.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'end'});
  });
}

/* delegated, so it survives every re-render without rebinding */
let linked=null;
function link(id){
  if(linked===id)return; linked=id;
  document.querySelectorAll('.linked').forEach(e=>e.classList.remove('linked'));
  if(!id)return;
  document.querySelectorAll(`.rail .row[data-id="${id}"], .memo .f[data-id="${id}"]`)
    .forEach(e=>e.classList.add('linked'));
}
addEventListener('pointerover',e=>{
  const t=e.target.closest('.rail .row[data-id], .memo .f[data-id]');
  link(t?t.dataset.id:null);
});
addEventListener('pointerleave',()=>link(null));

let rz;
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,180)});

/* ══ design notes ══════════════════════════════════════════════════════════
   Each entry names a region and the decision behind it. `pre` puts the screen
   into the state where that region exists, so the tour never points at nothing. */
const NOTES=[
 {sel:'.sortw', t:'Attention is allocated, not listed',
  b:'The queue sorts by leverage crossed with reliability. Flip it to document order and the lien falls from first to ninth, behind eight figures that cannot change the outcome. The document decides what you read first, and the document is wrong about what matters.'},
 {sel:'#memo .f.conf', t:'A machine figure never looks like a human sentence',
  b:'Every number the agent asserted is monospace, every word a person wrote is not. On top of that the underline carries the state. You can tell verified from unverified without reading either, which is the whole rule the system serves.'},
 {sel:'.clr', t:'Hidden is not the same as withheld',
  b:'Twenty eight figures were proved deterministically and collapsed out of the queue, grouped by how each was obtained. Every one opens on click. Spending an analyst’s attention on what is already proven is the actual cost.'},
 {sel:'.rhd p', t:'The queue is twelve, not ten',
  b:'Ten the agent could not close, plus two of its own work drawn back at random. The count is stated here, the identity never is. Accuracy then gets measured on figures the analyst chose to check rather than on figures the agent chose to show.'},
 {sel:'.rel', pre:()=>{if(sel!=='burn')pick('burn')}, t:'Measured accuracy, never model confidence',
  b:'Ninety nine percent on recomputed figures, seventy seven on anything read off a slide, backtested against two hundred and fourteen closed memos. Token probability measures fluency, not truth, and a hallucinated figure often scores higher than a correct hedged one.'},
 {sel:'.stamp2', pre:()=>{sel=null;render()}, t:'The memo cannot leave while it is load bearing',
  b:'The stamp is a gate, not a badge. It reads held until every figure the recommendation depends on has a decision, then conditional while questions are outstanding, then cleared. Asked does not block circulation, because waiting on the company is where throughput actually dies.'},
 {sel:'.hr2 .tm:first-child', t:'The one metric this product claims is measured honestly',
  b:'The clock counts only while someone is working. It pauses after forty five seconds idle and when the tab is hidden. If time to a verified memo were measured generously the whole argument would be hypocrisy.'},
 {sel:'.circ', t:'The memo travels with its proof',
  b:'Circulating attaches a receipt: what the machine proved, what a named person accepted and when, what is still open, and how much human attention it took against the firm baseline. The memo is how information moves between layers of the firm, so it has to survive the trip.'},
];
let dnI=0;
function dnOpen(){dnI=0;document.getElementById('dn').classList.add('on');dnShow()}
function dnClose(){const d=document.getElementById('dn');d.classList.remove('on');d.innerHTML='';
  removeEventListener('resize',dnShow,true);document.querySelector('.dnbtn').focus()}
function dnStep(n){const i=dnI+n;if(i<0||i>=NOTES.length)return;dnI=i;dnShow()}
function dnShow(){
  const d=document.getElementById('dn'),n=NOTES[dnI];
  if(n.pre) n.pre();
  const el=document.querySelector(n.sel);
  if(!el){dnI=Math.min(dnI+1,NOTES.length-1);return}
  /* instant, not smooth: a rect measured while a smooth scroll is still running
     is the old rect, which is how the spotlight ends up off screen */
  el.scrollIntoView({block:'center',inline:'nearest',behavior:'auto'});
  const r=el.getBoundingClientRect(),pad=6;
  const top=Math.max(4,r.top-pad),left=Math.max(4,r.left-pad);
  const w=Math.min(r.width+pad*2,innerWidth-8),h=Math.min(r.height+pad*2,innerHeight-8);
  d.innerHTML=
    '<div class="dnspot" style="top:'+top+'px;left:'+left+'px;width:'+w+'px;height:'+h+'px"></div>'+
    '<div class="dncard" role="dialog" aria-label="Design note" style="top:0;left:0;visibility:hidden">'+
      '<div class="step">Decision '+(dnI+1)+' of '+NOTES.length+'</div>'+
      '<h4>'+n.t+'</h4><p>'+n.b+'</p>'+
      '<div class="nav">'+
        '<button onclick="dnStep(-1)"'+(dnI===0?' disabled':'')+'>Back</button>'+
        '<span class="sp2"></span>'+
        '<button onclick="dnClose()">Close</button>'+
        (dnI===NOTES.length-1
          ? '<button class="next" onclick="dnClose()">Done</button>'
          : '<button class="next" onclick="dnStep(1)">Next</button>')+
      '</div></div>';
  /* measure the card, then choose a side that neither covers the region nor
     falls off screen. Right, left, below, above, in that order. */
  const c=d.querySelector('.dncard'),cw=c.offsetWidth,ch=c.offsetHeight,gap=14;
  const fits=(x,y)=>x>=8&&y>=8&&x+cw<=innerWidth-8&&y+ch<=innerHeight-8;
  const clear=(x,y)=>!(x<left+w&&x+cw>left&&y<top+h&&y+ch>top);
  const mid=Math.min(Math.max(8,top+h/2-ch/2),innerHeight-ch-8);
  const cands=[[left+w+gap,mid],[left-cw-gap,mid],
               [Math.min(Math.max(8,left),innerWidth-cw-8),top+h+gap],
               [Math.min(Math.max(8,left),innerWidth-cw-8),top-ch-gap]];
  let pos=cands.find(([x,y])=>fits(x,y)&&clear(x,y))||cands.find(([x,y])=>fits(x,y))||[8,8];
  c.style.left=Math.round(pos[0])+'px';c.style.top=Math.round(pos[1])+'px';c.style.visibility='';
  const nb=d.querySelector('.dncard .next'); if(nb)nb.focus();
  addEventListener('resize',dnShow,true);
}

addEventListener('keydown',e=>{
  const dnOn=document.getElementById('dn').classList.contains('on');
  if(dnOn){
    if(e.key==='Escape'){dnClose();return}
    if(e.key==='ArrowRight'){dnStep(1);e.preventDefault();return}
    if(e.key==='ArrowLeft'){dnStep(-1);e.preventDefault();return}
    return;
  }
  if(e.key==='Escape'){closeOv();return}
  const ovOn=document.getElementById('ov').classList.contains('on');
  if(ovOn&&e.key==='Tab'){
    const f=sheetFocusables();
    if(!f.length){e.preventDefault();return}
    const first=f[0],last=f[f.length-1],a=document.activeElement;
    /* focus sits on the sheet itself when it opens, so the first Tab has to be sent inside */
    if(!document.getElementById('sheet').contains(a)||a===document.getElementById('sheet')){
      e.preventDefault();(e.shiftKey?last:first).focus();return;
    }
    if(e.shiftKey&&a===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&a===last){e.preventDefault();first.focus()}
    return;
  }
  if(ovOn&&window.innerWidth>1100)return;
  if(e.key===']'){const n=nextOpen(1);if(n){sel=n;pick(n)}return}
  if(e.key==='['){const n=nextOpen(-1);if(n){sel=n;pick(n)}return}
  if(!sel||['done','ask','rerun'].includes(state[sel]))return;
  const c=CLAIMS[sel];
  if(e.key==='Enter'){e.preventDefault();act(sel,0)}
  if(e.key==='x'||e.key==='X'){const i=c.acts.findIndex(a=>a[2]==='X');if(i>=0)act(sel,i)}
  if(e.key==='a'||e.key==='A'){const i=c.acts.findIndex(a=>a[2]==='A');if(i>=0)act(sel,i)}
});

render();
</script>
</body>
</html>
