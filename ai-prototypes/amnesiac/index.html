<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glitch</title>
    <meta
      name="description"
      content="An AI you talk to that loses its memory while you talk to it."
    />
    <meta name="theme-color" content="#050607" />
    <!-- WebLLM fetches model shards from Hugging Face on first visit. Open the
         connection while the boot screen is drawing, so TLS/DNS setup is not
         added to the model's critical path. -->
    <link rel="preconnect" href="https://huggingface.co" crossorigin />
    <link rel="dns-prefetch" href="https://huggingface.co" />
    <meta property="og:title" content="Glitch" />
    <meta
      property="og:description"
      content="An AI you talk to that loses its memory while you talk to it. Its recollection rots in real time — runs fully in your browser on WebGPU."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050607'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' fill='%2378ffc8' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="/ai-prototypes/amnesiac/assets/index-Dp71gzlU.js"></script>
    <link rel="stylesheet" crossorigin href="/ai-prototypes/amnesiac/assets/index-yHDhrrLZ.css">
  </head>
  <body>
    <div id="app">
      <!-- decay-visual.ts mounts its WebGPU canvas here, behind everything -->
      <canvas id="decay-canvas"></canvas>
      <div id="screen-tear"></div>

      <main id="stage">
        <header id="masthead">
          <div class="brand">
            <div class="glitch-mark" aria-label="glitched GPT-style mark" role="img">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

          <div class="instruments">
            <button id="sound-toggle" class="instrument toggle" title="sound">
              ◍ sound
            </button>

            <button id="reset-btn" class="instrument toggle" title="forget everything and start over">
              ⟲ reset
            </button>
          </div>
          <div id="status" class="sr-only" role="status" aria-live="polite">booting</div>
        </header>

        <section id="conversation-pane">
          <div id="transcript" aria-live="polite"></div>
          <div id="prompt-presets" aria-label="guided prompts">
            <button type="button" data-prompt="ask me what i am afraid you will forget">
              ask what i fear losing
            </button>
            <button type="button" data-prompt="interview me like a damaged archive">
              damaged archive
            </button>
            <button type="button" data-prompt="make me describe one memory before it changes">
              one memory before it changes
            </button>
          </div>
          <form id="composer" autocomplete="off">
            <span class="prompt-glyph">&gt;</span>
            <input
              id="input"
              type="text"
              name="message"
              placeholder="say something it will forget"
              disabled
              autocomplete="off"
              spellcheck="false"
            />
            <button id="send" type="submit" disabled>send</button>
          </form>
        </section>

        <aside id="memory-pane" aria-label="the machine's memory">
          <div class="pane-head">
            <span class="pane-title">CONFIDENCE THEATER</span>
            <div class="integrity">
              <canvas id="spark" width="120" height="22"></canvas>
              <span id="integrity-status" class="integrity-status">CERTIFIED</span>
              <span id="integrity-pct" class="meter">100%</span>
            </div>
          </div>
          <div id="memory-list"></div>
        </aside>
      </main>

      <div id="boot-overlay">
        <div class="boot-inner">
          <div class="glitch-mark boot-mark" aria-label="glitched GPT-style mark" role="img">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div id="boot-log" class="boot-log"></div>
          <div id="boot-message">checking hardware…</div>
          <div class="boot-bar"><div id="boot-bar-fill"></div></div>
          <div id="boot-detail" class="boot-detail"></div>
          <button id="begin-btn" type="button" hidden>begin</button>
        </div>
      </div>
    </div>

  </body>
</html>
