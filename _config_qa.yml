# ── A BUILD FOR LOOKING AT, NOT FOR SHIPPING ────────────────────────────────
# Used only as `bundle exec jekyll build --config _config.yml,_config_qa.yml`
# while iterating on the portfolio's own pages. It excludes the standalone art
# pieces, which are ~500MB of the 805MB build and are not being modified:
#
#   2.cube          332MB of generated 3D studies
#   ai-prototypes   174MB of Vite bundles
#
# That takes the output to roughly 300MB, which is what makes visual QA
# possible on a machine with under a gigabyte free. Never commit a build made
# with this, and always do a full build before pushing -- /works/ links into
# /ai-prototypes/, so a QA run against this config will report those as 404
# and it is not a real failure.
exclude:
  - 2.cube
  - ai-prototypes
  - _to_delete
  - node_modules
  - output
  - guise-worker
  - bloom-proxy
  - ai-prototypes-proxy
  - .wrangler
  - _scripts
  - bin
