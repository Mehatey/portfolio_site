<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SID.OS · Human in the machine</title>
    <style>
      @font-face {
        font-family: Utility;
        src: url("./fonts/din-condensed-bold.ttf") format("truetype");
        font-display: swap;
      }
      :root {
        --ink: #f3f0e9;
        --muted: rgba(225, 235, 242, 0.52);
        --glass: rgba(10, 20, 31, 0.52);
        --line: rgba(184, 224, 244, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070b;
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .chrome {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      .chrome:after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.42);
        pointer-events: none;
      }
      .topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 34px;
        font-size: 14px;
        letter-spacing: -0.02em;
      }
      .wordmark {
        font-weight: 560;
      }
      .index {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font:
          13px/1 Utility,
          "Arial Narrow",
          sans-serif;
        letter-spacing: 0.19em;
        color: var(--muted);
      }
      .talk {
        pointer-events: auto;
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: border-color 0.25s;
      }
      .talk:hover {
        border-color: currentColor;
      }
      .dialogue {
        position: absolute;
        left: clamp(26px, 4vw, 68px);
        bottom: clamp(52px, 8vh, 96px);
        width: min(520px, 41vw);
        pointer-events: auto;
      }
      .eyebrow {
        margin: 0 0 28px;
        max-width: 360px;
        font:
          12px/1.4 Utility,
          sans-serif;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .line {
        min-height: 2.6em;
        margin: 0 0 24px;
        font-size: clamp(27px, 2.25vw, 42px);
        font-weight: 410;
        line-height: 1.04;
        letter-spacing: -0.052em;
        max-width: 520px;
        text-wrap: balance;
      }
      .caret {
        display: inline-block;
        width: 0.12em;
        height: 0.78em;
        margin-left: 0.12em;
        background: #82d8ff;
        vertical-align: -0.04em;
        animation: blink 1s steps(1) infinite;
      }
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: 520px;
      }
      .choice,
      .sound {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--glass);
        color: var(--ink);
        font:
          500 12px/1 "Helvetica Neue",
          sans-serif;
        padding: 12px 17px;
        border-radius: 999px;
        cursor: pointer;
        backdrop-filter: blur(18px);
        box-shadow:
          inset 0 1px rgba(255, 255, 255, 0.05),
          0 12px 32px rgba(0, 0, 0, 0.18);
        transition:
          transform 0.28s,
          background 0.28s,
          border-color 0.28s;
      }
      .choice:hover,
      .choice:focus-visible {
        outline: none;
        background: rgba(129, 216, 255, 0.14);
        border-color: rgba(150, 226, 255, 0.5);
        transform: translateY(-2px);
      }
      .choice:active,
      .sound:active,
      .restart:active {
        transform: scale(0.96);
      }
      .sound {
        position: absolute;
        right: 30px;
        bottom: 28px;
        width: 50px;
        height: 50px;
        padding: 0;
        display: grid;
        place-items: center;
        pointer-events: auto;
        background: rgba(8, 13, 21, 0.78);
        font-size: 15px;
      }
      .sound:hover {
        transform: scale(1.05);
        border-color: rgba(150, 226, 255, 0.55);
      }
      .sound[aria-pressed="true"] {
        color: #071018;
        background: #9edfff;
      }
      .restart {
        position: absolute;
        left: 30px;
        bottom: 28px;
        width: 48px;
        height: 48px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--glass);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        pointer-events: auto;
        opacity: 0;
        transform: translateY(10px);
        transition: 0.3s;
      }
      .restart.visible {
        opacity: 1;
        transform: none;
      }
      .hint {
        position: absolute;
        right: 96px;
        bottom: 44px;
        font:
          11px/1 Utility,
          sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .model-meta {
        position: absolute;
        right: 34px;
        top: 50%;
        transform: translateY(-50%) translateX(12px);
        display: grid;
        gap: 7px;
        text-align: right;
        opacity: 0;
        filter: blur(4px);
        transition: 0.35s;
        pointer-events: none;
      }
      .model-meta.visible {
        opacity: 1;
        filter: none;
        transform: translateY(-50%);
      }
      .model-meta b {
        font:
          17px/1 Utility,
          sans-serif;
        letter-spacing: 0.14em;
      }
      .model-meta span {
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
      .loader {
        position: fixed;
        inset: 0;
        z-index: 5;
        background: #05070b;
        display: grid;
        place-items: center;
        transition: opacity 0.6s;
      }
      .loader.done {
        opacity: 0;
        pointer-events: none;
      }
      .loader:after {
        content: "";
        width: 28px;
        height: 28px;
        border: 1px solid rgba(180, 225, 247, 0.18);
        border-top-color: #8edcff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      @media (max-width: 760px) {
        .topbar {
          padding: 20px;
        }
        .index,
        .model-meta {
          display: none;
        }
        .dialogue {
          left: 20px;
          bottom: 82px;
          width: calc(100vw - 40px);
        }
        .eyebrow {
          display: none;
        }
        .line {
          font-size: 27px;
          max-width: 92%;
          margin-bottom: 18px;
        }
        .choice {
          padding: 11px 14px;
        }
        .sound {
          right: 20px;
          bottom: 20px;
        }
        .restart {
          left: 20px;
          bottom: 20px;
        }
        .hint {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .caret,
        .loader:after {
          animation: none;
        }
        .choice,
        .sound {
          transition: none;
        }
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="stage" aria-label="Interactive translucent cube character with modeled human face"></canvas>
    <main class="chrome">
      <header class="topbar">
        <div class="wordmark">Siddharth Mehta®</div>
        <div class="index">HUMAN / MACHINE / 001</div>
        <a class="talk" href="mailto:hello@siddharthmehta.design">Let’s talk</a>
      </header>
      <section class="dialogue" aria-live="polite">
        <p class="eyebrow">A human interface wearing a machine</p>
        <p class="line"><span id="dialogueText"></span><span class="caret" aria-hidden="true"></span></p>
        <div class="choices" id="choices"></div>
      </section>
      <button class="restart" id="restart" aria-label="Restart conversation">↩</button>
      <div class="hint">hover to reveal · click to respond</div>
      <aside class="model-meta" id="modelMeta"><b>SID / INSIDE</b><span>MODELED IN 3D · NOT A PORTRAIT PLANE</span></aside>
      <button class="sound" id="sound" type="button" aria-label="Turn voice on" aria-pressed="false">◖))</button>
    </main>
    <div class="loader" id="loader" aria-label="Loading character"></div>
    <script type="module" src="./tv-head-viewer.js?v=5"></script>
  </body>
</html>
