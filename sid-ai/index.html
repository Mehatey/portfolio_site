<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:," />
    <title>Talk to Sid AI</title>
    <meta
      name="description"
      content="An early build of Sid Mehta as a character you can talk to live, on the site's cube, in either his own voice or an AI one."
    />
    <meta property="og:title" content="Talk to Sid AI" />
    <meta
      property="og:description"
      content="An early build of Sid Mehta as a character you can talk to live, in either his own voice or an AI one."
    />
    <meta property="og:image" content="https://siddharthmehta.design/assets/img/og-card-v2.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --ink: #f5f2ec;
        --muted: rgba(234, 242, 247, 0.68);
        --signal: #9ef2ea;
        --voice: #9ef2ea;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070b;
        color: var(--ink);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #stage {
        z-index: 0;
        background: transparent;
      }
      #watercolour-bg {
        z-index: -1;
        opacity: 0;
        pointer-events: none;
      }
      .chrome {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      .chrome:after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.36);
        pointer-events: none;
      }
      .sid-ai {
        position: absolute;
        left: clamp(24px, 4vw, 64px);
        top: clamp(26px, 6vh, 68px);
        width: min(360px, 44vw);
        text-align: left;
        transition:
          transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
          opacity 0.6s;
      }
      .sid-ai__lockup {
        display: flex;
        align-items: center;
        gap: clamp(12px, 1.25vw, 18px);
      }
      .sid-ai__mark {
        position: relative;
        display: grid;
        place-items: center;
        pointer-events: auto;
        text-decoration: none;
        border-radius: 8px;
        width: clamp(38px, 4vw, 52px);
        aspect-ratio: 1;
        color: var(--voice);
        filter: drop-shadow(0 0 12px color-mix(in srgb, var(--voice), transparent 60%));
        transition:
          color 0.45s,
          filter 0.45s;
      }
      .sid-ai__mark svg {
        width: 66%;
        height: 66%;
        overflow: visible;
      }
      .sid-ai__mark:hover {
        color: #fff;
      }
      .sid-ai__mark:focus-visible {
        outline: 2px solid var(--voice);
        outline-offset: 3px;
      }
      .sid-ai__mark rect {
        fill: currentColor;
      }
      .sid-ai__title {
        font-size: clamp(28px, 3.2vw, 46px);
        font-weight: 520;
        line-height: 0.92;
        letter-spacing: -0.036em;
      }
      .sid-ai__title span,
      .sid-ai__title strong {
        display: inline;
        font-weight: 520;
        color: var(--ink);
      }
      .sid-ai__persona,
      .sid-ai__wave {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .sid-ai__meta {
        margin: clamp(14px, 1.8vh, 22px) 0 0;
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        line-height: 1.5;
        text-transform: uppercase;
        opacity: 0.52;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8);
        transition: opacity 0.9s ease;
      }
      body.ai-touched .sid-ai__meta {
        opacity: 0;
      }
      .cube-hover .sid-ai {
        transform: translateX(3px);
      }
      .cube-hover .sid-ai__mark {
        filter: drop-shadow(0 0 18px color-mix(in srgb, var(--voice), transparent 42%));
      }
      .is-speaking .sid-ai__mark svg rect:nth-child(odd) {
        animation: pixel-speak 0.42s ease-in-out infinite alternate;
      }
      .is-speaking .sid-ai__mark svg rect:nth-child(even) {
        animation: pixel-speak 0.55s -0.2s ease-in-out infinite alternate;
      }
      .captions {
        position: absolute;
        left: 50%;
        bottom: clamp(138px, 18vh, 172px);
        width: min(680px, 70vw);
        transform: translate(-50%, 12px);
        text-align: center;
        font-size: clamp(17px, 1.6vw, 25px);
        font-weight: 480;
        line-height: 1.32;
        letter-spacing: -0.02em;
        color: rgba(245, 242, 236, 0.72);
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.72);
        opacity: 0;
        transition:
          opacity 0.28s ease,
          transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        text-wrap: balance;
      }
      .captions.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .captions span {
        transition:
          color 0.12s,
          text-shadow 0.12s;
      }
      .captions span.is-current {
        color: #fff;
        text-shadow: 0 0 22px color-mix(in srgb, var(--voice), transparent 28%);
      }
      /* One live conversation control. No suggested questions, pills, or
         lower-left copy competing with the character. */
      .cube-ask {
        position: absolute;
        left: 50%;
        bottom: clamp(26px, 6vh, 50px);
        width: min(480px, 84vw);
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        pointer-events: auto;
      }
      .cube-ask__row {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 10px;
        border-bottom: 1px solid color-mix(in srgb, var(--voice), transparent 60%);
        padding-bottom: 8px;
        transition: border-color 0.2s;
      }
      .cube-ask__row:focus-within {
        border-color: var(--voice);
      }
      .cube-ask__input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: none;
        outline: none;
        color: var(--ink);
        font:
          480 15px/1.3 "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
      }
      .cube-ask__input::placeholder {
        color: #d6e4e3;
      }
      .cube-ask__mic,
      .cube-ask__submit {
        flex: none;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 0;
        background: none;
        color: var(--voice);
        cursor: pointer;
      }
      .cube-ask__submit svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .cube-ask__mic {
        width: 28px;
        height: 30px;
        color: rgba(234, 242, 247, 0.62);
      }
      .cube-ask__mic svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
      }
      .cube-ask__mic:hover,
      .cube-ask__mic:focus-visible,
      .cube-ask__mic.is-listening {
        color: var(--voice);
        outline: none;
      }
      .cube-ask__mic.is-listening {
        animation: mic-listening 0.9s ease-in-out infinite alternate;
      }
      @keyframes mic-listening {
        from {
          filter: drop-shadow(0 0 0 color-mix(in srgb, var(--voice), transparent 100%));
        }
        to {
          filter: drop-shadow(0 0 8px var(--voice));
        }
      }
      .cube-ask__status {
        min-height: 1.2em;
        color: rgba(234, 242, 247, 0.5);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      /* ── CUSTOMIZE ────────────────────────────────────────────────────
       One small control, top right, opposite the mark. It opens a short
       list of plain rows, same register as the rest of the page: no cards,
       no pills, a thin rule between rows is the only chrome. */
      .cube-tune {
        position: absolute;
        right: clamp(20px, 3vw, 40px);
        top: clamp(26px, 6vh, 68px);
        pointer-events: auto;
      }
      .cube-tune__toggle {
        display: flex;
        align-items: center;
        gap: 7px;
        border: 1px solid color-mix(in srgb, var(--voice), transparent 65%);
        background: rgba(5, 10, 14, 0.3);
        padding: 7px 13px;
        color: rgba(240, 248, 248, 0.78);
        font:
          600 9.5px/1 "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .cube-tune__toggle:hover,
      .cube-tune__toggle:focus-visible {
        border-color: var(--voice);
        color: #fff;
        outline: none;
      }
      .cube-tune__toggle svg {
        width: 12px;
        height: 12px;
        fill: currentColor;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .cube-tune.is-open .cube-tune__toggle svg {
        transform: rotate(48deg);
      }
      .cube-tune__panel {
        position: absolute;
        right: 0;
        top: calc(100% + 10px);
        width: 236px;
        background: rgba(6, 10, 15, 0.86);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid color-mix(in srgb, var(--voice), transparent 72%);
        padding: 14px 16px 16px;
        opacity: 0;
        transform: translateY(-6px);
        pointer-events: none;
        transition:
          opacity 0.2s ease,
          transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .cube-tune.is-open .cube-tune__panel {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .cube-tune__group {
        padding: 10px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .cube-tune__group:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .cube-tune__label {
        margin: 0 0 8px;
        color: rgba(234, 242, 247, 0.46);
        font-size: 9px;
        font-weight: 680;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .cube-tune__options {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .cube-tune__options button {
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: none;
        padding: 5px 10px;
        color: rgba(240, 248, 248, 0.68);
        font:
          600 10px/1 "Helvetica Neue",
          Helvetica,
          Arial,
          sans-serif;
        letter-spacing: 0.03em;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
      }
      .cube-tune__options button.is-active {
        border-color: var(--voice);
        color: #fff;
      }
      .cube-tune__options button:hover,
      .cube-tune__options button:focus-visible {
        border-color: var(--voice);
        color: #fff;
        outline: none;
      }
      .cube-tune__note {
        margin: 8px 0 0;
        color: rgba(234, 242, 247, 0.4);
        font-size: 9.5px;
        line-height: 1.5;
      }
      #stage:focus-visible {
        outline: 2px solid var(--voice);
        outline-offset: -3px;
      }
      .loader {
        position: fixed;
        inset: 0;
        z-index: 5;
        background: #05070b;
        display: grid;
        place-items: center;
        transition: opacity 0.6s;
      }
      .loader.done {
        opacity: 0;
        pointer-events: none;
      }
      /* ── THE WAIT IS PART OF THE CHARACTER ──────────────────────────
         Sid: "in the loading sign for talk to sid ai, instead of a basic
         loader u can have a cube forming side by side and animated icon
         with text like claude's creative marinating or custom text, it can
         be like sid is having his morning coffee, he is waking up, pluggin
         wires or whatever."

         A spinner says "a computer is busy". This page is about to hand you
         a person to talk to, so the wait should be that person getting
         ready. Two parts: the mark assembles itself, and a line underneath
         says what he is doing, in his voice.

         The cube is the site's logomark, drawn rather than filled -- the
         crisp light stroke it is supposed to be everywhere. Its edges draw
         in on a dash offset, back to front, so it builds instead of
         appearing, and then it turns slowly on its own axis. Nothing here
         is a progress bar: it cannot honestly report progress on a model
         download, so it does not pretend to. */
      .loader__wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
      }
      .loader__cube {
        width: 84px;
        height: 84px;
        overflow: visible;
        animation: cubeTurn 7.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .loader__cube path,
      .loader__cube line {
        fill: none;
        stroke: #8edcff;
        stroke-width: 1.15;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: var(--len, 120);
        stroke-dashoffset: var(--len, 120);
        animation: cubeDraw 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: var(--d, 0ms);
        opacity: 0.94;
      }
      /* The three hidden edges are quieter, which is what gives a wireframe
         its front and back without shading anything. */
      .loader__cube .is-back {
        stroke: rgba(142, 220, 255, 0.34);
      }
      @keyframes cubeDraw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes cubeTurn {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .loader__say {
        font-family: var(--mono, ui-monospace, monospace);
        font-size: 12.5px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: rgba(198, 226, 244, 0.78);
        min-height: 1.4em;
        text-align: center;
        transition: opacity 420ms ease;
      }
      .loader__say.is-out {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .loader__cube {
          animation: none;
        }
        .loader__cube path,
        .loader__cube line {
          animation: none;
          stroke-dashoffset: 0;
        }
        .loader__say {
          transition: none;
        }
      }
      @keyframes voice {
        0%,
        100% {
          transform: scaleY(0.55);
        }
        50% {
          transform: scaleY(2.6);
        }
      }
      @keyframes orbit {
        to {
          transform: rotate(1turn);
        }
      }
      @keyframes pixel-speak {
        to {
          transform: scaleY(1.7);
          transform-origin: center;
        }
      }
      @keyframes title-breathe {
        0%,
        100% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(1.025);
        }
      }
      @keyframes construction-strip {
        to {
          transform: translateX(30px);
        }
      }
      @media (max-width: 760px), (orientation: portrait) and (max-width: 1024px) {
        .sid-ai {
          left: 18px;
          top: 20px;
          width: min(290px, calc(100vw - 36px));
        }
        .sid-ai__lockup {
          gap: 13px;
        }
        .sid-ai__mark {
          width: 48px;
        }
        .sid-ai__title {
          font-size: 34px;
        }
        .sid-ai__coming {
          margin-bottom: 5px;
        }
        .sid-ai__meta {
          margin-top: 12px;
          font-size: 9px;
          letter-spacing: 0.12em;
        }
        .captions {
          bottom: auto;
          top: calc(100vh - 226px);
          width: calc(100vw - 36px);
          font-size: 17px;
        }
        .cube-ask {
          bottom: calc(66px + env(safe-area-inset-bottom, 0px));
          width: calc(100vw - 36px);
        }
        .cube-tune {
          right: 14px;
          top: 18px;
        }
        .cube-tune__panel {
          width: min(260px, calc(100vw - 28px));
        }
      }
      @media (min-width: 761px) and (orientation: portrait) and (max-width: 1024px) {
        .sid-ai {
          left: clamp(24px, 4vw, 64px);
          top: clamp(26px, 6vh, 68px);
          width: min(360px, 60vw);
        }
        .sid-ai__title {
          font-size: 42px;
        }
        .sid-ai__meta {
          font-size: 10px;
        }
        .captions {
          top: calc(100vh - 268px);
          font-size: 19px;
        }
      }
      @media (orientation: portrait) and (max-height: 700px), (orientation: portrait) and (max-width: 340px) {
        .captions {
          top: calc(100vh - 206px);
          font-size: 15px;
        }
      }
      @media (max-height: 520px) and (orientation: landscape) {
        .sid-ai__meta {
          display: none;
        }
        .cube-ask {
          bottom: 10px;
        }
        .captions {
          bottom: 48px;
          font-size: 15px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader:after,
        .sid-ai__wave i,
        .sid-ai__orbit,
        .sid-ai__mark svg rect,
        .sid-ai__title strong {
          animation: none !important;
        }
        .sid-ai,
        .captions,
        .sid-ai__meta {
          transition: none;
        }
        .cube-tune__toggle svg,
        .cube-tune__panel {
          transition: none;
        }
      }
      @media print {
        *,
        *:before,
        *:after {
          transition: none !important;
          animation: none !important;
        }
        html,
        body {
          overflow: visible;
          height: auto;
          background: #fff;
          color: #0a0d12;
        }
        body {
          padding: 28px 32px;
        }
        canvas,
        .loader,
        .chrome:after,
        .sid-ai__coming:after {
          display: none !important;
        }
        .chrome {
          position: static;
          inset: auto;
        }
        .sid-ai,
        .captions {
          position: static;
          width: auto;
          max-width: none;
          transform: none;
          opacity: 1;
          color: #0a0d12;
          text-shadow: none;
        }
        .cube-ask,
        .cube-tune {
          display: none;
        }
        .sid-ai__mark {
          color: #0a0d12;
        }
        .sid-ai__title,
        .sid-ai__title span,
        .sid-ai__title strong {
          color: #0a0d12;
        }
        .sid-ai__coming {
          color: #0a0d12;
          border-color: #0a0d12;
          margin-bottom: 8px;
        }
        .sid-ai__lockup {
          gap: 14px;
        }
        .sid-ai__meta {
          color: #2a3440;
          opacity: 1;
        }
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
  </head>
  <body>
    <canvas id="watercolour-bg" aria-hidden="true"></canvas>
    <canvas
      id="stage"
      tabindex="0"
      role="button"
      aria-describedby="cube-instructions"
      aria-label="Interactive translucent cube character. Click or press Enter to focus the live conversation."
    ></canvas>
    <main class="chrome">
      <section class="sid-ai" aria-label="Talk to Sid AI">
        <div class="sid-ai__lockup">
          <a class="sid-ai__mark" href="/" aria-label="Back to Sid Mehta’s site">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="4" height="4" rx="1" />
              <rect x="17" y="3" width="4" height="4" rx="1" />
              <rect x="3" y="17" width="4" height="4" rx="1" />
              <rect x="17" y="17" width="4" height="4" rx="1" />
              <rect x="8" y="9" width="2" height="6" rx="1" />
              <rect x="11" y="6" width="2" height="12" rx="1" />
              <rect x="14" y="8" width="2" height="8" rx="1" />
            </svg>
          </a>
          <div>
            <div class="sid-ai__title"><span>Talk to </span><strong>Sid AI</strong></div>
          </div>
        </div>
        <p class="sid-ai__meta" id="cube-instructions">Speak, type, or click the cube to begin.</p>
        <div class="sid-ai__persona" id="voice-persona">AI voice ready</div>
      </section>
      <div class="cube-tune" id="cube-tune">
        <button class="cube-tune__toggle" type="button" id="cube-tune-toggle" aria-expanded="false" aria-controls="cube-tune-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 2.5-1.6-.4a7.1 7.1 0 00-.6-1.46l.85-1.42a1 1 0 00-.15-1.23l-.93-.93a1 1 0 00-1.23-.15l-1.42.85a7.1 7.1 0 00-1.46-.6l-.4-1.6A1 1 0 0012.98 3h-1.96a1 1 0 00-.97.76l-.4 1.6a7.1 7.1 0 00-1.46.6l-1.42-.85a1 1 0 00-1.23.15l-.93.93a1 1 0 00-.15 1.23l.85 1.42a7.1 7.1 0 00-.6 1.46l-1.6.4a1 1 0 00-.76.97v1.96a1 1 0 00.76.97l1.6.4c.14.5.34 1 .6 1.46l-.85 1.42a1 1 0 00.15 1.23l.93.93a1 1 0 001.23.15l1.42-.85c.46.26.96.46 1.46.6l.4 1.6a1 1 0 00.97.76h1.96a1 1 0 00.97-.76l.4-1.6c.5-.14 1-.34 1.46-.6l1.42.85a1 1 0 001.23-.15l.93-.93a1 1 0 00.15-1.23l-.85-1.42c.26-.46.46-.96.6-1.46l1.6-.4a1 1 0 00.76-.97v-1.96a1 1 0 00-.76-.97z"
            />
          </svg>
          Customize
        </button>
        <div class="cube-tune__panel" id="cube-tune-panel">
          <div class="cube-tune__group">
            <p class="cube-tune__label">Voice</p>
            <div class="cube-tune__options" id="cube-tune-mode" role="group" aria-label="Voice mode"></div>
          </div>
          <div class="cube-tune__group">
            <p class="cube-tune__label">Delivery</p>
            <div class="cube-tune__options" id="cube-tune-persona" role="group" aria-label="Voice delivery"></div>
          </div>
          <div class="cube-tune__group">
            <p class="cube-tune__label">Scene</p>
            <div class="cube-tune__options" id="cube-tune-scene" role="group" aria-label="Scene"></div>
          </div>
          <p class="cube-tune__note" id="cube-tune-note"></p>
        </div>
      </div>
      <div class="captions" id="captions" role="status" aria-live="polite" aria-atomic="true"></div>
      <form class="cube-ask" id="cube-ask" autocomplete="off">
        <div class="cube-ask__row">
          <input class="cube-ask__input" id="cube-ask-input" type="text" placeholder="Talk to Sid" maxlength="240" aria-label="Ask the cube" />
          <button class="cube-ask__mic" id="cube-ask-mic" type="button" aria-label="Speak to Sid" title="Speak to Sid">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="8" y="3" width="8" height="12" rx="4" />
              <path d="M5 11a7 7 0 0014 0M12 18v3M8 21h8" />
            </svg>
          </button>
          <button class="cube-ask__submit" type="submit" aria-label="Ask">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14.2l-5.6-5.6L14 5l8 8-8 8-1.4-1.4 5.6-5.6H4z" /></svg>
          </button>
        </div>
        <p class="cube-ask__status" id="cube-ask-status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <div class="loader" id="loader" aria-label="Loading character">
      <div class="loader__wrap">
        <svg class="loader__cube" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <!-- back verticals and the hidden corner, drawn first so the box
               builds from behind -->
          <line class="is-back" x1="32" y1="26" x2="32" y2="46" style="--len: 20; --d: 0ms" />
          <line class="is-back" x1="32" y1="26" x2="10" y2="14" style="--len: 25; --d: 90ms" />
          <line class="is-back" x1="32" y1="26" x2="54" y2="14" style="--len: 25; --d: 180ms" />
          <!-- the top face -->
          <path d="M32 6 L54 14 L32 26 L10 14 Z" style="--len: 100; --d: 260ms" />
          <!-- the two visible side faces -->
          <path d="M10 14 L10 38 L32 50 L32 26" style="--len: 92; --d: 520ms" />
          <path d="M54 14 L54 38 L32 50 L32 26" style="--len: 92; --d: 700ms" />
        </svg>
        <p class="loader__say" id="loader-say">Sid is having his morning coffee</p>
      </div>
    </div>
    <script src="./watercolour.js?v=7"></script>
    <script src="./watercolour-init.js?v=7"></script>

    <script src="./vinyl.js?v=5" defer></script>
    <script type="module" src="./live-chat.js?v=1"></script>

    <script>
      /* ── WHAT HE IS DOING WHILE YOU WAIT ──────────────────────────────
         The lines are the loader's only honest signal: there is no real
         progress to report on a model download, so instead of a fake bar
         this says what the character is up to, in his register. They cycle
         on a fixed beat rather than mapping to load stages, because a line
         that claims "almost ready" and then sits there for nine seconds is
         worse than one that never claimed anything.

         Written to be read once each. No dashes anywhere in them, which is
         the house rule for copy on this site. */
      (function () {
        var el = document.getElementById("loader-say");
        if (!el) return;
        var LINES = [
          "Sid is having his morning coffee",
          "Waking up the model",
          "Plugging in the wires",
          "Looking for his words",
          "Warming up his voice",
          "Remembering what he built",
          "Almost ready to talk",
        ];
        var i = 0;
        var timer = setInterval(function () {
          var loader = document.getElementById("loader");
          if (!loader || loader.classList.contains("done")) {
            clearInterval(timer);
            return;
          }
          el.classList.add("is-out");
          setTimeout(function () {
            i = (i + 1) % LINES.length;
            el.textContent = LINES[i];
            el.classList.remove("is-out");
          }, 420);
        }, 2600);
      })();
    </script>
  </body>
