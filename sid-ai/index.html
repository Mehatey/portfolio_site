    .loader{position:fixed;inset:0;z-index:5;background:#05070b;display:grid;place-items:center;transition:opacity .6s}.loader.done{opacity:0;pointer-events:none}.loader:after{content:"";width:28px;height:28px;border:1px solid rgba(180,225,247,.18);border-top-color:#8edcff;border-radius:50%;animation:spin .9s linear infinite}

    @media(prefers-reduced-motion:reduce){.loader:after,.sid-ai__wave i,.sid-ai__orbit,.sid-ai__mark svg rect,.sid-ai__title strong{animation:none!important}.sid-ai__coming:after{display:none}.sid-ai,.captions,.sid-ai__meta{transition:none}}@media print{*,*:before,*:after{transition:none!important;animation:none!important}html,body{overflow:visible;height:auto;background:#fff;color:#0a0d12}body{padding:28px 32px}canvas,.loader,.chrome:after,.sid-ai__coming:after{display:none!important}.chrome{position:static;inset:auto}.sid-ai,.cube-notes,.captions{position:static;width:auto;max-width:none;transform:none;opacity:1;color:#0a0d12;text-shadow:none}.cube-notes:before{display:none}.cube-notes__label,.sid-ai__mark{color:#0a0d12}.sid-ai__title,.sid-ai__title span,.sid-ai__title strong{color:#0a0d12}.sid-ai__coming{color:#0a0d12;border-color:#0a0d12;margin-bottom:8px}.sid-ai__lockup{gap:14px}.cube-notes{margin-top:22px}.cube-note-chip{background:none;min-height:0;padding:4px 10px}.cube-notes__answer,.sid-ai__meta{color:#2a3440;opacity:1}.cube-note-chip{color:#0a0d12;border-color:#0a0d12}}

<body>
  <canvas id="watercolour-bg" aria-hidden="true"></canvas>
  <canvas id="stage" tabindex="0" role="button" aria-describedby="cube-instructions" aria-label="Interactive translucent cube character. Click or press Enter to ask it a question and hear Sid."></canvas>
  <main class="chrome">
    <section class="sid-ai" aria-label="Talk to Sid AI, coming soon">
      <div class="sid-ai__lockup">
        <div class="sid-ai__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="3" height="3" rx=".6"/><rect x="17" y="5" width="3" height="3" rx=".6"/><rect x="4" y="16" width="3" height="3" rx=".6"/><rect x="17" y="16" width="3" height="3" rx=".6"/><rect x="7" y="10" width="2.5" height="5" rx=".7"/><rect x="10.75" y="7" width="2.5" height="11" rx=".7"/><rect x="14.5" y="9" width="2.5" height="7" rx=".7"/></svg>
        </div>
        <div><div class="sid-ai__coming">Coming soon</div><div class="sid-ai__title"><span>Talk to </span><strong>Sid AI</strong></div></div>
      </div>
      <p class="sid-ai__meta" id="cube-instructions">Click the cube, or ask it something.</p>
      <div class="sid-ai__persona" id="voice-persona">Ready when you are</div>
    </section>
    <aside class="cube-notes" aria-live="polite" aria-atomic="true" aria-label="Conversation with the cube">
      <span class="cube-notes__label" id="cube-note-label">The cube says</span>
      <p class="cube-notes__question" id="cube-note-question">Who’s Sid?</p>
      <p class="cube-notes__answer" id="cube-note-answer">Designer and technologist in New York. MFA from Parsons, with work spanning EyeJack, Deloitte, and Philips. The cube claims only partial credit.</p>
      <div class="cube-notes__chips" id="cube-note-chips" aria-label="Ask the cube">
        <button class="cube-note-chip" type="button" data-cube-note="builds">What does he build</button>
        <button class="cube-note-chip" type="button" data-cube-note="best">Best work</button>
        <button class="cube-note-chip" type="button" data-cube-note="reach">How to reach him</button>
      </div>
    </aside>
    <div class="captions" id="captions" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
  <div class="loader" id="loader" aria-label="Loading character"></div>
