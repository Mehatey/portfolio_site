<!doctype html><meta charset="utf-8" /><style>
  * {
    margin: 0;
  }
  body {
    background: #fafaf6;
  }
  canvas {
    display: block;
  }</style
><canvas width="1280" height="800"></canvas>
<script>
  const D = {
      p: {
        slug: "aananda",
        title: "Aananda",
        color: "#87a44b",
        bg: "#fafaf6",
        ink: "#292820",
        problem: "App, book and temple print arrive as separate galleries, so the shared philosophy and visual language become hard to follow.",
        change: "Connect the cultural source to the visual system, then show how one idea moves between learning formats.",
        pieces: [
          {
            id: "identity",
            type: "logo",
            title: "A quieter introduction.",
            deck: "Motion study using the original Aananda wordmark.",
            items: [{ src: "9.aananda/1.png", label: "Original Aananda identity", detail: "", asset: "assets/9.aananda_1.webp" }],
            logo: "9.aananda/1.png",
            motion: "aananda",
            logoAsset: "assets/aananda-logo.webp",
          },
          {
            id: "source-to-form",
            type: "triptych",
            title: "A source, a language, a page.",
            deck: "Jain philosophy and temple references become a consistent learning system.",
            items: [
              { src: "9.aananda/4.webp", label: "Cultural references", detail: "", asset: "assets/9.aananda_4.webp" },
              { src: "9.aananda/2.webp", label: "Identity development", detail: "", asset: "assets/9.aananda_2.webp" },
              { src: "9.aananda/14.webp", label: "Ahimsa, in the book", detail: "", asset: "assets/9.aananda_14.webp" },
            ],
          },
          {
            id: "learning",
            type: "comparison",
            title: "Teachers and students share a place.",
            deck: "The original app brings learning, conversations and community into the same visual language.",
            items: [
              { src: "9.aananda/6.webp", label: "Learning and events", detail: "", asset: "assets/9.aananda_6.webp" },
              { src: "9.aananda/9.webp", label: "Conversation and profile", detail: "", asset: "assets/9.aananda_9.webp" },
            ],
          },
          {
            id: "book-sequence",
            type: "sequence",
            title: "One book, several entry points.",
            deck: "An editorial sequence through the original spreads.",
            items: [
              { src: "9.aananda/14.webp", label: "Ahimsa", detail: "", asset: "assets/9.aananda_14.webp" },
              { src: "9.aananda/15.1.webp", label: "A different chapter", detail: "", asset: "assets/9.aananda_15.1.webp" },
              { src: "9.aananda/17.1.webp", label: "The visual system continues", detail: "", asset: "assets/9.aananda_17.1.webp" },
            ],
          },
          {
            id: "learning-kit",
            type: "generated",
            title: "Carry a question into the next conversation.",
            deck: "Proposed reader’s notebook, bookmark and an existing discussion card.",
            items: [],
            concept: true,
            generated: "aananda-kit",
          },
        ],
      },
      a: {
        id: "identity",
        type: "logo",
        title: "A quieter introduction.",
        deck: "Motion study using the original Aananda wordmark.",
        items: [{ src: "9.aananda/1.png", label: "Original Aananda identity", detail: "", asset: "assets/9.aananda_1.webp" }],
        logo: "9.aananda/1.png",
        motion: "aananda",
        logoAsset: "assets/aananda-logo.webp",
      },
      assets: ["assets/aananda-motion.png"],
    },
    B = "/output/image-review-2026-09-07/round-5/",
    C = document.querySelector("canvas"),
    x = C.getContext("2d");
  const images = [];
  const ease = (t) => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
  const clamp = (t) => Math.max(0, Math.min(1, t));
  const fill = (c) => {
    x.fillStyle = c;
    x.fillRect(0, 0, 1280, 800);
  };
  const fit = (im, w, h) => {
    const s = Math.min(w / im.width, h / im.height);
    return [im.width * s, im.height * s];
  };
  const crop = (im, sx, sy, sw, sh, dx, dy, dw, dh, alpha = 1) => {
    if (sw <= 0 || sh <= 0) return;
    x.save();
    x.globalAlpha = clamp(alpha);
    x.drawImage(im, sx, sy, sw, sh, dx, dy, dw, dh);
    x.restore();
  };
  window.ready = Promise.all(
    D.assets.map(
      (s) =>
        new Promise((r) => {
          let i = new Image();
          i.onload = () => r(i);
          i.src = B + s;
        })
    )
  ).then((a) => {
    images.push(...a);
    window.render(0);
  });
  window.render = (t) => {
    const im = images[0];
    if (!im) return;
    if (D.a.type === "logo") {
      const bg = D.p.slug === "mool" ? "#2b337c" : D.p.slug === "illustrations" ? "#ef1710" : "#070806";
      fill(bg);
      const [w, h] = fit(im, D.p.slug === "illustrations" ? 970 : 780, 600),
        ox = (1280 - w) / 2,
        oy = (800 - h) / 2,
        s = w / im.width;
      if (D.p.slug === "mool") {
        let e = ease((t - 0.25) / 1.4);
        crop(im, 0, 0, im.width, 215, ox, oy, w, 215 * s, 1);
        x.fillStyle = bg;
        x.fillRect(ox, oy, w, 205 * s * (1 - e));
        let f = ease((t - 1.15) / 1.2);
        crop(im, 0, 215, im.width, im.height - 215, ox, oy + 215 * s + 20 * (1 - f), w, (im.height - 215) * s, f);
      } else if (D.p.slug === "naavo") {
        x.save();
        x.beginPath();
        x.arc(ox + 246 * s, oy + 200 * s, 160 * s * ease((t - 0.1) / 1.5), 0, Math.PI * 2);
        x.clip();
        crop(im, 0, 0, im.width, 357, ox, oy, w, 357 * s);
        x.restore();
        const f = ease((t - 1.35) / 1);
        crop(im, 0, 357, im.width, im.height - 357, ox, oy + 357 * s + 14 * (1 - f), w, (im.height - 357) * s, f);
      } else if (D.p.slug === "aananda") {
        const f = ease((t - 0.1) / 1.2);
        x.save();
        x.beginPath();
        x.arc(ox + 166 * s, oy + 87 * s, 40 * s, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f);
        x.lineTo(ox + 166 * s, oy + 87 * s);
        x.closePath();
        x.clip();
        crop(im, 120, 40, 90, 90, ox + 120 * s, oy + 40 * s, 90 * s, 90 * s);
        x.restore();
        const e = ease((t - 0.9) / 1.6);
        crop(im, 0, 125, im.width * e, im.height - 125, ox, oy + 125 * s, w * e, (im.height - 125) * s);
      } else {
        const f = ease((t - 0.1) / 1.1);
        x.save();
        x.beginPath();
        x.arc(ox + w * 0.5, oy + h * 0.35, w * 0.52 * f, 0, Math.PI * 2);
        x.clip();
        x.drawImage(im, ox, oy, w, h);
        x.restore();
      }
      if (t > 5.6) {
        x.fillStyle = bg;
        x.globalAlpha = clamp((t - 5.6) / 0.4);
        x.fillRect(0, 0, 1280, 800);
        x.globalAlpha = 1;
      }
    } else {
      fill(D.p.bg);
      const segment = 3.5,
        n = Math.min(images.length - 1, Math.floor(t / segment)),
        local = t - n * segment;
      const img = images[n];
      const [w, h] = fit(img, 1160, 610);
      if (n > 0 && local < 0.3) {
        const prev = images[n - 1],
          [pw, ph] = fit(prev, 1160, 610);
        x.globalAlpha = 1 - clamp(local / 0.3);
        x.drawImage(prev, (1280 - pw) / 2, 55 + (610 - ph) / 2, pw, ph);
        x.fillStyle = D.p.ink;
        x.font = "500 29px Arial";
        x.fillText(D.a.items[n - 1].label, 60, 742);
      }
      const opacity = clamp(local / 0.3);
      x.globalAlpha = opacity;
      x.drawImage(img, (1280 - w) / 2, 55 + (610 - h) / 2, w, h);
      x.fillStyle = D.p.ink;
      x.font = "500 29px Arial";
      x.fillText(D.a.items[n].label, 60, 742);
      x.globalAlpha = 1;
      x.fillStyle = D.p.color;
      x.fillRect(60, 777, 1160 * clamp(t / (images.length * segment)), 3);
    }
  };
</script>
