<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Sid Mehta</title>
    <meta name="description" content="The page you requested does not exist. Visit Sid Mehta's work, résumé, or contact page." />
    <link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Figtree", system-ui, sans-serif;
        background: #0a0c11;
        color: #f2f1ed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 20% 15%, #14233b, #0a0c11 52%);
      }
      main {
        width: min(680px, 100%);
      }
      .face {
        position: relative;
        width: 64px;
        height: 64px;
        margin-bottom: 30px;
        border: 1.5px solid currentColor;
        border-radius: 8px;
        opacity: 0.9;
        animation: faceBob 4s ease-in-out infinite;
      }
      .face i {
        position: absolute;
        top: 22px;
        width: 7px;
        height: 11px;
        border-radius: 2px;
        background: currentColor;
        transform: translate(var(--ex, 0), var(--ey, 0));
        transition: transform 120ms ease-out;
      }
      .face i:nth-child(1) {
        left: 17px;
      }
      .face i:nth-child(2) {
        right: 17px;
      }
      .face b {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 15px;
        height: 2px;
        background: currentColor;
        transform: rotate(-4deg);
      }
      @keyframes faceBob {
        50% {
          transform: translateY(-6px) rotate(-2deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .face {
          animation: none;
        }
      }
      p {
        margin: 0;
      }
      .code {
        margin-bottom: 28px;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #98a4b8;
      }
      h1 {
        max-width: 12ch;
        margin: 0 0 20px;
        font-size: clamp(42px, 9vw, 76px);
        font-weight: 500;
        line-height: 0.98;
        letter-spacing: -0.05em;
      }
      .note {
        max-width: 46ch;
        font-size: 18px;
        line-height: 1.55;
        color: #c8cbd1;
      }
      #guess {
        margin-top: 24px;
      }
      #guess[hidden] {
        display: none;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        margin-top: 38px;
      }
      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid #66748a;
      }
      a:hover,
      a:focus-visible {
        border-color: currentColor;
        outline: none;
      }
      @media (prefers-color-scheme: light) {
        :root {
          background: #f5f3ee;
          color: #15171c;
        }
        body {
          background: radial-gradient(circle at 20% 15%, #e4edf7, #f5f3ee 56%);
        }
        .code {
          color: #536174;
        }
        .note {
          color: #41464e;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="face" id="face" aria-hidden="true"><i></i><i></i><b></b></div>
      <p class="code">404 · Page not found</p>
      <h1>This page is not here.</h1>
      <p class="note">The address may have changed. Here's the rest of the site.</p>
      <!-- Every other page on the site shares the full studio_nav.html header
           (Work, Play, Contact, About). This page deliberately does not --
           it has no shared includes at all, so an error page loads in one
           request instead of pulling in the nav's own CSS/JS and the
           theme-toggle sync. That's the right call for a 404, but it meant
           a visitor landing here with Play or About in mind had nowhere to
           go: only Work, Résumé and Contact were offered. Completing the
           list rather than importing the heavy nav keeps the page light
           and makes every top-level destination reachable from here. -->
      <nav aria-label="Useful links">
        <a href="{{ site.baseurl }}/works/">View work</a>
        <a href="{{ site.baseurl }}/play/">Play</a>
        <a href="{{ site.baseurl }}/about/">About</a>
        <a href="{{ site.baseurl }}/contact/">Contact</a>
        <a href="{{ site.baseurl }}/assets/Siddharth_Mehta_Resume.pdf">Résumé</a>
      </nav>
      <p class="note" id="guess" hidden></p>
    </main>
    <script>
      (function () {
        var f = document.getElementById("face");
        if (!f || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        addEventListener("pointermove", function (e) {
          var r = f.getBoundingClientRect();
          var dx = e.clientX - (r.left + r.width / 2),
            dy = e.clientY - (r.top + r.height / 2);
          var d = Math.hypot(dx, dy) || 1,
            k = Math.min(1, d / 300);
          f.style.setProperty("--ex", (dx / d) * 4 * k + "px");
          f.style.setProperty("--ey", (dy / d) * 4 * k + "px");
        });
      })();
    </script>
    <script>
      (function () {
        var W = [{% for w in site.data.works %}{% unless w.hidden %}{ t: {{ w.title | jsonify }}, u: {{ w.url | jsonify }} }{% unless forloop.last %},{% endunless %}{% endunless %}{% endfor %}];
        var parts = location.pathname.toLowerCase().split(/[^a-z0-9]+/).filter(function (x) { return x.length > 2; });
        if (!parts.length) return;
        var best = null, score = 0;
        W.forEach(function (w) {
          var hay = (w.u + " " + w.t).toLowerCase(), sc = 0;
          parts.forEach(function (x) { if (hay.indexOf(x) > -1) sc += x.length; else if (x.length > 3 && hay.indexOf(x.slice(0, 4)) > -1) sc += 2; });
          if (sc > score) { score = sc; best = w; }
        });
        if (!best || score < 3) return;
        var g = document.getElementById("guess");
        g.innerHTML = "Looking for ";
        var a = document.createElement("a");
        a.href = {{ site.baseurl | jsonify }} + best.u;
        a.textContent = best.t;
        g.appendChild(a);
        g.appendChild(document.createTextNode("?"));
        g.hidden = false;
      })();
    </script>
  </body>
</html>
