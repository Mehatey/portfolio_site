<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="{{ '/assets/js/gl-budget.js' | relative_url }}"></script>
    <title>{{ page.title }} · Sid Mehta</title>
    <meta name="description" content="{{ page.description }}" />
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/favicon.svg" />
    <link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="any" />
    {% include head_bootstrap.html %}
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}" />
    <meta property="og:title" content="{{ page.title }} · Sid Mehta" />
    <meta property="og:description" content="{{ page.description }}" />
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/og-card-v2.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
    />
    {% include design_tokens.html %}
    <style>
      /* ══════════════════════════════════════════════════════════════════
         THE REEL

         Sid: "one page where it's just Siddharth Mehta as a work project
         ... across all my work projects based on the final outcome photo
         ... it shouldn't have way too much text. more top level, more
         visual ... the more scroll interactions and transitions you can do,
         the better. divide it by headers."

         One long scroll, six chapters, each a capability with the best
         finished outcome from the projects that prove it. Almost no words:
         a chapter number, a title, one line, and then the work. Every
         picture is the thing in use, not a screen in a frame.

         MOTION. All of it is CSS scroll-driven animation (animation-timeline:
         view()), so it costs nothing per frame and needs no script: media
         rises and unblurs as it enters, chapter titles slide across the
         viewport as you pass them, the big number behind each chapter
         counts up in scale, and alternate rows drift against each other.
         Browsers without scroll-driven animations get the page still,
         which is fine: it is a page of pictures.
         ══════════════════════════════════════════════════════════════════ */
      :root {
        --reel-ink: var(--ink, #f2efe8);
        --reel-dim: var(--ink-3, rgba(255, 255, 255, 0.6));
        --reel-line: var(--line-2, rgba(255, 255, 255, 0.14));
        --reel-gutter: clamp(20px, 5vw, 80px);
      }
      body.reel-page {
        overflow-x: clip;
      }
      /* ── THE PAGE BENDS ─────────────────────────────────────────────────
         Sid: "attach some curve on the media or bend like we wanted when we
         scroll on the top of the page as a whole not individual pics." One
         clip path on the whole page, its top and bottom edges arcing with
         scroll velocity: scroll down and the top of the page bows, stop and
         it flattens. Written by the script at the foot of this file from
         --sv, the site's shared damped scroll velocity. */
      .reel {
        clip-path: url(#reel-bend);
      }
      .reel {
        position: relative;
        z-index: 1;
        padding-top: calc(var(--nav-h, 72px) + 8vh);
      }

      /* ── HERO ─────────────────────────────────────────────────────────── */
      .reel-hero {
        min-height: calc(100svh - var(--nav-h, 72px));
        display: grid;
        align-content: center;
        padding: 0 var(--reel-gutter) 12vh;
      }
      .reel-hero__kicker {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--reel-dim);
        margin: 0 0 22px;
      }
      /* One weight, the site's display token, and a size a title should be.
         Sid: "i dont like how u have multiple weights in title text and its
         too big." */
      .reel-hero__name {
        margin: 0;
        font: var(--type-display);
        font-size: clamp(44px, 6.4vw, 92px);
        letter-spacing: -0.035em;
        color: var(--reel-ink);
      }
      .reel-hero__line {
        margin: 24px 0 0;
        max-width: 44ch;
        font: var(--type-body-lg);
        color: var(--reel-dim);
      }
      .reel-hero__tags {
        margin: 36px 0 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 10px;
        padding: 0;
        list-style: none;
      }
      .reel-hero__tags li {
        font: 500 11px/1 var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--reel-ink);
        border: 1px solid var(--reel-line);
        border-radius: 999px;
        padding: 9px 13px;
      }
      .reel-hero__hint {
        margin: 9vh 0 0;
        font: 400 11px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--reel-dim);
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .reel-hero__hint i {
        display: inline-block;
        width: 1px;
        height: 34px;
        background: var(--reel-dim);
        animation: reelHint 1.8s ease-in-out infinite;
        transform-origin: top;
      }
      @keyframes reelHint {
        0% {
          transform: scaleY(0);
          transform-origin: top;
        }
        50% {
          transform: scaleY(1);
          transform-origin: top;
        }
        51% {
          transform-origin: bottom;
        }
        100% {
          transform: scaleY(0);
          transform-origin: bottom;
        }
      }

      /* ── CHAPTER ──────────────────────────────────────────────────────── */
      .reel-ch {
        position: relative;
        padding: 14vh var(--reel-gutter) 6vh;
        border-top: 1px solid var(--reel-line);
      }
      /* The chapter's number, enormous and faint, behind the title. It
         grows as the chapter arrives and shrinks as it leaves, so the
         scroll reads as a camera passing over a set of plates. */
      .reel-ch__num {
        position: absolute;
        right: var(--reel-gutter);
        top: 4vh;
        z-index: 0;
        font-family: var(--font-head);
        font-weight: 600;
        font-size: clamp(96px, 16vw, 240px);
        line-height: 1;
        letter-spacing: -0.06em;
        color: transparent;
        -webkit-text-stroke: 1px var(--reel-line);
        opacity: 0.7;
        pointer-events: none;
        user-select: none;
      }
      /* Title, then the projects it draws from, on one left edge with a
         hairline between: a heading and its meta, not two things floating.
         Sid: "dont like how project text labels just sit there pls do
         proper typography spacing and hierarchy." */
      .reel-ch__head {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 18px;
        max-width: 64ch;
        margin-bottom: clamp(32px, 5vh, 56px);
      }
      .reel-ch__title {
        margin: 0;
        font: var(--type-display);
        font-size: clamp(36px, 4.6vw, 64px);
        letter-spacing: -0.03em;
        color: var(--reel-ink);
      }
      .reel-ch__line {
        margin: 0 0 10px;
        font-family: var(--font-head);
        font-size: clamp(15px, 1.25vw, 19px);
        line-height: 1.5;
        color: var(--reel-dim);
        max-width: 40ch;
      }
      .reel-ch__from {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 22px;
        margin: 0;
        padding: 14px 0 0;
        border-top: 1px solid var(--reel-line);
        list-style: none;
        font: var(--type-micro);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--reel-dim);
      }
      .reel-ch__from a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition:
          color 200ms ease,
          border-color 200ms ease;
      }
      .reel-ch__from a:hover {
        color: var(--reel-ink);
        border-bottom-color: var(--reel-ink);
      }

      /* ── PLATES ───────────────────────────────────────────────────────── */
      .reel-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: clamp(12px, 1.6vw, 24px);
      }
      .reel-plate {
        position: relative;
        overflow: hidden;
        border-radius: 6px;
        background: rgba(127, 127, 127, 0.08);
        grid-column: span 6;
      }
      .reel-plate--wide {
        grid-column: span 12;
      }
      .reel-plate--third {
        grid-column: span 4;
      }
      .reel-plate--tall {
        grid-column: span 4;
        grid-row: span 2;
      }
      .reel-plate--8 {
        grid-column: span 8;
      }
      .reel-plate img,
      .reel-plate video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: var(--pos, 50% 50%);
        aspect-ratio: var(--ar, 16 / 10);
      }
      /* A mockup with its own ground is shown whole, never cropped. */
      .reel-plate--fit img,
      .reel-plate--fit video {
        object-fit: contain;
        background: var(--plate-bg, rgba(127, 127, 127, 0.08));
      }
      .reel-plate--tall img,
      .reel-plate--tall video {
        aspect-ratio: var(--ar, 3 / 4);
      }
      .reel-plate--wide img,
      .reel-plate--wide video {
        aspect-ratio: var(--ar, 21 / 9);
      }

      /* ── SCROLL-DRIVEN MOTION ─────────────────────────────────────────── */
      @supports (animation-timeline: view()) {
        @media (prefers-reduced-motion: no-preference) {
          .reel-plate {
            animation: reelIn linear both;
            animation-timeline: view();
            animation-range: entry 0% entry 55%;
          }
          .reel-plate:nth-child(3n + 2) {
            animation-name: reelInLeft;
          }
          .reel-plate:nth-child(3n) {
            animation-name: reelInRight;
          }
          .reel-plate img,
          .reel-plate video {
            animation: reelZoom linear both;
            animation-timeline: view();
            animation-range: entry 0% exit 100%;
          }
          .reel-ch__num {
            animation: reelNum linear both;
            animation-timeline: view();
            animation-range: entry 0% exit 100%;
          }
          .reel-ch__title {
            animation: reelTitle linear both;
            animation-timeline: view();
            animation-range: entry 0% entry 60%;
          }
          .reel-ch__line,
          .reel-ch__from {
            animation: reelFade linear both;
            animation-timeline: view();
            animation-range: entry 10% entry 70%;
          }
          .reel-hero__name {
            animation: reelHeroOut linear both;
            animation-timeline: view();
            animation-range: exit 0% exit 100%;
          }
        }
      }
      @keyframes reelIn {
        from {
          opacity: 0;
          transform: translateY(64px) scale(0.96);
          filter: blur(10px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      @keyframes reelInLeft {
        from {
          opacity: 0;
          transform: translate(-40px, 48px) rotate(-1.2deg);
          filter: blur(8px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      @keyframes reelInRight {
        from {
          opacity: 0;
          transform: translate(40px, 48px) rotate(1.2deg);
          filter: blur(8px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      /* The picture inside the plate travels slower than the plate, which
         is parallax at the depth of a print sitting in a mount. */
      @keyframes reelZoom {
        from {
          transform: scale(1.12) translateY(-4%);
        }
        to {
          transform: scale(1) translateY(4%);
        }
      }
      @keyframes reelNum {
        from {
          transform: translateY(18vh) scale(0.7);
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
        to {
          transform: translateY(-30vh) scale(1.15);
          opacity: 0;
        }
      }
      @keyframes reelTitle {
        from {
          opacity: 0;
          transform: translateX(-6vw);
          letter-spacing: 0.02em;
        }
        to {
          opacity: 1;
          transform: none;
          letter-spacing: -0.04em;
        }
      }
      @keyframes reelFade {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes reelHeroOut {
        to {
          transform: translateY(-14vh) scale(0.94);
          opacity: 0;
          filter: blur(6px);
        }
      }

      /* ── MARQUEE BETWEEN CHAPTERS ─────────────────────────────────────── */
      .reel-marq {
        overflow: hidden;
        border-top: 1px solid var(--reel-line);
        border-bottom: 1px solid var(--reel-line);
        padding: 14px 0;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      }
      .reel-marq__track {
        display: flex;
        gap: 48px;
        width: max-content;
        animation: reelMarq 40s linear infinite;
        font-family: var(--font-head);
        font-weight: 300;
        font-size: clamp(22px, 3vw, 44px);
        letter-spacing: -0.02em;
        color: var(--reel-dim);
        white-space: nowrap;
      }
      .reel-marq__track span::after {
        content: "·";
        margin-left: 48px;
        color: var(--reel-line);
      }
      @keyframes reelMarq {
        to {
          transform: translateX(-50%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .reel-marq__track,
        .reel-hero__hint i {
          animation: none;
        }
      }

      /* ── RECOGNITION ──────────────────────────────────────────────────── */
      .reel-awards {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }
      .reel-award {
        border: 1px solid var(--reel-line);
        border-radius: 8px;
        padding: 22px 22px 20px;
        display: grid;
        gap: 12px;
      }
      .reel-award img {
        width: 84px;
        height: auto;
        border-radius: 3px;
      }
      .reel-award b {
        font-family: var(--font-head);
        font-weight: 500;
        font-size: 16px;
        color: var(--reel-ink);
      }
      .reel-award span {
        font: 400 11px/1.4 var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--reel-dim);
      }

      /* ── CLOSE ────────────────────────────────────────────────────────── */
      .reel-close {
        padding: 18vh var(--reel-gutter) 16vh;
        border-top: 1px solid var(--reel-line);
        display: grid;
        gap: 22px;
      }
      .reel-close h2 {
        margin: 0;
        font: var(--type-display);
        font-size: clamp(40px, 5.6vw, 80px);
        letter-spacing: -0.035em;
        color: var(--reel-ink);
        max-width: 16ch;
      }
      .reel-close__row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 12px;
      }
      .reel-close__row a {
        font: 500 12px/1 var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--reel-ink);
        border: 1px solid var(--reel-ink);
        border-radius: 999px;
        padding: 14px 20px;
        transition:
          background-color 200ms ease,
          color 200ms ease;
      }
      .reel-close__row a:hover {
        background: var(--reel-ink);
        color: var(--bg, #0b0e14);
      }
      .reel-close__row a.is-primary {
        background: var(--reel-ink);
        color: var(--bg, #0b0e14);
      }
      .reel-close__row a.is-primary:hover {
        background: #3fbf7f;
        color: #0b0e14;
        border-color: #3fbf7f;
      }

      /* ── HOVER ────────────────────────────────────────────────────────── */
      .reel-plate {
        transition: transform 480ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reel-plate:hover {
        transform: translateY(-4px);
      }
      .reel-plate img,
      .reel-plate video {
        transition: transform 700ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reel-plate:hover img,
      .reel-plate:hover video {
        transform: scale(1.03);
      }

      /* ── CUBE STORY ─────────────────────────────────────────────────── */
      .cube-story {
        display: none;
        position: relative;
        height: 640vh;
      }
      .cube-story.is-live {
        display: block;
      }
      .cube-story.is-live + .reel-about {
        display: none;
      }
      .cs-pin {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: hidden;
      }
      .cs-stage {
        position: absolute;
        inset: 0;
        cursor: grab;
      }
      .cs-stage:active {
        cursor: grabbing;
      }
      .cs-stage .cs-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .cs-caption {
        position: absolute;
        left: var(--reel-gutter);
        bottom: clamp(28px, 6vh, 64px);
        margin: 0;
        max-width: 40ch;
        font: var(--type-body-lg);
        color: var(--reel-ink);
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 480ms ease,
          transform 640ms cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }
      .cs-caption.is-on {
        opacity: 1;
        transform: none;
      }

      /* ── ABOUT ────────────────────────────────────────────────────────── */
      .reel-about {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
        gap: clamp(20px, 3vw, 48px);
        align-items: end;
        padding: 0 var(--reel-gutter) 12vh;
      }
      .reel-about__pic {
        overflow: hidden;
        border-radius: 6px;
        aspect-ratio: 4 / 5;
      }
      .reel-about__pic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .reel-about__facts {
        display: grid;
        gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .reel-about__facts li {
        display: grid;
        grid-template-columns: 9ch minmax(0, 1fr);
        gap: 20px;
        padding: 16px 0;
        border-top: 1px solid var(--reel-line);
        font-family: var(--font-head);
        font-size: clamp(15px, 1.25vw, 19px);
        line-height: 1.4;
        color: var(--reel-ink);
      }
      .reel-about__facts li:last-child {
        border-bottom: 1px solid var(--reel-line);
      }
      .reel-about__facts li span {
        font: 500 11px/1.9 var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--reel-dim);
      }

      /* ── FILM STRIP ───────────────────────────────────────────────────── */
      /* A row of plates that slides sideways as the page scrolls down:
         the AI experiments, all twelve, as a strip of film pulled past. */
      .reel-strip {
        position: relative;
        z-index: 1;
        margin: clamp(24px, 4vh, 48px) calc(-1 * var(--reel-gutter)) 0;
        overflow: hidden;
        padding: 2vh 0 10vh;
      }
      .reel-strip__track {
        display: flex;
        gap: clamp(12px, 1.6vw, 24px);
        width: max-content;
        padding: 0 var(--reel-gutter);
      }
      .reel-strip__track .reel-plate {
        flex: 0 0 auto;
        width: clamp(300px, 32vw, 520px);
      }
      .reel-strip__track .reel-plate img,
      .reel-strip__track .reel-plate video {
        aspect-ratio: 16 / 10;
      }
      @supports (animation-timeline: view()) {
        @media (prefers-reduced-motion: no-preference) {
          .reel-strip__track {
            animation: reelStrip linear both;
            animation-timeline: view();
            animation-range: entry 30% exit 70%;
          }
          .reel-strip__track .reel-plate {
            animation: none;
          }
        }
      }
      /* Starts with the first card at the left gutter and ends with the
         last card at the right gutter; between, the strip is pulled past
         at the page's own scroll speed. */
      @keyframes reelStrip {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(calc(-100% + 100vw));
        }
      }
      @media (max-width: 860px) {
        .reel-about {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 860px) {
        .reel-ch__head {
          grid-template-columns: 1fr;
        }
        .reel-plate,
        .reel-plate--third,
        .reel-plate--8 {
          grid-column: span 12;
        }
        .reel-plate--tall {
          grid-column: span 12;
          grid-row: auto;
        }
        .reel-plate--tall img,
        .reel-plate--tall video {
          aspect-ratio: 4 / 5;
        }
        .reel-ch__num {
          font-size: 34vw;
          top: 2vh;
        }
      }
    </style>
  </head>
  <body class="reel-page">
    {% include site_field.html %} {% include studio_nav.html active="work" %}
    <main class="reel" id="main">{{ content }}</main>
    {% include site_footer.html bare=true %} {% include cursor_fluid.html %} {% include motion_stack.html %}
    <script src="{{ site.baseurl }}/assets/js/scroll-velocity.js" defer></script>
    <script type="importmap">
      {
        "imports": {
          "three": "{{ site.baseurl }}/sid-ai/vendor/three/build/three.module.js",
          "three/addons/": "{{ site.baseurl }}/sid-ai/vendor/three/addons/"
        }
      }
    </script>
    <!-- Sid: "remove the 3d scenes from the scroll for now." Section markup
         is commented in siddharth.md too; re-enable both together.
    <script type="module" src="{{ site.baseurl }}/assets/js/cube-story.js"></script>
    -->

    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <clipPath id="reel-bend" clipPathUnits="objectBoundingBox">
        <path id="reel-bend-path" d="M0,0 L1,0 L1,1 L0,1 Z" />
      </clipPath>
    </svg>
    <script>
      /* The page's own edges arc with the scroll. One path in bounding-box
         units on the whole <main>; the top edge sags in the middle when the
         page is being pulled down, the bottom edge bows the other way on the
         way up, and both flatten as the wheel stops. --sv comes from
         scroll-velocity.js. The amount is small on purpose: this is the
         sheet flexing, not the sheet folding. */
      (function () {
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var path = document.getElementById("reel-bend-path");
        var main = document.querySelector(".reel");
        if (!path || !main) return;
        var html = document.documentElement;

          cur += (sv - cur) * 0.12;

             viewport needs to be scaled to the page height. */
          var H = main.offsetHeight || 1;
          var px = Math.abs(cur) * 90; /* up to 90px of sag */
          var a = px / H;

          if (cur > 0.005) {
            d = "M0,0 Q0.5," + (2 * a).toFixed(5) + " 1,0 L1,1 L0,1 Z";
          } else if (cur < -0.005) {
            d = "M0,0 L1,0 L1,1 Q0.5," + (1 - 2 * a).toFixed(5) + " 0,1 Z";
          } else {
            d = "M0,0 L1,0 L1,1 L0,1 Z";
          }
          if (d !== last) {
            path.setAttribute("d", d);
            last = d;
          }
          if (Math.abs(sv - cur) > 0.002 || Math.abs(cur) > 0.005) raf = requestAnimationFrame(frame);
        }
        function kick() {
          if (!raf) raf = requestAnimationFrame(frame);
        }
        window.addEventListener("scroll", kick, { passive: true });
        window.addEventListener("wheel", kick, { passive: true });
      })();
    </script>
