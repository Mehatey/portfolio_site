<!DOCTYPE html> <html lang="en"> <head> <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"> <meta charset="utf-8"> <meta name="robots" content="noindex, nofollow"> <title>OG card source</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Figtree:ital,wght@0,300..900;1,300..900&amp;display=swap"> <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #05070d;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(120% 90% at 12% 6%, rgba(28, 48, 96, 0.5), transparent 62%),
          radial-gradient(80% 70% at 88% 84%, rgba(88, 52, 24, 0.34), transparent 60%), #05070d;
        font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
        color: #eef3fa;
        overflow: hidden;
      }
      /* The figure sits right and bleeds off the bottom, the way he does in
         the hero — a portrait fully inside a box is a stock photo. */
      .fig {
        position: absolute;
        right: -40px;
        /* Bleeds off the bottom on purpose — a figure fully inside the frame
           is a stock photo — but not through the middle of a shoe. */
        bottom: -52px;
        width: 640px;
        height: 700px;
      }
      .fig canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .copy {
        position: absolute;
        left: 74px;
        top: 84px;
        /* Wide enough that "Product designer, six years." holds one line. It
           was breaking after "six", which puts the orphan on the line that
           carries the claim. */
        width: 660px;
      }
      .mark {
        display: block;
        width: 46px;
        height: 46px;
        margin-bottom: 40px;
        color: rgba(186, 211, 244, 0.9);
      }
      .name {
        font-size: 30px;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: rgba(226, 238, 255, 0.72);
        margin-bottom: 18px;
      }
      .line {
        font-size: 52px;
        font-weight: 300;
        line-height: 1.02;
        letter-spacing: -0.035em;
        color: #fff;
      }
      .line span {
        color: rgba(226, 238, 255, 0.58);
      }
      .foot {
        position: absolute;
        left: 74px;
        bottom: 68px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(186, 211, 244, 0.62);
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(120, 210, 150, 0.9);
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.5;
        background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 3px 3px;
      }
    </style> </head> <body> <div class="card"> <div class="fig"> <canvas id="cg-gl" data-base=""></canvas> </div> <div class="grain"></div> <div class="copy"> <svg class="logo-cube" xmlns="http://www.w3.org/2000/svg" viewbox="0 0 36 36" aria-hidden="true" focusable="false"> <rect class="cube-face cube-top" x="7.5" y="7.5" width="21" height="21" rx="2.1"></rect> <rect class="cube-face cube-right" x="7.5" y="7.5" width="21" height="21" rx="2.1"></rect> <rect class="cube-front" x="7.5" y="7.5" width="21" height="21" rx="2.1"></rect> <g style="transform: translate(calc(var(--eye-x, 0) * 0.9px), calc(var(--eye-y, 0) * 0.7px))"> <rect class="logo-eye" x="13.83" y="13.9" width="1.3" height="4.8" rx="0.65"></rect> <rect class="logo-eye" x="20.88" y="13.9" width="1.3" height="4.8" rx="0.65"></rect> </g> <rect class="logo-mouth" x="15.86" y="21.9" width="4.3" height="0.9" rx="0.45"></rect> <path class="logo-scan" d="M8.5 18 H27.5"></path> </svg> <div class="name">Sid Mehta</div> <div class="line">Product designer, six years.<br><span>Research to shipped code, end to end.</span> </div> </div> <div class="foot"> <span class="dot"></span> <span>Open to product design roles</span> <span>·</span> <span>siddharthmehta.design</span> </div> </div> <script>
      /* The renderer expects a .cg-stage parent and reads --hero-p and the
         field phase, neither of which exist here. It guards on both, so the
         only thing it needs is the canvas and a sized parent. */
      document.querySelector(".fig").classList.add("cg-stage");
    </script> <script src="/assets/js/cube-guy.js"></script> <style>
      .logo-cube {
        width: 46px;
        height: 46px;
        color: rgba(186, 211, 244, 0.9);
      }
      .logo-cube .cube-face {
        opacity: 0;
      }
      .logo-cube .cube-front {
        fill: #070b13;
        stroke: currentColor;
        stroke-width: 1.5;
      }
      .logo-cube .logo-eye,
      .logo-cube .logo-mouth {
        fill: #e7f1ff;
      }
      .logo-cube .logo-scan {
        opacity: 0;
      }
    </style> </body> </html>
