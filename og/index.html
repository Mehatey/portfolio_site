<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>OG card source</title>
    <!-- The same two families the site loads, from the same place. A card
         that renders in a fallback face is a card in someone else's type. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
    />
    <!-- ── THE SHARE CARD, MADE BY THE SITE ────────────────────────────────
         Sid: "see that the cover pic or what we have is nice when i paste my
         portfolio link there. the placeholder image is very lame and i think
         an old ppt style thumbnail preview."

         He is describing the old card exactly: a text block on the left, a
         portrait in a rounded rectangle on the right, over a blue gradient.
         That is a title slide, and it was also out of date — it carried a
         tagline the site no longer uses and a discipline list ("PRODUCT
         DESIGN · CREATIVE TECH · XR") that The Range replaced with Product,
         Spatial and Generative.

         This page is not for visitors. It renders the card at exactly
         1200x630 out of the site's own parts — the real point cloud of the
         cube guy, the real type, the real ground — and
         _scripts/make_og_card.mjs screenshots it to assets/img/og-card.jpg.
         The card a stranger sees in Slack is then a frame of the thing they
         are about to open, rather than a picture made in a different tool
         that has to be kept in sync by hand.

         Regenerate after changing the headline:
           node _scripts/make_og_card.mjs
         ─────────────────────────────────────────────────────────────────── -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #05070d;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(120% 90% at 12% 6%, rgba(28, 48, 96, 0.5), transparent 62%),
          radial-gradient(80% 70% at 88% 84%, rgba(88, 52, 24, 0.34), transparent 60%), #05070d;
        font-family: "Figtree", ui-sans-serif, system-ui, sans-serif;
        color: #eef3fa;
        overflow: hidden;
      }
      /* The figure sits right and bleeds off the bottom, the way he does in
         the hero — a portrait fully inside a box is a stock photo. */
      .fig {
        position: absolute;
        right: -40px;
        /* Bleeds off the bottom on purpose — a figure fully inside the frame
           is a stock photo — but not through the middle of a shoe. */
        bottom: -52px;
        width: 640px;
        height: 700px;
      }
      .fig canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .copy {
        position: absolute;
        left: 74px;
        top: 84px;
        /* Wide enough that "Product designer, six years." holds one line. It
           was breaking after "six", which puts the orphan on the line that
           carries the claim. */
        width: 660px;
      }
      .mark {
        display: block;
        width: 46px;
        height: 46px;
        margin-bottom: 40px;
        color: rgba(186, 211, 244, 0.9);
      }
      .name {
        font-size: 30px;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: rgba(226, 238, 255, 0.72);
        margin-bottom: 18px;
      }
      .line {
        font-size: 52px;
        font-weight: 300;
        line-height: 1.02;
        letter-spacing: -0.035em;
        color: #fff;
      }
      .line span {
        color: rgba(226, 238, 255, 0.58);
      }
      .foot {
        position: absolute;
        left: 74px;
        bottom: 68px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(186, 211, 244, 0.62);
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(120, 210, 150, 0.9);
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.5;
        background-image: radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 3px 3px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="fig">
        <canvas id="cg-gl" data-base="{{ site.baseurl }}"></canvas>
      </div>
      <div class="grain"></div>
      <div class="copy">
        {% include site_logo.html %}
        <div class="name">Sid Mehta</div>
        <div class="line">Product designer, six years.<br /><span>Research to shipped code, end to end.</span></div>
      </div>
      <div class="foot">
        <span class="dot"></span>
        <span>Open to product design roles</span>
        <span>·</span>
        <span>siddharthmehta.design</span>
      </div>
    </div>

    <script>
      /* The renderer expects a .cg-stage parent and reads --hero-p and the
         field phase, neither of which exist here. It guards on both, so the
         only thing it needs is the canvas and a sized parent. */
      document.querySelector(".fig").classList.add("cg-stage");
    </script>
    <script src="{{ site.baseurl }}/assets/js/cube-guy.js"></script>
    <style>
      .logo-cube {
        width: 46px;
        height: 46px;
        color: rgba(186, 211, 244, 0.9);
      }
      .logo-cube .cube-face {
        opacity: 0;
      }
      .logo-cube .cube-front {
        fill: #070b13;
        stroke: currentColor;
        stroke-width: 1.5;
      }
      .logo-cube .logo-eye,
      .logo-cube .logo-mouth {
        fill: #e7f1ff;
      }
      .logo-cube .logo-scan {
        opacity: 0;
      }
    </style>
  </body>
</html>
